<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organizer Portal · The Dink Society</title>
<meta name="robots" content="noindex,nofollow" />
<script>(function(){var t=localStorage.getItem("ds-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark")})()</script>
<style>
:root{
  --bg:#0e0e0e;--surface:#161616;--s2:#1e1e1e;--s3:#262626;--s4:#2e2e2e;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0ec;--muted:#9a9e97;--faint:#5e625c;--inv:#0e0e0e;
  --lime:#b8ff2c;--lime-dim:rgba(184,255,44,0.12);--teal:#17d7b0;--teal-dim:rgba(23,215,176,0.12);
  --red:#ff5c47;--red-dim:rgba(255,92,71,0.12);--gold:#f0c040;--gold-dim:rgba(240,192,64,0.12);
  --r:10px;--r2:14px;--rf:9999px;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
a{color:inherit}
h1,h2,h3{line-height:1.1;font-weight:800}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.top{border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;padding:14px 18px}
.logo{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.tag{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);font-weight:700}
.top__sp{flex:1}
.who{font-size:11px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 16px;border-radius:var(--rf);font-size:12px;font-weight:700;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-lime{background:var(--lime);color:var(--inv)}
.btn-teal{background:var(--teal);color:var(--inv)}
.btn-out{border-color:var(--border2);color:var(--text)}
.btn-out:hover{background:var(--s2)}
.btn-ghost{background:var(--s2);color:var(--muted)}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:rgba(255,92,71,.2)}
.btn-sm{min-height:30px;padding:0 11px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.sub{font-size:12px;color:var(--faint);line-height:1.5}
label{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;font-weight:700}
input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--s2);color:var(--text)}
input:focus,select:focus{outline:none;border-color:var(--lime)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{margin-bottom:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pill-open{background:var(--teal-dim);color:var(--teal)}.pill-live{background:var(--lime-dim);color:var(--lime)}
.pill-final{background:var(--s3);color:var(--muted)}.pill-cancelled{background:var(--red-dim);color:var(--red)}.pill-full{background:var(--gold-dim);color:var(--gold)}
.pill-included{background:var(--lime-dim);color:var(--lime)}.pill-pending{background:var(--gold-dim);color:var(--gold)}.pill-excluded{background:var(--s3);color:var(--muted)}
.pill-paid{background:var(--teal-dim);color:var(--teal)}.pill-unpaid{background:var(--red-dim);color:var(--red)}
.lad{border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:10px;background:var(--surface)}
.lad__h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.lad__t{font-size:15px;font-weight:800}
.lad__m{font-size:11px;color:var(--faint);margin-top:3px}
.lad__stats{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:11px 0}
.lad__stats b{color:var(--text)}
.divider{height:1px;background:rgba(255,255,255,.06);margin:12px 0}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.rrow:last-child{border-bottom:none}
.venmo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#3d95ce;background:rgba(61,149,206,.12);border:1px solid rgba(61,149,206,.25);padding:3px 9px;border-radius:var(--rf)}
.note{padding:11px 13px;border-radius:var(--r);font-size:11.5px;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.note-info{background:var(--teal-dim);color:var(--teal)}.note-gold{background:var(--gold-dim);color:var(--gold)}.note-lime{background:rgba(184,255,44,.06);border:1px solid rgba(184,255,44,.15);color:var(--lime)}
.empty{text-align:center;padding:34px 16px;color:var(--faint);font-size:12px}
.msg{font-size:12px;margin-top:8px}
.hide{display:none}
.back{font-size:12px;color:var(--muted);cursor:pointer}
.back:hover{color:var(--text)}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><span class="logo">The Dink Society</span><span class="tag">Organizer</span><span class="top__sp"></span><span class="who" id="who"></span></div></div>
<div class="wrap" id="app" style="padding-top:22px;padding-bottom:80px"><div class="empty">Loading…</div></div>

<script>
const API='/.netlify/functions';
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(c)=>'$'+((Number(c)||0)/100).toFixed((Number(c)||0)%100?2:0);
let ME=null, LADDERS=[];

async function api(path,opts){ const r=await fetch(API+path,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opts||{})); let d=null; try{d=await r.json();}catch{} if(!r.ok) throw new Error((d&&d.error)||('HTTP '+r.status)); return d; }

async function boot(){
  try{ ME=await api('/organizer-me'); }
  catch(e){ ME={signedIn:false,organizer:null}; }
  if(!ME.signedIn){ return renderLogin(); }
  $('who').textContent=ME.email||'';
  if(!ME.organizer){ return renderNotOrganizer(); }
  loadLadders();
}

function renderLogin(msg){
  $('app').innerHTML=`<div class="card" style="max-width:440px;margin:40px auto">
    <h2>Organizer sign-in</h2>
    <div class="sub" style="margin-bottom:14px">Enter your email and we'll send a one-tap sign-in link. It's the same Dink Society player login — once you tap the link, come back to this page.</div>
    <div class="field"><label>Email</label><input id="li-email" type="email" placeholder="you@email.com"></div>
    <button class="btn btn-lime" style="width:100%" onclick="sendLink()">Send sign-in link</button>
    <div class="msg" id="li-msg">${msg||''}</div>
  </div>`;
}
async function sendLink(){
  const email=$('li-email').value.trim(), m=$('li-msg');
  if(!email){ m.style.color='var(--red)'; m.textContent='Enter your email.'; return; }
  m.style.color='var(--muted)'; m.textContent='Sending…';
  try{ await api('/player-login',{method:'POST',body:JSON.stringify({email})});
    m.style.color='var(--teal)'; m.innerHTML='Check your inbox for the sign-in link. After you tap it, <b>reload this page</b>.';
  }catch(e){ m.style.color='var(--red)'; m.textContent=e.message; }
}
function renderNotOrganizer(){
  $('app').innerHTML=`<div class="card" style="max-width:460px;margin:40px auto;text-align:center">
    <h2>Not an organizer yet</h2>
    <div class="sub" style="margin:8px 0 4px">You're signed in as <b>${esc(ME.email)}</b>, but this account isn't set up to run ladders. Ask a Dink Society admin to grant you organizer access, then reload.</div>
  </div>`;
}

/* ── Ladders list + create ── */
async function loadLadders(){
  $('app').innerHTML='<div class="empty">Loading your ladders…</div>';
  try{ const d=await api('/organizer-ladders'); LADDERS=d.ladders||[]; }
  catch(e){ $('app').innerHTML=`<div class="card"><div class="empty">Couldn't load ladders: ${esc(e.message)}</div></div>`; return; }
  renderHome();
}
function lbPill(v){ v=v||'included'; const label=v==='included'?'In leaderboard':v==='pending'?'Pending approval':'Own board only'; return `<span class="pill pill-${v}">${label}</span>`; }
function renderHome(){
  const cards=LADDERS.map(l=>`
    <div class="lad">
      <div class="lad__h">
        <div><div class="lad__t">${esc(l.name)}</div><div class="lad__m">${esc(l.date||'TBD')}${l.startTime?' · '+esc(l.startTime):''}${l.place?' · '+esc(l.place):''}</div></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap"><span class="pill pill-${esc(l.status||'open')}">${esc(l.status||'open')}</span>${lbPill(l.leaderboard)}</div>
      </div>
      <div class="lad__stats">
        <div><b>${l.rosterCount||0}</b>/${l.capacity||0} signed up</div>
        <div><b>${l.paidCount||0}</b> paid</div>
        <div><b>${l.courts||0}</b> courts · ${l.rounds||0} rounds</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-out btn-sm" onclick="manage('${esc(l.id)}')">Sign-ups &amp; payments</button>
        <a class="btn btn-out btn-sm" href="/ladder-score.html?event=${encodeURIComponent(l.id)}">Score the ladder</a>
        <button class="btn btn-out btn-sm" onclick="manageRecap('${esc(l.id)}')">Recap</button>
        <button class="btn btn-ghost btn-sm" onclick="editLadder('${esc(l.id)}')">Edit</button>
      </div>
    </div>`).join('');
  $('app').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <h1 style="font-size:1.5rem;text-transform:uppercase">My Ladders</h1>
      <button class="btn btn-lime" onclick="newLadder()">+ New ladder</button>
    </div>
    <div class="note note-lime" style="margin-bottom:14px">${ic('trophy')}<div>You collect entry fees your own way — <b>Venmo or cash</b>. Your ladder's own board is always live; a <b>Pending</b> tag just means it isn't in the league-wide leaderboard yet (an admin includes it — your own ladders are added automatically).</div></div>
    ${LADDERS.length?cards:'<div class="card"><div class="empty">No ladders yet. Create your first one.</div></div>'}`;
}

function newLadder(){ editForm(null); }
function editLadder(id){ editForm(LADDERS.find(l=>l.id===id)||null); }
function editForm(l){
  const v=(k,d)=>l&&l[k]!=null?l[k]:(d==null?'':d);
  $('app').innerHTML=`
    <div class="back" onclick="renderHome()">← My ladders</div>
    <h1 style="font-size:1.4rem;text-transform:uppercase;margin:10px 0 14px">${l?'Edit ladder':'Create a ladder'}</h1>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>Ladder name</label><input id="f-name" value="${esc(v('name'))}" placeholder="Thursday Night Ladder"></div>
        <div class="field"><label>Venue</label><input id="f-place" value="${esc(v('place'))}" placeholder="SBTC"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Date</label><input id="f-date" type="date" value="${esc(v('date'))}"></div>
        <div class="field"><label>Start time</label><input id="f-time" value="${esc(v('startTime'))}" placeholder="6:30 PM"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Bracket</label><select id="f-type">
          ${['mixed','mens','womens'].map(t=>`<option value="${t}" ${v('type','mixed')===t?'selected':''}>${t==='mixed'?'Mixed':t==='mens'?"Men's":"Women's"}</option>`).join('')}
        </select></div>
        <div class="field"><label>Courts</label><input id="f-courts" type="number" min="1" value="${esc(v('courts',4))}"></div>
        <div class="field"><label>Rounds</label><input id="f-rounds" type="number" min="1" value="${esc(v('rounds',9))}"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Player cap</label><input id="f-cap" type="number" min="2" value="${esc(v('capacity',16))}"></div>
        <div class="field"><label>Fee per player ($)</label><input id="f-fee" type="number" min="0" step="0.01" value="${l&&l.feeCents!=null?(l.feeCents/100):9}"></div>
        <div class="field"><label>Your Venmo</label><input id="f-venmo" value="${esc(v('venmoHandle'))}" placeholder="@your-name"></div>
      </div>
      <div class="field"><label>Court names (optional)</label><input id="f-courtnames" value="${esc((v('courtNames',[])||[]).join(', '))}" placeholder="Leave blank to number them 1–N (e.g. 3A, 3B, 3C)"></div>
      <div class="note note-info" style="margin:4px 0 12px">${ic('dollar')}<div>Payments are <b>Venmo / cash only</b> — no card processing. The app tracks who's paid; you collect and confirm.</div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="renderHome()">Cancel</button>
        <button class="btn btn-lime" onclick="saveLadder('${l?esc(l.id):''}')">${l?'Save changes':'Create ladder'}</button>
      </div>
      <div class="msg" id="f-msg"></div>
    </div>`;
}
async function saveLadder(id){
  const m=$('f-msg');
  const body={
    name:$('f-name').value.trim(), place:$('f-place').value.trim(), date:$('f-date').value,
    startTime:$('f-time').value.trim(), type:$('f-type').value,
    courts:+$('f-courts').value||0, rounds:+$('f-rounds').value||0, capacity:+$('f-cap').value||0,
    fee:+$('f-fee').value||0, venmoHandle:$('f-venmo').value.trim(),
    courtNames:($('f-courtnames').value||'').split(',').map(s=>s.trim()).filter(Boolean),
  };
  if(id) body.id=id;
  if(!body.name||!body.date){ m.style.color='var(--red)'; m.textContent='Name and date are required.'; return; }
  m.style.color='var(--muted)'; m.textContent='Saving…';
  try{ await api('/organizer-ladder-save',{method:'POST',body:JSON.stringify(body)}); await loadLadders(); }
  catch(e){ m.style.color='var(--red)'; m.textContent=e.message; }
}

/* ── Manage: sign-ups & payments (uses admin-ladder-manage, unlocked for owners) ── */
let MASTER=[], ROSTER_IDS=new Set();
async function manage(id){
  const l=LADDERS.find(x=>x.id===id);
  $('app').innerHTML=`<div class="back" onclick="renderHome()">← My ladders</div><div class="empty">Loading roster…</div>`;
  let d; try{ d=await api('/admin-ladder-manage?event='+encodeURIComponent(id)); }
  catch(e){ $('app').innerHTML=`<div class="back" onclick="renderHome()">← My ladders</div><div class="card"><div class="empty">${esc(e.message)}</div></div>`; return; }
  // Master roster for de-duped adds (best-effort; add-new still works if it fails).
  try{ const mr=await api('/admin-ladder-players'); MASTER=(mr.players||[]).filter(p=>!p.mergedInto); }catch{ MASTER=[]; }
  const roster=d.roster||[], wait=d.waitlist||[];
  ROSTER_IDS=new Set(roster.map(p=>p.playerId).filter(Boolean));
  const paid=roster.filter(p=>p.paymentStatus==='paid').length;
  const rows=roster.map(p=>{
    const isPaid=p.paymentStatus==='paid';
    return `<div class="rrow">
      <div style="flex:1;min-width:150px"><div style="font-weight:700">${esc(p.name)}</div><div class="faint" style="font-size:11px">${esc(p.email||'no email')}${p.gender?' · '+esc(p.gender):''}</div></div>
      <div>${isPaid?'<span class="pill pill-paid">Paid</span>':'<span class="pill pill-unpaid">Unpaid</span>'}</div>
      <div>${isPaid
        ? `<button class="btn btn-ghost btn-sm" onclick="pay('${esc(id)}','${esc(p.playerId||'')}','${esc(p.email||'')}','mark-unpaid')">Undo</button>`
        : `<button class="btn btn-lime btn-sm" onclick="pay('${esc(id)}','${esc(p.playerId||'')}','${esc(p.email||'')}','mark-paid')">Mark paid</button>`}
        <button class="btn btn-danger btn-sm" onclick="removeP('${esc(id)}','${esc(p.playerId||'')}','${esc(p.email||'')}')">Remove</button></div>
    </div>`;
  }).join('');
  $('app').innerHTML=`
    <div class="back" onclick="renderHome()">← My ladders</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px;flex-wrap:wrap;gap:8px">
      <h1 style="font-size:1.3rem;text-transform:uppercase">${esc(d.event.name)}</h1>
      ${l?`<span class="venmo">Venmo ${esc(l.venmoHandle||'@unset')}</span>`:''}
    </div>
    <div class="card">
      <h2>Add players</h2>
      <div class="sub" style="margin-bottom:8px">Search the Dink Society roster first so a returning player keeps their stats — don't create a duplicate.</div>
      <input id="mr-q" placeholder="Search players…" autocomplete="off" oninput="mrSearch('${esc(id)}')">
      <div id="mr-res" style="margin-top:6px"></div>
      <div class="divider"></div>
      <div class="sub" style="margin-bottom:6px">Or add someone brand new</div>
      <div class="grid2"><input id="np-name" placeholder="Name"><select id="np-gender"><option value="">Gender —</option><option value="M">M</option><option value="F">F</option></select></div>
      <div style="display:flex;gap:8px;margin-top:8px"><input id="np-email" placeholder="Email (optional)"><button class="btn btn-lime btn-sm" style="flex:0 0 auto" onclick="addNew('${esc(id)}')">Add</button></div>
    </div>
    <div class="card">
      <h2>Payments · ${paid}/${roster.length} paid</h2>
      <div class="note note-info" style="margin-bottom:12px">${ic('info')}<div>Money never flows through Dink Society — you collect via Venmo/cash and mark players paid here. Marking paid emails them a "you're in" confirmation.</div></div>
      ${rows||'<div class="empty">No sign-ups yet.</div>'}
      ${wait.length?`<div class="divider"></div><div class="sub" style="margin-bottom:6px">Waitlist (${wait.length})</div>`+wait.map(w=>`<div class="rrow"><div style="flex:1">${esc(w.name)}</div><button class="btn btn-lime btn-sm" onclick="promote('${esc(id)}')">Promote next</button></div>`).join(''):''}
    </div>`;
}
function mrSearch(id){
  const q=($('mr-q').value||'').trim().toLowerCase(), el=$('mr-res');
  if(!q){ el.innerHTML=''; return; }
  const hits=MASTER.filter(p=>!ROSTER_IDS.has(p.id) && String(p.name||'').toLowerCase().includes(q)).slice(0,8);
  if(!hits.length){ el.innerHTML='<div class="faint" style="font-size:11px;padding:6px 2px">No roster match — add them as new below.</div>'; return; }
  // playerId only in the onclick (names can contain apostrophes → would break inline JS).
  el.innerHTML=hits.map(p=>`<div class="rrow" style="padding:7px 0">
    <div style="flex:1"><span style="font-weight:600">${esc(p.name)}</span>${p.gender?` <span class="faint" style="font-size:10px">${esc(p.gender)}</span>`:''}${p.nights?` <span class="faint" style="font-size:10px">· ${p.nights} night${p.nights>1?'s':''}</span>`:''}</div>
    <button class="btn btn-out btn-sm" onclick="addFromMaster('${esc(id)}','${esc(p.id)}')">Add</button>
  </div>`).join('');
}
async function addFromMaster(id,pid){
  const p=MASTER.find(x=>x.id===pid)||{};
  try{ await api('/admin-ladder-manage?event='+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action:'add',playerId:pid,name:p.name,gender:p.gender||undefined,force:true})}); manage(id); }
  catch(e){ alert(e.message); }
}
async function addNew(id){
  const name=($('np-name').value||'').trim(); if(!name){ alert('Enter a name.'); return; }
  const gender=$('np-gender').value||undefined, email=($('np-email').value||'').trim()||undefined;
  try{ await api('/admin-ladder-manage?event='+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action:'add',name,gender,email,force:true})}); manage(id); }
  catch(e){ alert(e.message); }
}
async function pay(id,pid,email,action){ try{ await api('/admin-ladder-manage?event='+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action,playerId:pid||undefined,email:email||undefined})}); manage(id); }catch(e){ alert(e.message); } }
async function removeP(id,pid,email){ if(!confirm('Remove this player?'))return; try{ await api('/admin-ladder-manage?event='+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action:'remove',playerId:pid||undefined,email:email||undefined})}); manage(id); }catch(e){ alert(e.message); } }
async function promote(id){ try{ await api('/admin-ladder-manage?event='+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action:'promote'})}); manage(id); }catch(e){ alert(e.message); } }

/* ── Recap (uses admin-ladder-recap, unlocked for owners) ── */
async function manageRecap(id){
  const l=LADDERS.find(x=>x.id===id);
  $('app').innerHTML=`<div class="back" onclick="renderHome()">← My ladders</div><div class="empty">Loading recap…</div>`;
  let d; try{ d=await api('/admin-ladder-recap?event='+encodeURIComponent(id)); }catch(e){ d={recap:null,_err:e.message}; }
  const rec=d.recap;
  const status=rec?(rec.status==='sent'?`Sent to ${rec.sentCount||0} players`:'Draft ready'):'Not generated yet';
  $('app').innerHTML=`
    <div class="back" onclick="renderHome()">← My ladders</div>
    <h1 style="font-size:1.3rem;text-transform:uppercase;margin:10px 0 12px">Recap — ${esc(l?l.name:'')}</h1>
    <div class="card">
      <h2>Night recap</h2>
      <div class="note note-info" style="margin-bottom:12px">${ic('info')}<div>A recap is auto-drafted ~15 min after the night finishes. You can also generate it now, review, then send it to everyone who played — same recap email your league ladders use.</div></div>
      <div class="sub" style="margin-bottom:12px">Status: <b style="color:var(--text)">${esc(status)}</b>${rec&&rec.recap&&rec.recap.title?` · "${esc(rec.recap.title)}"`:''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-out btn-sm" onclick="recap('${esc(id)}','generate')">${rec?'Regenerate draft':'Generate draft'}</button>
        <button class="btn btn-lime btn-sm" onclick="recap('${esc(id)}','send')" ${rec?'':'disabled'}>Send to players</button>
      </div>
      <div class="msg" id="rc-msg"></div>
    </div>`;
}
async function recap(id,action){
  const m=$('rc-msg'); m.style.color='var(--muted)'; m.textContent=action==='send'?'Sending…':'Generating…';
  try{ const d=await api('/admin-ladder-recap?event='+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action})});
    if(action==='send'){ m.style.color='var(--teal)'; m.textContent=`Sent to ${d.sent||0} player(s).`; }
    else { m.style.color='var(--teal)'; m.textContent='Draft ready — review and send.'; setTimeout(()=>manageRecap(id),700); }
  }catch(e){ m.style.color='var(--red)'; m.textContent=e.message; }
}

function ic(n){const p={
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/>',
  dollar:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'}[n]||'';
  return `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px">${p}</svg>`;}

boot();
</script>
