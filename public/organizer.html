<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organizer · The Dink Society</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0b0d0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<script>(function(){var t=localStorage.getItem("ds-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark")})()</script>
<style>
  /* Mirrors the admin ladder manager (admin-ladders.html) so the two feel like one product. */
  :root{ --lime:#b8ff2c; --teal:#17d7b0; --gold:#f0c040; --red:#ff5c47; }
  body{ background:#0b0d0a; color:#f0f2ec; font-family:'Inter',system-ui,sans-serif; margin:0; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 16px 70px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 0 10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mk{ width:32px;height:32px;border-radius:9px;background:var(--lime);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px; }
  .brand small{ display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:800; }
  .brand b{ font-size:.92rem;font-weight:900;font-style:italic;text-transform:uppercase; }
  .badge{ font-size:.6rem;font-weight:800;padding:4px 10px;border-radius:9999px;background:rgba(184,255,44,.14);color:var(--lime);text-transform:uppercase;letter-spacing:.06em; }
  .who{ font-size:.72rem;color:#9aa094; }
  h1{ font-size:1.5rem;font-weight:900;margin:6px 0 2px; }
  h2.mh{ font-size:1.15rem;font-weight:900;margin:0 0 2px; }
  .sec{ font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9aa094;margin:22px 2px 10px; }
  .card{ background:#161914;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;margin-bottom:14px; }
  .row2{ display:flex;gap:12px;flex-wrap:wrap; } .row2>*{ flex:1;min-width:120px; }
  .row3{ display:flex;gap:10px;flex-wrap:wrap; } .row3>*{ flex:1;min-width:90px; }
  label.l{ display:block;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9aa094;margin:0 0 5px; }
  .frow{ margin-bottom:13px; }
  input.i,select.i{ width:100%;min-height:44px;padding:0 13px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#1c1f18;color:#f0f2ec;font:inherit;font-size:.88rem;box-sizing:border-box; }
  input.i:focus,select.i:focus{ outline:none;border-color:var(--lime); }
  input.i[type="time"]::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; }
  input.i[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; }
  .help{ font-size:.64rem;color:#5e655a;margin-top:5px; }
  .btn{ display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:9999px;border:1px solid transparent;font:inherit;font-size:.82rem;font-weight:800;cursor:pointer; }
  .btn-lime{ background:var(--lime);color:#000; } .btn-out{ border-color:rgba(255,255,255,.18);color:#f0f2ec;background:transparent; }
  .btn-teal{ background:var(--teal);color:#04241d; }
  .btn-sm{ min-height:32px;font-size:.72rem;padding:0 12px; } .btn-danger{ border:1px solid rgba(255,92,71,.3);color:var(--red);background:transparent;min-height:32px;font-size:.72rem;padding:0 12px;border-radius:9999px;cursor:pointer; }
  .btn[disabled]{ opacity:.4;cursor:not-allowed; }
  .lad-row{ display:flex;align-items:center;gap:12px;padding:14px 12px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:#161914;margin-bottom:10px;cursor:pointer;transition:background .12s,border-color .12s; }
  .lad-row:hover{ background:rgba(184,255,44,.05);border-color:rgba(184,255,44,.25); }
  .lad-row:hover .lad-chev{ color:var(--lime);transform:translateX(2px); }
  .lad-row .nm{ font-weight:800;font-size:.98rem; } .lad-row .mt{ font-size:.72rem;color:#9aa094;margin-top:3px; }
  .lad-chev{ color:#5e655a;font-size:1.4rem;line-height:1;transition:.12s;flex:none; }
  .chip{ display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:9999px;font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em; }
  .chip-lime{ background:rgba(184,255,44,.14);color:var(--lime); } .chip-red{ background:rgba(255,92,71,.14);color:var(--red); } .chip-gold{ background:rgba(240,192,64,.14);color:var(--gold); } .chip-teal{ background:rgba(23,215,176,.16);color:var(--teal); } .chip-gray{ background:#262a20;color:#9aa094; }
  .banner{ background:rgba(184,255,44,.08);border:1px solid rgba(184,255,44,.22);color:var(--lime);border-radius:12px;padding:13px 15px;font-size:.82rem;margin:0 0 16px;line-height:1.5; }
  .banner.info{ background:rgba(23,215,176,.1);border-color:rgba(23,215,176,.28);color:var(--teal); }
  .mtabbar{ display:flex;gap:4px;background:#1c1f18;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:4px;margin:0 0 18px; }
  .mtabbar button{ flex:1;padding:10px 6px;border:0;border-radius:8px;background:transparent;color:#9aa094;font:inherit;font-size:.78rem;font-weight:800;cursor:pointer;white-space:nowrap; }
  .mtabbar button.on{ background:var(--lime);color:#000; }
  .mpanel{ display:none; } .mpanel.on{ display:block; }
  .prow{ display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.86rem; }
  .prow:last-child{ border-bottom:none; } .prow .pn{ flex:1;font-weight:700; } .prow .pe{ font-size:.68rem;color:#5e655a;font-weight:500;margin-top:1px; }
  .rfbar{ display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 4px; }
  .rfin{ flex:1;min-width:72px;min-height:38px;padding:0 10px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:#1c1f18;color:#f0f2ec;font:inherit;font-size:.8rem;text-align:center;font-weight:700; }
  .venmo{ display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;color:#3d95ce;background:rgba(61,149,206,.12);border:1px solid rgba(61,149,206,.28);padding:4px 11px;border-radius:9999px; }
  .empty{ color:#5e655a;font-size:.88rem;padding:18px 0;text-align:center; }
  .back{ font-size:.78rem;color:#9aa094;cursor:pointer;display:inline-block;margin-bottom:6px; } .back:hover{ color:#f0f2ec; }
  .lock{ display:flex;align-items:center;gap:9px;background:#1c1f18;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 13px;font-size:.78rem;color:#9aa094; }
  .danger{ border:1px solid rgba(255,92,71,.25);border-radius:14px;padding:15px;margin-top:16px; }
  .danger .dh{ font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:8px; }
  select{ color-scheme:dark; } select option{ background:#161616;color:#f5f5f5; }
  a{ color:inherit;text-decoration:none; }
  /* On-brand toast + confirm (replaces native alert/confirm) */
  .dstoast{ position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--lime);color:#06210f;font-weight:800;font-size:.86rem;padding:12px 20px;border-radius:9999px;box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center; }
  .dstoast.on{ opacity:1;transform:translateX(-50%) translateY(0); } .dstoast.err{ background:var(--red);color:#fff; }
  .cdlg{ position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:95;padding:18px; }
  .cdlg.on{ display:flex; }
  .cdlg-box{ background:#161914;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center; }
  .cdlg-msg{ font-size:.92rem;font-weight:600;line-height:1.5;margin-bottom:18px; }
  .cdlg-actions{ display:flex;gap:8px;justify-content:center; }
  @media(max-width:600px){ .row3>*{ min-width:calc(50% - 5px); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="mk">DS</div><div><small>Dink Society</small><b>Ladder Organizer</b></div></div>
    <span class="who" id="who"></span>
  </div>
  <div id="app"><div class="empty">Loading…</div></div>
</div>

<div class="dstoast" id="dstoast"></div>
<div class="cdlg" id="cdlg"><div class="cdlg-box">
  <div class="cdlg-msg" id="cdlg-msg"></div>
  <div class="cdlg-actions"><button class="btn btn-out btn-sm" onclick="cdlgClose()">Cancel</button><button class="btn btn-danger btn-sm" id="cdlg-ok">Confirm</button></div>
</div></div>

<script>
const API='/.netlify/functions';
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null, LADDERS=[], MASTER=[], ROSTER_IDS=new Set(), CUR=null; // CUR = current event object being managed (null=create)

/* ---- on-brand toast + confirm ---- */
let _toastT;
function toast(msg,err){ const t=$('dstoast'); t.textContent=msg; t.classList.toggle('err',!!err); t.classList.add('on'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('on'),2600); }
let _onOk=null;
function askConfirm(msg,okLabel,onOk){ $('cdlg-msg').textContent=msg; const b=$('cdlg-ok'); b.textContent=okLabel||'Confirm'; _onOk=onOk; $('cdlg').classList.add('on'); }
function cdlgClose(){ $('cdlg').classList.remove('on'); _onOk=null; }
$('cdlg-ok').addEventListener('click',()=>{ const f=_onOk; cdlgClose(); if(f)f(); });

async function api(path,opts){ const r=await fetch(API+path,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opts||{})); let d=null; try{d=await r.json();}catch{} if(!r.ok) throw new Error((d&&d.error)||('HTTP '+r.status)); return d; }

async function boot(){
  try{ ME=await api('/organizer-me'); }catch(e){ ME={signedIn:false,organizer:null}; }
  if(!ME.signedIn) return renderLogin();
  $('who').textContent=ME.email||'';
  if(!ME.organizer) return renderNotOrganizer();
  loadLadders();
}

function renderLogin(msg){
  $('app').innerHTML=`<div class="card" style="max-width:440px;margin:34px auto">
    <h2 class="mh">Organizer sign-in</h2>
    <div class="help" style="margin:4px 0 14px;font-size:.8rem;line-height:1.5">Enter your email and we'll send a one-tap sign-in link — the same Dink Society player login. After you tap it, come back to this page.</div>
    <div class="frow"><label class="l">Email</label><input class="i" id="li-email" type="email" placeholder="you@email.com"></div>
    <button class="btn btn-lime" style="width:100%" onclick="sendLink()">Send sign-in link</button>
    <div id="li-msg" class="help" style="margin-top:10px">${msg||''}</div>
  </div>`;
}
async function sendLink(){
  const email=$('li-email').value.trim();
  if(!email) return toast('Enter your email.',true);
  try{ await api('/player-login',{method:'POST',body:JSON.stringify({email,next:'/organizer.html'})}); $('li-msg').innerHTML='Check your inbox for the sign-in link — it\'ll bring you right back here.'; toast('Link sent — check your email.'); }
  catch(e){ toast(e.message,true); }
}
function renderNotOrganizer(){
  $('app').innerHTML=`<div class="card" style="max-width:460px;margin:34px auto;text-align:center">
    <h2 class="mh">Not an organizer yet</h2>
    <div class="help" style="font-size:.82rem;margin-top:8px;line-height:1.6">You're signed in as <b>${esc(ME.email)}</b>, but this account isn't set up to run ladders. Ask a Dink Society admin to grant you organizer access, then reload.</div>
  </div>`;
}

/* ---- ladder list ---- */
async function loadLadders(){
  $('app').innerHTML='<div class="empty">Loading your ladders…</div>';
  try{ const d=await api('/organizer-ladders'); LADDERS=d.ladders||[]; }
  catch(e){ $('app').innerHTML=`<div class="card"><div class="empty">Couldn't load ladders: ${esc(e.message)}</div></div>`; return; }
  renderList();
}
function lbChip(v){ v=v||'included'; if(v==='included') return '<span class="chip chip-lime">In leaderboard</span>'; if(v==='pending') return '<span class="chip chip-gold">Pending</span>'; return '<span class="chip chip-gray">Own board</span>'; }
function statusChip(s){ s=s||'open'; const m={open:'chip-teal',live:'chip-lime',final:'chip-gray',cancelled:'chip-red',full:'chip-gold'}; return `<span class="chip ${m[s]||'chip-gray'}">${esc(s)}</span>`; }
function renderList(){
  const rows=LADDERS.map(l=>`
    <div class="lad-row" onclick="openLadder('${esc(l.id)}')">
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(l.name)}</div>
        <div class="mt">${esc(l.date||'TBD')}${l.startTime?' · '+esc(l.startTime):''}${l.place?' · '+esc(l.place):''}</div>
        <div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">${statusChip(l.status)}${lbChip(l.leaderboard)}
          <span class="chip chip-gray">${l.rosterCount||0}/${l.capacity||0} in</span>
          <span class="chip chip-gray">${l.paidCount||0} paid</span></div>
      </div>
      <span class="lad-chev">›</span>
    </div>`).join('');
  $('app').innerHTML=`
    <div class="topbar" style="padding:6px 0 12px"><h1 style="margin:0">My Ladders</h1><button class="btn btn-lime" onclick="openLadder(null)">+ New ladder</button></div>
    <div class="banner">You collect entry fees your own way — <b>Venmo or cash</b>. Your ladder's own board is always live; a <b>Pending</b> tag just means it isn't in the league-wide leaderboard yet (your own ladders are added automatically).</div>
    ${LADDERS.length?rows:'<div class="card"><div class="empty">No ladders yet. Create your first one.</div></div>'}`;
}

/* ---- manage (tabbed) ---- */
let TAB='info';
async function openLadder(id){
  TAB='info';
  $('app').innerHTML=`<div class="back" onclick="loadLadders()">← My ladders</div><div class="empty">Loading…</div>`;
  CUR=null;
  if(id){
    try{ const d=await api('/admin-ladder-manage?event='+encodeURIComponent(id)); CUR=d.event; CUR._roster=d.roster||[]; CUR._waitlist=d.waitlist||[]; }
    catch(e){ $('app').innerHTML=`<div class="back" onclick="loadLadders()">← My ladders</div><div class="card"><div class="empty">${esc(e.message)}</div></div>`; return; }
    try{ const mr=await api('/admin-ladder-players'); MASTER=(mr.players||[]).filter(p=>!p.mergedInto); }catch{ MASTER=[]; }
    ROSTER_IDS=new Set((CUR._roster||[]).map(p=>p.playerId).filter(Boolean));
  }
  renderManage();
}
function renderManage(){
  const e=CUR, isNew=!e;
  const title=isNew?'New ladder':esc(e.name);
  const meta=isNew?'Set it up — one night, individual sign-ups.':`${esc(e.date||'')}${e.startTime?' · '+esc(e.startTime):''}${e.place?' · '+esc(e.place):''} · roster ${(e._roster||[]).length}/${e.capacity||0}`;
  const tabs=isNew?[['info','Ladder Info']]:[['info','Ladder Info'],['signups','Sign-ups'],['scoring','Scoring'],['recap','Recap']];
  $('app').innerHTML=`
    <div class="back" onclick="loadLadders()">← My ladders</div>
    <h2 class="mh">${title}</h2>
    <div class="help" style="margin:2px 0 14px;font-size:.76rem">${meta}</div>
    ${tabs.length>1?`<div class="mtabbar" id="mtabs">${tabs.map(t=>`<button class="${t[0]===TAB?'on':''}" onclick="mtab('${t[0]}')">${t[1]}</button>`).join('')}</div>`:''}
    <div id="mbody"></div>`;
  renderTab();
}
function mtab(k){ TAB=k; document.querySelectorAll('#mtabs button').forEach((b,i)=>{}); renderManage(); }
function renderTab(){
  const b=$('mbody');
  if(TAB==='info') return b.innerHTML=infoPanel();
  if(TAB==='signups') return b.innerHTML=signupsPanel();
  if(TAB==='scoring') return b.innerHTML=scoringPanel();
  if(TAB==='recap'){ b.innerHTML='<div class="card"><div class="empty">Loading recap…</div></div>'; return loadRecap(); }
}

/* Ladder Info form (mirrors admin edit form) */
// Native <input type="time"> works in 24h "HH:MM" — convert to/from the
// "6:30 PM"-style string stored on the event (and used everywhere else it's
// displayed: cards, emails, admin panel) so a mistyped "6.30" or missing
// AM/PM is impossible — the mobile OS supplies its own picker instead.
function to24h(s){
  s=String(s||'').trim(); if(!s) return '';
  let m=s.match(/^(\d{1,2}):(\d{2})$/); if(m) return String(+m[1]).padStart(2,'0')+':'+m[2];
  m=s.match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])$/); if(!m) return '';
  let h=(+m[1])%12; if(/pm/i.test(m[3])) h+=12;
  return String(h).padStart(2,'0')+':'+m[2];
}
function to12h(s){
  s=String(s||'').trim(); const m=s.match(/^(\d{1,2}):(\d{2})$/); if(!m) return '';
  let h=+m[1]; const mm=m[2], ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  return h+':'+mm+' '+ap;
}
let FREE=false, VIS='public';
function infoPanel(){
  const e=CUR||{}, v=(k,d)=>e[k]!=null?e[k]:(d==null?'':d);
  const courts=+v('courts',4)||4;
  const names=Array.isArray(e.courtNames)&&e.courtNames.length?e.courtNames:Array.from({length:courts},(_,i)=>String(i+1));
  const div=v('type','mixed');
  const sm=v('scoreMode','points');
  FREE=!!e.free; VIS=e.visibility||'public';
  const site=location.origin;
  return `<div class="card">
    <div class="frow"><label class="l">Visibility</label>
      <div class="row2" style="gap:8px">
        <button type="button" id="f-vis-btn-public" class="btn ${VIS==='public'?'btn-lime':'btn-out'}" style="flex:1" onclick="setVis('public')">🌐 Public</button>
        <button type="button" id="f-vis-btn-private" class="btn ${VIS==='private'?'btn-lime':'btn-out'}" style="flex:1" onclick="setVis('private')">🔒 Private (invite-only)</button>
      </div>
      <div class="help" id="f-vis-help" style="margin-top:9px">${VIS==='private'?VIS_HELP.private:VIS_HELP.public}</div>
    </div>
    ${CUR&&VIS==='private'?`<div class="frow"><label class="l">Share this link with your group</label><input class="i" readonly value="${esc(site+'/ladders.html?event='+CUR.id)}" onclick="this.select()"><button class="btn btn-out btn-sm" style="margin-top:8px" onclick="copyInviteLink(this)">Copy link</button></div>`:''}
    <div class="frow"><label class="l">Name</label><input class="i" id="f-name" value="${esc(v('name'))}" placeholder="Thursday Night Ladder"></div>
    <div class="row3">
      <div class="frow"><label class="l">Date</label><input class="i" id="f-date" type="date" value="${esc(v('date'))}"></div>
      <div class="frow"><label class="l">Start time</label><input class="i" id="f-time" type="time" value="${to24h(v('startTime'))}"></div>
      <div class="frow"><label class="l">End time</label><input class="i" id="f-end" type="time" value="${to24h(v('endTime'))}"></div>
    </div>
    <div class="frow"><label class="l">Location</label><input class="i" id="f-place" value="${esc(v('place'))}" placeholder="SBTC - 25924 Rolling Hills Rd"></div>
    <div class="frow"><label class="l">Division</label><select class="i" id="f-type">
      ${[['mixed','Mixed'],['mens',"Men's"],['womens',"Women's"]].map(o=>`<option value="${o[0]}" ${div===o[0]?'selected':''}>${o[1]}</option>`).join('')}
    </select></div>
    <div class="row3">
      <div class="frow"><label class="l">Courts</label><input class="i" id="f-courts" type="number" min="1" value="${courts}" oninput="recalcCourts()"></div>
      <div class="frow"><label class="l">Total players</label><input class="i" id="f-cap" type="number" min="2" value="${esc(v('capacity',courts*4))}"></div>
      <div class="frow"><label class="l">Entry fee ($)</label><input class="i" id="f-fee" type="number" min="0" step="0.01" value="${e.feeCents!=null?(e.feeCents/100):9}" ${FREE?'disabled':''}></div>
    </div>
    <div class="row3">
      <div class="frow"><label class="l">Rounds</label><input class="i" id="f-rounds" type="number" min="1" value="${esc(v('rounds',9))}"></div>
      <div class="frow"><label class="l">Round time (min)</label><input class="i" id="f-roundmin" type="number" min="1" value="${esc(v('roundMin',12))}"></div>
      <div class="frow"><label class="l">Scoring</label><select class="i" id="f-score">
        ${[['points','Points'],['winby2','Win by 2'],['to11','To 11'],['to15','To 15']].map(o=>`<option value="${o[0]}" ${sm===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select></div>
    </div>
    <div class="frow"><label class="l">Court names (top to bottom)</label><div class="rfbar" id="f-courtnames">${names.map(n=>`<input class="rfin" value="${esc(n)}">`).join('')}</div></div>
    <div class="frow"><label class="l">Payments</label>
      <div class="row2" style="gap:8px">
        <button type="button" id="f-free-btn-paid" class="btn ${FREE?'btn-out':'btn-lime'}" style="flex:1" onclick="setFree(false)">💵 Collect entry fee</button>
        <button type="button" id="f-free-btn-free" class="btn ${FREE?'btn-lime':'btn-out'}" style="flex:1" onclick="setFree(true)">🆓 Free — no payment</button>
      </div>
      <div class="help" id="f-free-help" style="margin-top:9px;display:${FREE?'block':'none'}">No entry fee, no Venmo — just the scheduling, scoring, and stats. Sign-ups are confirmed instantly.</div>
    </div>
    <div class="frow" id="f-venmo-row" style="display:${FREE?'none':'block'}"><label class="l">Your Venmo</label><input class="i" id="f-venmo" value="${esc(v('venmoHandle'))}" placeholder="@your-name">
      <div class="lock" style="margin-top:8px">🔒 Venmo / cash only — you collect entry fees yourself; Dink Society never touches the money.</div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">
      ${CUR?`<button class="btn btn-out" onclick="loadLadders()">Done</button>`:''}
      <button class="btn btn-lime" onclick="saveLadder()">${CUR?'Save changes':'Create ladder'}</button>
    </div>
  </div>
  ${CUR?`<div class="card"><div class="l" style="margin-bottom:8px">Status</div><div style="font-size:.9rem;font-weight:800;color:var(--lime)">${esc((CUR.status||'open')[0].toUpperCase()+(CUR.status||'open').slice(1))}</div><div class="help" style="margin-top:6px">Automatic: <b>Open</b> until the start date · <b>Live</b> while scoring · <b>Final</b> when you finish the night.</div>
    <div class="danger"><div class="dh">Danger zone</div><div class="help" style="margin-bottom:10px">Deleting removes the ladder, its roster, and scores. This can't be undone.</div><button class="btn btn-danger" onclick="delLadder()">Delete ladder</button></div>
  </div>`:''}`;
}
// Direct DOM toggles (NOT a full renderTab() re-render) — a re-render would read
// form values back off CUR, which is null/stale for an unsaved new ladder and
// would silently wipe out anything the organizer already typed into the form.
const VIS_HELP={ public:'Shows on the public Ladders page — anyone can find it and sign up.', private:'Hidden from the public Ladders page and from league-wide announcements. Only people you send the direct link to can find and join it.' };
function setFree(v){
  FREE=v;
  $('f-free-btn-paid').className='btn '+(FREE?'btn-out':'btn-lime');
  $('f-free-btn-free').className='btn '+(FREE?'btn-lime':'btn-out');
  $('f-free-help').style.display=FREE?'block':'none';
  $('f-venmo-row').style.display=FREE?'none':'block';
  const fee=$('f-fee'); if(fee) fee.disabled=FREE;
}
function setVis(v){
  VIS=v;
  $('f-vis-btn-public').className='btn '+(VIS==='public'?'btn-lime':'btn-out');
  $('f-vis-btn-private').className='btn '+(VIS==='private'?'btn-lime':'btn-out');
  $('f-vis-help').textContent=VIS==='private'?VIS_HELP.private:VIS_HELP.public;
}
function copyInviteLink(btn){ const inp=btn.previousElementSibling; try{ navigator.clipboard.writeText(inp.value); btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='Copy link',2000); }catch(e){ inp.select(); } }
function recalcCourts(){
  const n=Math.max(1,parseInt($('f-courts').value)||1);
  const box=$('f-courtnames'); const cur=Array.from(box.querySelectorAll('input')).map(i=>i.value);
  let html='';
  for(let i=0;i<n;i++) html+=`<input class="rfin" value="${esc(cur[i]!=null?cur[i]:String(i+1))}">`;
  box.innerHTML=html;
  const cap=$('f-cap'); if(cap&&(!cap.value||+cap.value===0)) cap.value=n*4;
}
async function saveLadder(){
  const courtNames=Array.from($('f-courtnames').querySelectorAll('input')).map(i=>i.value.trim()).filter(Boolean);
  const body={
    name:$('f-name').value.trim(), date:$('f-date').value, startTime:to12h($('f-time').value), endTime:to12h($('f-end').value),
    place:$('f-place').value.trim(), type:$('f-type').value, courts:+$('f-courts').value||0, capacity:+$('f-cap').value||0,
    fee:FREE?0:(+$('f-fee').value||0), rounds:+$('f-rounds').value||0, roundMin:+$('f-roundmin').value||0, scoreMode:$('f-score').value,
    venmoHandle:FREE?'':$('f-venmo').value.trim(), courtNames,
    free:FREE, visibility:VIS,
  };
  if(CUR) body.id=CUR.id;
  if(!body.name||!body.date) return toast('Name and date are required.',true);
  try{ const d=await api('/organizer-ladder-save',{method:'POST',body:JSON.stringify(body)}); toast(CUR?'Saved.':'Ladder created.'); CUR=d.event; CUR._roster=CUR._roster||[]; if(!d.created){ await loadLadders(); } else { openLadder(d.event.id); } }
  catch(e){ toast(e.message,true); }
}
async function delLadder(){
  if(!CUR) return;
  askConfirm('Delete "'+ (CUR.name||'this ladder') +'"? This removes its roster and scores permanently.','Delete',async()=>{
    try{ await api('/admin-ladder-manage?event='+encodeURIComponent(CUR.id),{method:'DELETE'}); toast('Ladder deleted.'); loadLadders(); }
    catch(e){ toast(e.message,true); }
  });
}

/* Sign-ups & payments */
function signupsPanel(){
  const e=CUR, roster=e._roster||[], wait=e._waitlist||[];
  const paid=roster.filter(p=>p.paymentStatus==='paid').length;
  const rows=roster.map(p=>{
    const isPaid=p.paymentStatus==='paid';
    return `<div class="prow">
      <div class="pn">${esc(p.name)}<div class="pe">${esc(p.email||'no email')}${p.gender?' · '+esc(p.gender):''}</div></div>
      <span class="chip ${isPaid?'chip-teal':'chip-red'}">${isPaid?'Paid':'Unpaid'}</span>
      ${isPaid?`<button class="btn btn-out btn-sm" onclick="pay('${esc(p.playerId||'')}','${esc(p.email||'')}','mark-unpaid')">Undo</button>`
              :`<button class="btn btn-lime btn-sm" onclick="pay('${esc(p.playerId||'')}','${esc(p.email||'')}','mark-paid')">Mark paid</button>`}
      <button class="btn btn-danger" onclick="removeP('${esc(p.playerId||'')}','${esc(p.email||'')}')">Remove</button>
    </div>`;
  }).join('');
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="l" style="margin:0">Add players</div><span class="venmo">Venmo ${esc(e.venmoHandle||'@unset')}</span></div>
    <div class="help" style="margin-bottom:9px">Search the Dink Society roster first so a returning player keeps their stats — don't create a duplicate.</div>
    <input class="i" id="mr-q" placeholder="Search players…" autocomplete="off" oninput="mrSearch()">
    <div id="mr-res" style="margin-top:6px"></div>
    <div style="border-top:1px solid rgba(255,255,255,.08);margin:14px 0 10px"></div>
    <div class="l" style="margin-bottom:7px">Or add someone brand new</div>
    <div class="row2"><input class="i" id="np-name" placeholder="Name"><select class="i" id="np-gender" style="max-width:120px"><option value="">Gender —</option><option value="M">M</option><option value="F">F</option></select></div>
    <div class="row2" style="margin-top:8px"><input class="i" id="np-email" placeholder="Email (optional)"><button class="btn btn-lime" style="max-width:120px" onclick="addNew()">Add</button></div>
  </div>
  <div class="card">
    <div class="l" style="margin-bottom:4px">Payments · ${paid}/${roster.length} paid</div>
    <div class="banner info" style="margin:10px 0">Money never flows through Dink Society — you collect via Venmo/cash and mark players paid here. Marking paid emails them a "you're in" confirmation.</div>
    ${rows||'<div class="empty">No sign-ups yet.</div>'}
    ${wait.length?`<div style="border-top:1px solid rgba(255,255,255,.08);margin:12px 0 8px"></div><div class="l" style="margin-bottom:6px">Waitlist (${wait.length})</div>`+wait.map(w=>`<div class="prow"><div class="pn">${esc(w.name)}</div><button class="btn btn-lime btn-sm" onclick="promote()">Promote next</button></div>`).join(''):''}
  </div>`;
}
function mrSearch(){
  const q=($('mr-q').value||'').trim().toLowerCase(), el=$('mr-res');
  if(!q){ el.innerHTML=''; return; }
  const hits=MASTER.filter(p=>!ROSTER_IDS.has(p.id) && String(p.name||'').toLowerCase().includes(q)).slice(0,8);
  if(!hits.length){ el.innerHTML='<div class="help" style="padding:6px 2px">No roster match — add them as new below.</div>'; return; }
  el.innerHTML=hits.map(p=>`<div class="prow" style="padding:8px 0"><div class="pn">${esc(p.name)} ${p.gender?`<span class="pe" style="display:inline">${esc(p.gender)}</span>`:''}${p.teamName?` <span class="pe" style="display:inline">· 🏆 ${esc(p.teamName)}</span>`:''}${p.nights?` <span class="pe" style="display:inline">· ${p.nights} ladder night${p.nights>1?'s':''}</span>`:''}</div><button class="btn btn-out btn-sm" onclick="addFromMaster('${esc(p.id)}')">Add</button></div>`).join('');
}
async function refreshRoster(){ try{ const d=await api('/admin-ladder-manage?event='+encodeURIComponent(CUR.id)); CUR._roster=d.roster||[]; CUR._waitlist=d.waitlist||[]; ROSTER_IDS=new Set((CUR._roster||[]).map(p=>p.playerId).filter(Boolean)); renderTab(); }catch(e){ toast(e.message,true); } }
async function addFromMaster(pid){
  const p=MASTER.find(x=>x.id===pid)||{};
  try{ await api('/admin-ladder-manage?event='+encodeURIComponent(CUR.id),{method:'POST',body:JSON.stringify({action:'add',playerId:pid,name:p.name,gender:p.gender||undefined,force:true})}); toast('Added '+(p.name||'player')+'.'); refreshRoster(); }
  catch(e){ toast(e.message,true); }
}
async function addNew(){
  const name=($('np-name').value||'').trim(); if(!name) return toast('Enter a name.',true);
  const gender=$('np-gender').value||undefined, email=($('np-email').value||'').trim()||undefined;
  try{ await api('/admin-ladder-manage?event='+encodeURIComponent(CUR.id),{method:'POST',body:JSON.stringify({action:'add',name,gender,email,force:true})}); toast('Added '+name+'.'); refreshRoster(); }
  catch(e){ toast(e.message,true); }
}
async function pay(pid,email,action){ try{ await api('/admin-ladder-manage?event='+encodeURIComponent(CUR.id),{method:'POST',body:JSON.stringify({action,playerId:pid||undefined,email:email||undefined})}); toast(action==='mark-paid'?'Marked paid.':'Marked unpaid.'); refreshRoster(); }catch(e){ toast(e.message,true); } }
function removeP(pid,email){ askConfirm('Remove this player from the ladder?','Remove',async()=>{ try{ await api('/admin-ladder-manage?event='+encodeURIComponent(CUR.id),{method:'POST',body:JSON.stringify({action:'remove',playerId:pid||undefined,email:email||undefined})}); toast('Removed.'); refreshRoster(); }catch(e){ toast(e.message,true); } }); }
async function promote(){ try{ await api('/admin-ladder-manage?event='+encodeURIComponent(CUR.id),{method:'POST',body:JSON.stringify({action:'promote'})}); toast('Promoted next in line.'); refreshRoster(); }catch(e){ toast(e.message,true); } }

/* Scoring */
function scoringPanel(){
  return `<div class="card">
    <div class="l" style="margin-bottom:8px">Score the ladder</div>
    <div class="help" style="margin-bottom:14px;font-size:.82rem;line-height:1.6">Open the live scoreboard to seat players into courts, run the rounds, and finalize the night. Finalizing publishes this ladder's board${CUR&&CUR.leaderboard==='included'?' and updates the league-wide leaderboard':''}.</div>
    <a class="btn btn-lime" href="/ladder-score.html?event=${encodeURIComponent(CUR.id)}">Open scoring →</a>
  </div>`;
}

/* Recap */
async function loadRecap(){
  let d; try{ d=await api('/admin-ladder-recap?event='+encodeURIComponent(CUR.id)); }catch(e){ d={recap:null}; }
  const rec=d.recap;
  const status=rec?(rec.status==='sent'?`Sent to ${rec.sentCount||0} players`:'Draft ready'):'Not generated yet';
  $('mbody').innerHTML=`<div class="card">
    <div class="l" style="margin-bottom:8px">Night recap</div>
    <div class="banner info" style="margin:0 0 12px">A recap is auto-drafted ~15 min after the night finishes. You can also generate it now, review, then send it to everyone who played — the same recap email your league ladders use.</div>
    <div class="help" style="margin-bottom:12px;font-size:.82rem">Status: <b style="color:#f0f2ec">${esc(status)}</b>${rec&&rec.recap&&rec.recap.title?` · "${esc(rec.recap.title)}"`:''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-out btn-sm" onclick="recap('generate')">${rec?'Regenerate draft':'Generate draft'}</button>
      <button class="btn btn-lime btn-sm" onclick="recap('send')" ${rec?'':'disabled'}>Send to players</button>
    </div>
  </div>`;
}
async function recap(action){
  try{ const d=await api('/admin-ladder-recap?event='+encodeURIComponent(CUR.id),{method:'POST',body:JSON.stringify({action})});
    if(action==='send') toast(`Sent to ${d.sent||0} player(s).`); else { toast('Draft ready — review and send.'); loadRecap(); }
  }catch(e){ toast(e.message,true); }
}

boot();
</script>
</body>
</html>
