<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Console · The Dink Society</title>
<meta name="robots" content="noindex,nofollow" />
<script>(function(){var t=localStorage.getItem("ds-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark")})()</script>
<style>
:root{
  --bg:#0e0e0e;--surface:#161616;--s2:#1e1e1e;--s3:#262626;--s4:#2e2e2e;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0ec;--muted:#9a9e97;--faint:#5e625c;--inv:#0e0e0e;
  --lime:#b8ff2c;--lime-dim:rgba(184,255,44,0.12);--teal:#17d7b0;--teal-dim:rgba(23,215,176,0.12);--gold:#f0c040;--gold-dim:rgba(240,192,64,0.12);
  --rf:9999px;--r:10px;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

.shell{display:grid;grid-template-columns:236px 1fr;flex:1;min-height:0}
.sb{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.sb__brand{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.sb__logo{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.sb__tag{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:700}
.sb__filter{display:flex;gap:3px;margin:11px 11px 3px;background:var(--s2);border:1px solid var(--border);border-radius:var(--rf);padding:3px}
.sb__filter button{flex:1;padding:6px 6px;border-radius:var(--rf);font-size:10px;font-weight:700;color:var(--faint);transition:all .15s}
.sb__filter button.on{background:var(--lime);color:var(--inv)}
.sb__nav{flex:1;overflow-y:auto;padding:6px 8px 16px}
.grp{margin-top:4px}
.grp.hide{display:none}
.grp__t{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:13px 12px 5px;font-weight:800;display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%}
.dot-l{background:var(--teal)}.dot-d{background:var(--lime)}.dot-s{background:var(--gold)}
.lnk{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:var(--r);color:var(--faint);font-size:12.5px;font-weight:500;width:100%;text-align:left;transition:all .13s}
.lnk:hover{color:var(--text);background:var(--s2)}
.lnk.on{color:var(--lime);background:var(--lime-dim);font-weight:600}
.lnk .bd{margin-left:auto;font-size:9px;font-weight:700;padding:1px 7px;border-radius:var(--rf);background:var(--gold-dim);color:var(--gold)}
.sb__foot{padding:11px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.sb__foot a{font-size:10.5px;color:var(--faint)}
.sb__foot a:hover{color:var(--text)}
.main{position:relative;min-width:0;background:var(--bg)}
iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s}
.load.on{opacity:1}

/* Mobile top bar + hamburger (hidden on desktop) */
.mob-bar{display:none;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;justify-content:space-between}
.mob-bar__brand{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.mob-bar__ham{font-size:19px;line-height:1;padding:4px 6px;color:var(--text)}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:998;opacity:0;pointer-events:none;transition:opacity .2s}
.mob-overlay.on{opacity:1;pointer-events:auto}

/* Mobile: sidebar becomes a slide-in drawer instead of eating screen height */
@media(max-width:820px){
  .mob-bar{display:flex}
  .mob-overlay{display:block}
  .shell{grid-template-columns:1fr}
  .sb{
    position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);
    transform:translateX(-100%);transition:transform .25s cubic-bezier(.16,1,.3,1);
    z-index:999;box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .sb.open{transform:translateX(0)}
  .sb__nav{max-height:none}
}
</style>
</head>
<body>
<div class="mob-bar">
  <span class="mob-bar__brand">Dink Society Admin</span>
  <button class="mob-bar__ham" id="ham" aria-label="Open menu" aria-expanded="false">☰</button>
</div>
<div class="mob-overlay" id="overlay"></div>
<div class="shell">
  <aside class="sb" id="sb">
    <div class="sb__brand"><span class="sb__logo">Dink Society</span><span class="sb__tag">Admin</span></div>
    <div class="sb__filter">
      <button data-f="all" class="on" onclick="setFilter('all')">All</button>
      <button data-f="l" onclick="setFilter('l')">League</button>
      <button data-f="d" onclick="setFilter('d')">Ladders</button>
    </div>
    <nav class="sb__nav" id="nav"></nav>
    <div class="sb__foot">
      <a href="/admin.html">League ↗</a>
      <a href="/admin-ladders.html">Ladders ↗</a>
      <a href="/me.html">Player ↗</a>
    </div>
  </aside>
  <div class="main">
    <div class="load" id="load">Loading…</div>
    <iframe id="frame" title="Admin"></iframe>
  </div>
</div>

<script>
// target: 'l' = league (admin.html), 'd' = ladders (admin-ladders.html)
// tab: the hash the embedded page uses (data-tab / showSec key)
const GROUPS=[
  {t:'League',dom:'l',dot:'l',items:[
    ['l','overview','Overview'],['l','registrations','Registrations'],['l','teams','Teams'],['l','players','Players'],
    ['l','schedule','Schedule'],['l','scores','Score Entry'],['l','seasons','Seasons'],['l','approvals','Approvals'],
  ]},
  {t:'Ladders',dom:'d',dot:'d',items:[
    ['d','dash','Dashboard'],['d','ladders','Ladders'],['d','players','Ladder Players'],['d','scoring','Scoring'],
    ['d','xp','XP & Rewards'],['d','credits','Credits'],['d','organizers','Organizers'],['d','import','Import'],
  ]},
  {t:'Content',dom:'l',dot:'l',items:[
    ['l','drop','The Drop'],['l','potw','Player of the Week'],['l','badges','Badges'],['l','moments','Photos'],
    ['l','site-images','Site Images'],
  ]},
  {t:'Insights',dom:'l',dot:'l',items:[
    ['l','activity','Activity'],['l','analytics','Analytics'],['l','messages','Messages'],
  ]},
  {t:'Config',dom:'s',dot:'s',items:[
    ['l','settings','League Settings'],['d','settings','Ladder Settings'],
  ]},
];
const PAGE={l:'/admin.html',d:'/admin-ladders.html'};
let FILTER='all', CUR={target:'l',tab:'overview'};
const $=(id)=>document.getElementById(id);
const key=(t,tab)=>t+':'+tab;

function domVisible(dom){ return FILTER==='all'||dom==='s'||dom===FILTER; }
function renderNav(){
  $('nav').innerHTML=GROUPS.map(g=>`
    <div class="grp ${domVisible(g.dom)?'':'hide'}">
      <div class="grp__t"><span class="dot dot-${g.dot}"></span>${g.t}</div>
      ${g.items.map(([t,tab,label])=>`<button class="lnk ${key(t,tab)===key(CUR.target,CUR.tab)?'on':''}" data-k="${key(t,tab)}" onclick="go('${t}','${tab}')">${label}</button>`).join('')}
    </div>`).join('');
}
function setFilter(f){
  FILTER=f;
  document.querySelectorAll('.sb__filter button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  renderNav();
}
function closeDrawer(){
  $('sb').classList.remove('open');
  $('overlay').classList.remove('on');
  $('ham')?.setAttribute('aria-expanded','false');
}
function go(target,tab){
  const frame=$('frame'), page=PAGE[target], want=page+'?embed=1#'+tab;
  const curPage=frame.getAttribute('data-page');
  if(curPage!==page){
    // different page → load it (embed selects the tab from the hash on load)
    $('load').classList.add('on');
    frame.setAttribute('data-page',page);
    frame.onload=()=>$('load').classList.remove('on');
    frame.src=want;
  } else {
    // same page already loaded → just switch the tab in place via its hashchange
    try{ frame.contentWindow.location.hash='#'+tab; }
    catch(e){ frame.src=want; }
  }
  CUR={target,tab};
  const top='#'+target+'/'+tab;
  if(location.hash!==top) history.replaceState(null,'',top);
  renderNav();
  closeDrawer();
}
function fromHash(){
  const raw=(location.hash||'').replace(/^#/,'');
  const [t,tab]=raw.split('/');
  if((t==='l'||t==='d')&&tab) return {target:t,tab};
  return {target:'l',tab:'overview'};
}
// mobile hamburger drawer
$('ham')?.addEventListener('click',()=>{
  const open=$('sb').classList.toggle('open');
  $('overlay').classList.toggle('on',open);
  $('ham').setAttribute('aria-expanded',open?'true':'false');
});
$('overlay')?.addEventListener('click',closeDrawer);
// initial
(function(){
  const init=fromHash(); renderNav();
  go(init.target, init.tab);
})();
window.addEventListener('hashchange',()=>{
  const h=fromHash();
  if(key(h.target,h.tab)!==key(CUR.target,CUR.tab)) go(h.target,h.tab);
});
</script>
</body>
</html>
