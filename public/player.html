        ${h.bestWeek ? hl('🔥', `Best week · ${rec(h.bestWeek.w, h.bestWeek.l)} (${signed(h.bestWeek.diff)})`, `${esc(h.bestWeek.seasonLabel)} Wk ${h.bestWeek.week}${h.bestWeek.opponentTeamName ? ' vs ' + esc(h.bestWeek.opponentTeamName) : ''}`) : ''}
        ${h.longestStreak ? hl('📈', `Longest win streak · ${h.longestStreak.n}`, esc(h.longestStreak.seasonLabel)) : ''}
        ${h.peak ? hl('⭐', `Highest rating · ${fmtDsr(h.peak.dsr)}`, `${esc(h.peak.seasonLabel)}${h.peak.week ? ' · Wk ' + h.peak.week : ''}`) : ''}
        ${h.biggestStage ? hl(h.biggestStage.place === 1 ? '🥇' : h.biggestStage.place === 2 ? '🥈' : h.biggestStage.place === 3 ? '🥉' : '🎯', `Biggest stage · ${h.biggestStage.phase === 'championship' ? (h.biggestStage.label ? 'Medal night · ' + esc(h.biggestStage.label) : 'Medal night') : h.biggestStage.phase === 'playoff' ? 'Playoffs' : 'Rivalry Week'}`, `${esc(h.biggestStage.seasonLabel)}${h.biggestStage.opponentTeamName ? ' vs ' + esc(h.biggestStage.opponentTeamName) : ''}`) : ''}
        ${!h.bestWeek && !h.longestStreak && !h.peak && !h.biggestStage ? '<div class="ml-empty">Highlights land after the first match night.</div>' : ''}`);

      // All-time partners (merged across seasons through the identity layer)
      const partners = c.partners || [];
      let partnersHtml = sub('partners', 'All-time partners', '', '<div class="ml-empty">No partner data yet.</div>');
      if (partners.length) {
        const totalPlayed = partners.reduce((n, x) => n + x.played, 0), totalWon = partners.reduce((n, x) => n + x.won, 0);
        partnersHtml = sub('partners', 'All-time partners', `${partners.length} partner${partners.length === 1 ? '' : 's'} · <b>${rec(totalWon, totalPlayed - totalWon)}</b>`,
          partners.map(x => {
            const newest = x.seasons.slice().sort()[x.seasons.length - 1];
            return partnerRow(x, playerHref(x.name, x.teamName, newest), `${x.seasons.length} season${x.seasons.length === 1 ? '' : 's'}`);
          }).join(''));
      }

      return careerStory(c) + strip + skillBandsHtml(c.skill, true, { name: (seasons.find(x => x.name) || {}).name, dsr: (seasons.find(x => x.rating && x.rating.dsr != null) || {}).rating?.dsr ?? null }) + arc + splits + highlights + table + partnersHtml;
    }

    /* ── Wire: season pills, section tabs, charts, week taps ── */
    function wireSeasonsCard(seasons, career) {
      const card = document.getElementById('seasons-card');
      if (!card) return;
      const drawn = new Set();
      // When the card's top has scrolled under the sticky bar, a switch jumps
      // back to the top of the new content instead of leaving you mid-page.
      const toTop = () => {
        const navH = 64;
        const y = card.getBoundingClientRect().top + window.scrollY - navH - 8;
        if (window.scrollY > y) window.scrollTo({ top: y, behavior: 'smooth' });
      };
      const show = (code) => {
        card.querySelectorAll('.ss-tab').forEach(b => b.classList.toggle('on', b.dataset.pane === code));
        card.querySelectorAll('.ss-pane').forEach(p => p.classList.toggle('on', p.dataset.pane === code));
        if (drawn.has(code)) return;
        drawn.add(code);
        if (code === 'career') { const el = card.querySelector('[data-career-arc]'); if (el) wireCareerArc(el, seasons); }
        else { const s = seasons.find(x => x.circuit === code); const el = card.querySelector(`[data-trend="${CSS.escape(code)}"]`); if (s && el) wireSeasonTrend(el, s, card.querySelector(`[data-log="${CSS.escape(code)}"]`)); }
      };
      card._setSec = (sec) => {
        card.dataset.sec = sec;
        card.querySelectorAll('.pf-sec').forEach(b => { const on = b.dataset.sec === sec; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
      };
      card.querySelectorAll('.ss-tab').forEach(b => b.addEventListener('click', () => { show(b.dataset.pane); toTop(); }));
      card.querySelectorAll('.pf-sec').forEach(b => b.addEventListener('click', () => { card._setSec(b.dataset.sec); toTop(); }));
      card.addEventListener('click', e => {
        const a = e.target.closest('[data-goto]'); if (!a) return;
        e.preventDefault(); show(a.dataset.goto); card._setSec('overview'); toTop();
      });
      const on = card.querySelector('.ss-tab.on');
      if (on) show(on.dataset.pane);
    }

    // Open + flash the week's match in the log (switches to the Games section).
    function openWeekInLog(logEl, wk) {
      if (!logEl) return;
      const card = logEl.closest('#seasons-card');
      if (card && card._setSec) card._setSec('games');
      const det = logEl.querySelector(`details[data-wk="${wk}"]`);
      if (!det) return;
      det.open = true;
      det.scrollIntoView({ behavior: 'smooth', block: 'center' });
      det.classList.add('is-flash');
      setTimeout(() => det.classList.remove('is-flash'), 1400);
    }

    /* ─── Season DSR trend chart ──────────────────────────── */
    function wireSeasonTrend(el, s, logEl) {
      const svg = el.querySelector('[data-svg]');
      const tip = el.querySelector('[data-tip]');
      if (!svg) return;
      const gLbl = s.gender === 'F' ? "Women's" : "Men's";
      const byWeek = {};
      for (const h of s.dsrHistory) byWeek[h.week] = h;
      const wkInfo = {};
      for (const w of (s.weeks || [])) wkInfo[w.week] = w;
      const lastWk = Math.max(...s.dsrHistory.map(h => h.week));
      const upWk = s.upcoming && s.upcoming.week != null ? s.upcoming.week : null;
      const TOTAL = Math.max(s.totalWeeks || 0, lastWk, upWk || 0, 7);

      // Series definitions: value + rank pickers per line. `r` is the official
      // (qualified) rank; `rp` is the same ranking with the games-qualification
      // bar removed — used only as a fallback so early, not-yet-qualified weeks
      // still plot a (visually distinct) provisional point instead of a gap.
      const SERIES = {
        all:    { name: 'Overall', color: '#b8ff2c', width: 3, v: h => h.dsr,  r: h => h.rank,   rp: h => h.rankProv },
        gender: { name: gLbl, color: '#17d7b0', width: 2, v: h => h.gDsr, r: h => h.gRank, rp: h => h.gRankProv },
        mixed:  { name: 'Mixed', color: '#a78bfa', width: 2, v: h => h.xDsr, r: h => h.xRank, rp: h => h.xRankProv },
      };
      let mode = 'dsr';
      const showLine = { all: true, gender: false, mixed: false };

      // Phones get their own, narrower drawing so the labels stay readable
      // instead of shrinking a 720-wide chart to a third of its size.
      const NARROW = window.innerWidth < 640;
      const F = NARROW ? 1.25 : 1;                  // label scale
      const W = NARROW ? 420 : 720, H = NARROW ? 330 : 330, PL = NARROW ? 36 : 44, PR = 16, PT = 18, PB = NARROW ? 74 : 62;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const xFor = wk => PL + (wk - 1) * ((W - PL - PR) / Math.max(1, TOTAL - 1));

      // Points for a series in the current mode: [{wk, val, prov, dnp}].
      const pts = k => {
        const out = [];
        for (let wk = 1; wk <= TOTAL; wk++) {
          const h = byWeek[wk]; if (!h) continue;
          const dnp = !!(wkInfo[wk] && !wkInfo[wk].played);
          if (mode === 'rank') {
            const off = SERIES[k].r(h);
            const prov = off == null ? SERIES[k].rp(h) : null;
            const val = off != null ? off : prov;
            if (val != null) out.push({ wk, val, prov: off == null, dnp });
          } else {
            const val = SERIES[k].v(h);
            if (val != null) out.push({ wk, val, prov: false, dnp });
          }
        }
        return out;
      };

      // Axis bounds come from the LEAGUE (pool / range), not from this player's
      // own points — the chart is "where am I in the league".
      function bounds() {
        let vals = [];
        for (const k of Object.keys(SERIES)) if (showLine[k]) vals = vals.concat(pts(k).map(p => p.val));
        if (mode === 'rank') {
          let hi = 0;
          for (const k of Object.keys(SERIES)) if (showLine[k]) hi = Math.max(hi, (s.pool || {})[k] || 0);
          hi = Math.max(hi, ...(vals.length ? vals : [0]));
          return { lo: 1, hi: Math.max(hi, 2) };
        }
        for (const k of Object.keys(SERIES)) {
          if (!showLine[k]) continue;
          const r = (s.range || {})[k];
          if (r) vals.push(r[0], r[1]);
        }
        for (const avg of Object.values(s.leagueAvg || {})) if (avg != null) vals.push(avg);
        if (!vals.length) vals = [0, 100];
        const lo = Math.max(0, Math.floor(Math.min(...vals) / 10) * 10 - 5);
        const hi = Math.ceil(Math.max(...vals) / 10) * 10 + 5;
        return { lo, hi: hi > lo ? hi : lo + 10 };
      }
      const yFor = (v, b) => {
        const t = (v - b.lo) / (b.hi - b.lo);
        return PT + (mode === 'rank' ? t : 1 - t) * (H - PT - PB);
      };
      const pathFor = (points, b) => {
        let d = '', prevWk = null;
        for (const p of points) {
          const cmd = (prevWk != null && p.wk === prevWk + 1) ? 'L' : 'M';
          d += `${cmd}${xFor(p.wk).toFixed(1)},${yFor(p.val, b).toFixed(1)} `;
          prevWk = p.wk;
        }
        return d.trim();
      };

      function draw() {
        const b = bounds();
        let out = '';
        for (let i = 0; i <= 4; i++) {
          const v = b.lo + (b.hi - b.lo) * i / 4;
          const y = yFor(v, b);
          out += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="var(--color-border)" stroke-width="1"/>`;
          out += `<text x="${PL - 8}" y="${y + 3.5}" text-anchor="end" font-size="${10 * F}" fill="var(--color-text-faint)" font-weight="600">${mode === 'rank' ? '#' + Math.round(v) : v.toFixed(0)}</text>`;
        }
        if (mode === 'rank') {
          out += `<text x="${W - PR}" y="${H - PB - 6}" text-anchor="end" font-size="${9.5 * F}" fill="var(--color-text-faint)" font-weight="700" letter-spacing="0.06em">${Math.round(b.hi)} RATED</text>`;
        }
        if (lastWk < TOTAL) {
          out += `<rect x="${xFor(lastWk)}" y="${PT}" width="${xFor(TOTAL) - xFor(lastWk)}" height="${H - PT - PB}" fill="rgba(255,255,255,0.02)"/>`;
        }
        // X axis = the week-by-week record strip. Tap a week → that match in the log.
        const colW = (W - PL - PR) / Math.max(1, TOTAL - 1);
        for (let wk = 1; wk <= TOTAL; wk++) {
          const x = xFor(wk), wi = wkInfo[wk];
          const future = wk > lastWk;
          const isUp = upWk === wk;
          const dnp = wi && !wi.played && !future;
          let l1 = NARROW ? `W${wk}` : `WK ${wk}`, l2 = '', l3 = '';
          if (wi && wi.played) { l2 = `${wi.w}–${wi.l}`; l3 = signed(wi.diff); }
          else if (dnp) { l2 = 'DNP'; }
          else if (isUp) { l2 = `vs ${teamTag(s.upcoming.opponentTeamName)}`; l3 = s.upcoming.date ? fmtDow(s.upcoming.date) : ''; }
          const dim = future && !isUp;
          const clickable = !!(wi && wi.played && wi.matchId);
          out += `<g class="${clickable ? 'wkhit' : ''}" data-wk="${wk}" ${clickable ? '' : 'pointer-events="none"'}>`;
          out += `<rect class="wkbg" x="${x - colW / 2}" y="${PT}" width="${colW}" height="${H - PT}" fill="transparent"/>`;
          out += `<text x="${x}" y="${H - PB + 16 * F}" text-anchor="middle" font-size="${9.5 * F}" fill="${isUp ? 'var(--color-teal)' : 'var(--color-text-faint)'}" font-weight="800" ${dim ? 'opacity="0.4"' : ''}>${esc(l1)}</text>`;
          if (l2) out += `<text x="${x}" y="${H - PB + 30 * F}" text-anchor="middle" font-size="${(isUp ? 8.5 : 10) * F}" fill="${dnp ? 'var(--color-text-faint)' : isUp ? 'var(--color-teal)' : (wi && wi.w > wi.l) ? '#22c55e' : (wi && wi.w < wi.l) ? '#ef4444' : 'var(--color-text)'}" font-weight="800" ${dnp ? 'opacity="0.7" font-style="italic"' : ''}>${esc(l2)}</text>`;
          if (l3) out += `<text x="${x}" y="${H - PB + 43 * F}" text-anchor="middle" font-size="${9 * F}" fill="${isUp ? 'var(--color-teal)' : 'var(--color-text-muted)'}" font-weight="700">${esc(l3)}</text>`;
          out += `</g>`;
        }
        if (mode === 'dsr' && s.leagueAvg) {
          const avgPts = [];
          for (let wk = 1; wk <= TOTAL; wk++) if (s.leagueAvg[wk] != null) avgPts.push({ wk, val: s.leagueAvg[wk] });
          if (avgPts.length) out += `<path d="${pathFor(avgPts, b)}" fill="none" stroke="var(--color-text-faint)" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7"/>`;
        }
        for (const k of Object.keys(SERIES)) {
          if (!showLine[k]) continue;
          const sd = SERIES[k], points = pts(k);
          if (!points.length) continue;
          // Edge-by-edge so a provisional stretch (not yet games-qualified) or a
          // DNP week (rating carried, nothing played) renders dashed/faded.
          let prevPt = null;
          for (const p of points) {
            if (prevPt && p.wk === prevPt.wk + 1) {
              const prov = prevPt.prov || p.prov;
              const dnp = p.dnp;
              out += `<path d="M${xFor(prevPt.wk).toFixed(1)},${yFor(prevPt.val, b).toFixed(1)} L${xFor(p.wk).toFixed(1)},${yFor(p.val, b).toFixed(1)}" fill="none" stroke="${sd.color}" stroke-width="${sd.width}" stroke-linecap="round" stroke-linejoin="round"${(prov || dnp) ? ' stroke-dasharray="5 4" opacity="0.55"' : ''}/>`;
            }
            prevPt = p;
          }
          for (const p of points) {
            const provAttr = p.prov ? ' stroke-dasharray="2 2" opacity="0.65"' : p.dnp ? ' opacity="0.5"' : '';
            out += `<circle class="tdot" data-k="${k}" data-wk="${p.wk}" cx="${xFor(p.wk)}" cy="${yFor(p.val, b)}" r="${p.dnp ? 3.5 : k === 'all' ? 5.5 : 4.5}" fill="var(--color-surface)" stroke="${sd.color}" stroke-width="2.5"${provAttr} style="cursor:pointer"/>`;
          }
          const last = points[points.length - 1];
          out += `<text x="${Math.min(xFor(last.wk) + 10, W - 40)}" y="${yFor(last.val, b) - 8}" font-size="${12 * F}" font-weight="800" fill="${sd.color}"${last.prov ? ' opacity="0.7"' : ''}>${mode === 'rank' ? '#' + last.val : Number(last.val).toFixed(1)}</text>`;
        }
        const provLeg = el.querySelector('[data-leg="prov"]');
        if (provLeg) provLeg.style.display = mode === 'rank' ? '' : 'none';
        svg.innerHTML = out;

        svg.querySelectorAll('.tdot').forEach(dot => {
          dot.addEventListener('mouseenter', () => {
            const k = dot.dataset.k, wk = +dot.dataset.wk, sd = SERIES[k], h = byWeek[wk];
            if (!h || !tip) return;
            const v = sd.v(h);
            const officialR = sd.r(h);
            const provR = sd.rp ? sd.rp(h) : null;
            const r = officialR != null ? officialR : provR;
            const isProv = officialR == null && provR != null;
            let prevV = null;
            for (let p = wk - 1; p >= 1; p--) { const ph = byWeek[p]; if (ph && sd.v(ph) != null) { prevV = sd.v(ph); break; } }
            const delta = (v != null && prevV != null) ? Math.round((v - prevV) * 10) / 10 : null;
            const wi = wkInfo[wk];
            tip.innerHTML = `<div class="tt-wk">Week ${wk} · ${esc(sd.name)}</div>
              DSR <b>${v != null ? Number(v).toFixed(1) : '—'}</b>${delta != null ? ` <span class="${delta >= 0 ? 'val--green' : 'val--red'}" style="font-weight:800">(${delta >= 0 ? '+' : ''}${delta})</span>` : ''}<br>
              ${r != null ? `Rank <b>#${r}</b>${isProv ? ' <span style="color:var(--color-text-faint);font-weight:600">(provisional — not yet qualified)</span>' : ''}` : '<span style="color:var(--color-text-faint)">Unranked</span>'}
              ${wi ? `<br>${wi.played ? `${wi.w}–${wi.l} · ${signed(wi.diff)}${wi.opponentTeamName ? ' vs ' + esc(wi.opponentTeamName) : ''}` : '<span style="color:var(--color-text-faint)">Did not play · rating carried</span>'}` : ''}`;
            const rect = svg.getBoundingClientRect();
            tip.style.left = (parseFloat(dot.getAttribute('cx')) / W * rect.width) + 'px';
            tip.style.top = (parseFloat(dot.getAttribute('cy')) / H * rect.height) + 'px';
            tip.classList.add('show');
          });
          dot.addEventListener('mouseleave', () => tip && tip.classList.remove('show'));
        });
        svg.querySelectorAll('.wkhit').forEach(g => g.addEventListener('click', () => openWeekInLog(logEl, +g.dataset.wk)));
      }

      const seg = el.querySelector('[data-seg]');
      if (seg) seg.addEventListener('click', e => {
        const btn = e.target.closest('button'); if (!btn) return;
        mode = btn.dataset.mode;
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === btn));
        draw();
      });
      el.querySelectorAll('.trend-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const k = chip.dataset.line;
          showLine[k] = !showLine[k];
          if (!showLine.all && !showLine.gender && !showLine.mixed) { showLine[k] = true; return; }
          chip.classList.toggle('on', showLine[k]);
          const lg = el.querySelector(`[data-leg="${k}"]`);
          if (lg) lg.style.display = showLine[k] ? '' : 'none';
          draw();
        });
      });

      draw();
    }

    /* ─── Career DSR arc: one continuous line across seasons ── */
    function wireCareerArc(el, seasons) {
      const svg = el.querySelector('[data-svg]');
      const tip = el.querySelector('[data-tip]');
      if (!svg) return;
      const curCode = currentCode();
      const ordered = seasons.filter(s => s.dsrHistory && s.dsrHistory.length).slice().sort((a, b) => a.seasonLabel.localeCompare(b.seasonLabel, undefined, { numeric: true }));
      if (!ordered.length) { svg.outerHTML = '<div class="ml-empty">No weekly ratings yet.</div>'; return; }
      // Flatten: every (season, week) point in order, with a gap between seasons.
      const pts = [];
      ordered.forEach((s, si) => {
        const hist = s.dsrHistory.slice().sort((a, b) => a.week - b.week);
        for (const h of hist) if (h.dsr != null) pts.push({ si, s, wk: h.week, val: h.dsr, cur: s.circuit === curCode && !s.finalized });
      });
      const NARROW = window.innerWidth < 640;
      const F = NARROW ? 1.3 : 1;                   // label scale on phones
      const W = NARROW ? 420 : 720, H = NARROW ? 280 : 260, PL = 44, PR = 16, PT = 18, PB = 40, GAP = 1.2;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      // x position: cumulative week index with a gap between seasons.
      // A season gets at least two units of width so a one-week season (the
      // opening night of a new season) still reads as a stretch, not a sliver.
      let cursor = 0; const startX = {}; const spanOf = {};
      ordered.forEach((s, si) => { startX[si] = cursor; spanOf[si] = Math.max(2, s.dsrHistory.length); cursor += spanOf[si] + (si < ordered.length - 1 ? GAP : 0); });
      const unit = (W - PL - PR) / Math.max(1, cursor - 1);
      const xFor = p => { const hist = p.s.dsrHistory.slice().sort((a, b) => a.week - b.week); const i = hist.findIndex(h => h.week === p.wk); const n = hist.length; const pos = n > 1 ? i * ((spanOf[p.si] - 1) / (n - 1)) : (spanOf[p.si] - 1) / 2; return PL + (startX[p.si] + pos) * unit; };
      const vals = pts.map(p => p.val);
      const lo = Math.max(0, Math.floor(Math.min(...vals) / 10) * 10 - 5), hi0 = Math.ceil(Math.max(...vals) / 10) * 10 + 5, hi = hi0 > lo ? hi0 : lo + 10;
      const yFor = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
      let out = '';
      for (let i = 0; i <= 4; i++) {
        const v = lo + (hi - lo) * i / 4, y = yFor(v);
        out += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="var(--color-border)" stroke-width="1"/>`;
        out += `<text x="${PL - 8}" y="${y + 3.5}" text-anchor="end" font-size="${10 * F}" fill="var(--color-text-faint)" font-weight="600">${v.toFixed(0)}</text>`;
      }
      // Season dividers + labels
      ordered.forEach((s, si) => {
        const x0 = PL + startX[si] * unit, x1 = PL + (startX[si] + spanOf[si] - 1) * unit;
        if (si > 0) { const gx = x0 - (GAP / 2) * unit; out += `<line x1="${gx}" y1="${PT}" x2="${gx}" y2="${H - PB}" stroke="var(--color-border)" stroke-width="1" stroke-dasharray="3 4"/>`; }
        out += `<text x="${(x0 + x1) / 2}" y="${H - 14}" text-anchor="middle" font-size="${10 * F}" fill="${s.circuit === curCode && !s.finalized ? 'var(--color-lime)' : 'var(--color-teal)'}" font-weight="800" letter-spacing="0.08em">${esc(s.seasonLabel.toUpperCase())}</text>`;
        const fin = finishText(s.finish);
        if (fin && !(s.circuit === curCode && !s.finalized)) out += `<text x="${(x0 + x1) / 2}" y="${H - 3}" text-anchor="middle" font-size="${8.5 * F}" fill="var(--color-text-faint)" font-weight="700">${esc(fin)}</text>`;
      });
      // Line, edge by edge (season color; a dotted bridge across the divider)
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], p = pts[i];
        const bridge = a.si !== p.si;
        const color = p.cur ? '#b8ff2c' : '#17d7b0';
        out += `<path d="M${xFor(a).toFixed(1)},${yFor(a.val).toFixed(1)} L${xFor(p).toFixed(1)},${yFor(p.val).toFixed(1)}" fill="none" stroke="${bridge ? 'var(--color-text-faint)' : color}" stroke-width="${bridge ? 1.5 : 2.5}" stroke-linecap="round"${bridge ? ' stroke-dasharray="3 4" opacity="0.6"' : ''}/>`;
      }
      pts.forEach((p, i) => {
        out += `<circle class="tdot" data-i="${i}" cx="${xFor(p)}" cy="${yFor(p.val)}" r="4" fill="var(--color-surface)" stroke="${p.cur ? '#b8ff2c' : '#17d7b0'}" stroke-width="2.2" style="cursor:pointer"/>`;
      });
      // Peak marker + last value
      const peak = pts.reduce((m, p) => (!m || p.val > m.val) ? p : m, null);
      if (peak) out += `<text x="${xFor(peak)}" y="${yFor(peak.val) - 9}" text-anchor="middle" font-size="${9 * F}" fill="var(--color-gold, #f0c040)" font-weight="800">★ ${peak.val.toFixed(1)}</text>`;
      const last = pts[pts.length - 1];
      if (last && last !== peak) out += `<text x="${Math.min(xFor(last) + 8, W - 36)}" y="${yFor(last.val) - 8}" font-size="${11 * F}" font-weight="800" fill="${last.cur ? '#b8ff2c' : '#17d7b0'}">${last.val.toFixed(1)}</text>`;
      svg.innerHTML = out;
      svg.querySelectorAll('.tdot').forEach(dot => {
        dot.addEventListener('mouseenter', () => {
          const p = pts[+dot.dataset.i]; if (!p || !tip) return;
          const h = p.s.dsrHistory.find(x => x.week === p.wk) || {};
          tip.innerHTML = `<div class="tt-wk">${esc(p.s.seasonLabel)} · Week ${p.wk}</div>DSR <b>${p.val.toFixed(1)}</b>${h.rank != null ? ` · Rank <b>#${h.rank}</b>` : ''}<br><span style="color:var(--color-text-faint)">${esc(p.s.teamName || '')}</span>`;
          const rect = svg.getBoundingClientRect();
          tip.style.left = (parseFloat(dot.getAttribute('cx')) / W * rect.width) + 'px';
          tip.style.top = (parseFloat(dot.getAttribute('cy')) / H * rect.height) + 'px';
          tip.classList.add('show');
        });
        dot.addEventListener('mouseleave', () => tip && tip.classList.remove('show'));
      });
    }

    (window.dsSeason ? window.dsSeason() : Promise.resolve(null)).then(function (S) {
      if (S) { SEASON_ID = S.id; CIRCUIT = S.circuit; LINK_SUFFIX = S.suffix; SEASON_NAME = S.name; ALL_SEASONS = S.all || []; CURRENT_SEASON = S.current || null; VIEWED_IS_CURRENT = !!S.isCurrent && !S.isPast; }
    }).catch(() => {}).then(() =>
    load()).catch(e => { console.error('player load failed', e); const pr = document.getElementById('page-root'); if (pr) pr.innerHTML = '<div class="pp-loading">Couldn’t load this player. <a href="#" onclick="location.reload();return false" style="color:var(--color-lime);font-weight:700">Retry</a></div>'; });
  })();
  </script>
</body>
