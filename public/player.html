       current one, which flips a week before its start date). -->

  <style>
    /* ═══════════════════════════════════════
       PLAYER PROFILE — full-page layout
    ═══════════════════════════════════════ */
    .pp-shell { max-width: 780px; margin: 0 auto; padding: 80px var(--gutter) 100px; }

    /* ── Nav back ── */
    .pp-back { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--color-text-faint); text-decoration: none; margin-bottom: var(--space-5); transition: color var(--transition); }
    .pp-back:hover { color: var(--color-text); }
    .pp-back::before { content: '←'; }

    /* ── Section card ── */
    .pp-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5) var(--space-6); margin-bottom: var(--space-4); }
    .pp-card__head { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.14em; color: var(--color-text-faint); margin-bottom: var(--space-4); }
    .pp-hero__pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pp-pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-full); border: 1px solid var(--color-border); color: var(--color-text-faint); background: var(--color-surface-2); }
    .pp-pill--award { color: var(--color-lime); border-color: var(--color-lime); background: var(--color-lime-ghost); }
    .val--green { color: #22c55e; }
    .val--red   { color: #ef4444; }
    .val--teal  { color: var(--color-teal); }
    .val--lime  { color: var(--color-lime); }

    /* ═══ MLP-format hero ═══ */
    .mlp-hero { border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: var(--space-4);
      background: linear-gradient(115deg, var(--color-surface) 0%, var(--color-surface-2) 100%); }
    .mlp-hero__top { display: flex; align-items: center; gap: 24px; padding: 28px 30px; }
    .mlp-photo { position: relative; width: 120px; height: 120px; flex-shrink: 0; border-radius: 50%; overflow: visible;
      display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800; color: #fff;
      background: var(--ph, var(--color-teal)); border: 1px solid var(--color-border); }
    .mlp-photo__img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .mlp-hero__id { flex: 1; min-width: 0; }
    .mlp-hero__name { font-size: clamp(1.4rem, 3.2vw, 2.2rem); font-weight: 800; line-height: 1.05; margin: 0; overflow-wrap: anywhere; }
    .mlp-hero__name.is-long  { font-size: clamp(1.25rem, 2.6vw, 1.85rem); }
    .mlp-hero__name.is-xlong { font-size: clamp(1.1rem, 2.2vw, 1.55rem); }
    .mlp-hero__meta { font-size: 13px; font-weight: 600; color: var(--color-text-muted); margin-top: 7px; }
    .mlp-hero__meta a { color: var(--color-teal); text-decoration: none; font-weight: 700; }
    .mlp-hero__meta a:hover { text-decoration: underline; }
    @media (max-width: 420px) { .mlp-hero__name { white-space: normal; overflow-wrap: anywhere; } }
    .mlp-hero__dsr { flex-shrink: 0; text-align: center; padding: 0 6px; }
    .mlp-hero__dsr-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-faint); }
    .mlp-hero__dsr-n { font-size: 3rem; font-weight: 800; color: var(--color-lime); line-height: 1; margin: 4px 0; }
    .mlp-hero__dsr-rk { font-size: 11px; color: var(--color-text-muted); font-weight: 600; }
    .mlp-vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); border-top: 1px solid var(--color-border); background: rgba(0,0,0,0.18); }
    .mlp-vital { padding: 14px 12px; border-right: 1px solid var(--color-border); text-align: center; }
    .mlp-vital:last-child { border-right: none; }
    .mlp-vital__lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-faint); margin-bottom: 5px; }
    .mlp-vital__val { font-size: 15px; font-weight: 800; }
    @media (max-width: 640px) {
      .mlp-hero__top { gap: 14px; padding: 20px; }
      .mlp-photo { width: 76px; height: 76px; font-size: 26px; border-radius: 50%; }
      .mlp-hero__name { font-size: 1.45rem; }
      .mlp-hero__name.is-long  { font-size: 1.25rem; }
      .mlp-hero__name.is-xlong { font-size: 1.1rem; }
      .mlp-hero__dsr-n { font-size: 2.2rem; }
      .mlp-hero__dsr-rk { display: none; }
      .mlp-vitals { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
    }

    /* ═══ SEASONS card ═══ */
    .ss-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: var(--space-4); }
    .ss-head .pp-card__head { margin-bottom: 0; }
    .ss-tabs { display: flex; gap: 4px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 3px; flex-wrap: wrap; }
    .ss-tab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--color-text-faint); font: inherit; font-size: 11.5px; font-weight: 800; letter-spacing: 0.02em; padding: 6px 14px; border-radius: var(--radius-full); cursor: pointer; white-space: nowrap; transition: background var(--transition), color var(--transition); }
    .ss-tab:hover { color: var(--color-text); }
    .ss-tab.on { background: var(--color-teal); color: #06231d; }
    .ss-tab.on .ss-dot { background: #06231d; box-shadow: none; }
    .ss-tab--career.on { background: var(--color-gold, #f0c040); color: #241a02; }
    .ss-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-lime); box-shadow: 0 0 8px var(--color-lime); }
    .ss-pane { display: none; }
    .ss-pane.on { display: block; }
    .ss-note { font-size: 11.5px; color: var(--color-text-faint); margin-bottom: var(--space-4); line-height: 1.5; }

    /* headline strip */
    .ss-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: var(--space-4); }
    .ss-tile { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px 12px; min-width: 0; }
    .ss-tile__lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-faint); margin-bottom: 6px; white-space: nowrap; }
    .ss-tile__val { font-size: 1.55rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .ss-tile__sub { font-size: 11px; color: var(--color-text-muted); margin-top: 6px; font-weight: 600; line-height: 1.35; }
    .ss-tile__sub b { color: var(--color-text); font-weight: 800; }

    /* sub-card (chart, boxes, log) */
    .ss-sub { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-2); padding: 14px 14px 12px; margin-bottom: 10px; }
    .ss-sub__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .ss-sub__title { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-faint); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .ss-sub__title .now { font-size: 20px; font-weight: 800; color: var(--color-lime); letter-spacing: 0; text-transform: none; line-height: 1; }
    .ss-sub__title .delta { font-size: 11px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--color-text-muted); }

    /* trend chart controls */
    .trend-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .trend-chip { font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: transparent; color: var(--color-text-faint); cursor: pointer; font-family: inherit; }
    .trend-chip.on { border-color: currentColor; }
    .trend-seg { display: flex; gap: 4px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 3px; }
    .trend-seg button { border: 0; background: transparent; color: var(--color-text-faint); font: inherit; font-size: 11px; font-weight: 800; padding: 5px 13px; border-radius: var(--radius-full); cursor: pointer; }
    .trend-seg button.on { background: var(--color-teal); color: #06231d; }
    .trend-wrap { position: relative; }
    .trend-wrap svg { width: 100%; height: auto; display: block; }
    .trend-tip { position: absolute; pointer-events: none; background: var(--color-bg, #0b0e0c); border: 1px solid var(--color-border); border-radius: 10px; padding: 9px 11px; font-size: 11px; line-height: 1.5; min-width: 130px; opacity: 0; transform: translate(-50%, -110%); transition: opacity 0.12s; z-index: 5; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .trend-tip.show { opacity: 1; }
    .trend-tip .tt-wk { font-weight: 800; color: var(--color-lime); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
    .trend-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--color-text-muted); align-items: center; }
    .trend-legend .sw { display: inline-block; width: 16px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
    .wkhit { cursor: pointer; }
    .wkhit:hover .wkbg { fill: rgba(255,255,255,0.05); }

    /* the three boxes */
    .ss-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
    .ss-box { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-2); padding: 12px 14px; min-width: 0; }
    .ss-box__h { font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-teal); margin-bottom: 6px; }
    .kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--color-border); font-size: 12px; }
    .kv:first-of-type { border-top: 0; }
    .kv .k { color: var(--color-text-muted); font-weight: 600; min-width: 0; }
    .kv .k small { display: block; font-size: 9.5px; color: var(--color-text-faint); font-weight: 600; margin-top: 1px; }
    .kv .v { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .kv .v small { font-size: 10px; color: var(--color-text-faint); font-weight: 600; margin-left: 4px; }
    .bar { height: 4px; border-radius: 2px; background: var(--color-surface-3, rgba(255,255,255,0.08)); margin-top: 5px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 2px; background: var(--color-lime); }
    .bar.teal i { background: var(--color-teal); }
    .bar.purple i { background: #a78bfa; }

    /* performance vs. skill level */
    .sk-note { font-size: 10.5px; color: var(--color-text-faint); font-weight: 600; }
    .sk-row { padding: 12px 0 11px; border-top: 1px solid var(--color-border); }
    .sk-row:first-of-type { border-top: 0; padding-top: 4px; }
    .sk-top { display: flex; align-items: center; gap: 10px; }
    .sk-vs { font-size: 12px; color: var(--color-text-faint); font-weight: 700; white-space: nowrap; }
    .sk-vs b { font-size: 17px; color: var(--color-text); font-weight: 800; font-variant-numeric: tabular-nums; margin-left: 3px; }
    .sk-tier { font-size: 10px; color: var(--color-text-faint); font-weight: 600; white-space: nowrap; }
    .sk-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.04em; padding: 3px 10px; border-radius: 9999px; white-space: nowrap; }
    .sk-tag--dominant  { color: #c4b5fd; background: rgba(167,139,250,0.14); }
    .sk-tag--strong    { color: #22c55e; background: rgba(34,197,94,0.12); }
    .sk-tag--competitive { color: #7cb3ff; background: rgba(59,130,246,0.16); }
    .sk-tag--growing   { color: #e8b542; background: rgba(232,181,66,0.13); }
    .sk-tag--challenge { color: #f87171; background: rgba(239,68,68,0.13); }
    .sk-tag--sample    { color: var(--color-text-faint); background: var(--color-surface-3, rgba(255,255,255,0.06)); }
    .sk-row--lvl { background: var(--color-lime-ghost); border-radius: 14px; margin: 0 -10px; padding-left: 10px !important; padding-right: 10px !important; border-top-color: transparent !important; }
    .sk-lvl { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-lime); margin-bottom: 6px; }
    .sk-you { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; color: #06231d; background: var(--color-lime); padding: 2px 7px; border-radius: 9999px; }
    .sk-pct { margin-left: auto; font-size: 24px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .sk-bar { height: 6px; border-radius: 3px; background: var(--color-surface-3, rgba(255,255,255,0.08)); margin: 9px 0 7px; overflow: hidden; }
    .sk-bar i { display: block; height: 100%; border-radius: 3px; }
    .sk-bar--dominant i { background: #a78bfa; } .sk-bar--strong i { background: #22c55e; }
    .sk-bar--competitive i { background: #3b82f6; }
    .sk-bar--growing i { background: #e8b542; } .sk-bar--challenge i { background: #ef4444; }
    .sk-bar--sample i { background: var(--color-text-faint); opacity: .5; }
    .sk-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--color-text-faint); font-weight: 600; }
    .sk-foot b { color: var(--color-text); font-weight: 800; font-variant-numeric: tabular-nums; }
    .sk-row--empty .sk-vs b, .sk-row--empty .sk-pct { color: var(--color-text-faint); }
    .sk-read { margin-top: 6px; padding: 10px 12px; border-radius: 8px; background: var(--color-surface); border: 1px solid var(--color-border); font-size: 12px; line-height: 1.5; color: var(--color-text-muted); }
    .sk-read b { color: var(--color-lime); }

    /* match log */
    .ss-wk { border-top: 1px solid var(--color-border); }
    .ss-wk:first-of-type { border-top: 0; }
    .ss-wk > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 12px; }
    .ss-wk > summary::-webkit-details-marker { display: none; }
    .ss-wk > summary::before { content: '▸'; color: var(--color-text-faint); font-size: 10px; width: 10px; flex-shrink: 0; transition: transform 0.15s; }
    .ss-wk[open] > summary::before { transform: rotate(90deg); }
    .ss-wk.is-flash > summary { background: var(--color-lime-ghost); border-radius: 6px; }
    .ss-wk__wk { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-teal); white-space: nowrap; }
    .ss-wk__meta { flex: 1; min-width: 0; color: var(--color-text-muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ss-wk__meta a { color: var(--color-text); text-decoration: none; font-weight: 700; }
    .ss-wk__meta a:hover { color: var(--color-teal); }
    .ss-wk__rec { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ss-wk__team { font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
    .ss-wk__team.w { color: #22c55e; background: rgba(34,197,94,0.12); }
    .ss-wk__team.l { color: #ef4444; background: rgba(239,68,68,0.12); }
    .ss-wk__team.t { color: var(--color-text-muted); background: var(--color-surface-3, rgba(255,255,255,0.06)); }
    .ml-row { display: flex; align-items: center; gap: 10px; padding: 8px 0 8px 20px; border-top: 1px dashed var(--color-border); font-size: 12.5px; }
    .ml-type { flex-shrink: 0; font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-faint); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 5px; padding: 3px 7px; min-width: 62px; text-align: center; }
    .ml-who { flex: 1; min-width: 0; line-height: 1.45; }
    .ml-who a { color: var(--color-text); text-decoration: none; font-weight: 700; }
    .ml-who a:hover { color: var(--color-teal); }
    .ml-who .ml-lbl { color: var(--color-text-faint); font-weight: 600; }
    .ml-dsr { flex-shrink: 0; text-align: right; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--color-text-muted); }
    .ml-dsr .ml-lbl { display: block; font-size: 8.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-faint); }
    .ml-score { flex-shrink: 0; min-width: 74px; text-align: right; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
    .ml-wl { display: inline-block; min-width: 18px; text-align: center; font-size: 10px; font-weight: 800; border-radius: 4px; padding: 2px 5px; margin-left: 6px; }
    .ml-wl--w { color: #22c55e; background: rgba(34,197,94,0.12); }
    .ml-wl--l { color: #ef4444; background: rgba(239,68,68,0.12); }
    .ml-empty { font-size: 12px; color: var(--color-text-faint); padding: var(--space-4) 0; text-align: center; }

    /* partners */
    .partners-list { display: flex; flex-direction: column; gap: 0; }
    .partner-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--color-border); }
    .partner-row:first-of-type { border-top: 0; }
    .partner-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #fff; flex-shrink: 0; overflow: hidden; }
    .partner-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .partner-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--color-text); text-decoration: none; transition: color var(--transition); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .partner-name small { color: var(--color-text-faint); font-weight: 600; font-size: 10.5px; margin-left: 6px; }
    .partner-name:hover { color: var(--color-teal); }
    .partner-record { font-size: 12px; font-weight: 700; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
    .partner-pct { font-size: 12px; font-weight: 800; min-width: 40px; text-align: right; }
    .partner-total-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 0; font-size: 12px; font-weight: 700; color: var(--color-text-faint); border-top: 1px solid var(--color-border); }
    .partner-total-row .total-val { font-size: 14px; font-weight: 800; color: var(--color-text); }

    /* career table */
    .ss-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ss-table th, .ss-table td { padding: 9px 8px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ss-table th { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-faint); border-bottom: 1px solid var(--color-border); }
    .ss-table th:first-child, .ss-table td:first-child { text-align: left; padding-left: 0; }
    .ss-table td:first-child { font-weight: 800; }
    .ss-table td:first-child small { display: block; font-size: 10px; color: var(--color-text-faint); font-weight: 600; white-space: normal; }
    .ss-table tbody tr + tr td { border-top: 1px solid var(--color-border); }
    .ss-table tfoot td { border-top: 2px solid var(--color-border-strong, var(--color-border)); font-weight: 800; color: var(--color-lime); }
    .ss-table a { color: inherit; text-decoration: none; }
    .ss-table a:hover { color: var(--color-teal); }
    .ss-table .fin { font-size: 10px; font-weight: 800; color: var(--color-gold, #f0c040); }

    /* ═══════════════════════════════════════════════════════

    /* skill bands, bigger */

    /* partners */

    .pf-prow__pct { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .pf-prow .pf-bar { height: 6px; margin: 8px 0 6px; }

    /* career bits */

    @media (max-width: 640px) {

<body data-page="player">
  <div data-partial="nav"></div>

  <div class="pp-shell">
    <a href="/teams" class="pp-back" id="back-link">Teams</a>
    <div id="page-root"><div class="pp-loading">Loading…</div></div>
  </div>

  <div data-partial="footer"></div>
  <script src="/js/partials.js"></script>
  <script src="/ladder-profile-view.js"></script>
  <script>
  (() => {
    /* ─── Helpers ─────────────────────────────────────────── */
    const esc  = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const slug = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
    const fmtDow  = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-US',{weekday:'short'}); };
    const pct  = (won, played) => played ? Math.round(won / played * 100) : 0;
    const fmtDsr = d => (d != null ? Number(d).toFixed(1) : '—');
    const signed = n => (n == null ? '—' : (n > 0 ? '+' : '') + n);
    const rec = (w, l) => `${w ?? 0}–${l ?? 0}`;
    // DSR ring (hero): r = 54 in a 128 box.
    const RING_C = 339.3;
    const setRing = (el, p) => { const arc = el && el.querySelector('.pf-ring__arc'); if (arc) arc.style.strokeDashoffset = String(RING_C * (1 - Math.max(0, Math.min(1, p)))); };
    const SN = n => (window.shortName ? window.shortName(n) : n);
    // Short team tag for tight labels: "Happy Hour Hitters" → HHH, "Bonkerz" → BON.
    const teamTag = n => { const w = String(n || '').trim().split(/\s+/).filter(Boolean); if (!w.length) return 'TBD'; return (w.length >= 2 ? w.slice(0, 3).map(x => x[0]).join('') : w[0].slice(0, 3)).toUpperCase(); };
    // Shrink the hero name for long names / long single words so it never
    // crowds the DSR or wraps awkwardly on mobile.
    const nameSizeClass = (name) => {
      const n = String(name || '');
      const longestWord = n.split(/\s+/).reduce((m, w) => Math.max(m, w.length), 0);
      if (n.length > 18 || longestWord > 11) return 'is-xlong';
      if (n.length > 12 || longestWord > 8)  return 'is-long';
      return '';
    };

    const PALETTE = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#84cc16'];
    const avatarColor = name => { let h = 0; for (const c of String(name||'')) h = (h*31+c.charCodeAt(0))&0xffff; return PALETTE[h%PALETTE.length]; };
    const initial = name => (name || '?').charAt(0).toUpperCase();
    const teamInitials = name => (name || '?').split(/\s+/).slice(0, 2).map(w => w.charAt(0).toUpperCase()).join('');

    /* ─── URL ─────────────────────────────────────────────── */
    const params     = new URLSearchParams(location.search);
    const teamParam  = params.get('team')  || '';
    const playerName = params.get('name')  || '';
    const playerIdParam = params.get('id') || '';   // direct player-id lookup (future use)
    // Season: the URL when given, else the current one (js/season.js).
    let SEASON_ID = params.get('season') || 'circuit-i';
    // Season ids come in several shapes ('circuit-i', 'season-2', a bare '2').
    function codeFromId(id) {
      var ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
      var roman = function (n) { return (n >= 1 && n <= 10) ? ROMAN[n] : String(n); };
      var s = String(id || '').trim();
      if (!s) return 'I';
      if (/^(TEST|[IVX]+)$/i.test(s)) return s.toUpperCase();
      if (/^(circuit|season)-/i.test(s)) {
        var t = s.replace(/^(circuit|season)-/i, '').trim();
        return /^\d+$/.test(t) ? roman(parseInt(t, 10)) : t.toUpperCase();
      }
      if (/^\d+$/.test(s)) return roman(parseInt(s, 10));
      var m = s.match(/season\s*(\d+)/i);   // display name: "Season 2" → II
      if (m) return roman(parseInt(m[1], 10));
      return s.toUpperCase();
    }
    let CIRCUIT   = codeFromId(SEASON_ID);
    let LINK_SUFFIX = SEASON_ID === 'circuit-i' ? '' : `&season=${encodeURIComponent(SEASON_ID)}`;
    let SEASON_NAME = null;   // filled from the season record, for the chips
    let ALL_SEASONS = [];     // every public season, for the cross-season fallback
    let CURRENT_SEASON = null; // the season the site is on right now (js/season.js)
    // The season record being viewed (start date, tag) — for copy that names it.
    function seasonRec() { return (ALL_SEASONS || []).find(x => x && x.id === SEASON_ID) || null; }
    function seasonNameNow() { return SEASON_NAME || (seasonRec() && seasonRec().name) || 'This season'; }
    function seasonStartText() {
      const sr = seasonRec(); const d = sr && sr.startDate ? new Date(sr.startDate + 'T12:00:00') : null;
      return d && !isNaN(d) ? d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) : '';
    }
    // Season id for a circuit code ('I' → 'season-1'), so links can carry it.
    function seasonIdForCode(code) {
      const c = String(code || '').toUpperCase();
      const hit = (ALL_SEASONS || []).find(x => x && String(x.circuit || '').toUpperCase() === c);
      return hit ? hit.id : null;
    }
    function suffixForCode(code) { const sid = seasonIdForCode(code); return sid && sid !== 'circuit-i' ? '&season=' + encodeURIComponent(sid) : ''; }
    // The circuit the site is on right now (in-progress dot on its tab).
    let VIEWED_IS_CURRENT = false; // js/season.js's verdict on the viewed season
    function currentCode() {
      const c = CURRENT_SEASON && CURRENT_SEASON.circuit ? String(CURRENT_SEASON.circuit).toUpperCase() : null;
      if (c) return c;
      if (CURRENT_SEASON && CURRENT_SEASON.id) return codeFromId(CURRENT_SEASON.id);
      return VIEWED_IS_CURRENT ? CIRCUIT : null;
    }

    /* ─── Load ────────────────────────────────────────────── */
    async function load() {
      // Always fetch teams to find the player's roster entry + team info
      const teamsRes = await fetch('/.netlify/functions/public-teams?season=' + encodeURIComponent(SEASON_ID)).then(r => r.ok ? r.json().catch(() => null) : null).catch(() => null);
      if (!teamsRes) {
        document.getElementById('page-root').innerHTML = '<div class="pp-loading">Couldn’t load right now. <a href="#" onclick="location.reload();return false" style="color:var(--color-lime);font-weight:700">Retry</a></div>';
        return;
      }
      const teams = teamsRes.teams || [];

      // Find the team by slug or raw id
      let team = teams.find(t => slug(t.name) === teamParam) || teams.find(t => t.id === teamParam);
      let rosterPlayer = null;

      if (team) {
        rosterPlayer = (team.roster || []).find(p => (playerIdParam && p.id === playerIdParam) || p.name === playerName);
      }

      // Fall back: search all teams if direct team match fails
      if (!rosterPlayer) {
        for (const t of teams) {
          const found = (t.roster || []).find(p => (playerIdParam && p.id === playerIdParam) || p.name === playerName);
          if (found) { rosterPlayer = found; team = t; break; }
        }
      }

      // Still nothing? The link may point at a season this player didn't play.
      // A profile link should never dead-end just because the site has moved on
      // to a new season — look through the other seasons before giving up, and
      // show the player in whichever one they're actually on.
      if (!rosterPlayer) {
        const others = (ALL_SEASONS || [])
          .map(sn => sn && sn.id)
          .filter(id => id && id !== SEASON_ID);
        for (const otherId of others) {
          let list = null;
          try {
            const rr = await fetch('/.netlify/functions/public-teams?season=' + encodeURIComponent(otherId));
            list = rr.ok ? await rr.json().catch(() => null) : null;
          } catch { list = null; }
          const otherTeams = (list && list.teams) || [];
          const hitTeam = otherTeams.find(t => (t.roster || []).some(pp => pp.name === playerName));
          if (!hitTeam) continue;
          rosterPlayer = (hitTeam.roster || []).find(pp => pp.name === playerName);
          team = hitTeam;
          // Retarget the whole page at the season we found them in.
          const sn = (ALL_SEASONS || []).find(x => x && x.id === otherId) || {};
          SEASON_ID = otherId;
          CIRCUIT = String(sn.circuit || '').toUpperCase() || CIRCUIT;
          SEASON_NAME = sn.name || sn.label || SEASON_NAME;
          LINK_SUFFIX = '&season=' + encodeURIComponent(otherId);
          break;
        }
      }

      if (!rosterPlayer || !team) {
        document.getElementById('page-root').innerHTML = '<div class="pp-loading">Player not found.</div>';
        return;
      }

      document.title = `${rosterPlayer.name} · The Dink Society`;
      const teamSlug = slug(team.name);

      // Viewing a past season? Still say where they play NOW. Look them up on
      // the current season's rosters (same email first, then same name).
      rosterPlayer._current = null;
      if (CURRENT_SEASON && CURRENT_SEASON.id && CURRENT_SEASON.id !== SEASON_ID) {
        try {
          const cr = await fetch('/.netlify/functions/public-teams?season=' + encodeURIComponent(CURRENT_SEASON.id));
          const cd = cr.ok ? await cr.json().catch(() => null) : null;
          const em = String(rosterPlayer.email || '').trim().toLowerCase();
          const same = pp => pp && !pp.archived && ((em && String(pp.email || '').trim().toLowerCase() === em) || pp.name === playerName);
          for (const ct of ((cd && cd.teams) || [])) {
            const hit = (ct.roster || []).find(same);
            if (hit) { rosterPlayer._current = { team: ct, player: hit, seasonName: CURRENT_SEASON.name || CURRENT_SEASON.label || 'Current season', seasonId: CURRENT_SEASON.id }; break; }
          }
        } catch {}
      }

      // Update back link to point at the team page
      const back = document.getElementById('back-link');
      back.href = `/team?id=${teamSlug}${LINK_SUFFIX}`;
      back.textContent = team.name;

      // Roster entries carry their id; a legacy roster without one falls back to
      // the season's stats blob (name + team match) to find it.
      let resolvedId = rosterPlayer.id || playerIdParam || '';
      if (!resolvedId) {
        try {
          const lr = await fetch('/.netlify/functions/public-leaderboard?circuit=' + encodeURIComponent(CIRCUIT) + '&view=players');
          const ld = lr.ok ? await lr.json().catch(() => null) : null;
          const allP = ld && !ld.empty ? Object.values(ld.players || {}) : [];
          const hit = allP.find(p => p.name === playerName && (p.teamName === team.name || p.teamId === team.id)) || allP.find(p => p.name === playerName);
          resolvedId = hit?.playerId || '';
        } catch {}
      }

      // Every season this person has played, fully computed server-side
      // (public-player &seasons=1): headline numbers, ranks, DSR trend with the
      // league average, game log with snapshot DSRs, partners — plus a career
      // roll-up. The page only renders.
      let seasons = [], career = null, careerAwards = null;
      if (resolvedId) {
        try {
          const hr = await fetch(`/.netlify/functions/public-player?id=${encodeURIComponent(resolvedId)}&circuit=${encodeURIComponent(CIRCUIT)}&seasons=1`);
          if (hr.ok) {
            const hd = await hr.json();
            seasons = Array.isArray(hd.seasons) ? hd.seasons : [];
            career = hd.career || null;
            careerAwards = Array.isArray(hd.careerAwards) ? hd.careerAwards : null;
            // A new season's roster entry has no photo stamp of its own; the
            // endpoint finds the photo under whichever of her ids it was uploaded to.
            if (!rosterPlayer.photoUrl && hd.photoUrl) rosterPlayer.photoUrl = hd.photoUrl;
            // Live / unofficial: in a match still in progress this season.
            if (hd.player && hd.player.provisional && (typeof VIEWED_IS_CURRENT === "undefined" || VIEWED_IS_CURRENT)) rosterPlayer.provisional = true;
          }
        } catch {}
      }

      // The viewed season's package drives the hero (rating + ranks).
      const viewed = seasons.find(s => s.circuit === CIRCUIT) || null;
      const norm = g => { const s = String(g || '').trim().toLowerCase(); return s[0] === 'f' ? 'F' : s[0] === 'm' ? 'M' : ''; };
      const myGender = norm((viewed && viewed.gender) || rosterPlayer.gender);
      const genderLabel = myGender === 'F' ? "Women's Ranking" : myGender === 'M' ? "Men's Ranking" : 'Division Ranking';
      const ranks = {
        dsr: viewed ? viewed.rating.dsr : null,
        overallRank: viewed ? viewed.rating.overallRank : null,
        genderRank: viewed ? viewed.rating.genderRank : null,
        genderLabel,
        unqualified: !!(viewed && viewed.record.played > 0 && viewed.rating.qualified === false),
        myGender,
      };

      render(rosterPlayer, team, teamSlug, seasons, career, ranks);

      // Load badge data first (config + grants) so the tabs can show the right
      // crest + pills per view, and house everything in a Trophy Case tab.
      const statForBadges = viewed ? {
        gamesWon: viewed.record.w, gamesLost: viewed.record.l, gamesPlayed: viewed.record.played, matchesPlayed: viewed.record.matches,
        awards: viewed.awards || [], weeklyGameRecords: viewed.weeklyGameRecords || [], gender: viewed.gender,
      } : null;
      const badgeOpts = await loadBadgeOpts(statForBadges, resolvedId, careerAwards);

      // Some players also play the Ladder — pull that profile if present.
      let ladderData = null;
      try {
        const up = await fetch(`/.netlify/functions/public-profile?leagueId=${encodeURIComponent(resolvedId)}&circuit=${encodeURIComponent(CIRCUIT)}`);
        if (up.ok) { const u = await up.json(); if (u.found && u.ladder) ladderData = u.ladder; }
      } catch {}
      if (badgeOpts) { badgeOpts.ladder = ladderData; badgeOpts.gender = (viewed && viewed.gender) || rosterPlayer?.gender || null; }

      try { buildProfileTabs(ladderData, badgeOpts, ranks); } catch (e) {}
    }

    /* ─── Badges + League / Ladder / Trophy Case tabs ──────── */
    // Load badge config + grants and build the opts the renderers read.
    async function loadBadgeOpts(stat, pid, careerAwards) {
      if (!window.dsBadges) return null;
      let cfg = null, grants = [];
      try {
        // all=1 → grants from every season and every roster id this person has
        // held, so the Trophy Case is a career view rather than one season's.
        const qs = `circuit=${encodeURIComponent(CIRCUIT)}${pid ? '&playerId=' + encodeURIComponent(pid) + '&all=1' : ''}`;
        const r = await fetch(`/.netlify/functions/public-badges?${qs}`);
        if (r.ok) { const d = await r.json(); cfg = d.config; grants = d.grants || []; }
      } catch {}
      if (cfg) dsBadges.setConfig(cfg);
      // Career awards (every season, stamped with its season) when the profile
      // endpoint supplied them; the viewed season's own list otherwise.
      const awards = Array.isArray(careerAwards) && careerAwards.length ? careerAwards : ((stat && stat.awards) || []);
      return { awards, ladder: null, grants, currentSeason: CIRCUIT,
               league: stat ? { w: stat.gamesWon, l: stat.gamesLost, gp: stat.gamesPlayed, matchesPlayed: stat.matchesPlayed } : null,
               // Per-week records → per-MATCH Undefeated badge (a night won ≥1, lost 0).
               // Falls back to the season-long league record above when absent.
               leagueWeeks: (stat && Array.isArray(stat.weeklyGameRecords) && stat.weeklyGameRecords.length) ? stat.weeklyGameRecords : null };
    }

    // Paint the avatar crest + hero pills for a view ('league' | 'ladder' | null = all).
    function applyHeroBadges(opts, domain) {
      if (!window.dsBadges || !opts) return;
      const photo = document.querySelector('#page-root .mlp-photo');
      if (photo) {
        const old = photo.querySelector('.dsb-clip'); if (old) old.remove();
        const crest = dsBadges.avatarCrest(opts, domain);
        if (crest) { photo.style.position = 'relative'; photo.insertAdjacentHTML('beforeend', crest); }
      }
      let pills = document.querySelector('#page-root .pp-hero__pills');
      if (!pills) {
        const idEl = document.querySelector('#page-root .mlp-hero__id');
        if (idEl) { pills = document.createElement('div'); pills.className = 'pp-hero__pills'; pills.style.marginTop = '10px'; idEl.appendChild(pills); }
      }
      if (pills) pills.innerHTML = dsBadges.heroPills(opts, domain) || '';
    }

    // Build the League / Ladder / Trophy Case tab bar. Tabs appear when there's
    // more than one view to show (a Ladder profile and/or earned awards). The hero
    // crest + pills follow the active view; the Trophy Case houses every award.
    function buildProfileTabs(ladder, opts, ranks) {
      const root = document.getElementById('page-root');
      const hero = root && root.querySelector('.mlp-hero');
      if (!hero) return;
      const hasLadder = !!ladder;
      const hasWins = !!(window.dsBadges && opts && dsBadges.hasWins(opts));
      if (!hasLadder && !hasWins) { applyHeroBadges(opts, 'league'); return; }

      // Move existing league content (everything after the hero) into a League pane.
      const leaguePane = document.createElement('div'); leaguePane.id = 'lane-league';
      let nn = hero.nextSibling; while (nn) { const nx = nn.nextSibling; leaguePane.appendChild(nn); nn = nx; }

      let ladderPane = null;
      if (hasLadder) {
        ladderPane = document.createElement('div'); ladderPane.id = 'lane-ladder'; ladderPane.style.display = 'none';
        ladderPane.innerHTML = (window.ladderProfileBody ? window.ladderProfileBody(ladder) : '');
      }
      let trophyPane = null;
      if (hasWins) {
        trophyPane = document.createElement('div'); trophyPane.id = 'lane-trophy'; trophyPane.style.display = 'none';
        trophyPane.innerHTML = dsBadges.trophyCase(opts);
      }

      const tabs = document.createElement('div');
      tabs.style.cssText = 'display:flex;gap:6px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:9999px;padding:4px;margin:14px 0';
      const mkBtn = (id, label) => `<button id="${id}" style="flex:1;padding:9px;border:0;border-radius:9999px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer">${label}</button>`;
      let btns = mkBtn('tabL', 'League');
      if (hasLadder) btns += mkBtn('tabD', 'Ladder');
      if (hasWins) btns += mkBtn('tabT', 'Trophies');
      tabs.innerHTML = btns;
      root.appendChild(tabs); root.appendChild(leaguePane);
      if (ladderPane) root.appendChild(ladderPane);
      if (trophyPane) root.appendChild(trophyPane);

      const heroN = hero.querySelector('.mlp-hero__dsr-n'), heroLbl = hero.querySelector('.mlp-hero__dsr-lbl'), heroRk = hero.querySelector('.mlp-hero__dsr-rk');
      const dsrV = (ranks && ranks.dsr != null) ? Number(ranks.dsr).toFixed(1) : '—';
      const dsrRank = (hero.querySelector('.pf-rank') || {}).textContent || '';
      const drV = hasLadder ? (ladder.dr == null ? '–' : ladder.dr) : '';
      const drRank = hasLadder ? ('#' + (ladder.rank || '–') + (ladder.mvp ? ' · ' + ladder.mvp + '× top' : '')) : '';

      const style = (btn, active, color, fg) => { if (!btn) return; btn.style.background = active ? color : 'transparent'; btn.style.color = active ? fg : 'var(--color-text-faint)'; };
      function setTab(t) {
        const lg = t === 'league', ld = t === 'ladder', tr = t === 'trophy';
        leaguePane.style.display = lg ? '' : 'none';
        if (ladderPane) ladderPane.style.display = ld ? '' : 'none';
        if (trophyPane) trophyPane.style.display = tr ? '' : 'none';
        style(document.getElementById('tabL'), lg, '#17d7b0', '#06231d');
        style(document.getElementById('tabD'), ld, '#b8ff2c', '#06210f');
        style(document.getElementById('tabT'), tr, 'var(--color-gold, #f0c040)', '#241a02');
        if (heroN) { heroN.textContent = ld ? drV : dsrV; heroN.style.color = ld ? '#b8ff2c' : ''; }
        if (heroLbl) heroLbl.textContent = ld ? 'Ladder DR' : 'DSR';
        if (heroRk) heroRk.textContent = ld ? drRank : dsrRank;
        // The ring measures DSR (0–100); the ladder DR has no such scale, so it
        // shows the empty track. Rank movement is league-only.
        const ringEl = hero.querySelector('[data-ring]');
        if (ringEl) setRing(ringEl, ld ? 0 : (+ringEl.dataset.p || 0));
        const mv = hero.querySelector('.pf-move'); if (mv) mv.style.display = ld ? 'none' : '';
        // League/Ladder show that view's badges; Trophy Case shows the combined set.
        applyHeroBadges(opts, tr ? null : (ld ? 'ladder' : 'league'));
      }
      document.getElementById('tabL').onclick = () => setTab('league');
      if (hasLadder) document.getElementById('tabD').onclick = () => setTab('ladder');
      if (hasWins) document.getElementById('tabT').onclick = () => setTab('trophy');
      setTab('league');
    }

    /* ─── Render ──────────────────────────────────────────── */
    function render(rp, team, teamSlug, seasons, career, ranks = {}) {
      const color    = avatarColor(team.name || rp.name);

      let html = '';

      const fmtRank = r => (r != null ? `#${r}` : '—');

      /* ── HERO (MLP format) ── */
      // Captain / Co-Captain read as plain text in the meta line (see roleTxt),
      // not as a pill. The pills row is reserved for earned award badges.
      const pills = [];

      // Photo (approved) or colored initials fallback.
      const avatarInner = rp.photoUrl
        ? `<img src="${esc(rp.photoUrl)}" alt="${esc(rp.name)}" class="mlp-photo__img">`
        : `<span>${teamInitials(team.name)}</span>`;

      // Meta line (team · gender · city) sits under the name; only non-empty parts.
      const genderTxt = rp.gender === 'F' ? 'Female' : rp.gender === 'M' ? 'Male' : '';
      const roleTxt = rp.isCaptain ? 'Captain' : rp.isCoCaptain ? 'Co-Captain' : '';
      // When this profile is being viewed as a past season, the meta line leads
      // with where they play NOW, and the season being viewed gets its own line.
      const cur = rp._current;
      const curRole = cur ? (cur.player.isCaptain ? 'Captain' : cur.player.isCoCaptain ? 'Co-Captain' : '') : '';
      const metaLine = (cur ? [
        `<a href="/team?id=${slug(cur.team.name)}">${esc(cur.team.name)}</a>${cur.team.emoji ? ' ' + cur.team.emoji : ''}`,
        genderTxt ? esc(genderTxt) : '',
        curRole,
        rp.city ? esc(rp.city) : '',
      ] : [
        `<a href="/team?id=${teamSlug}${LINK_SUFFIX}">${esc(team.name)}</a>${team.emoji ? ' ' + team.emoji : ''}`,
        genderTxt ? esc(genderTxt) : '',
        roleTxt,
        rp.city ? esc(rp.city) : '',
      ]).filter(Boolean).join(' · ');
      const viewingLine = cur
        ? `<div style="font-size:11px;color:var(--color-text-faint);margin-top:4px">Viewing ${esc(seasonNameNow())} · played for <a href="/team?id=${teamSlug}${LINK_SUFFIX}" style="color:var(--color-teal);text-decoration:none;font-weight:700">${esc(team.name)}</a>${roleTxt ? ' · ' + roleTxt : ''}</div>`
        : '';

      // Vitals bar — only show boxes that actually have a value.
      const vital = (lbl, val) => `<div class="mlp-vital"><div class="mlp-vital__lbl">${lbl}</div><div class="mlp-vital__val">${esc(String(val))}</div></div>`;
      const vitalDefs = [
        ['Height', rp.height], ['Age', rp.age], ['Plays', rp.plays], ['Home', rp.homeCourt],
      ].filter(([, v]) => v != null && v !== '');
      const vitals = vitalDefs.map(([l, v]) => vital(l, v)).join('');

      // Rank line under the name. The DSR itself sits inside the ring.
      const rankTxt = ranks.unqualified
        ? 'Unqualified · not enough games yet'
        : [
            ranks.overallRank != null ? `${fmtRank(ranks.overallRank)} overall` : null,
            ranks.genderRank != null ? `${fmtRank(ranks.genderRank)} ${ranks.genderLabel.replace(' Ranking','').toLowerCase()}` : null,
          ].filter(Boolean).join(' · ');
      // Live / unofficial: this player is in a match still in progress
      // (lib/live-results.js) — their numbers move until it's finalized.
      const livePill = rp.provisional ? `<span class="pf-live" title="Includes a match still in progress — unofficial until it's finalized"><i></i>Live</span>` : '';
      // Rank movement: last two weeks with an official rank, current season only.
      const viewedS = seasons.find(s => s.circuit === CIRCUIT) || null;
      let move = null;
      if (viewedS && !viewedS.finalized && viewedS.circuit === currentCode()) {
        const rk = (viewedS.dsrHistory || []).filter(h => h.rank != null).sort((x, y) => x.week - y.week);
        if (rk.length >= 2) { const d = rk[rk.length - 2].rank - rk[rk.length - 1].rank; if (d) move = d; }
      }
      const moveHtml = move ? `<span class="pf-move pf-move--${move > 0 ? 'up' : 'down'}">${move > 0 ? '▲' : '▼'} ${Math.abs(move)} since last week</span>` : '';
      // DSR ring: the arc fills to DSR / 100 (DSR is a 0–100 composite).
      const ringP = ranks.dsr != null ? Math.max(0, Math.min(1, ranks.dsr / 100)) : 0;

      html += `<div class="mlp-hero">
        <div class="mlp-hero__top">
          <div class="pf-ring" data-ring data-p="${ringP}">
            <svg viewBox="0 0 128 128" aria-hidden="true"><circle class="pf-ring__track" cx="64" cy="64" r="54"></circle><circle class="pf-ring__arc" cx="64" cy="64" r="54" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"></circle></svg>
            <div class="pf-ring__in">
              <div class="mlp-hero__dsr-n">${fmtDsr(ranks.dsr)}</div>
              <div class="mlp-hero__dsr-lbl">DSR</div>
            </div>
          </div>
          <div class="mlp-hero__id">
            <div class="pf-idrow">
              <div class="mlp-photo" style="--ph:${color}">${avatarInner}</div>
              <h1 class="mlp-hero__name ${nameSizeClass(rp.name)}">${esc(rp.name)}</h1>
            </div>
            <div class="mlp-hero__meta">${metaLine}</div>${viewingLine}
            <div class="pf-rankline"><span class="pf-rank mlp-hero__dsr-rk">${esc(rankTxt)}</span>${moveHtml}${livePill}</div>
            ${pills.length ? `<div class="pp-hero__pills" style="margin-top:10px">${pills.join('')}</div>` : ''}
          </div>
        </div>
        ${vitals ? `<div class="mlp-vitals">${vitals}</div>` : ''}
      </div>`;

      /* ── SEASONS card: one pill tab per season + ★ Career ── */
      html += seasonsCardHtml(seasons, career, rp, team, teamSlug, ranks);

      document.getElementById('page-root').innerHTML = html;
      const ring = document.querySelector('#page-root [data-ring]');
      if (ring) requestAnimationFrame(() => requestAnimationFrame(() => setRing(ring, +ring.dataset.p || 0)));
      wireSeasonsCard(seasons, career);
    }

    /* ═══════════════════════════════════════════════════════
       SEASONS CARD
    ═══════════════════════════════════════════════════════ */
    const TYPE_LBL = { womens: "Women's", mens: "Men's", mixed: 'Mixed' };
    const playerHref = (name, teamName, code) => `/player?team=${teamName ? slug(teamName) : ''}&name=${encodeURIComponent(name || '')}${suffixForCode(code)}`;
    const teamHref = (teamName, code) => `/team?id=${slug(teamName || '')}${suffixForCode(code)}`;
    // Bracket finish: Gold · Silver · Bronze · 4th · 5th · 6th (from the medal
    // round). Before a bracket resolves, the regular-season rank stands in.
    const finishText = (f) => {
      if (!f) return null;
      if (f.place != null) return `${f.medal ? f.medal + ' ' : ''}${f.label || f.place}`;
      if (f.rank != null) { const n = f.rank, sfx = n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'; return `${n}${sfx}${f.teams ? ' of ' + f.teams : ''}${f.division ? ' · ' + f.division : ''}`; }
      return null;
    };

    // Section tabs under the season pills. The choice sticks while you switch
    // seasons; every block in a pane carries data-part for the section it
    // belongs to (blocks without one — notes, empty states — always show).
    const SECS = [['overview', 'Overview'], ['matchups', 'Matchups'], ['games', 'Games'], ['partners', 'Partners']];

    function seasonsCardHtml(seasons, career, rp, team, teamSlug, ranks) {
      const curCode = currentCode();
      const played = seasons.filter(s => s.record.played > 0);
      // Default tab: the viewed season if it has a package, else the newest.
      const defaultCode = (seasons.find(s => s.circuit === CIRCUIT) || seasons[0] || {}).circuit || null;
      const tabs = seasons.map(s => {
        const live = s.circuit === curCode && !s.finalized;
        return `<button type="button" class="ss-tab${s.circuit === defaultCode ? ' on' : ''}" data-pane="${esc(s.circuit)}">${live ? '<span class="ss-dot" title="In progress"></span>' : ''}${esc(s.seasonLabel)}</button>`;
      });
      if (played.length) tabs.push(`<button type="button" class="ss-tab ss-tab--career${defaultCode ? '' : ' on'}" data-pane="career">Career</button>`);

      let panes = '';
      for (const s of seasons) panes += `<div class="ss-pane${s.circuit === defaultCode ? ' on' : ''}" data-pane="${esc(s.circuit)}">${seasonPaneHtml(s, ranks, rp)}</div>`;
      if (played.length) panes += `<div class="ss-pane${defaultCode ? '' : ' on'}" data-pane="career">${careerPaneHtml(career, seasons, curCode)}</div>`;

      if (!seasons.length) {
        // Rostered, but no stats row anywhere yet (season not started).
        const sr = seasonRec() || {}; const nm = esc(seasonNameNow()); const st = seasonStartText();
        const started = sr.startDate && sr.startDate <= new Date().toISOString().slice(0, 10);
        const note = started ? `No games recorded for ${nm} yet — this season's stats land after the first match night.`
                             : `${nm} stats will appear here once it begins${st ? ' on ' + esc(st) : ''}.`;
        return `<div class="pp-card" style="text-align:center;padding:var(--space-8);">
          <div style="font-size:15px;font-weight:800;margin-bottom:var(--space-2)">Stats pending</div>
          <div style="font-size:13px;color:var(--color-text-muted)">${note}</div>
        </div>`;
      }

      const secs = SECS.map(([id, lbl], i) => `<button type="button" class="pf-sec${i === 0 ? ' on' : ''}" data-sec="${id}" role="tab" aria-selected="${i === 0}">${lbl}</button>`).join('');
      return `<div class="pf-card" id="seasons-card" data-sec="overview">
        <div class="pf-stick">
          <div class="ss-tabs" id="ss-tabs">${tabs.join('')}</div>
          <div class="pf-secs" role="tablist" aria-label="Profile sections">${secs}</div>
        </div>
        ${panes}
      </div>`;
    }

    /* ── Shared bits ── */
    const tile = (lbl, val, sub, cls = '') => `<div class="ss-tile"><div class="ss-tile__lbl">${lbl}</div><div class="ss-tile__val ${cls}">${val}</div>${sub ? `<div class="ss-tile__sub">${sub}</div>` : ''}</div>`;
    const kv = (k, v, sub) => `<div class="kv"><div class="k">${k}${sub ? `<small>${sub}</small>` : ''}</div><div class="v">${v}</div></div>`;
    const sub = (part, title, side, body, extra = '') => `<div class="ss-sub" data-part="${part}"${extra}><div class="ss-sub__head"><div class="ss-sub__title">${title}</div>${side ? `<span class="pf-side">${side}</span>` : ''}</div>${body}</div>`;
    // End bands are open-ended ("under 30", "56+") — same as lib/skill-bands.js rangeLabel().
    const bandName = b => b.label || (b.lo == null ? b.tier.toLowerCase()
      : b.idx === 0 ? `under ${Math.round(b.hi)}` : b.idx === 4 ? `${Math.round(b.lo)}+` : `${Math.round(b.lo)}–${Math.round(b.hi)}`);

    // Best and toughest opponent band with a real sample (≥3 games), the same
    // rule lib/skill-bands.js uses for its Read sentence.
    function bestWorstBands(sk) {
      const sampled = ((sk && sk.bands) || []).filter(b => b.played >= 3);
      if (sampled.length < 2) return {};
      let best = sampled[0], worst = sampled[0];
      for (const b of sampled) {
        // Ties go to the bigger sample (9–0 beats 3–0) — same as lib/skill-bands.js bestWorst().
        if (b.pct > best.pct || (b.pct === best.pct && (b.played > best.played || (b.played === best.played && b.idx > best.idx)))) best = b;
        if (b.pct < worst.pct || (b.pct === worst.pct && (b.played > worst.played || (b.played === worst.played && b.idx < worst.idx)))) worst = b;
      }
      return (best.idx === worst.idx || best.pct === worst.pct) ? {} : { best, worst };
    }

    /* ── Season story: swipeable cards, each one number + one plain sentence.
       Every card states only what the season package says; a card whose
       numbers aren't there (or are too thin) simply doesn't appear. ── */
    function storyHtml(title, cards) {
      if (cards.length < 2) return '';
      if (!cards.some(c => c.tone === 'lime')) cards[0].tone = 'lime';
      return `<div class="st-wrap" data-part="overview">
        <div class="pf-label"><span>${title}</span><span class="st-hint">swipe →</span></div>
        <div class="st-row">${cards.map(c => `<div class="st-card st-card--${c.tone}"><div class="st-big${c.small ? ' st-big--sm' : ''}"${c.color ? ` style="color:${c.color}"` : ''}>${c.big}</div><div class="st-txt">${c.txt}</div></div>`).join('')}</div>
      </div>`;
    }
    function seasonStory(s, isCur) {
      const cards = [], r = s.record;
      const nights = (s.weeks || []).filter(w => w.played).length;
      if (isCur && s.streak && s.streak.kind === 'W' && s.streak.n >= 2) {
        cards.push({ tone: 'lime', big: `W${s.streak.n}`, txt: `${s.streak.n} straight wins. ${s.bestStreak > s.streak.n ? `Best run this season: ${s.bestStreak}.` : 'Ties the best run of the season.'}` });
      } else if (!isCur && s.bestStreak >= 3) {
        cards.push({ tone: 'lime', big: `W${s.bestStreak}`, txt: 'Longest win streak of the season.' });
      }
      cards.push({ tone: 'dark', big: rec(r.w, r.l), txt: `${r.pct}% of games won${nights ? ` across ${nights} night${nights === 1 ? '' : 's'}` : ''}.` });
      const fin = !isCur ? finishText(s.finish) : null;
      if (fin) cards.push({ tone: 'gold', small: true, big: esc(fin), txt: `Season finish${s.finish.wins != null ? ` · team ${s.finish.wins}–${s.finish.losses}` : ''}.` });
      const top = (s.partners || []).find(p => p.played >= 3);
      if (top) cards.push({ tone: 'teal', big: rec(top.won, top.played - top.won), txt: `with ${esc(SN(top.name))}, most-played partner.` });
      const { best, worst } = bestWorstBands(s.skill);
      if (best) cards.push({ tone: 'dark', big: `${best.pct}%`, txt: `vs. players rated ${bandName(best)} (${rec(best.w, best.l)}) — best band.` });
      if (s.clutch && s.clutch.g >= 3) cards.push({ tone: 'dark', big: rec(s.clutch.w, s.clutch.g - s.clutch.w), txt: 'in clutch games — decided by 3 points or fewer.' });
      if (worst) cards.push({ tone: 'dark', color: 'var(--color-gold)', big: `${worst.pct}%`, txt: `vs. players rated ${bandName(worst)} (${rec(worst.w, worst.l)}) — toughest band.` });
      const pk = s.rating && s.rating.peak;
      if (pk && pk.dsr != null && pk.week) cards.push({ tone: 'dark', big: fmtDsr(pk.dsr), txt: `Peak DSR, Week ${pk.week}.` });
      return storyHtml(`${esc(s.seasonLabel)} story`, cards);
    }
    function careerStory(c) {
      const cards = [], hw = c.hardware || {}, h = c.highlights || {};
      cards.push({ tone: 'lime', big: rec(c.record.w, c.record.l), txt: `${c.record.pct}% of games won across ${c.seasons} season${c.seasons === 1 ? '' : 's'}.` });
      if (hw.titles) cards.push({ tone: 'gold', big: `${hw.titles}×`, txt: `league champion.` });
      else if (hw.finals) cards.push({ tone: 'gold', big: `${hw.finals}×`, txt: `played in a championship final.` });
      if (h.longestStreak && h.longestStreak.n >= 3) cards.push({ tone: 'dark', big: `W${h.longestStreak.n}`, txt: `Longest win streak · ${esc(h.longestStreak.seasonLabel)}.` });
      const top = (c.partners || []).find(p => p.played >= 3);
      if (top) cards.push({ tone: 'teal', big: rec(top.won, top.played - top.won), txt: `with ${esc(SN(top.name))}, most-played partner.` });
      const { best, worst } = bestWorstBands(c.skill);
      const vsB = b => b.lo != null ? `vs. players rated ${bandName(b)}` : `vs. the ${bandName(b)} of the league`;
      if (best) cards.push({ tone: 'dark', big: `${best.pct}%`, txt: `${vsB(best)} (${rec(best.w, best.l)}) — best band, all seasons.` });
      if (worst) cards.push({ tone: 'dark', color: 'var(--color-gold)', big: `${worst.pct}%`, txt: `${vsB(worst)} (${rec(worst.w, worst.l)}) — toughest band, all seasons.` });
      if (c.peak && c.peak.dsr != null) cards.push({ tone: 'dark', big: fmtDsr(c.peak.dsr), txt: `Career-high DSR · ${esc(c.peak.seasonLabel)}${c.peak.week ? ' Wk ' + c.peak.week : ''}.` });
      if (hw.potw) cards.push({ tone: 'dark', big: `${hw.potw}×`, txt: 'Player of the Week.' });
      return storyHtml('Career story', cards);
    }

    /* ── Form: the last 10 games, oldest → newest ── */
    function formHtml(s, isCur) {
      const g = (s.games || []).filter(x => x.won === true || x.won === false);
      if (g.length < 3) return '';
      const last = g.slice(-10);
      const side = isCur && s.streak ? `<b class="${s.streak.kind === 'W' ? 'val--lime' : 'val--red'}">${s.streak.kind}${s.streak.n} streak</b>` : (s.bestStreak ? `best run ${s.bestStreak}` : '');
      const chips = last.map(x => `<span class="pf-chip pf-chip--${x.won ? 'w' : 'l'}" title="${esc(`Wk ${x.week ?? '—'} · ${x.myScore}–${x.oppScore} vs ${x.opponentTeamName || ''}`)}">${x.won ? 'W' : 'L'}</span>`).join('');
      return sub('overview', `Form · last ${last.length}`, side, `<div class="pf-form">${chips}</div><div class="pf-note">Oldest to newest</div>`);
    }

    /* ── Big bar row (game types, partners) ── */
    function barRow(lbl, pctV, foot, barCls, href) {
      const top = `<div class="pf-row__top"><span class="pf-row__lbl">${lbl}</span><span class="pf-row__pct">${pctV}%</span></div>
        <div class="pf-bar ${barCls}"><i style="width:${Math.max(2, pctV)}%"></i></div>
        <div class="pf-row__foot">${foot}</div>`;
      return href ? `<a class="pf-row pf-row--link" href="${href}">${top}</a>` : `<div class="pf-row">${top}</div>`;
    }

    /* ── Performance vs. Skill Level (DUPR-style) ──
       s.skill / career.skill come from lib/skill-bands.js via public-player:
       five bands = the season's rated players split into fifths by DSR; a game
       lands in the band holding its opponents' average DSR that week. Career
       rows are the same fifths rolled up across seasons, so they're labelled by
       tier instead of a DSR range. */
    const SK_TAG = { dominant: 'Dominant', strong: 'Strong', competitive: 'Competitive', growing: 'Growing', challenge: 'Challenge', sample: 'Small sample' };
    // `who` = { name, dsr }: the profile's own player. Their band is marked
    // "<First>'s level · DSR n" — never "YOU", since the page doesn't know who
    // is looking and on someone else's profile "you" would be wrong.
    const possessive = n => { const f = String(n || '').trim().split(/\s+/)[0] || 'Their'; return f + (/s$/i.test(f) ? '’' : '’s'); };
    function skillBandsHtml(sk, career, who = {}) {
      if (!sk || !sk.bands) return `<div class="ss-sub" data-part="matchups"><div class="ml-empty">Not enough rated games yet — this fills in as the season goes.</div></div>`;
      const rows = sk.bands.map(b => {
        const ranged = b.lo != null;
        const label = ranged ? esc(bandName(b)) : esc(b.tier);
        const isLvl = sk.you != null && sk.you === b.idx;
        const lvl = isLvl ? `<div class="sk-lvl">${esc(possessive(who.name))} level${who.dsr != null ? ` · DSR ${fmtDsr(who.dsr)}` : ''}</div>` : '';
        const you = '';
        if (!b.played) {
          return `<div class="sk-row sk-row--empty${isLvl ? ' sk-row--lvl' : ''}">${lvl}<div class="sk-top"><span class="sk-vs">vs.<b>${label}</b></span>${you}<span class="sk-pct">—</span></div>
            <div class="sk-bar"><i style="width:0"></i></div>
            <div class="sk-foot"><span>No games yet${ranged ? ` · ${esc(b.tier)}` : ''}</span><span>0W · 0L</span></div></div>`;
        }
        const tag = b.tag || 'sample';
        return `<div class="sk-row${isLvl ? ' sk-row--lvl' : ''}">${lvl}<div class="sk-top">
            <span class="sk-vs">vs.<b>${label}</b></span>
            <span class="sk-tag sk-tag--${tag}">${SK_TAG[tag]}</span>${you}
            <span class="sk-pct">${b.pct}%</span>
          </div>
          <div class="sk-bar sk-bar--${tag}"><i style="width:${Math.max(2, b.pct)}%"></i></div>
          <div class="sk-foot"><span>${b.partner != null ? `Avg partner <b>${fmtDsr(b.partner)}</b>` : 'Avg partner —'}${ranged ? ` · ${esc(b.tier)}` : ''}</span><span>${b.w}W · ${b.l}L</span></div>
        </div>`;
      }).join('');
      const careerRanged = career && sk.bands.some(b => b.lo != null);
      const note = !career
        ? 'Opponent band = their average DSR that week · bands split the league into fifths'
        : careerRanged
          ? 'Every league game played, by the opponents’ average DSR that week · bands split every rated player, all seasons, into fifths'
          : 'Every season’s games, grouped by which fifth of that season’s league you faced';
      // Career shows it on Overview too — the long view is the headline there.
      return sub(career ? 'overview matchups' : 'matchups', career ? 'Career vs. Skill Level' : 'Performance vs. Skill Level', `${sk.games} game${sk.games === 1 ? '' : 's'}`,
        `<div class="pf-note" style="margin:-4px 0 4px">Win rate by how strong the other side of the net was</div>${rows}
        ${sk.read ? `<div class="sk-read"><b>Read:</b> ${esc(sk.read)}</div>` : ''}
        <div class="pf-note" style="margin-top:10px">${note}${sk.you != null ? ` · the highlighted row is players rated like ${esc(String(who.name || '').trim().split(/\s+/)[0] || 'this player')}` : ''}</div>`, ' data-skill');
    }

    /* ── One season's pane ── */
    function seasonPaneHtml(s, ranks, rp) {
      const code = s.circuit;
      const isCur = code === currentCode() && !s.finalized;
      const gLbl = s.gender === 'F' ? "Women's" : "Men's";
      const r = s.record, p = s.points, rt = s.rating;

      if (!r.played) {
        const sr = seasonRec() || {}; const st = seasonStartText();
        const started = sr.startDate && sr.startDate <= new Date().toISOString().slice(0, 10);
        const note = isCur
          ? (started ? `No games recorded for ${esc(s.seasonLabel)} yet — stats land after the first match night.` : `${esc(s.seasonLabel)} stats will appear here once it begins${st ? ' on ' + esc(st) : ''}.`)
          : `No games recorded for ${esc(s.seasonLabel)}.`;
        const up = s.upcoming ? `<div class="ss-note">Next up: <b>vs ${esc(s.upcoming.opponentTeamName || 'TBD')}</b>${s.upcoming.date ? ' · ' + esc(fmtDow(s.upcoming.date)) + ' ' + esc(fmtDate(s.upcoming.date)) : ''}${s.upcoming.week != null ? ' · Week ' + s.upcoming.week : ''}</div>` : '';
        return `<div class="ml-empty" style="padding:var(--space-8) 0 var(--space-3)">${note}</div>${up}`;
      }

      /* ═══ OVERVIEW ═══ */
      const story = seasonStory(s, isCur);
      const dsrSub = s.finalized || !isCur
        ? `final${rt.peak && rt.peak.dsr != null ? ` · peak <b>${fmtDsr(rt.peak.dsr)}</b>` : ''}`
        : (rt.qualified === false ? 'unqualified yet'
          : [rt.overallRank != null ? `<b>#${rt.overallRank}</b> overall` : null, rt.genderRank != null ? `<b>#${rt.genderRank}</b> ${gLbl.toLowerCase()}` : null].filter(Boolean).join(' · ') || 'unranked');
      const fin = finishText(s.finish);
      const fourth = (!isCur && fin)
        ? tile('Finish', `<span style="font-size:1.15rem;line-height:1.2">${esc(fin)}</span>`, s.finish.wins != null ? `team ${s.finish.wins}–${s.finish.losses}` : '')
        : tile('Streak', s.streak ? `<span class="${s.streak.kind === 'W' ? 'val--lime' : 'val--red'}">${s.streak.kind}${s.streak.n}</span>` : '—', s.bestStreak ? `best run <b>${s.bestStreak}</b>` : '');
      const strip = `<div class="ss-strip" data-part="overview">
        ${tile('Record', rec(r.w, r.l), `<b>${r.pct}%</b> · ${r.matches} night${r.matches === 1 ? '' : 's'}`)}
        ${tile('DSR', fmtDsr(rt.dsr), dsrSub, 'val--lime')}
        ${tile('Point diff', signed(p.diff), p.ps != null ? `<b>${p.ps}</b> for · <b>${p.pa}</b> against` : '', p.diff > 0 ? 'val--lime' : p.diff < 0 ? 'val--red' : '')}
        ${fourth}
      </div>`;

      // DSR trend chart — drawn by wireSeasonTrend
      const hasTrend = Array.isArray(s.dsrHistory) && s.dsrHistory.length > 0;
      const deltaPeak = (hasTrend && rt.peak && rt.dsr != null) ? Math.round((rt.dsr - rt.peak.dsr) * 10) / 10 : null;
      const trend = hasTrend ? `<div class="ss-sub" data-part="overview" data-trend="${esc(code)}">
        <div class="ss-sub__head">
          <div class="ss-sub__title">DSR Trend <span class="now" data-trend-now>${fmtDsr(rt.dsr)}</span>${deltaPeak != null ? `<span class="delta" data-trend-delta>${deltaPeak === 0 ? 'at season peak' : `${signed(deltaPeak)} from peak ${fmtDsr(rt.peak.dsr)}`}</span>` : ''}</div>
          <div class="trend-controls">
            <button type="button" class="trend-chip on" data-line="all" style="color:var(--color-lime)">Overall</button>
            <button type="button" class="trend-chip" data-line="gender" style="color:var(--color-teal)">${esc(gLbl)}</button>
            <button type="button" class="trend-chip" data-line="mixed" style="color:#a78bfa">Mixed</button>
            <div class="trend-seg" data-seg>
              <button type="button" class="on" data-mode="dsr">DSR</button>
              <button type="button" data-mode="rank">Rank</button>
            </div>
          </div>
        </div>
        <div class="trend-wrap">
          <svg data-svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="trend-tip" data-tip></div>
        </div>
        <div class="trend-legend">
          <span><span class="sw" style="background:var(--color-lime)"></span>Overall</span>
          <span data-leg="gender" style="display:none"><span class="sw" style="background:var(--color-teal)"></span>${esc(gLbl)}</span>
          <span data-leg="mixed" style="display:none"><span class="sw" style="background:#a78bfa"></span>Mixed</span>
          <span><span class="sw" style="border-top:2px dashed var(--color-text-faint);background:transparent"></span>League avg</span>
          <span><span class="sw" style="border-top:2px dashed var(--color-text-muted);background:transparent;opacity:.7"></span>DNP · rating carried</span>
          <span data-leg="prov" style="display:none"><span class="sw" style="border-top:2px dashed var(--color-text-muted);background:transparent"></span>Provisional (unqualified)</span>
          <span class="trend-tap">tap a week for that match</span>
        </div>
      </div>` : '';

      const form = formHtml(s, isCur);

      // By game type: W–L bar plus that discipline's DSR and rank.
      const sg = s.splits.gender, sx = s.splits.mixed;
      const typeFoot = (sp, o) => `<span>${rec(sp.won, sp.played - sp.won)} · ${sp.played} game${sp.played === 1 ? '' : 's'}</span><span>${o && o.dsr != null ? `DSR <b>${fmtDsr(o.dsr)}</b>${o.rank != null ? ` · #${o.rank}` : ''}${o.qualified === false ? ' · unqualified' : ''}` : ''}</span>`;
      const typeRows = [
        sg && sg.played ? barRow(`${gLbl} doubles`, pct(sg.won, sg.played), typeFoot(sg, rt.gender), 'pf-bar--teal') : '',
        sx && sx.played ? barRow('Mixed doubles', pct(sx.won, sx.played), typeFoot(sx, rt.mixed), 'pf-bar--purple') : '',
      ].join('');
      const types = typeRows ? sub('overview', 'By game type', '', typeRows) : '';

      /* ═══ MATCHUPS ═══ */
      const st = s.strength, ko = s.keyOpponent;
      const nums = sub('matchups', 'Matchup numbers', '', `
        ${kv('Clutch', s.clutch.g ? `${rec(s.clutch.w, s.clutch.g - s.clutch.w)}<small>${pct(s.clutch.w, s.clutch.g)}%</small>` : '—', 'games decided by ≤3')}
        ${kv('Avg partner DSR', st.partner != null ? fmtDsr(st.partner) : '—', st.partners ? `${st.partners} partner${st.partners === 1 ? '' : 's'}` : '')}
        ${kv('Avg opponent DSR', st.opponent != null ? fmtDsr(st.opponent) : '—', st.opponents ? `${st.opponents} opponent${st.opponents === 1 ? '' : 's'}` : 'needs match data')}
        ${kv('Points won', p.wonPct != null ? `${p.wonPct}%` : '—', p.avgPointsPct != null ? `avg game ${p.avgPointsPct}%` : 'of all rally points')}
        ${kv('Avg margin', p.avgMargin != null ? signed(p.avgMargin) : '—', 'per game')}
        ${isCur ? kv('Consistency', rt.consistency != null ? `${rt.consistency}%` : '—', 'game-to-game margin') : kv('Best rank', rt.bestRank != null ? `#${rt.bestRank}` : '—', 'overall, any week')}
        ${ko ? kv(`vs ${esc(ko.teamName)}`, rec(ko.w, ko.l), 'most-faced opponent') : ''}`);

      /* ═══ GAMES ═══ */
      const groups = [];
      for (const g of (s.games || [])) {
        const last = groups[groups.length - 1];
        if (last && last.matchId === g.matchId) last.games.push(g);
        else groups.push({ matchId: g.matchId, week: g.week, phase: g.phase, championship: g.championship, date: g.date, opp: g.opponentTeamName, teamResult: g.teamResult, games: [g] });
      }
      groups.reverse(); // newest night first
      const phaseTag = (ph, champ) => champ || ph === 'championship' ? ' · Championship' : ph === 'playoff' ? ' · Playoffs' : ph === 'rivalry' ? ' · Rivalry Week' : '';
      const upcoming = (isCur && s.upcoming)
        ? `<div class="pf-next"><span class="pf-next__lbl">Up next${s.upcoming.week != null ? ' · Wk ' + s.upcoming.week : ''}</span><span class="pf-next__opp">vs <a href="${teamHref(s.upcoming.opponentTeamName, code)}">${esc(s.upcoming.opponentTeamName || 'TBD')}</a></span>${s.upcoming.date ? `<span class="pf-next__when">${esc(fmtDow(s.upcoming.date))} ${esc(fmtDate(s.upcoming.date))}</span>` : ''}</div>`
        : '';
      const logRows = groups.map((grp, i) => {
        const w = grp.games.filter(g => g.won === true).length, l = grp.games.filter(g => g.won === false).length;
        const tr = grp.teamResult;
        const teamPill = tr ? `<span class="ss-wk__team ${tr.for > tr.against ? 'w' : tr.for < tr.against ? 'l' : 't'}">Team ${tr.for > tr.against ? 'W' : tr.for < tr.against ? 'L' : 'T'} ${tr.for}–${tr.against}</span>` : '';
        return `<details class="ss-wk" data-wk="${grp.week ?? ''}"${i === 0 ? ' open' : ''}>
          <summary>
            <div class="ss-wk__id">
              <span class="ss-wk__wk">Wk ${grp.week ?? '—'}${phaseTag(grp.phase, grp.championship)}${grp.date ? ' · ' + esc(fmtDate(grp.date)) : ''}</span>
              <span class="ss-wk__meta">vs <a href="${teamHref(grp.opp, code)}">${esc(grp.opp || '')}</a></span>
            </div>
            <div class="ss-wk__right"><span class="ss-wk__rec ${w > l ? 'val--lime' : w < l ? 'val--red' : ''}">${rec(w, l)}</span>${teamPill}</div>
          </summary>
          ${grp.games.map(g => {
            const oppLinks = (g.oppNames || []).map((n, i) => n
              ? `<a href="${playerHref(n, g.oppTeams?.[i] || g.opponentTeamName, code)}">${esc(SN(n))}</a>`
              : '—').join(' &amp; ');
            const partnerLink = g.partnerName
              ? `<a href="${playerHref(g.partnerName, g.partnerTeamName || s.teamName, code)}">${esc(SN(g.partnerName))}</a>`
              : '—';
            const dsrCell = (g.myDsr != null && g.oppDsr != null)
              ? `<span class="${g.myDsr >= g.oppDsr ? 'val--green' : 'val--red'}">${fmtDsr(g.myDsr)}</span> <span class="ml-lbl" style="display:inline">v</span> ${fmtDsr(g.oppDsr)}`
              : '—';
            const discLbl = TYPE_LBL[g.type] || '';
            const dsrLbl = g.isSnap ? `Wk ${g.week ?? '—'} ${discLbl} DSR you v them` : 'Final DSR you v them';
            const wl = g.won === true ? '<span class="ml-wl ml-wl--w">W</span>' : g.won === false ? '<span class="ml-wl ml-wl--l">L</span>' : '';
            return `<div class="ml-row">
              <span class="ml-type">R${g.round} ${discLbl || g.type}</span>
              <div class="ml-who"><span class="ml-lbl">w/</span> ${partnerLink}<br><span class="ml-lbl">vs</span> ${oppLinks}</div>
              <div class="ml-dsr"><span class="ml-lbl">${dsrLbl}</span>${dsrCell}</div>
              <div class="ml-score">${g.myScore}–${g.oppScore}${wl}</div>
            </div>`;
          }).join('')}
        </details>`;
      }).join('');
      const log = `<div data-part="games" data-log="${esc(code)}">
        ${upcoming}
        <div class="pf-label"><span>Match log</span><span>${groups.length} night${groups.length === 1 ? '' : 's'} · ${r.played} games</span></div>
        ${logRows || '<div class="ss-sub"><div class="ml-empty">Game-level detail isn\'t available for this season.</div></div>'}
      </div>`;

      /* ═══ PARTNERS ═══ */
      const partners = (s.partners || []);
      let partnersHtml = sub('partners', `Partners · ${esc(s.seasonLabel)}`, '', '<div class="ml-empty">No partner data for this season.</div>');
      if (partners.length) {
        const totalPlayed = partners.reduce((n, x) => n + x.played, 0), totalWon = partners.reduce((n, x) => n + x.won, 0);
        partnersHtml = sub('partners', `Partners · ${esc(s.seasonLabel)}`, `${partners.length} partner${partners.length === 1 ? '' : 's'} · <b>${rec(totalWon, totalPlayed - totalWon)}</b>`,
          partners.map(x => partnerRow(x, playerHref(x.name, x.teamName || s.teamName, code), x.dsr != null ? `DSR ${fmtDsr(x.dsr)}` : '')).join(''));
      }

      const teamsNote = (s.teams && s.teams.length > 1) ? `<div class="ss-note">Played for ${s.teams.map(t => esc(t.teamName)).join(' and ')} this season — stats are combined.</div>` : '';
      return teamsNote + story + strip + trend + form + types + skillBandsHtml(s.skill, false, { name: s.name || rp.name, dsr: rt.dsr }) + nums + log + partnersHtml;
    }

    function partnerRow(x, href, extra) {
      const pp = pct(x.won, x.played);
      const av = `<span class="pf-av" style="background:${avatarColor(x.name)}">${initial(x.name)}</span>`;
      return `<a class="pf-prow" href="${href}">
        ${av}
        <span class="pf-prow__main">
          <span class="pf-prow__top"><span class="pf-prow__name">${esc(SN(x.name))}</span><span class="pf-prow__pct">${pp}%</span></span>
          <span class="pf-bar ${pp >= 50 ? '' : 'pf-bar--muted'}"><i style="width:${Math.max(2, pp)}%"></i></span>
          <span class="pf-prow__sub">${rec(x.won, x.played - x.won)}${extra ? ' · ' + extra : ''}</span>
        </span>
      </a>`;
    }

    /* ── Career pane ── */
    function careerPaneHtml(c, seasons, curCode) {
      if (!c || !c.seasons) return '<div class="ml-empty">No league play yet.</div>';
      const hw = c.hardware || {};
      const md = hw.medals || {};
      const hwParts = [md.gold ? `🥇×${md.gold}` : null, md.silver ? `🥈×${md.silver}` : null, md.bronze ? `🥉×${md.bronze}` : null, hw.potw ? `${hw.potw} POTW` : null].filter(Boolean);
      const strip = `<div class="ss-strip" data-part="overview">
        ${tile('Career record', rec(c.record.w, c.record.l), `<b>${c.record.pct}%</b> · ${c.seasons} season${c.seasons === 1 ? '' : 's'}`)}
        ${tile('Peak DSR', c.peak ? fmtDsr(c.peak.dsr) : '—', c.peak ? `${esc(c.peak.seasonLabel)}${c.peak.week ? ' · Wk ' + c.peak.week : ''}` : '', 'val--lime')}
        ${tile('Career diff', signed(c.points.diff), c.points.ps != null ? `<b>${c.points.ps}</b> for · <b>${c.points.pa}</b> against` : '', c.points.diff > 0 ? 'val--lime' : c.points.diff < 0 ? 'val--red' : '')}
        ${tile('Hardware', `<span style="font-size:1.15rem;line-height:1.2">${hwParts.length ? hwParts.map(esc).join(' · ') : '—'}</span>`, hwParts.length ? '' : 'nothing on the shelf yet')}
      </div>`;

      // Career DSR arc — drawn by wireCareerArc.
      const arc = `<div class="ss-sub" data-part="overview" data-career-arc>
        <div class="ss-sub__head"><div class="ss-sub__title">Career DSR</div><span class="pf-side">week by week, every season</span></div>
        <div class="trend-wrap"><svg data-svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg"></svg><div class="trend-tip" data-tip></div></div>
        <div class="trend-legend"><span><span class="sw" style="background:var(--color-teal)"></span>Past seasons</span><span><span class="sw" style="background:var(--color-lime)"></span>Current season</span></div>
      </div>`;

      // Season-by-season table with a career footer (the Games tab for Career).
      const rows = c.rows.slice().sort((a, b) => a.seasonLabel.localeCompare(b.seasonLabel, undefined, { numeric: true }));
      const table = sub('games', 'Season by season', 'tap a season to open it', `<div class="ss-tblwrap"><table class="ss-table">
          <thead><tr><th>Season</th><th>W–L</th><th>Win %</th><th>Diff</th><th>DSR</th><th>Peak</th><th>Clutch</th><th>Finish</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
            <td><a href="#" data-goto="${esc(r.circuit)}">${esc(r.seasonLabel)}</a><small>${esc(r.teamName || '')}${r.circuit === curCode && !r.finalized ? ' · in progress' : ''}</small></td>
            <td>${rec(r.w, r.l)}</td><td>${r.pct}%</td>
            <td class="${r.diff > 0 ? 'val--green' : r.diff < 0 ? 'val--red' : ''}">${signed(r.diff)}</td>
            <td>${fmtDsr(r.dsr)}</td><td>${fmtDsr(r.peak)}</td>
            <td>${r.clutchG ? `${r.clutchW}/${r.clutchG}` : '—'}</td>
            <td>${finishText(r.finish) ? `<span class="fin">${esc(finishText(r.finish))}</span>` : (r.circuit === curCode && !r.finalized ? '<span style="color:var(--color-text-faint)">—</span>' : '—')}</td>
          </tr>`).join('')}</tbody>
          <tfoot><tr><td>Career</td><td>${rec(c.record.w, c.record.l)}</td><td>${c.record.pct}%</td><td>${signed(c.points.diff)}</td><td colspan="2" style="font-size:10px;color:var(--color-text-faint);font-weight:600">peak ${c.peak ? fmtDsr(c.peak.dsr) : '—'}</td><td>${c.clutch.g ? `${c.clutch.w}/${c.clutch.g}` : '—'}</td><td>${[md.gold ? '🥇×' + md.gold : null, md.silver ? '🥈×' + md.silver : null, md.bronze ? '🥉×' + md.bronze : null].filter(Boolean).join(' ') || '—'}</td></tr></tfoot>
        </table></div>`);

      // Splits + highlights
      const sg = c.splits.gender, sx = c.splits.mixed;
      const gLbl = seasons[0] && seasons[0].gender === 'F' ? "Women's" : "Men's";
      const splitRows = [
        sg.played ? barRow(`${gLbl} doubles`, pct(sg.won, sg.played), `<span>${rec(sg.won, sg.played - sg.won)} · ${sg.played} games</span>`, 'pf-bar--teal') : '',
        sx.played ? barRow('Mixed doubles', pct(sx.won, sx.played), `<span>${rec(sx.won, sx.played - sx.won)} · ${sx.played} games</span>`, 'pf-bar--purple') : '',
      ].join('');
      const splits = sub('overview', 'Career by game type', '', `${splitRows}
        ${kv('Clutch', c.clutch.g ? `${rec(c.clutch.w, c.clutch.g - c.clutch.w)}<small>${pct(c.clutch.w, c.clutch.g)}%</small>` : '—', 'games decided by ≤3')}
        ${kv('Points won', c.points.wonPct != null ? `${c.points.wonPct}%` : '—', 'of all rally points')}`);
      const h = c.highlights || {};
      const hl = (ic, title, sub2) => `<div class="hl"><div class="ic">${ic}</div><div class="t"><b>${title}</b><span>${sub2}</span></div></div>`;
      const highlights = sub('overview', 'Highlights', '', `
