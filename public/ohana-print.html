<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lineup · South Bay Ohana</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <!-- Printable lineup in the PVTC "League Scoresheet" (Mixed) format.
       /ohana/print?m=<matchId> — always the latest SAVED lineup for that week.
       Our side is filled in; the opponent's side is left blank for their captain. -->
  <style>
    @page { size: letter; margin: 0.35in; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #000; background: #e9e9e9; }
    .bar { position: sticky; top: 0; background: #0e0e0e; color: #f0f0ec; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 600 13px Inter, Arial, sans-serif; z-index: 5; }
    .bar a, .bar button { font: 800 12px Inter, Arial, sans-serif; border-radius: 9999px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.2); background: transparent; color: #f0f0ec; text-decoration: none; cursor: pointer; }
    .bar button.pri { background: #b8ff2c; color: #0e0e0e; border-color: #b8ff2c; }
    .bar .meta { color: #9a9e97; font-weight: 500; flex: 1; min-width: 200px; }
    .sheet { width: 8.5in; min-height: 11in; margin: 16px auto; background: #fff; padding: 0.35in 0.4in; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    h1 { font-size: 22pt; text-align: center; margin: 0 0 10px; }
    .hdr { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; font-size: 13pt; font-weight: 700; margin-bottom: 8px; }
    .hdr span { font-weight: 400; border-bottom: 1px solid #000; padding: 0 6px; }
    .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; font-size: 12.5pt; font-weight: 700; margin: 10px 0 6px; }
    .teams .v { display: block; font-weight: 400; border-bottom: 1px solid #000; min-height: 20px; margin-top: 2px; }
    .rhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 8px 0 6px; font-size: 11pt; font-weight: 700; }
    .rhead .round { background: #ffff00; padding: 3px 16px; font-size: 14pt; border: 1px solid #000; }
    .rhead .court { text-align: center; } .rhead .court span { font-weight: 400; border-bottom: 1px solid #000; padding: 0 8px; }
    .rhead .r { text-align: right; }
    .games { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
    .g { border: 1px solid #000; }
    .g .t { background: #d0cece; font-weight: 700; font-size: 10.5pt; padding: 3px 6px; border-bottom: 1px solid #000; }
    .g table { width: 100%; border-collapse: collapse; font-size: 10pt; table-layout: fixed; }
    .g th { font-size: 9pt; text-align: left; padding: 2px 5px; border-bottom: 1px solid #000; }
    .g td { padding: 0 5px; height: 22px; border-top: 1px solid #bbb; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .g td.side { width: 46px; font-size: 8.5pt; font-weight: 700; }
    .g td.sc, .g th.sc { width: 44px; text-align: center; border-left: 1px solid #000; }
    .g col.p { width: auto; }
    .g td.us { font-weight: 700; }
    .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 8px 0 4px; font-size: 9.5pt; }
    .sum table { border-collapse: collapse; }
    .sum td { border: 1px solid #000; padding: 2px 8px; min-width: 52px; height: 20px; text-align: center; }
    .sum td.l { font-weight: 700; text-align: left; border: 0; padding-left: 0; }
    .sum .note { font-size: 8.5pt; color: #333; margin-top: 2px; }
    .tot { display: flex; justify-content: flex-end; gap: 12px; align-items: flex-start; margin-top: 8px; font-size: 10pt; }
    .tot table { border-collapse: collapse; } .tot td { border: 1px solid #000; min-width: 56px; height: 22px; text-align: center; padding: 2px 8px; }
    .tot td.l { font-weight: 700; border: 0; text-align: right; }
    .sig { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 18px; font-size: 9.5pt; font-weight: 700; }
    .sig div { border-top: 1px solid #000; padding-top: 3px; }
    .draft { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 120pt; font-weight: 900; color: rgba(255,0,0,.12); transform: rotate(-24deg); pointer-events: none; }
    .msg { max-width: 560px; margin: 60px auto; text-align: center; font: 500 15px Inter, Arial, sans-serif; color: #333; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { margin: 0; box-shadow: none; width: auto; min-height: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="/ohana">← Team page</a>
    <span class="meta" id="meta">Loading…</span>
    <button class="pri" onclick="window.print()">Print</button>
  </div>
  <div id="out"></div>
  <script>
  (function () {
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const id = new URLSearchParams(location.search).get('m');
    const LABEL = { WD: 'Womens Double', MD: 'Mens Double', MXD: 'Mixed' };
    const OUR = 'South Bay Ohana';

    fetch('/.netlify/functions/ohana-data', { credentials: 'include' }).then(async r => {
      if (r.status === 401) { location.href = '/me.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
      if (!r.ok) { document.getElementById('out').innerHTML = '<div class="msg">This lineup is only for the South Bay Ohana roster.</div>'; document.getElementById('meta').textContent = ''; return; }
      const D = await r.json();
      const w = D.weeks.find(x => x.match && (x.match.id === id || x.id === id)) || D.weeks.find(x => x.match && x.match.startMs > Date.now() - 3 * 3600e3);
      if (!w) { document.getElementById('out').innerHTML = '<div class="msg">No match found for that week.</div>'; return; }
      render(D, w, w.match);
    });

    function render(D, w, m) {
      const home = m.side === 'home' ? OUR : m.opponent, away = m.side === 'home' ? m.opponent : OUR;
      const d = new Date(m.date + 'T12:00:00');
      const posted = m.lineupSentAt ? new Date(m.lineupSentAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : null;
      const filled = m.slots.filter(s => s.players.some(Boolean)).length;
      // Managers get the working draft; players only ever receive the finalized lineup.
      const isDraft = D.me.canEdit && (!m.finalizedAt || m.draftDirty);
      document.getElementById('meta').textContent = `${w.label} vs ${m.opponent} · ${filled}/12 games filled · ` + (isDraft
        ? (m.finalizedAt ? `DRAFT — has changes not finalized (finalized version from ${posted})` : 'DRAFT — not finalized yet')
        : (posted ? `finalized ${posted}` : 'lineup not posted yet'));
      document.title = `Lineup · ${w.label} vs ${m.opponent}`;

      const names = (s) => s.players.map(p => p ? p.name : '');
      const box = (s) => {
        const ours = names(s), theirs = [s.opp[0] || '', s.opp[1] || ''];
        const homeRow = m.side === 'home' ? ours : theirs, awayRow = m.side === 'home' ? theirs : ours;
        const hs = m.side === 'home' ? s.us : s.them, as = m.side === 'home' ? s.them : s.us;
        const row = (lbl, p, sc, us) => `<tr><td class="side">${lbl}</td><td class="${us ? 'us' : ''}">${esc(p[0])}</td><td class="${us ? 'us' : ''}">${esc(p[1])}</td><td class="sc">${sc ?? ''}</td></tr>`;
        return `<div class="g"><div class="t">Game ${((s.no - 1) % 6) + 1}:&nbsp; ${LABEL[s.type]}</div>
          <table><colgroup><col style="width:46px"><col class="p"><col class="p"><col style="width:44px"></colgroup>
            <tr><th></th><th>Player 1</th><th>Player 2</th><th class="sc">Score</th></tr>
            ${row('HOME', homeRow, hs, m.side === 'home')}${row('AWAY', awayRow, as, m.side === 'away')}
          </table></div>`;
      };
      const rr = (n) => {
        const x = m.result?.rounds?.[n - 1];
        if (!x) return { gh: '', ga: '', ph: '', pa: '' };
        const h = m.side === 'home' ? x.us : x.them, a = m.side === 'home' ? x.them : x.us;
        return { gh: h, ga: a, ph: h > a ? 2 : h < a ? 0 : 1, pa: a > h ? 2 : a < h ? 0 : 1 };
      };
      const summary = (n) => { const x = rr(n); return `<div class="sum">
          <div><table><tr><td class="l">ROUND ${n}</td><td class="l" style="text-align:center">HOME</td><td class="l" style="text-align:center">AWAY</td></tr>
            <tr><td class="l">GAMES WON</td><td>${x.gh}</td><td>${x.ga}</td></tr></table><div class="note">Total games = 6</div></div>
          <div><table><tr><td class="l">ROUND ${n}</td><td class="l" style="text-align:center">HOME</td><td class="l" style="text-align:center">AWAY</td></tr>
            <tr><td class="l">POINTS</td><td>${x.ph}</td><td>${x.pa}</td></tr></table><div class="note">6 game scoring · Win=2pts, Tie=1, Loss=0</div></div>
        </div>`; };
      const r1 = rr(1), r2 = rr(2);
      const tot = m.result ? [m.side === 'home' ? m.result.ptsUs : m.result.ptsThem, m.side === 'home' ? m.result.ptsThem : m.result.ptsUs] : ['', ''];

      document.getElementById('out').innerHTML = `<div class="sheet" style="position:relative">
        ${isDraft ? '<div class="draft">DRAFT</div>' : ''}
        <h1>PVTC Pickleball League Scoresheet</h1>
        <div class="hdr"><div>DATE: <span>${d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' })}</span></div>
          <div style="text-align:center">DIVISION:&nbsp; MIXED</div><div style="text-align:right">LEVEL: <span>3.5</span></div></div>
        <div class="teams"><div>Home Team (Serves First): <span class="v">${esc(home)}</span></div><div>Away Team (Chooses Side): <span class="v">${esc(away)}</span></div></div>
        <div class="rhead"><div class="court">COURT # <span>${esc(m.courts)}</span></div><div class="round">ROUND: 1</div><div class="court r">COURT # <span>${esc(m.courts)}</span></div></div>
        <div class="games">${m.slots.filter(s => s.round === 1).map(box).join('')}</div>
        ${summary(1)}
        <div class="rhead"><div>Home Team Chooses Side</div><div class="round">ROUND: 2</div><div class="r">Away Team Serves first</div></div>
        <div class="games">${m.slots.filter(s => s.round === 2).map(box).join('')}</div>
        ${summary(2)}
        <div class="tot"><table><tr><td class="l">ROUND 1&amp;2</td><td class="l" style="text-align:center">HOME</td><td class="l" style="text-align:center">AWAY</td></tr>
          <tr><td class="l">TOTAL POINTS</td><td>${tot[0]}</td><td>${tot[1]}</td></tr></table><div style="font-size:8.5pt;padding-top:26px">Max = 4 pts., Min. = 0</div></div>
        <div class="sig"><div>Home Captain Signature</div><div>Away Captain Signature</div></div>
      </div>`;
    }
  })();
  </script>
</body>
</html>
