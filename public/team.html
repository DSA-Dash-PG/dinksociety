       current one, which flips a week before its start date). -->

  <style>
    /* ═══════════════════════════════════════════════════════════════
       TEAM PAGE. Shared pieces live in /css/pages.css (.dk-*).
       Hero + season tiles → sticky tabs: Overview · Matches · Roster ·
       Stats · News. One tab row at every width; nothing scrolls sideways.
       ═══════════════════════════════════════════════════════════════ */
    /* Season so far */
    .tm-sea { display: grid; grid-template-columns: 64px 26px minmax(0, 1fr) auto 150px; align-items: center; gap: 4px 14px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--color-divider); background: none; color: inherit; font: inherit; text-align: left; }
    button.tm-sea { cursor: pointer; }
    button.tm-sea:hover .nm { color: var(--color-lime); }
    .tm-sea .wk { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-muted); }
    .tm-sea .mid { min-width: 0; }
    .tm-sea .nm { display: block; font-size: 15px; font-weight: 800; }
    .tm-sea .sm { display: block; font-size: 12px; color: var(--color-text-muted); }
    .tm-sea .sc { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--color-text-muted); }
    .tm-sea.w .sc { color: var(--color-lime); } .tm-sea.t .sc { color: var(--color-text); }
    .tm-sea .det { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--color-text-muted); }
    /* Roster by DSR */
    .tm-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 11px 0; border-bottom: 1px solid var(--color-divider); }
    .tm-bar .who { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 12px; }
    .tm-bar .who > div { min-width: 0; }
    .tm-bar .nm { display: block; font-size: 15px; font-weight: 800; }
    .tm-bar .sm { display: block; font-size: 12px; color: var(--color-text-muted); }
    .tm-bar .dk-track { flex: 999 1 160px; min-width: 0; }
    .tm-bar .val { flex: 0 0 46px; text-align: right; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .tm-bar .val.nr { font-size: 13px; color: var(--color-text-muted); }
    /* How they win */
    .tm-how { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
    .tm-type { display: flex; flex-direction: column; gap: 6px; }
    .tm-type > div:first-child { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
    .tm-type b { font-size: 14px; font-weight: 800; }
    .tm-type span { font-size: 13px; color: var(--color-text-muted); }
    .tm-type span b { font-size: 16px; font-weight: 900; color: var(--color-text); }
    .tm-mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; padding-top: 14px; border-top: 1px solid var(--color-border); }
    .tm-mini small { display: block; font-size: 11px; color: var(--color-text-muted); }
    .tm-mini b { display: block; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .tm-mini span { display: block; font-size: 12px; color: var(--color-text-muted); }
    /* Head to head */
    .tm-h2h { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .tm-h2h a { padding: 16px; border-radius: var(--radius-md); background: var(--color-surface); border: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .tm-h2h a:hover { border-color: var(--color-lime); }
    .tm-h2h .t { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; min-width: 0; }
    .tm-h2h .t span:last-child { overflow-wrap: anywhere; }
    .tm-h2h b { font-size: 28px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
    .tm-h2h b.up { font-size: 22px; }
    .tm-h2h small { font-size: 12px; color: var(--color-text-muted); }
    /* The Drop */
    .tm-drop { overflow: hidden; display: flex; flex-wrap: wrap; }
    .tm-drop__pic { flex: 1 1 300px; min-height: 200px; background: var(--color-surface-2) center / cover no-repeat; display: block; }
    .tm-drop__txt { flex: 999 1 440px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
    .tm-drop h2 { margin: 0; font-size: clamp(18px, 2.4vw, 24px); line-height: 1.25; font-weight: 800; }
    .tm-drop p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--color-text-muted); }
    .tm-links { display: flex; flex-wrap: wrap; gap: 4px 20px; }
    .tm-links .dk-more { padding: 10px 0; }
    /* Matches */
    .tm-match { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .tm-match__top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
    .tm-match__top > div:first-child { flex: 1 1 240px; min-width: 0; }
    .tm-match__k { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
    .tm-match__t { font-size: 22px; line-height: 1.1; font-weight: 900; font-style: italic; text-transform: uppercase; margin-top: 4px; }
    .tm-match__t a:hover { color: var(--color-lime); }
    .tm-match__s { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; font-size: 44px; line-height: 1; font-weight: 900; color: var(--color-text-muted); }
    .tm-match__s i { font-style: normal; font-size: 22px; font-weight: 800; }
    .tm-match.w .tm-match__s b:first-child { color: var(--color-lime); }
    .tm-match.t .tm-match__s b { color: var(--color-text); }
    .tm-match.l .tm-match__s b:last-child { color: var(--color-text); }
    .tm-mt { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .tm-mt > div { background: var(--color-surface-2); border-radius: 12px; padding: 12px; }
    .tm-mt small { display: block; font-size: 11px; color: var(--color-text-muted); }
    .tm-mt b { display: block; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .tm-mt span { display: block; font-size: 12px; color: var(--color-text-muted); }
    .tm-tog { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; min-height: 44px; padding: 12px 0 0; border: 0; border-top: 1px solid var(--color-border); background: none; color: var(--color-lime); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .tm-tog svg { transition: transform .2s; }
    .tm-match.is-open .tm-tog svg { transform: rotate(180deg); }
    .tm-games { display: none; flex-wrap: wrap; gap: 16px 28px; }
    .tm-match.is-open .tm-games { display: flex; }
    .tm-rd { flex: 1 1 420px; min-width: 0; }
    .tm-rd h4 { margin: 0 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--color-lime); }
    .tm-g { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto 26px; align-items: center; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--color-divider); }
    .tm-g .ty { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-muted); }
    .tm-g .pr { min-width: 0; }
    .tm-g .us { display: block; font-size: 14px; font-weight: 800; }
    .tm-g .us a:hover, .tm-g .th a:hover { color: var(--color-lime); }
    .tm-g .th { display: block; font-size: 12px; color: var(--color-text-muted); }
    .tm-g .gs { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--color-text-muted); }
    .tm-g.w .gs { color: var(--color-lime); }
    .tm-up { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--color-divider); }
    .tm-up:last-child { border-bottom: 0; }
    .tm-up .wk { flex: 0 0 64px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-muted); }
    .tm-up .mid { flex: 1 1 200px; min-width: 0; }
    .tm-up .nm { display: block; font-size: 15px; font-weight: 800; }
    .tm-up a.nm:hover { color: var(--color-lime); }
    .tm-up .sm { display: block; font-size: 12px; color: var(--color-text-muted); }
    /* Roster cards */
    .tm-roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
    .tm-pl { display: flex; flex-direction: column; overflow: hidden; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); min-width: 0; }
    .tm-pl:hover { border-color: var(--color-lime); }
    .tm-pl__pic { position: relative; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: var(--color-surface-2); overflow: hidden; font-size: 40px; font-weight: 900; font-style: italic; color: var(--color-lime); }
    .tm-pl__pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
    .tm-pl__tag { position: absolute; left: 8px; top: 8px; z-index: 1; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #0e0e0e; background: var(--color-lime); padding: 3px 8px; border-radius: var(--radius-full); font-style: normal; }
    .tm-pl__tag.co { background: var(--color-teal); }
    .tm-pl__b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .tm-pl__n { font-size: 15px; line-height: 1.15; font-weight: 900; font-style: italic; text-transform: uppercase; overflow-wrap: anywhere; }
    .tm-pl__r { font-size: 12px; color: var(--color-text-muted); }
    .tm-pl__c { margin-top: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; font-variant-numeric: tabular-nums; }
    .tm-pl__x { font-size: 12px; line-height: 1.4; color: var(--color-text-muted); }
    /* News */
    .tm-news { display: block; padding: 16px 18px; border-bottom: 1px solid var(--color-divider); }
    .tm-news:last-child { border-bottom: 0; }
    .tm-news__top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; font-size: 12px; color: var(--color-text-muted); }
    .tm-news__title { display: block; font-size: 17px; font-weight: 800; line-height: 1.25; }
    .tm-news__title:hover { color: var(--color-lime); }
    .tm-ment { display: flex; gap: 10px; align-items: baseline; margin-top: 8px; font-size: 13px; line-height: 1.5; color: var(--color-text-muted); }
    .tm-ment > span:first-child { flex: none; min-width: 78px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .tm-ment b { display: block; color: var(--color-text); font-weight: 700; }
    .tm-ment a:hover b { color: var(--color-lime); }
    .tm-phg { margin-bottom: 22px; } .tm-phg:last-child { margin-bottom: 0; }
    .tm-phg__h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--color-text-muted); }
    .tm-phg__h a { margin-left: auto; }
    /* Game pace (Stats tab) */
    .tm-pace { padding: 20px; }
    .tm-pace h3 { margin: 18px 0 4px; }
    .tm-prow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 9px 0; border-top: 1px solid var(--color-divider); font-size: 13px; font-variant-numeric: tabular-nums; }
    .tm-prow .l { flex: 1 1 240px; min-width: 0; }
    .tm-prow .dk-track { flex: 999 1 140px; min-width: 0; position: relative; overflow: visible; }
    .tm-prow .dk-track u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--color-text); }
    .tm-prow .v { flex: 0 0 86px; text-align: right; }
    /* Lightbox (team photos) */
    #tp-lightbox { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; padding: 24px; }
    #tp-lightbox.on { display: flex; }
    #tp-lightbox img { max-width: 96vw; max-height: 80vh; border-radius: 8px; }
    #tp-lightbox .cap { position: absolute; bottom: 64px; left: 0; right: 0; text-align: center; color: #c9ccc5; font-size: 13px; padding: 0 64px; }
    #tp-lightbox .x { position: absolute; top: 14px; right: 20px; font-size: 30px; color: #fff; background: none; border: none; cursor: pointer; line-height: 1; width: 44px; height: 44px; }
    #tp-lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 34px; color: #fff; background: rgba(255,255,255,.08); border: none; width: 46px; height: 46px; border-radius: 50%; cursor: pointer; line-height: 1; }
    #tp-lightbox .nav.prev { left: 14px; } #tp-lightbox .nav.next { right: 14px; }
    #tp-lightbox .acts { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
    #tp-lightbox .acts a, #tp-lightbox .acts button { font: inherit; font-size: 12px; font-weight: 800; padding: 10px 16px; border-radius: 9999px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; text-decoration: none; cursor: pointer; }
    #tp-lightbox .acts .pri { background: #b8ff2c; color: #0e0e0e; border-color: #b8ff2c; }
    @media (max-width: 600px) {
      .tm-sea { grid-template-columns: 58px 26px minmax(0, 1fr) auto; gap: 2px 10px; } .tm-sea .det { grid-column: 3 / -1; }
      .tm-roster { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .tm-match { padding: 16px; } .tm-match__s { font-size: 38px; }
      .tm-ment { flex-direction: column; gap: 2px; } .tm-ment > span:first-child { min-width: 0; }
      .tm-drop__txt { padding: 18px; }
      .tm-prow .v { flex-basis: 70px; }
      .tm-g { grid-template-columns: 50px minmax(0, 1fr) auto 26px; gap: 4px 8px; }
    }
  </style>
</head>
<body data-page="team">
  <div data-partial="nav"></div>

  <main class="dk" id="tm-root"><div class="dk-loading">Loading the team…</div></main>

  <div data-partial="footer"></div>
  <script src="/js/partials.js"></script>
  <script>
  (() => {
    /* ─── Helpers ─────────────────────────────────────────── */
    const FN = '/.netlify/functions/';
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const slug = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const SN = n => (window.shortName ? window.shortName(n) : n);
    const pct = (won, played) => played ? Math.round(won / played * 100) : 0;
    const signed = n => n == null ? '—' : n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0';
    const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
    const r1 = n => Math.round(n * 10) / 10;
    const initials = name => { const p = String(name || '?').trim().split(/\s+/); return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
    const ms = iso => { const t = Date.parse(iso || ''); return isNaN(t) ? null : t; };
    const dayShort = iso => { const t = ms(iso); return t == null ? '' : new Date(t).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
    const dayOnly = iso => { const t = ms(iso); return t == null ? '' : new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
    const timeOf = m => { const t = ms(m && m.scheduledAt); return t != null ? new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ((m && m.startTime) || ''); };
    const getJSON = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
    const dsrOf = p => (p && p.composite != null) ? r1(p.composite) : null;
    const chev = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

    /* ─── URL + season ────────────────────────────────────── */
    const _q = new URLSearchParams(location.search);
    const teamParam = _q.get('id') || '';
    let SEASON_ID = _q.get('season') || 'circuit-i', SEASON = null;
    // Season ids come in several shapes ('circuit-i', 'season-2', a bare '2'). dsSeason()
    // overwrites these once it resolves; this is only the pre-resolution guess.
    function codeFromId(id) {
      const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'], roman = n => (n >= 1 && n <= 10) ? ROMAN[n] : String(n);
      const s = String(id || '').trim(); if (!s) return 'I';
      if (/^(TEST|[IVX]+)$/i.test(s)) return s.toUpperCase();
      if (/^(circuit|season)-/i.test(s)) { const t = s.replace(/^(circuit|season)-/i, '').trim(); return /^\d+$/.test(t) ? roman(parseInt(t, 10)) : t.toUpperCase(); }
      if (/^\d+$/.test(s)) return roman(parseInt(s, 10));
      return s.toUpperCase();
    }
    let CIRCUIT = codeFromId(SEASON_ID);
    let LINK_SUFFIX = SEASON_ID === 'circuit-i' ? '' : `&season=${encodeURIComponent(SEASON_ID)}`;
    const withSeason = url => url + (LINK_SUFFIX ? (url.indexOf('?') >= 0 ? LINK_SUFFIX : '?' + LINK_SUFFIX.slice(1)) : '');

    /* ─── State ───────────────────────────────────────────── */
    let TEAMS = [], team = null, teamSlug = '', REC = null, DIV = [], MY = [], TBD = [], ALLP = [], MYP = [], QRANK = {}, QN = 0, NEED = 6;
    let DSR_BY_TEAM = {}, NEWS = [], PHOTOS = [], PACE = null;
    const MATCH_CACHE = {};

    const teamBy = (id, name) => TEAMS.find(t => (id && t.id === id) || t.name === name) || null;
    const teamHref = name => withSeason('/team?id=' + slug(name));
    const playerHref = (name, tName) => '/player?team=' + slug(tName || team.name) + '&name=' + encodeURIComponent(name) + LINK_SUFFIX;
    function badge(name, size) {
      const t = teamBy(null, name) || {}, e = t.emoji || '', isText = /[a-z0-9]/i.test(e);
      const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * (e && !isText ? 0.52 : 0.34))}px;`;
      if (t.photoUrl) return `<span class="dk-tb" aria-hidden="true" style="${st}"><img src="${esc(t.photoUrl)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
      if (e) return `<span class="dk-tb" aria-hidden="true" style="${st}">${esc(isText ? e.slice(0, 2) : e)}</span>`;
      return `<span class="dk-tb" aria-hidden="true" style="${st}">${esc(initials(name))}</span>`;
    }
    const avatar = p => `<span class="dk-av" aria-hidden="true" data-ini="${esc(initials(p.name))}">${p.photoUrl ? `<img src="${esc(p.photoUrl)}" alt="" loading="lazy" onerror="var b=this.parentNode;this.remove();if(b)b.textContent=b.dataset.ini;">` : esc(initials(p.name))}</span>`;

    /* A match is done once it is finalized or has match points recorded. */
    const isFinal = m => m.status === 'final' || (m.scoreA != null && m.scoreB != null);
    const mine = m => (team.id && (m.teamAId === team.id || m.teamBId === team.id)) || m.teamA === team.name || m.teamB === team.name;
    /* Everything about one match from this team's side. */
    function side(m) {
      const home = (team.id && m.teamAId === team.id) || (m.teamAId == null && m.teamA === team.name) || (m.teamA === team.name);
      const pick = (a, b) => home ? [a, b] : [b, a];
      const [pts, opts] = pick(m.scoreA, m.scoreB), [g, og] = pick(m.gamesA, m.gamesB), [p, op] = pick(m.pointsA, m.pointsB);
      const rd = r => r ? pick(r.homeGames, r.awayGames) : null;
      const res = !isFinal(m) ? '' : pts > opts ? 'w' : pts < opts ? 'l' : 't';
      const courts = (m.courtA && m.courtB) ? `Courts ${m.courtA} & ${m.courtB}` : (m.court ? `Court ${m.court}` : '');

    /* ─── Data ────────────────────────────────────────────── */
    async function load() {

        getJSON(FN + 'public-schedule?season=' + encodeURIComponent(SEASON_ID)),

      teamSlug = slug(team.name);
      document.title = `${team.name} · The Dink Society`;

      /* standings: this team's row and its division, in standings order */

        for (const div of Object.values(lb.divisions)) {
          const rows = div.teams || [];
          const m = rows.find(t => t.teamId === team.id || t.teamName === team.name);

      MYP.sort((a, b) => (b.composite ?? -999) - (a.composite ?? -999));

      const nx = nextMatch();
      return `<div class="dk-cols">
          <section class="side"><div class="dk-head"><h2 class="dk-h2 dk-h2--lg">Up next</h2>${nx ? `<span>${esc([weekLong(nx), dayShort(nx.scheduledAt), timeOf(nx)].filter(Boolean).join(' · '))}</span>` : ''}</div>${upNextHtml()}</section>
          <section class="wide"><div class="dk-head"><h2 class="dk-h2 dk-h2--lg">${finals().length ? 'The season so far' : 'The season ahead'}</h2><button type="button" class="dk-more" data-tab="matches">All matches</button></div><div class="dk-card dk-rows">${seasonHtml()}</div></section>
        </div>
        <div class="dk-cols" style="align-items:flex-start;">
          <section class="wide"><div class="dk-head"><h2 class="dk-h2">Roster <span class="lime">· by DSR</span></h2><button type="button" class="dk-more" data-tab="roster">Full roster</button></div><div class="dk-card dk-rows">${rosterBarsHtml()}</div></section>
          <section class="side"><div class="dk-head"><h2 class="dk-h2">How they win</h2></div><div class="dk-card">${howHtml()}</div></section>
        </div>
        ${h2hHtml()}
        <section id="tm-dropcard" hidden></section>`;
    }

    /* ─── Matches ─────────────────────────────────────────── */
    function matchCard(m, open) {
      const s = side(m), opp = `<a href="${teamHref(s.opp)}">${esc(s.opp)}</a>`;
      const verb = s.res === 'w' ? 'Won' : s.res === 'l' ? 'Lost' : 'Tied';
      const rdTile = (lab, r) => { if (!r || r[0] == null) return ''; const txt = r[0] > r[1] ? 'won, 2 points' : r[0] < r[1] ? 'lost' : 'tied, 1 point each'; return `<div><small>${lab}</small><b>${r[0]}–${r[1]}</b><span>${txt}</span></div>`; };
      const tiles = rdTile('Round 1', s.r1) + rdTile('Round 2', s.r2)
        + (s.g != null && s.og != null ? `<div><small>Games</small><b>${s.g}–${s.og}</b><span>of ${s.g + s.og}</span></div>` : '')
        + (s.p != null && s.op != null ? `<div><small>Points</small><b>${s.p}–${s.op}</b><span>${signed(s.p - s.op)} on the night</span></div>` : '')
        + `<div data-pace-week="${m.week}" hidden></div>`;
      return `<article class="dk-card tm-match ${s.res}${open ? ' is-open' : ''}" id="m-${esc(m.id)}" data-match="${esc(m.id)}">
        <div class="tm-match__top">
          <div><div class="tm-match__k">${esc([weekLong(m), dayShort(m.scheduledAt), s.courts, s.home ? 'Home' : 'Away'].filter(Boolean).join(' · '))}</div>
            <div class="tm-match__t">${verb} ${s.home ? 'v' : 'at'} ${opp}</div></div>
          <div class="tm-match__s" aria-label="${s.pts} to ${s.opts}"><b>${s.pts ?? '–'}</b><i>–</i><b>${s.opts ?? '–'}</b></div>
        </div>
        ${tiles ? `<div class="tm-mt">${tiles}</div>` : ''}
        <div class="tm-games" data-games><div class="dk-empty" style="flex:1;">Loading the games…</div></div>
        <button type="button" class="tm-tog" data-toggle-match="${esc(m.id)}" aria-expanded="${open ? 'true' : 'false'}"><span>Game by game</span>${chev}</button>
      </article>`;
    }
    function matchesHtml() {
      const done = finals().slice().reverse(), up = MY.filter(m => !isFinal(m));
      if (!MY.length && !TBD.length) return '<div class="dk-card dk-empty">The schedule appears once the season is set.</div>';
      const upRows = up.map(m => { const s = side(m);
        return `<div class="tm-up"><span class="wk">${esc(wkLabel(m))}</span><span class="mid"><a class="nm" href="${teamHref(s.opp)}">${esc(vsLabel(s))}</a><span class="sm">${esc([dayShort(m.scheduledAt), timeOf(m), m.venue, s.courts, s.home ? 'Home' : 'Away'].filter(Boolean).join(' · '))}</span></span>
          <a class="dk-btn dk-btn--out dk-btn--sm" href="${withSeason('/leaderboard.html?view=tvt')}">Preview</a></div>`; }).join('')
        + TBD.map(w => `<div class="tm-up"><span class="wk">${esc(wkLabel(w))}</span><span class="mid"><span class="nm">Opponent set by the standings</span><span class="sm">${esc([w.phaseLabel, dayShort(w.scheduledAt)].filter(Boolean).join(' · '))}</span></span></div>`).join('');
      return `<div class="dk-head dk-head--mid" style="margin-bottom:0;"><h2 class="dk-h2 dk-h2--lg">Matches</h2>
          <div class="dk-seg" role="group" aria-label="Show" id="tm-mseg">
            <button type="button" class="on" data-mf="all" aria-pressed="true">All</button>
            <button type="button" data-mf="done" aria-pressed="false">Results · ${done.length}</button>
            <button type="button" data-mf="up" aria-pressed="false">Upcoming · ${up.length + TBD.length}</button>
          </div></div>
        <div data-mgroup="done" style="display:flex;flex-direction:column;gap:14px;">${done.length ? done.map((m, i) => matchCard(m, i === 0)).join('') : '<div class="dk-card dk-empty">No results yet.</div>'}</div>
        <div data-mgroup="up">${upRows ? `<div class="dk-head"><h3 class="dk-h3">Still to play</h3></div><div class="dk-card dk-rows">${upRows}</div>` : ''}</div>`;
    }
    const TYPE = { WD: 'Women', MD: 'Men', MX: 'Mixed' };
    function gamesHtml(match, m) {
      if (!match || !match.games || !match.games.length) return '<div class="dk-empty" style="flex:1;">Game-by-game scores are not posted for this match.</div>';
      const s = side(m), homeName = (match.home && match.home.name) || m.teamA, awayName = (match.away && match.away.name) || m.teamB;
      const names = (list, tName) => (list && list.length) ? list.map(n => { const nm = typeof n === 'string' ? n : (n && n.name) || ''; return `<a href="${playerHref(nm, tName)}">${esc(SN(nm))}</a>`; }).join(' &amp; ') : '—';
      return [1, 2].map(rn => {
        const games = match.games.filter(g => g.round === rn);
        if (!games.length) return '';
        const r = rn === 1 ? s.r1 : s.r2;
        const rows = games.map(g => {
          const us = s.home ? g.home : g.away, them = s.home ? g.away : g.home, scored = us != null && them != null, win = scored && us > them;
          return `<div class="tm-g ${win ? 'w' : ''}"><span class="ty">${esc(TYPE[g.type] || g.type || '')}</span>
            <span class="pr"><span class="us">${names(s.home ? g.homePlayers : g.awayPlayers, s.home ? homeName : awayName)}</span><span class="th">v ${names(s.home ? g.awayPlayers : g.homePlayers, s.home ? awayName : homeName)}</span></span>
            <span class="gs">${scored ? us + '–' + them : '—'}</span>${scored ? `<i class="dk-res ${win ? 'w' : ''}">${win ? 'W' : 'L'}</i>` : ''}</div>`;
        }).join('');
        return `<div class="tm-rd"><h4>Round ${rn}${r && r[0] != null ? ' · ' + r[0] + '–' + r[1] : ''}</h4>${rows}</div>`;
      }).join('');
    }
    async function openMatch(id, toggle) {
      const card = document.querySelector(`.tm-match[data-match="${CSS.escape(id)}"]`); if (!card) return;
      const willOpen = toggle ? !card.classList.contains('is-open') : true;
      card.classList.toggle('is-open', willOpen);
      const btn = card.querySelector('.tm-tog'); if (btn) btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      if (!willOpen) return;
      const box = card.querySelector('[data-games]'), m = MY.find(x => x.id === id);
      if (!box || !m || box.dataset.done) return;
      if (!MATCH_CACHE[id]) MATCH_CACHE[id] = getJSON(FN + 'public-match?' + new URLSearchParams({ season: SEASON_ID, match: id }));
      const d = await MATCH_CACHE[id];
      box.innerHTML = gamesHtml(d && d.match, m); box.dataset.done = '1';
    }

    /* ─── Roster ──────────────────────────────────────────── */
    function rosterHtml() {
      const roster = (team.roster || []).slice();
      if (!roster.length) return '<div class="dk-card dk-empty">The roster appears once the captain adds players.</div>';
      const stat = {}; MYP.forEach(p => { stat[p.name] = p; });
      roster.sort((a, b) => ((stat[b.name] || {}).composite ?? -999) - ((stat[a.name] || {}).composite ?? -999) || String(a.name).localeCompare(String(b.name)));
      const nW = roster.filter(p => p.gender === 'F').length, nM = roster.filter(p => p.gender === 'M').length;
      const cards = roster.map(p => {
        const st = stat[p.name], d = st ? dsrOf(st) : null, q = st && QRANK[st.playerId || st.name];
        const tag = p.isCaptain ? '<span class="tm-pl__tag">Captain</span>' : p.isCoCaptain ? '<span class="tm-pl__tag co">Co-captain</span>' : '';
        const g = p.gender === 'F' ? 'Women' : p.gender === 'M' ? 'Men' : '';
        const line = [g, st ? rankLine(st) : 'yet to play'].filter(Boolean).join(' · ');
        const sp = st ? [['womens', 'Women’s'], ['mens', 'Men’s'], ['mixed', 'Mixed']].map(([k, lab]) => { const b = (st.byType && st.byType[k]) || {}; return b.played ? `${lab} ${b.won || 0}–${(b.played || 0) - (b.won || 0)}` : ''; }).filter(Boolean).join(' · ') : '';
        const prof = [p.plays, p.city, p.dupr ? p.dupr + ' DUPR' : ''].filter(Boolean).join(' · ');
        const diff = st ? (st.diff != null ? st.diff : (st.ps || 0) - (st.pa || 0)) : null;
        return `<a class="tm-pl" href="${playerHref(p.name)}" data-g="${esc(p.gender || '')}" data-n="${esc(String(p.name).toLowerCase())}">
          <span class="tm-pl__pic">${tag}${p.photoUrl ? `<img src="${esc(p.photoUrl)}" alt="" loading="lazy" onerror="this.remove()">` : ''}${esc(initials(p.name))}</span>
          <span class="tm-pl__b"><span class="tm-pl__n">${esc(SN(p.name))}</span><span class="tm-pl__r">${esc(line)}</span>
            <span class="tm-pl__c">
              <span class="dk-cell"><small>DSR</small><b class="${q ? 'main' : ''}">${d == null ? '—' : d.toFixed(1)}</b></span>
              <span class="dk-cell"><small>W–L</small><b class="main">${st ? (st.gamesWon || 0) + '–' + (st.gamesLost ?? ((st.gamesPlayed || 0) - (st.gamesWon || 0))) : '—'}</b></span>
              <span class="dk-cell"><small>Diff</small><b class="${diff > 0 ? 'pos' : diff < 0 ? 'neg' : ''}">${diff == null ? '—' : signed(diff)}</b></span>
            </span>
            ${sp ? `<span class="tm-pl__x">${esc(sp)}</span>` : ''}${prof ? `<span class="tm-pl__x">${esc(prof)}</span>` : ''}</span></a>`;
      }).join('');
      return `<div class="dk-head dk-head--mid" style="margin-bottom:0;"><h2 class="dk-h2 dk-h2--lg">Roster <span class="lime">· ${roster.length}</span></h2>
          <div class="dk-seg" role="group" aria-label="Show" id="tm-rseg">
            <button type="button" class="on" data-rf="" aria-pressed="true">All</button>
            ${nW ? `<button type="button" data-rf="F" aria-pressed="false">Women · ${nW}</button>` : ''}${nM ? `<button type="button" data-rf="M" aria-pressed="false">Men · ${nM}</button>` : ''}
          </div></div>
        ${roster.length > 8 ? `<div><label class="dk-sr" for="tm-rfind">Find a player</label><input class="dk-find" id="tm-rfind" type="search" placeholder="Find a player" autocomplete="off"></div>` : ''}
        <div class="tm-roster" id="tm-roster">${cards}</div>`;
    }

    /* ─── Stats ───────────────────────────────────────────── */
    const STAT_COLS = [
      ['gp', 'GP', p => p.gamesPlayed || 0], ['w', 'W', p => p.gamesWon || 0], ['l', 'L', p => p.gamesLost ?? ((p.gamesPlayed || 0) - (p.gamesWon || 0))],
      ['pct', 'Win %', p => pct(p.gamesWon || 0, p.gamesPlayed || 0)], ['pf', 'For', p => p.ps || 0], ['pa', 'Against', p => p.pa || 0],
      ['diff', 'Diff', p => (p.diff != null ? p.diff : (p.ps || 0) - (p.pa || 0))], ['dsr', 'DSR', p => p.composite ?? -999],
    ];
    let statSort = 'dsr';
    function statsTable() {
      if (!MYP.length) return '<div class="dk-empty">Player stats appear once matches are played.</div>';
      const col = STAT_COLS.find(c => c[0] === statSort) || STAT_COLS[STAT_COLS.length - 1];
      const rows = MYP.slice().sort((a, b) => (statSort === 'l' || statSort === 'pa' ? col[2](a) - col[2](b) : col[2](b) - col[2](a)));
      const split = (p, k) => { const b = (p.byType && p.byType[k]) || {}; return b.played ? `${b.won || 0}–${(b.played || 0) - (b.won || 0)}` : '—'; };
      return `<div class="dk-scroll"><table class="dk-table"><thead><tr><th scope="col">Player</th>${STAT_COLS.map(c => `<th scope="col" class="${c[0] === statSort ? 'on' : ''}"><button type="button" data-sort="${c[0]}">${c[1]}</button></th>`).join('')}<th scope="col">Women’s</th><th scope="col">Men’s</th><th scope="col">Mixed</th><th scope="col">Close</th></tr></thead><tbody>
        ${rows.map(p => { const d = dsrOf(p), diff = STAT_COLS[6][2](p);
          return `<tr><td><a href="${playerHref(p.name)}">${esc(SN(p.name))}</a></td><td>${p.gamesPlayed || 0}</td><td>${p.gamesWon || 0}</td><td>${STAT_COLS[2][2](p)}</td><td>${STAT_COLS[3][2](p)}%</td><td>${p.ps || 0}</td><td>${p.pa || 0}</td>
            <td class="${diff > 0 ? 'pos' : diff < 0 ? 'neg' : ''}">${signed(diff)}</td><td class="main">${d == null ? '—' : d.toFixed(1)}</td>
            <td>${split(p, 'womens')}</td><td>${split(p, 'mens')}</td><td>${split(p, 'mixed')}</td><td>${p.clutchG ? (p.clutchW || 0) + '–' + (p.clutchG - (p.clutchW || 0)) : '—'}</td></tr>`; }).join('')}
        </tbody></table></div><div class="dk-note" style="padding:12px 18px 14px;">Tap a column to sort. Close = games decided by 3 points or fewer.</div>`;
    }
    function statsHtml() {
      return `<section><div class="dk-head"><h2 class="dk-h2 dk-h2--lg">Player stats</h2><span>${MYP.length} played this season</span></div><div class="dk-card" id="tm-stats">${statsTable()}</div></section>
        <section><div class="dk-head"><h2 class="dk-h2">Game pace</h2><span id="tm-pace-rank"></span></div><div class="dk-card tm-pace" id="tm-pace"><div class="dk-empty">Timing the courts…</div></div></section>`;
    }

    /* ─── News + photos ───────────────────────────────────── */
    function newsHtml() {
      return `<section><div class="dk-head"><h2 class="dk-h2 dk-h2--lg">In The Drop</h2><span id="tm-news-count"></span></div><div class="dk-card" id="tm-news"><div class="dk-empty">Checking the Society Desk…</div></div></section>
        <section id="photos"><div class="dk-head"><h2 class="dk-h2">Photos</h2><span id="tm-photo-count"></span></div><div id="tm-photos"><div class="dk-card dk-empty">Loading photos…</div></div></section>`;
    }
    const dateLong = iso => { const t = ms(iso); return t == null ? '' : new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
    const photoSrc = id => FN + 'drop-photo-serve?id=' + encodeURIComponent(id);
    async function loadNews() {
      const data = await getJSON(FN + 'public-team-news?circuit=' + encodeURIComponent(CIRCUIT) + '&team=' + encodeURIComponent(team.name));
      NEWS = (data && data.items) || []; PHOTOS = (data && data.photos) || [];
      const list = $('tm-news'), cnt = $('tm-news-count');
      const tabN = document.querySelector('.dk-tabs [data-tab="news"] .n'); if (tabN && NEWS.length) { tabN.textContent = NEWS.length; tabN.hidden = false; }
      if (cnt) cnt.textContent = NEWS.length ? `${NEWS.length} edition${NEWS.length === 1 ? '' : 's'}` : '';
      if (list) {
        const WHERE = { featured: 'Team report', story: 'Storyline', around: 'Around the league', lead: 'The lead' };
        list.innerHTML = NEWS.length ? NEWS.map(it => {
          const ments = (it.mentions || []).slice(0, 4).map(m => `<div class="tm-ment"><span>${esc(WHERE[m.where] || m.label || '')}</span><a href="${esc(m.href || it.href)}">${m.title ? `<b>${esc(m.title)}</b>` : ''}${m.snippet ? esc(m.snippet) : ''}</a></div>`).join('');
          const extra = (it.mentions || []).length > 4 ? `<div class="tm-ment"><span></span><span>+${it.mentions.length - 4} more</span></div>` : '';
          return `<div class="tm-news"><div class="tm-news__top"><span class="dk-kicker">${esc(it.kicker || ('The Drop · ' + (it.label || '')))}</span>${it.featured ? '<span class="dk-pill dk-pill--lime">Team report</span>' : ''}<span>${esc(dateLong(it.publishedAt))}</span></div>
            <a class="tm-news__title" href="${esc(it.href)}">${esc(it.title || 'The Drop')}</a>${ments}${extra}
            <a class="dk-more" href="${esc(it.href)}" style="display:inline-block;padding:10px 0 0;">Read the edition</a></div>`;
        }).join('') : '<div class="dk-empty">No mentions yet. The Society Desk writes The Drop after every match night.</div>';
      }
      renderPhotos();
      renderDropCard();
      // No team photo on file: the hero borrows the newest photo from The Drop.
      const hp = $('tm-heropic');
      if (hp && !team.photoUrl && PHOTOS.length) { const p = PHOTOS[0], f = p.focal || {}; hp.classList.remove('dk-art'); hp.textContent = ''; hp.style.backgroundImage = `url('${photoSrc(p.id)}')`; hp.style.backgroundPosition = `${isFinite(f.x) ? f.x : 50}% ${isFinite(f.y) ? f.y : 50}%`; hp.innerHTML = `<span>${esc(p.kicker || 'The Drop')}</span>`; }
    }
    function renderDropCard() {
      const box = $('tm-dropcard'); if (!box || !NEWS.length) return;
      const it = NEWS[0], ment = (it.mentions || []).find(m => m.where === 'featured') || (it.mentions || [])[0] || null;
      const ph = PHOTOS.find(p => p.edition === it.edition) || null, f = (ph && ph.focal) || {};
      box.innerHTML = `<div class="dk-card tm-drop">
        ${ph ? `<a class="tm-drop__pic" href="${esc(it.href)}" aria-label="Read The Drop" style="background-image:url('${photoSrc(ph.id)}');background-position:${isFinite(f.x) ? f.x : 50}% ${isFinite(f.y) ? f.y : 50}%"></a>` : ''}
        <div class="tm-drop__txt"><div class="dk-kicker">${esc(it.kicker || ('In The Drop · ' + (it.label || '')))}</div>
          <h2><a href="${esc(it.href)}">${esc(it.title || 'The Drop')}</a></h2>
          ${ment && (ment.snippet || ment.title) ? `<p>${esc(ment.snippet || ment.title)}</p>` : ''}
          <div class="tm-links"><a class="dk-more" href="${esc(it.href)}">Read the edition</a><button type="button" class="dk-more" data-tab="news">All team news and photos</button></div></div></div>`;
      box.hidden = false;
    }
    function renderPhotos() {
      const list = $('tm-photos'), cnt = $('tm-photo-count'); if (!list) return;
      if (cnt) cnt.textContent = PHOTOS.length ? `${PHOTOS.length} photo${PHOTOS.length === 1 ? '' : 's'}` : '';
      if (!PHOTOS.length) { list.innerHTML = '<div class="dk-card dk-empty">No photos yet. They show up here when a Drop storyline about this team has photos.</div>'; return; }
      const pos = p => { const f = p.focal; const x = f && isFinite(f.x) ? f.x : 50, y = f && isFinite(f.y) ? f.y : 50; return `object-position:${x}% ${y}%`; };
      const groups = [];
      PHOTOS.forEach((p, i) => { let g = groups[groups.length - 1]; if (!g || g.edition !== p.edition) { g = { edition: p.edition, p, list: [] }; groups.push(g); } g.list.push({ p, i }); });
      list.innerHTML = groups.map(g => `<div class="tm-phg">
          <div class="tm-phg__h"><span class="dk-kicker">${esc(g.p.kicker || ('The Drop · ' + (g.p.label || '')))}</span><span>${esc(dateLong(g.p.publishedAt))} · ${g.list.length} photo${g.list.length === 1 ? '' : 's'}</span><a class="dk-more" href="${esc(g.p.href)}">Read the story</a></div>
          <div class="dk-pics">${g.list.map(({ p, i }) => `<button type="button" data-ph="${i}" aria-label="Open photo ${i + 1}"><img src="${photoSrc(p.id)}" alt="${esc(p.caption || '')}" loading="lazy" style="${pos(p)}"></button>`).join('')}</div>
        </div>`).join('');
    }

    /* ─── Game pace: how long this team's games and matches take ─── */
    async function loadPace() {
      const d = await getJSON(FN + 'public-pace?circuit=' + encodeURIComponent(CIRCUIT) + '&team=' + encodeURIComponent(team.name));
      PACE = d && d.team ? d : null;
      const body = $('tm-pace'), rk = $('tm-pace-rank');
      if (!PACE) { if (body) body.innerHTML = '<div class="dk-empty">Game pace fills in after this team’s first match night.</div>'; return; }
      const t = d.team, L = d.league || {}, v = x => (x == null ? '—' : x);
      const hm = m => { const h = Math.floor(m / 60), mm = Math.round(m - h * 60); return h ? `${h}h ${mm}m` : `${mm}m`; };
      const rankTxt = d.rank === 1 ? 'Quickest games in the league' : d.rank === d.of ? 'Longest games in the league' : `${ord(d.rank)} of ${d.of} for pace`;
      if (rk) rk.textContent = rankTxt;
      const diff = t.avgGameMin != null && L.avgGameMin != null ? r1(t.avgGameMin - L.avgGameMin) : null;
      // Overview minis and the per-match "match time" tiles
      const a = $('tm-pace-a'), b = $('tm-pace-b');
      if (a && t.avgGameMin != null) { a.innerHTML = `<small>Average game</small><b>${t.avgGameMin} min</b><span>${L.avgGameMin != null ? 'league average ' + L.avgGameMin : ''}</span>`; a.hidden = false; }
      if (b && t.avgMatchMin != null) { b.innerHTML = `<small>Average match</small><b>${Math.round(t.avgMatchMin)} min</b><span>${esc(rankTxt.charAt(0).toLowerCase() + rankTxt.slice(1))}</span>`; b.hidden = false; }
      (d.matches || []).forEach(m => { const el = document.querySelector(`[data-pace-week="${m.week}"]`); if (el && m.totalMin != null) { el.innerHTML = `<small>Match time</small><b>${Math.round(m.totalMin)} min</b><span>${m.avgGameMin != null ? m.avgGameMin + ' a game' : ''}</span>`; el.hidden = false; } });
      if (!body) return;
      let h = `<div class="dk-tiles">
          <div class="dk-tile"><small>Average game</small><b>${v(t.avgGameMin)} <em>min</em></b><span>${diff != null ? (diff > 0 ? '+' : '') + diff + ' v the league' : ''}</span></div>
          <div class="dk-tile"><small>Average match</small><b>${t.avgMatchMin != null ? Math.round(t.avgMatchMin) : '—'} <em>min</em></b><span>${esc(rankTxt)}</span></div>
          <div class="dk-tile"><small>Average win</small><b>${v(t.winsAvgMin)} <em>min</em></b><span>games won</span></div>
          <div class="dk-tile"><small>Average loss</small><b>${v(t.lossesAvgMin)} <em>min</em></b><span>games lost</span></div>
        </div>`;
      const bt = t.byType || {}, types = [['WOMENS', 'Women’s'], ['MENS', 'Men’s'], ['MIXED', 'Mixed']].filter(([k]) => bt[k] && bt[k].n);
      if (types.length) {
        const mx = Math.max(...types.map(([k]) => bt[k].avgMin || 0), ...types.map(([k]) => (L.byType && L.byType[k] && L.byType[k].avgMin) || 0), 1);
        h += '<h3 class="dk-h3">By game type · the line is the league average</h3>' + types.map(([k, lab]) => { const lg = L.byType && L.byType[k] ? L.byType[k].avgMin : null;
          return `<div class="tm-prow"><span class="l">${lab}</span><span class="dk-track"><i style="width:${Math.round(bt[k].avgMin / mx * 100)}%"></i>${lg != null ? `<u style="left:${Math.round(lg / mx * 100)}%"></u>` : ''}</span><span class="v"><b>${bt[k].avgMin}</b> / ${v(lg)}</span></div>`; }).join('');
      }
      if ((d.matches || []).length) {
        const mx = Math.max(...d.matches.map(m => m.totalMin || 0), 1);
        h += '<h3 class="dk-h3">Match length by week</h3>' + d.matches.map(m => `<div class="tm-prow"><span class="l">Wk ${m.week} · <b class="${m.result === 'W' ? 'pos' : ''}">${esc(m.result)}</b> ${esc(m.games)} v ${esc(m.opponent)}</span><span class="dk-track"><i style="width:${Math.round((m.totalMin || 0) / mx * 100)}%"></i></span><span class="v"><b>${m.totalMin != null ? Math.round(m.totalMin) : '—'}</b> min</span></div>`).join('');
      }
      const gl = (lab, g) => g ? `<div class="tm-prow"><span class="l"><b>${lab}</b><br><span class="muted">${g.won ? 'Won' : 'Lost'} ${esc(g.teamScore)} v ${esc(g.opponent)}${g.teamPair ? ' · ' + esc(g.teamPair) : ''} · Week ${g.week}</span></span><span class="v"><b>${g.approx ? '~' : ''}${g.min}</b> min</span></div>` : '';
      const games = gl('Quickest win', d.quickestWin) + gl('Longest game', d.longestGame) + (d.longestClutch && (!d.longestGame || d.longestClutch.slot !== d.longestGame.slot || d.longestClutch.week !== d.longestGame.week) ? gl('Longest close game', d.longestClutch) : '');
      if (games) h += '<h3 class="dk-h3">Games to remember</h3>' + games;
      const ct = (d.courtTime || []).slice(0, 6);
      if (ct.length) h += '<h3 class="dk-h3">Court time this season</h3>' + ct.map((p, i) => `<div class="tm-prow"><span class="l"><b>${i + 1}. ${esc(SN(p.name))}</b></span><span class="muted">${p.games} games</span><span class="v"><b>${hm(p.courtMin)}</b></span></div>`).join('');
      h += `<div class="dk-note">Times come from when each score was entered, so they are close, not exact. ~ means two scores were entered together. <a class="dk-more" href="${withSeason('/the-nvz')}">League pace in The NVZ</a></div>`;
      body.innerHTML = h;
    }

    /* ─── Render + wiring ─────────────────────────────────── */
    const TABS = [['overview', 'Overview'], ['matches', 'Matches'], ['roster', 'Roster'], ['stats', 'Stats'], ['news', 'News']];
    const OLD_TABS = { schedule: 'matches', history: 'matches', photos: 'news' };
    function render() {
      $('tm-root').innerHTML = heroHtml()
        + `<div class="dk-wrap" style="padding-top:24px;">${tilesHtml()}</div>
        <div class="dk-bar" id="tm-bar"><div class="dk-wrap"><div class="dk-tabs" role="tablist" aria-label="Team">${TABS.map(([id, lab], i) => `<button type="button" role="tab" id="tab-${id}" data-tab="${id}" aria-selected="${i === 0}" class="${i === 0 ? 'on' : ''}">${lab}${id === 'news' ? '<span class="n" hidden></span>' : ''}</button>`).join('')}</div></div></div>
        <div class="dk-wrap dk-stack">
          <div class="dk-panel on" data-panel="overview" role="tabpanel" aria-labelledby="tab-overview">${overviewHtml()}</div>
          <div class="dk-panel" data-panel="matches" role="tabpanel" aria-labelledby="tab-matches">${matchesHtml()}</div>
          <div class="dk-panel" data-panel="roster" role="tabpanel" aria-labelledby="tab-roster">${rosterHtml()}</div>
          <div class="dk-panel" data-panel="stats" role="tabpanel" aria-labelledby="tab-stats">${statsHtml()}</div>
          <div class="dk-panel" data-panel="news" role="tabpanel" aria-labelledby="tab-news">${newsHtml()}</div>
        </div>`;
      setTop();
      // ?tab=roster, #roster and the old tab names all still land on the right tab.
      let want = _q.get('tab') || (location.hash ? location.hash.slice(1) : '');
      const sub = want === 'photos' ? 'photos' : '';
      want = OLD_TABS[want] || want;
      if (want && TABS.some(t => t[0] === want)) showTab(want, false);
      const first = finals().slice().reverse()[0], wantMatch = _q.get('match');
      if (wantMatch && MY.some(m => m.id === wantMatch)) { showTab('matches', false); openMatch(wantMatch).then(() => { const c = $('m-' + wantMatch); if (c) c.scrollIntoView({ block: 'start' }); }); }
      if (first) openMatch(first.id);
      if (sub) setTimeout(() => { const el = $('photos'); if (el) el.scrollIntoView({ block: 'start' }); }, 400);
    }
    function showTab(id, scroll) {
      document.querySelectorAll('#tm-bar [data-tab]').forEach(b => { const on = b.dataset.tab === id; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
      document.querySelectorAll('.dk-panel').forEach(p => p.classList.toggle('on', p.dataset.panel === id));
      const u = new URL(location.href); if (id === 'overview') u.searchParams.delete('tab'); else u.searchParams.set('tab', id); u.searchParams.delete('match'); u.hash = '';
      history.replaceState({}, '', u.pathname + u.search);
      if (scroll !== false) { const bar = $('tm-bar'), top = bar.getBoundingClientRect().top + window.pageYOffset - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dk-top'), 10) || 65); if (window.pageYOffset > top) window.scrollTo({ top, behavior: 'auto' }); }
    }
    // The tab bar sits under the fixed nav, whatever its height is today.
    function setTop() { let h = 0; ['.ds-nav', '.ds-pastbar'].forEach(s => { const n = document.querySelector(s); if (!n) return; const r = n.getBoundingClientRect(); if (r.height > 0 && r.bottom > h && r.top <= 0) h = r.bottom; }); document.documentElement.style.setProperty('--dk-top', Math.max(0, Math.round(h)) + 'px'); }
    window.addEventListener('resize', setTop); setTimeout(setTop, 300); setTimeout(setTop, 1500);

    document.addEventListener('click', e => {
      const tab = e.target.closest('#tm-root [data-tab]'); if (tab) { showTab(tab.dataset.tab); return; }
      const om = e.target.closest('[data-open-match]'); if (om) { showTab('matches'); openMatch(om.dataset.openMatch).then(() => { const c = $('m-' + om.dataset.openMatch); if (c) { const y = c.getBoundingClientRect().top + window.pageYOffset - ((parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dk-top'), 10) || 65) + 64); window.scrollTo({ top: y, behavior: 'auto' }); } }); return; }
      const tg = e.target.closest('[data-toggle-match]'); if (tg) { openMatch(tg.dataset.toggleMatch, true); return; }
      const mf = e.target.closest('#tm-mseg [data-mf]'); if (mf) { document.querySelectorAll('#tm-mseg button').forEach(b => { const on = b === mf; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
        document.querySelectorAll('[data-mgroup]').forEach(g => { g.hidden = mf.dataset.mf !== 'all' && g.dataset.mgroup !== mf.dataset.mf; }); return; }
      const rf = e.target.closest('#tm-rseg [data-rf]'); if (rf) { document.querySelectorAll('#tm-rseg button').forEach(b => { const on = b === rf; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); filterRoster(); return; }
      const so = e.target.closest('#tm-stats [data-sort]'); if (so) { statSort = so.dataset.sort; $('tm-stats').innerHTML = statsTable(); return; }
    });
    document.addEventListener('input', e => { if (e.target && e.target.id === 'tm-rfind') filterRoster(); });
    function filterRoster() {
      const on = document.querySelector('#tm-rseg button.on'), g = on ? on.dataset.rf : '';
      const q = (($('tm-rfind') || {}).value || '').trim().toLowerCase();
      document.querySelectorAll('#tm-roster .tm-pl').forEach(c => { c.hidden = (g && c.dataset.g !== g) || (q && c.dataset.n.indexOf(q) < 0); });
    }

    // Lightbox with prev/next (arrows + swipe) across all of the team's photos.
    (function () {
      const lb = document.createElement('div');
      lb.id = 'tp-lightbox'; lb.setAttribute('aria-hidden', 'true');
      lb.innerHTML = '<button class="x" type="button" aria-label="Close">&times;</button><button class="nav prev" type="button" aria-label="Previous">‹</button><img src="" alt=""><button class="nav next" type="button" aria-label="Next">›</button><div class="cap"></div>'
        + '<div class="acts"><a class="pri dl" href="#" download>Download</a><button class="dlall" type="button">Download all</button><button class="share" type="button">Share</button></div>';
      document.body.appendChild(lb);
      const img = lb.querySelector('img'), cap = lb.querySelector('.cap');
      let at = -1, x0 = null;
      const slugify = t => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      const teamName = () => (team && team.name) || 'team';
      const dlUrl = (p, i) => FN + 'drop-photo-serve?id=' + encodeURIComponent(p.id) + '&dl=1&name=' + encodeURIComponent('dink-society-' + slugify(teamName()) + '-' + slugify(p.edition || p.label) + '-' + String(i + 1).padStart(2, '0'));
      const show = i => {
        if (!PHOTOS.length) return;
        at = (i + PHOTOS.length) % PHOTOS.length; const p = PHOTOS[at];
        img.src = photoSrc(p.id);
        cap.textContent = [p.caption, p.credit, p.kicker || p.label, `${at + 1} / ${PHOTOS.length}`].filter(Boolean).join(' · ');
        lb.querySelector('.dl').href = dlUrl(p, at);
        lb.querySelector('.dlall').textContent = `Download all ${PHOTOS.length}`;
        lb.querySelector('.dlall').style.display = PHOTOS.length > 1 ? '' : 'none';
        lb.classList.add('on'); lb.setAttribute('aria-hidden', 'false');
      };
      const close = () => { lb.classList.remove('on'); lb.setAttribute('aria-hidden', 'true'); img.src = ''; at = -1; };
      document.addEventListener('click', e => {
        const c = e.target.closest('[data-ph]'); if (c) { show(+c.dataset.ph); return; }
        if (!lb.classList.contains('on')) return;
        if (e.target.closest('#tp-lightbox .prev')) return show(at - 1);
        if (e.target.closest('#tp-lightbox .next')) return show(at + 1);
        if (e.target.closest('#tp-lightbox .dlall')) {
          // Staggered — browsers block a burst of simultaneous downloads.
          PHOTOS.forEach((p, i) => setTimeout(() => { const a = document.createElement('a'); a.href = dlUrl(p, i); a.download = ''; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove(); }, i * 450));
          return;
        }
        if (e.target.closest('#tp-lightbox .share')) {
          const p = PHOTOS[at]; const url = location.origin + (p && p.href ? p.href : location.pathname + location.search);
          if (navigator.share) { navigator.share({ title: teamName() + ' · The Drop', url }).catch(() => {}); return; }
          if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => { cap.textContent = 'Link copied'; });
          return;
        }
        if (e.target === lb || e.target.closest('#tp-lightbox .x')) close();
      });
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('on')) return;
        if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(at - 1); else if (e.key === 'ArrowRight') show(at + 1);
      });
      lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1)); });
    })();

    (window.dsSeason ? window.dsSeason() : Promise.resolve(null)).then(function (S) {
      if (S) { SEASON = S; SEASON_ID = S.id; CIRCUIT = S.circuit; LINK_SUFFIX = S.suffix || ''; }
    }).catch(() => {}).then(load);
  })();
  </script>
</body>
