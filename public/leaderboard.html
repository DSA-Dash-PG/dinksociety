    return '<span class="rk-mv ' + (r.rankDelta > 0 ? 'up' : 'down') + '">' + (r.rankDelta > 0 ? '▲' : '▼') + Math.abs(r.rankDelta) + '</span>';
  };
  const LD_SORT = {
    w:    { lbl: 'Wins', val: r => r.w,            key: r => [r.w, r.diff, r.dr ?? -1] },
    diff: { lbl: 'Diff', val: r => ldSg(r.diff),   key: r => [r.diff, r.w, r.dr ?? -1] },
    dr:   { lbl: 'DR',   val: r => r.dr ?? '—',    key: r => [r.dr ?? -1, r.w, r.diff] },
    xp:   { lbl: 'XP',   val: r => r.xp ?? 0,      key: r => [r.xp ?? 0, r.w, r.diff] },
  };
  function ladderRows() {
    const d = ladderCur(); if (!d) return [];
    const src = state.ladderDiv === 'all' ? (d.leaderboard || []) : ((d.divisions || {})[state.ladderDiv] || []);
    let rows = src.filter(r => (r.nights || 0) >= LD_MIN_LADDERS);
    const q = state.ladderQ.trim().toLowerCase();
    if (q) rows = rows.filter(r => String(r.name || '').toLowerCase().includes(q));
    const k = LD_SORT[state.ladderSort].key;
    return rows.slice().sort((a, b) => { const A = k(a), B = k(b); for (let i = 0; i < A.length; i++) if (B[i] !== A[i]) return B[i] - A[i]; return 0; });
  }
  function renderLadderMonths() {
    const el = $('ld-months'); if (!el) return;
    const periods = (state.ladderBy.all && state.ladderBy.all.periods) || [];
    const chips = periods.map(p => '<button type="button" data-lmonth="' + esc(p.key) + '" class="' + (p.key === state.ladderPeriod ? 'on' : '') + (p.live ? ' live' : '') + '" aria-pressed="' + (p.key === state.ladderPeriod) + '">' +
      esc(p.short) + (p.key.slice(0, 4) !== String(new Date().getFullYear()) ? ' ’' + p.key.slice(2, 4) : '') + '<i>' + (p.live ? 'Live' : p.ladders) + '</i></button>');
    chips.push('<button type="button" data-lmonth="all" class="' + (state.ladderPeriod === 'all' ? 'on' : '') + '" aria-pressed="' + (state.ladderPeriod === 'all') + '">All-time<i>' + ((state.ladderBy.all && state.ladderBy.all.nights) || periods.reduce((n, p) => n + p.ladders, 0)) + '</i></button>');
    el.innerHTML = chips.join('');
    document.querySelectorAll('#ld-sortseg button').forEach(b => { const on = b.dataset.lsort === state.ladderSort; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    document.querySelectorAll('#ld-divseg button').forEach(b => { const on = b.dataset.ldiv === state.ladderDiv; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const ss = $('ld-sortsel'), ds = $('ld-divsel');
    if (ss) ss.value = state.ladderSort; if (ds) ds.value = state.ladderDiv;
  }
  // Hero: the month's story in the title, like Rankings does for the season.
  function renderLadderHero() {
    const title = $('lb-title'), lede = $('lb-lede');
    if (!title || state.section !== 'ladder') return;
    const d = ladderCur(), meta = ladderPeriodMeta();
    const isAll = state.ladderPeriod === 'all';
    $('lb-thru').textContent = isAll ? 'All ladders' : meta ? (meta.live ? 'This month' : 'Final') : '';
    if (!d) { title.textContent = 'Ladder'; lede.hidden = true; return; }
    const all = (d.leaderboard || []).filter(r => (r.nights || 0) >= LD_MIN_LADDERS);
    const one = all[0], two = all[1];
    if (!one) {
      title.textContent = isAll ? 'Ladder' : esc(meta ? meta.label : 'Ladder');
      lede.textContent = isAll ? 'Rankings appear after the first ladder is scored.' : 'No scored ladders yet this month.';
      lede.hidden = false; return;
    }
    const live = !!(meta && meta.live);
    const label = meta ? meta.label.split(' ')[0] : '';
    const nm = esc(firstName(one.name));
    title.innerHTML = isAll ? nm + ' leads the <span class="lime">all-time ladder.</span>'
      : live ? nm + ' holds the <span class="lime">' + esc(label) + ' ladder.</span>'
      : nm + ' took <span class="lime">' + esc(label) + '.</span>';
    const gap = two ? one.w - two.w : 0;
    const nights = meta ? meta.ladders : (d.nights || 0);
    lede.innerHTML = '<b>' + esc(one.name) + '</b> ' + (live ? 'is' : isAll ? 'has' : 'finished') + ' ' +
      (isAll ? plural(one.w, 'win') + ' over ' + plural(one.nights || 0, 'ladder') : one.w + '–' + one.l + ' with a ' + ldSg(one.diff) + ' differential over ' + plural(one.nights || 0, 'ladder')) +
      (two ? ', ' + (gap <= 0 ? 'level on wins with ' + esc(two.name) + ' and ahead on point differential' : plural(gap, 'win') + ' clear of ' + esc(two.name)) : '') + '. ' +
      plural(all.length, 'player') + (live ? ' have played' : ' played') + ' ' + (isAll ? 'the ladder so far.' : 'in ' + plural(nights, 'ladder') + (live ? ' so far this month.' : ' that month.'));
    lede.hidden = false;
  }
  function renderLadder() {
    const el = $('ladder-content'), tiles = $('ld-tiles'); if (!el) return;
    const d = ladderCur(), meta = ladderPeriodMeta(), base = state.ladderBy.all || {};
    renderLadderHero();
    if (!d) { el.innerHTML = '<div class="dk-empty">Loading…</div>'; tiles.hidden = true; return; }
    const isAll = state.ladderPeriod === 'all', live = !!(meta && meta.live);
    const monthWord = isAll ? 'all-time' : (meta ? meta.label.split(' ')[0] : 'month');
    const full = (d.leaderboard || []).filter(r => (r.nights || 0) >= LD_MIN_LADDERS);
    if (!full.length) {
      tiles.hidden = true; tiles.innerHTML = '';
      el.innerHTML = '<div class="dk-card dk-empty"><div style="font-size:28px;margin-bottom:6px;">🪜</div>' +
        '<div style="font-weight:800;margin-bottom:4px;">' + (isAll ? 'No ladder results yet' : 'No ladders scored in ' + esc(monthWord) + ' yet') + '</div>' +
        '<div style="font-size:13px;color:var(--color-text-muted);">The board fills in after the first ladder is scored.</div>' +
        '<a class="ladder-cta-btn" href="/ladders">See upcoming ladders →</a></div>';
      return;
    }
    // Tiles: always the whole board, not the filter.
    const bestDiff = full.slice().sort((a, b) => b.diff - a.diff)[0];
    const withPct = full.filter(r => r.w + r.l >= 6);
    const bestPct = (withPct.length ? withPct : full).slice().sort((a, b) => (b.w / (b.w + b.l)) - (a.w / (a.w + a.l)) || b.w - a.w)[0];
    const mostN = full.slice().sort((a, b) => (b.nights || 0) - (a.nights || 0) || b.w - a.w)[0];
    const pct = r => Math.round(100 * r.w / (r.w + r.l));
    const tile = (cls, k, v, r, sub) => '<div class="dk-tile ' + cls + '"><small>' + k + '</small>' + (v !== null ? '<b>' + v + '</b>' : '') +
      (r ? '<a class="nm" href="' + esc(ldHref(r)) + '">' + esc(shortName(r.name)) + '</a>' : '') + (sub ? '<span>' + sub + '</span>' : '') + '</div>';
    const one = full[0];
    tiles.innerHTML =
      tile('hot', isAll ? 'Number one' : live ? 'Leading ' + esc(monthWord) : esc(monthWord) + ' champion', one.w, one, one.w + '–' + one.l + ' · ' + ldSg(one.diff) + (one.dr != null ? ' · DR ' + one.dr : '')) +
      tile('', 'Best point diff', ldSg(bestDiff.diff), bestDiff, bestDiff.w + '–' + bestDiff.l) +
      tile('', 'Best win rate', pct(bestPct) + '<em>%</em>', bestPct, bestPct.w + '–' + bestPct.l + (withPct.length ? '' : '')) +
      (isAll ? tile('', 'Most ladders', mostN.nights || 0, mostN, mostN.w + '–' + mostN.l)
             : tile('', 'Ladders this month', (meta ? meta.ladders : d.nights || 0), null, plural(full.length, 'player') + ' took part'));
    tiles.hidden = false;

    const rows = ladderRows();
    const S = LD_SORT[state.ladderSort];
    const limit = state.ladderAll ? rows.length : 15;
    const K = ['#1', '#2', '#3'];
    const nightsTxt = r => plural(r.nights || 0, 'ladder') + (isAll ? '' : ' this month');
    const top = rows.slice(0, 3).map((r, i) =>
      '<a class="dk-pc' + (i === 0 ? ' first' : '') + '" href="' + esc(ldHref(r)) + '">' +
        '<div class="dk-pc__pic">' + (LD_AV[r.id] ? '<img src="' + esc(LD_AV[r.id]) + '" alt="">' : esc(ldIni(r.name))) + '</div>' +
        '<div class="dk-pc__b"><div class="dk-pc__k">' + K[i] + ldMv(r) + '</div>' +
          '<div class="dk-pc__n">' + esc(r.name) + '</div>' +
          '<div class="dk-pc__v"><b>' + S.val(r) + '</b><span>' + S.lbl.toLowerCase() + '</span></div>' +
          '<div class="dk-pc__s"><span><b>' + r.w + '–' + r.l + '</b></span><span class="' + (r.diff > 0 ? 'hot' : '') + '">' + ldSg(r.diff) + '</span>' +
            (r.dr != null ? '<span>DR <b>' + r.dr + '</b></span>' : '') + '<span>' + nightsTxt(r) + '</span></div>' +
        '</div></a>').join('');
    const body = rows.slice(3, limit).map((r, i) =>
      '<div class="dk-row rk-row" style="cursor:default;">' +
        '<div class="who"><span class="rk-pos"><b>' + (i + 4) + '</b>' + ldMv(r) + '</span>' + ldAv(r, 'dk-av') +
          '<div><a class="nm" href="' + esc(ldHref(r)) + '">' + esc(r.name) + '</a><span class="sm">' + nightsTxt(r) + ladderChip(r) + '</span></div>' +
          '<span class="rk-big"><b>' + S.val(r) + '</b><small>' + S.lbl + '</small></span></div>' +
        '<div class="rk-stats"><div class="dk-cells" style="--n:5">' +
          '<div><small>W–L</small><b class="main">' + r.w + '–' + r.l + '</b></div>' +
          '<div><small>Diff</small><b class="' + (r.diff > 0 ? 'pos' : r.diff < 0 ? 'neg' : '') + '">' + ldSg(r.diff) + '</b></div>' +
          '<div><small>Win %</small><b>' + pct(r) + '%</b></div>' +
          '<div><small>DR</small><b>' + (r.dr != null ? r.dr : '—') + '</b></div>' +
          '<div><small>XP</small><b>' + (r.xp ?? 0) + '</b></div>' +
        '</div></div>' +
      '</div>').join('');

    // Side: the month's ladders (or the latest four), month by month, race, how it ranks.
    const evs = (d.recentWinners || []).map(ev => {
      const dt = new Date(String(ev.date || '').slice(0, 10) + 'T12:00:00');
      const day = isNaN(dt) ? '' : dt.getDate(), mon = isNaN(dt) ? '' : dt.toLocaleDateString('en-US', { month: 'short' });
      const w = (ev.winners || [])[0];
      const wn = w ? (w.pair && w.names ? w.names.map(firstName).join(' & ') : firstName(w.name)) : '';
      const type = ev.type === 'mens' ? "Men's" : ev.type === 'womens' ? "Women's" : 'Mixed';
      return '<a class="ld-ev" href="/ladder-result?event=' + encodeURIComponent(ev.eventId) + '"><div class="d"><b>' + day + '</b><small>' + mon + '</small></div>' +
        '<div class="n"><b>' + esc(ev.eventName || 'Ladder') + '</b><span>' + type + (ev.format === 'fixed-partner' ? ' · Fixed Partner' : '') + (ev.players ? ' · ' + plural(ev.players, 'player') : '') + (ev.place ? ' · ' + esc(ev.place) : '') + '</span></div>' +
        (wn ? '<div class="w">🥇 ' + esc(wn) + '</div>' : '') + '</a>';
    }).join('');
    const champs = (base.champions || []).map(c => !c.champion ? '' :
      '<button type="button" class="ld-champ' + (c.period === state.ladderPeriod ? ' on' : '') + '" data-lmonth="' + esc(c.period) + '"><span class="m">' + esc(c.label.split(' ')[0].slice(0, 3)) + ' ’' + esc(c.period.slice(2, 4)) + (c.live ? ' <span class="ld-chip">live</span>' : '') + '</span>' +
      '<span class="n">' + esc(c.champion.name) + '<small>' + c.champion.w + '–' + c.champion.l + ' · ' + ldSg(c.champion.diff) + ' · ' + plural(c.ladders, 'ladder') + '</small></span><span class="v">' + c.champion.w + '</span></button>').join('');
    const mx = Math.max(1, ...full.slice(0, 6).map(r => r.w));
    const race = full.slice(0, 6).map(r => '<div class="ld-prog"><span>' + esc(firstName(r.name)) + '</span><span class="dk-track"><i style="width:' + Math.round(100 * r.w / mx) + '%"></i></span><b>' + r.w + '</b></div>').join('');

    el.innerHTML =
      '<div class="dk-cols rk-cols"><div class="wide">' +
        '<div class="rk-listhead"><h2 class="dk-h2 dk-h2--lg">The ' + esc(monthWord) + ' <span class="lime">board.</span></h2>' +
          '<span class="dk-sub">' + plural(meta ? meta.ladders : d.nights || 0, 'ladder') + ' · ' + plural(full.length, 'player') + ' · ranked by wins, then point diff, then DR</span></div>' +
        (rows.length ? '<div class="rk-top">' + top + '</div>' : '<div class="dk-card dk-empty">No one matches.</div>') +
        (rows.length > 3 ? '<div class="dk-card"><div class="dk-rows">' + body + '</div></div>' : '') +
        (rows.length > 15 ? '<div class="rk-foot"><span>Showing ' + Math.min(rows.length, limit) + ' of ' + rows.length + '</span><button type="button" class="dk-more" id="ld-showall">' + (state.ladderAll ? 'Show fewer' : 'Show all ' + rows.length) + '</button></div>' : '') +
        '<p class="dk-note">Every ladder is doubles. ' + (isAll ? 'Dink Rating and XP are career totals across every ladder.' : 'Wins and point differential count this month only; Dink Rating and XP are career-wide, so DR is the tiebreak.') + ' Ladders are open to everyone — no team required.</p>' +
      '</div><aside class="side rk-side">' +
        '<div class="dk-card dk-card--pad"><div class="dk-head"><h2 class="dk-h2">' + (isAll ? 'Latest ladders' : esc(monthWord) + ' ladders') + '</h2><a class="dk-more" href="/ladders">Join the next one →</a></div>' + (evs || '<div class="dk-sub">Nothing scored yet.</div>') + '</div>' +
        (champs ? '<div class="dk-card dk-card--pad"><div class="dk-head"><h2 class="dk-h2">Month by month</h2><span>Who held #1</span></div><div>' + champs + '</div><div class="dk-note">Each month is its own ladder board. All-time keeps the running totals.</div></div>' : '') +
        '<div class="dk-card dk-card--pad"><div class="dk-head"><h2 class="dk-h2">Race for #1</h2><span>Wins' + (isAll ? '' : ' this month') + '</span></div>' + race + '</div>' +
        '<div class="dk-card dk-card--pad ld-how"><h2 class="dk-h2">How the ladder ranks</h2><dl>' +
          '<dt>Wins first</dt><dd>Most games won across the ' + (isAll ? 'season’s' : 'month’s') + ' ladders. Partners rotate every round unless it’s a Fixed Partner ladder.</dd>' +
          '<dt>Then point differential</dt><dd>Points for minus points against' + (isAll ? '' : ', same month') + '.</dd>' +
          '<dt>Then Dink Rating</dt><dd>DR is career-wide and never resets, so it breaks ties rather than ranking the board.</dd>' +
          '<dt>One ladder to rank</dt><dd>Play one ladder in the month and you’re on its board.</dd>' +
        '</dl></div>' +
      '</aside></div>';
    ensureLadderAvatars(rows.slice(0, limit).map(r => r.id));
  }
  function wireLadder() {
    const sw = async (period) => {
      if (!period || period === state.ladderPeriod) return;
      state.ladderPeriod = period; state.ladderAll = false;
      writeUrl(); renderLadderMonths(); renderLadder();
      if (!state.ladderBy[period]) { await fetchLadder(period); renderLadder(); }
      const chip = document.querySelector('#ld-months [data-lmonth="' + period + '"]');
      if (chip && chip.scrollIntoView) chip.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    };
    $('ld-months').addEventListener('click', e => { const b = e.target.closest('[data-lmonth]'); if (b) sw(b.dataset.lmonth); });
    $('ladder-content').addEventListener('click', e => {
      const c = e.target.closest('[data-lmonth]'); if (c) { sw(c.dataset.lmonth); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (e.target.closest('#ld-showall')) { state.ladderAll = !state.ladderAll; renderLadder(); }
    });
    $('ld-sortseg').addEventListener('click', e => { const b = e.target.closest('[data-lsort]'); if (!b) return; state.ladderSort = b.dataset.lsort; renderLadderMonths(); renderLadder(); });
    $('ld-sortsel').addEventListener('change', e => { state.ladderSort = e.target.value; renderLadderMonths(); renderLadder(); });
    $('ld-divseg').addEventListener('click', e => { const b = e.target.closest('[data-ldiv]'); if (!b) return; state.ladderDiv = b.dataset.ldiv; renderLadderMonths(); renderLadder(); });
    $('ld-divsel').addEventListener('change', e => { state.ladderDiv = e.target.value; renderLadderMonths(); renderLadder(); });
    let t = null;
    $('ld-find').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.ladderQ = e.target.value; renderLadder(); }, 120); });
  }
  wireLadder();

  // ── ANALYTICS ────────────────────────────────────────────────────
  // ── The NVZ iframe (lazy, auto-sized via postMessage) ────────────
  function loadNvzFrame() {
    const f = $('nvz-frame'); if (!f) return;
    const season = 'circuit-' + String(state.circuit || 'I').toLowerCase();
    if (f.dataset.season === season) return;   // already showing this season
    f.dataset.season = season;
    f.src = '/the-nvz.html?embed=1&season=' + encodeURIComponent(season);
  }
  // Player Matchup / Team Matchup tabs: the same page, limited to those two views.
  // Both tabs share one frame; tell it which of the two to show.
  function loadCmpFrame(tab) {
    const f = $('cmp-frame'); if (!f) return;
    const season = 'circuit-' + String(state.circuit || 'I').toLowerCase();
    f.dataset.tab = tab;
    if (f.dataset.season === season) { try { f.contentWindow.postMessage({ nvzShow: tab }, location.origin); } catch {} return; }
    f.dataset.season = season;
    f.src = '/the-nvz.html?embed=1&set=versus&tab=' + encodeURIComponent(tab) + '&season=' + encodeURIComponent(season);
  }
  window.addEventListener('message', e => {
    const h = e.data && e.data.nvzHeight;
    if (typeof h !== 'number' || h <= 0) return;
    // Two frames report their height; size whichever one sent this.
    const f = [$('nvz-frame'), $('cmp-frame')].find(x => x && x.contentWindow === e.source) || $('nvz-frame');
    if (!f) return;
    f.style.height = (h + 8) + 'px';
    // If a sub-toggle click landed before the frame was ready, it missed the message: resend.
    if (f.id === 'cmp-frame' && e.data.nvzTab && f.dataset.tab && e.data.nvzTab !== f.dataset.tab) {
      try { f.contentWindow.postMessage({ nvzShow: f.dataset.tab }, location.origin); } catch {}
    }
  });

  // ── Section activation ───────────────────────────────────────────
  // Set once dsSeason() has settled which season is current. Until then no
  // data is fetched — readUrl() → activate() used to kick off a Season 1 load
  // before the current season resolved to Season 2.
  let SEASON_READY = false;
  function ensureDataThenRender() {
    if (!SEASON_READY) return;
    if (!state.playerStats && !state._loading) {
      state._loading = true;
      Promise.all([loadPlayerStats(), loadStandings(), loadPotw()]).then(() => {
        state._loading = false; renderHero(); renderAll();
      });
    } else if (state.playerStats) {
      renderHero(); renderAll();
    }
  }
  function activate(section, skipWrite) {
    state.section = section;
    const top = SECTION_TOP[section] || 'rankings';
    if (top === 'rankings' || top === 'awards') state.lastSub[top] = section;
    document.querySelectorAll('.lb-tab').forEach(b => b.classList.toggle('is-active', b.dataset.top === top));
    document.querySelectorAll('.lb-subseg').forEach(s => s.classList.toggle('is-active', s.dataset.subfor === top));
    document.querySelectorAll('.lb-sub').forEach(b => { const on = b.dataset.section === section; b.classList.toggle('is-active', on); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    document.querySelectorAll('.lb-section').forEach(s => s.classList.toggle('is-active', s.dataset.section === section || (section === 'leaders' && s.dataset.section === 'rankings') || ((top === 'pvp' || top === 'tvt') && s.dataset.section === 'compare')));
    if (!skipWrite) writeUrl();
    renderHero(); setTop();
    if (top === 'pvp' || top === 'tvt') { loadCmpFrame(section); return; }
    if (section === 'nvz') { loadNvzFrame(); return; }
    if (section === 'ladder') { loadLadderTab(); return; }
    ensureDataThenRender();
  }

  function renderAll() {
    renderRankings();
    renderTopChefs();
    renderStreaks();
  }

  // ── Utilities ────────────────────────────────────────────────────
  function esc(s) {
    return String(s??'').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})
           + ' ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }

  // ── Boot ─────────────────────────────────────────────────────────
  document.querySelectorAll('.lb-tab').forEach(b => b.addEventListener('click', () => {
    const top = b.dataset.top;
    activate((top === 'nvz' || top === 'ladder') ? top : (state.lastSub[top] || TOP_DEFAULT[top]));
  }));
  wireRankings();   // also handles the Players / By team and Awards switches
  // The bar sits under the fixed nav, whatever its height is today.
  function setTop() { let h = 0; ['.ds-nav', '.ds-pastbar'].forEach(s => { const n = document.querySelector(s); if (!n) return; const r = n.getBoundingClientRect(); if (r.height > 0 && r.bottom > h && r.top <= 0) h = r.bottom; }); if (h) document.documentElement.style.setProperty('--dk-top', Math.max(0, Math.round(h)) + 'px'); const tb = $('lb-bar'); if (tb && tb.offsetHeight) document.documentElement.style.setProperty('--lb-tabsh', tb.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop); setTimeout(setTop, 300); setTimeout(setTop, 1500);
  $('circuit-select').addEventListener('change', e => {
    state.circuit = e.target.value;
    state.playerStats = state.standings = state.potw = null;
    writeUrl(); activate(state.section, true);
  });
  $('division-select').addEventListener('change', e => {
    state.division = e.target.value;
    writeUrl(); renderAll();
  });

  // 'season-2' / 'circuit-ii' / '2' → 'II'. Season ids come in several shapes.
  function codeFromSeasonId(id) {
    const t = String(id || '').trim().replace(/^(circuit|season)-/i, '');
    const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
    if (/^\d+$/.test(t)) return ROMAN[parseInt(t, 10)] || t;
    return t.toUpperCase();
  }

  // The season id that goes with a code — the standings API takes the id form.
  function seasonIdOf(code) {
    const c = String(code || 'I').toUpperCase();
    const hit = (SEASONS_LOADED || []).find(s => String(s.circuit || '').toUpperCase() === c);
    return (hit && hit.id) || 'circuit-' + c.toLowerCase();
  }
  let SEASONS_LOADED = [];

  readUrl();
  // Settle the season first: with no ?circuit= in the URL the page follows the
  // CURRENT season, which flips a week before its start date.
  (window.dsSeason ? window.dsSeason() : Promise.resolve(null)).then(function (S) {
    if (S) {
      SEASONS_LOADED = S.all || [];
      CURRENT_CODE = (S.current && String(S.current.circuit || '').toUpperCase()) || S.circuit || 'I';
      // Follow the resolved season unless the URL pinned one.
      if (!PINNED_IN_URL) { state.circuit = S.circuit; }
      $('circuit-select').value = state.circuit;
    }
  }).catch(() => {}).then(() => {
    SEASON_READY = true;
    loadSeasonOptions();
    return Promise.all([loadPlayerStats(), loadStandings(), loadPotw()]).then(() => {
      renderHero(); renderAll();
    });
  });

  // ── Season dropdown ──────────────────────────────────────────────
  // Built from the real season list so a new season (Season 2, …) shows up the
  // moment it exists in Admin → Seasons. public-seasons already filters out
  // test and archived seasons, so the TEST season never reaches the public page
  // — it stays reachable only via an explicit ?circuit=TEST link from admin.
  // Mirrors circuitCode() in netlify/functions/lib/circuit.js. Standings and
  // player stats are keyed by the CODE ("I"), while a season blob's id and name
  // vary ("circuit-i", "circuit-1", "season-1", "Season 1"), so both are tried:
  // whichever resolves to a real code wins. Getting this wrong showed the season
  // twice — once under a code with no data, once as the fallback that had it.
  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
  function codeFromToken(raw) {
    const t = String(raw || '').trim();
    if (!t) return null;
    if (/^(TEST|[IVX]+)$/i.test(t)) return t.toUpperCase();
    const tail = t.replace(/^circuit-/i, '').replace(/^season-/i, '').trim();
    if (/^\d+$/.test(tail)) { const n = parseInt(tail, 10); return (n >= 1 && n <= 10) ? ROMAN[n - 1] : String(n); }
    if (/^(TEST|[IVX]+)$/i.test(tail)) return tail.toUpperCase();
    const m = t.match(/season\s*(\d+)/i);
    if (m) { const n = parseInt(m[1], 10); return (n >= 1 && n <= 10) ? ROMAN[n - 1] : String(n); }
    return tail ? tail.toUpperCase() : null;
  }
  const isCanonical = c => !!c && (c === 'TEST' || ROMAN.includes(c));
  function seasonCodeOf(season) {
    // The API resolves this server-side now; the local derivation is the
    // fallback for a cached response from before that shipped.
    if (isCanonical(season.circuit)) return String(season.circuit).toUpperCase();
    const fromId = codeFromToken(season.id);
    if (isCanonical(fromId)) return fromId;
    const fromName = codeFromToken(season.name || season.label);
    if (isCanonical(fromName)) return fromName;
    return fromId || fromName || 'I';
  }

  async function loadSeasonOptions() {
    const sel = $('circuit-select');
    if (!sel) return;
    try {
      const r = await fetch('/.netlify/functions/public-seasons');
      const data = await r.json();
      const seasons = (data.seasons || []).filter(s => s && s.id);
      if (!seasons.length) return; // keep the placeholder
      // Two blobs can resolve to the same season (a legacy id alongside a newer
      // one); show it once, keeping the entry with a real name.
      const byCode = new Map();
      for (const s of seasons) {
        const code = seasonCodeOf(s);
        const label = s.name || s.label || 'Season';
        const prev = byCode.get(code);
        if (!prev || (prev.label === 'Season' && label !== 'Season')) byCode.set(code, { code, label });
      }
      // Season order — Season 1 at the top; anything unrecognised sinks below.
      const rank = c => { const i = ROMAN.indexOf(c); return i < 0 ? 999 : i; };
      const opts = [...byCode.values()].sort((a, b) => rank(a.code) - rank(b.code));
      // Never lose the season the URL asked for (e.g. an admin ?circuit=TEST link).
      if (!opts.some(o => o.code === state.circuit)) {
        opts.push({ code: state.circuit, label: state.circuit === 'TEST' ? '🧪 TEST Season' : 'Season ' + state.circuit });
      }
      sel.innerHTML = opts.map(o =>
        '<option value="' + esc(o.code) + '">' + esc(o.label) + '</option>'
      ).join('');
      sel.value = state.circuit;
      // Nothing to switch between → hide the control entirely.
      sel.style.display = opts.length > 1 ? '' : 'none';
    } catch { /* placeholder stays */ }
  }
  </script>
  <script src="/js/partials.js"></script>
</body>
