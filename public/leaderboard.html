<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Leaderboard · The Dink Society</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="stylesheet" href="/css/shared.css" />
  <script>(function(){var t=localStorage.getItem("ds-theme");if(t==="light"){document.documentElement.setAttribute("data-theme","light")}else{document.documentElement.setAttribute("data-theme","dark")}})()</script>
  <link rel="stylesheet" href="/css/shared-nav.css" />
  <!-- Resolves which season this page shows (?season= / ?circuit=, else the
       current one, which flips a week before its start date). -->
  <script src="/js/season.js"></script>
  <script src="/js/short-name.js"></script>
  <link rel="stylesheet" href="/css/pages.css" />
  <style>
    /* ═══════════════════════════════════════════════════════════════
       LEADERBOARD. Shared pieces live in /css/pages.css (.dk-*).
       Header (headline, lede, four tiles) → sticky bar (tabs, then the
       filters for the open tab) → the tab's content.
       ═══════════════════════════════════════════════════════════════ */
    .lb .dk-hero__in { align-items: flex-end; padding-bottom: 0; }
    .lb-head__txt { flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .lb-controls { flex: 0 1 auto; display: flex; flex-direction: column; }
    .lb-controls select { height: 46px; padding: 0 16px; border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .lb-controls select:focus { outline: 2px solid var(--color-lime); outline-offset: 1px; }
    #lb-tiles { margin-bottom: 16px; }
    .lb .dk-tile a.nm + span { margin-top: 2px; }
    .lb-shell { padding-top: 20px; padding-bottom: 80px; }
    a.ds-link { color: inherit; text-decoration: none; cursor: pointer; }
    a.ds-link:hover { color: var(--color-lime); text-decoration: underline; }

    /* ── Sticky bar: six tabs, then the open tab's controls ── */
    .lb-tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .lb-tab { display: flex; align-items: center; justify-content: center; height: 50px; padding: 0 6px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--color-text-muted); font: inherit; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; cursor: pointer; white-space: nowrap; }
    .lb-tab:hover { color: var(--color-text); }
    .lb-tab.is-active { color: var(--color-text); border-bottom-color: var(--color-lime); }
    .lb-section { display: none; }
    .lb-section.is-active { display: block; }
    .lb-subseg { display: none; }
    .lb-subseg.is-active { display: flex; }
    .lb-subseg.dk-chips { border-top: 1px solid var(--color-divider); padding: 8px 0; }
    #nvz-frame, #cmp-frame { width: 100%; border: 0; display: block; min-height: 70vh; }

    .rk-stick { position: sticky; top: calc(var(--dk-top, 65px) + var(--lb-tabsh, 51px)); z-index: 25; margin: 0 calc(-1 * var(--gutter)) 20px; padding: 0 var(--gutter); background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
    .rk-stick[hidden] { display: none; }
    .rk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 0; }
    .rk-games { display: flex; gap: 6px; }
    .rk-games button { height: 40px; padding: 0 12px; border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); background: transparent; color: var(--color-text); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .rk-games button:hover { border-color: var(--color-lime); }
    .rk-games button.on { background: var(--color-lime); border-color: var(--color-lime); color: var(--color-text-inverse); font-weight: 800; }
    .rk-games .s { display: none; }
    .rk-find { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 6px; }
    .rk-find .dk-find { height: 42px; font-size: 14px; padding: 0 16px; }
    .rk-sort { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .rk-sort .dk-lbl { margin: 0; white-space: nowrap; }
    .rk-bar .dk-seg { padding: 3px; flex-wrap: nowrap; }
    .rk-bar .dk-seg button { height: 34px; padding: 0 10px; }
    #rk-sortsel, .rk-findbtn, .rk-x { display: none; }
    #rk-sortsel { height: 42px; padding: 0 12px; border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
    .rk-findbtn, .rk-x { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-text); align-items: center; justify-content: center; cursor: pointer; font: inherit; font-size: 20px; line-height: 1; }
    .rk-findbtn svg { width: 18px; height: 18px; }
    .rk-viewrow { display: none; }

    /* ── Rankings: the list ── */
    .rk-cols { align-items: flex-start; }
    .rk-cols > .wide, .rk-cols > .side { gap: 16px; }
    .rk-cols > .side { flex: 1 1 320px; }
    .rk-cols > * > .dk-card { flex: 0 0 auto; }
    .rk-listhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
    .rk-listhead .dk-sub { display: block; margin-top: 4px; }
    .rk-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
    .rk-top .dk-pc__k { display: flex; align-items: center; gap: 8px; }
    .rk-mv { font-size: 11px; font-weight: 800; letter-spacing: 0; font-variant-numeric: tabular-nums; color: var(--color-text-muted); white-space: nowrap; }
    .rk-mv.up { color: var(--color-lime); }
    .rk-mv.down { color: var(--color-red); }
    .rk-row { cursor: pointer; }
    .rk-row .who { flex: 1.3 1 300px; }
    .rk-row .who > div { flex: 1 1 auto; }
    .rk-pos { flex: 0 0 32px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    .rk-pos b { font-size: 16px; line-height: 1.1; font-weight: 900; font-variant-numeric: tabular-nums; }
    .rk-big { flex: 0 0 auto; margin-left: auto; text-align: right; }
    .rk-big b { display: block; font-size: 22px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--color-lime); }
    .rk-big small { display: block; margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-muted); }
    .rk-big.nr b { color: var(--color-text-muted); }
    .rk-stats { flex: 1 1 340px; min-width: 0; display: flex; align-items: center; gap: 8px; }
    .rk-stats .dk-cells { flex: 1 1 auto; }
    .rk-tog { flex: 0 0 36px; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 1px solid var(--color-border); background: transparent; color: var(--color-text-muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .rk-tog:hover { border-color: var(--color-lime); color: var(--color-text); }
    .rk-tog svg { width: 16px; height: 16px; transition: transform .15s; }
    .rk-row.open .rk-tog svg { transform: rotate(180deg); }
    .rk-more { flex: 1 1 100%; min-width: 0; box-sizing: border-box; padding: 14px; border-radius: var(--radius-md); background: var(--color-surface-2); cursor: default; display: flex; flex-direction: column; gap: 14px; }
    .rk-more__cap { font-size: 12px; color: var(--color-text-muted); }
    .rk-more__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px 8px; font-variant-numeric: tabular-nums; }
    .rk-more__grid .dk-cell b { font-size: 16px; font-weight: 800; color: var(--color-text); }
    .rk-more .dk-cell small { white-space: normal; }
    .rk-more__grid .dk-cell em { display: block; font-style: normal; font-size: 12px; color: var(--color-text-muted); }
    .rk-more h3 { margin: 0 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
    .rk-weeks { display: flex; flex-wrap: wrap; gap: 6px; font-variant-numeric: tabular-nums; }
    .rk-weeks span { padding: 5px 10px; border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .rk-weeks span small { font-size: 11px; font-weight: 700; color: var(--color-text-muted); margin-right: 4px; }
    .rk-more__acts { display: flex; flex-wrap: wrap; gap: 8px 20px; }
    .rk-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding: 14px 0 4px; font-size: 13px; color: var(--color-text-muted); }
    .rk-unq__hd { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
    .rk-unq__hd b { display: block; font-size: 15px; font-weight: 800; }
    .rk-unq .dk-rows { padding: 8px 0 0; }
    .rk-team__hd { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 16px 18px 6px; }
    .rk-team__hd a { font-size: 18px; line-height: 1.1; font-weight: 900; font-style: italic; text-transform: uppercase; color: var(--color-text); overflow-wrap: anywhere; }
    .rk-team__hd a:hover { color: var(--color-lime); }
    .rk-team .dk-row { cursor: default; flex-wrap: nowrap; }

    /* ── Rankings: side column ── */
    .rk-side .dk-head { margin-bottom: 4px; }
    .rk-srow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border: 0; border-top: 1px solid var(--color-divider); width: 100%; background: none; color: var(--color-text); font: inherit; text-align: left; min-width: 0; }
    .rk-srow .d { flex: 0 0 46px; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .rk-srow .n { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: var(--color-text); overflow-wrap: anywhere; }
    .rk-srow a.n:hover { color: var(--color-lime); }
    .rk-srow .t { font-size: 13px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rk-srow .k { flex: 0 0 74px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
    .rk-srow .v { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--color-lime); }
    button.rk-srow { cursor: pointer; min-height: 48px; }
    button.rk-srow:hover .n { color: var(--color-lime); }
    .rk-part { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .rk-part > span:first-child { flex: 0 0 92px; font-size: 13px; font-weight: 700; }
    .rk-part .dk-track { flex: 1; }
    .rk-part > b { flex: 0 0 26px; text-align: right; font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .rk-how summary { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--color-lime); cursor: pointer; }
    .rk-how dl { margin: 10px 0 0; }
    .rk-how dt { font-size: 13px; font-weight: 800; margin-top: 10px; }
    .rk-how dd { margin: 2px 0 0; font-size: 13px; line-height: 1.5; color: var(--color-text-muted); }
    .rk-how p { margin: 12px 0 0; font-size: 12px; line-height: 1.5; color: var(--color-text-muted); max-width: none; }

    /* ── Season MVPs (shown on the season they were won in) ── */
    .lb-mvp { margin-bottom: 24px; }
    .lb-mvp__hd { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 10px; }
    .lb-mvp__hd b { font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--color-gold); }
    .lb-mvp__hd span { font-size: 12px; color: var(--color-text-muted); }
    .lb-mvp__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .lb-mvpc { border: 1px solid rgba(240,192,64,.4); border-radius: var(--radius-lg); padding: 16px; background: radial-gradient(120% 90% at 50% 0%, rgba(240,192,64,.12), transparent 62%), var(--color-surface); }
    .lb-mvpc__tag { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #0b0d0a; background: #f0c040; border-radius: 9999px; padding: 4px 10px; }
    .lb-mvpc--f .lb-mvpc__tag { background: #E6E1D5; }
    .lb-mvpc__who { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
    .lb-mvpc__ring { width: 48px; height: 48px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 14px; font-weight: 900; color: #f0f0ec; background: #0b0d0a; border: 2px solid #f0c040; }
    .lb-mvpc__nm { font-size: 18px; font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 1.1; }
    .lb-mvpc__tm { font-size: 12px; color: var(--color-text-muted); font-weight: 700; margin-top: 2px; }
    .lb-mvpc__st { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .lb-mvpc__st div { background: var(--color-surface-2); border-radius: 10px; padding: 8px 2px; text-align: center; }
    .lb-mvpc__st b { display: block; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .lb-mvpc__st span { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-muted); font-weight: 800; }

    @media (max-width: 760px) {
      .lb-tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .lb-tab { height: 40px; font-size: 12px; letter-spacing: .01em; }
      .lb .dk-bar { margin-top: 14px; }
      /* One pinned row: games, rank by, find. Find swaps in over the row. */
      .rk-bar { flex-wrap: nowrap; gap: 6px; padding: 8px 0; }
      .rk-stick { margin-bottom: 16px; }
      .rk-games { flex: 1 1 auto; min-width: 0; gap: 0; padding: 3px; border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); background: var(--color-surface); }
      .rk-games button { flex: 1 1 auto; min-width: 0; height: 34px; padding: 0 6px; border: 0; font-size: 12px; }
      .rk-games .l { display: none; } .rk-games .s { display: inline; }
      .rk-find, .rk-sort .dk-lbl, #rk-sortseg, .rk-view { display: none; }
      #rk-sortsel { display: block; flex: 0 0 auto; max-width: 104px; }
      .rk-findbtn { display: inline-flex; }
      .rk-bar.finding > * { display: none; }
      .rk-bar.finding > .rk-find { display: flex; }
      .rk-bar.finding .rk-x { display: inline-flex; }
      .rk-find .dk-find { font-size: 16px; }
      .rk-viewrow { display: inline-flex; }
      .rk-viewrow button { height: 36px; }
      .rk-more { padding: 12px; }
      .rk-more__grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 340px) { .rk-games button { font-size: 11px; padding: 0 4px; } }

    /* Generic card */
    .lb-card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--space-5); margin-bottom:var(--space-4); }
    .lb-card__title { font-size:14px; font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:0.04em; margin:0 0 4px; }
    .lb-card__sub   { font-size:12px; color:var(--color-text-faint); margin:0 0 var(--space-4); }

    /* Tables still used by the Awards and Ladder tabs */
    .rank-table { width:100%; border-collapse:collapse; font-size:12px; }
    .rank-table th { text-align:left; padding:8px 8px; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-text-faint); font-weight:700; border-bottom:1px solid var(--color-border-strong); white-space:nowrap; }
    .rank-table th.r { text-align:right; }
    .rank-table td { padding:9px 8px; border-bottom:1px solid var(--color-border); vertical-align:middle; }
    .rank-table td.r { text-align:right; font-variant-numeric:tabular-nums; }
    .rank-table tr:last-child td { border-bottom:none; }
    .rank-table tbody tr:hover td { background:var(--color-surface-2); }
    .rank-num { color:var(--color-text-faint); font-weight:800; min-width:24px; display:inline-block; }
    .rank-num--1 { color:#f0c040; }
    .rank-num--2 { color:#c0c8d0; }
    .rank-num--3 { color:#cd7f32; }
    .rank-change { font-size:10px; font-weight:700; min-width:28px; display:inline-block; text-align:center; }
    .rank-change--up   { color:var(--color-lime); }
    .rank-change--down { color:var(--color-red); }
    .rank-change--same { color:var(--color-text-faint); }
    .rank-row--leader td { background:var(--color-lime-ghost); }

    .player-cell { display:flex; align-items:center; gap:10px; }
    .player-avatar {
      width:32px; height:32px; border-radius:50%; background:var(--color-surface-3);
      display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:900; flex-shrink:0; color:var(--color-lime);
      border:1.5px solid var(--color-lime-dim); overflow:hidden;
    }
    .player-avatar--f { color:var(--color-teal); border-color:var(--color-teal-dim); }
    .player-name  { font-weight:800; font-style:italic; text-transform:uppercase; }
    .player-team  { font-size:10px; color:var(--color-text-faint); margin-top:1px; }
    .win-pct      { font-weight:800; color:var(--color-lime); }
    .win-pct--low { color:var(--color-text-muted); }
    .col-opt {}
    @media(max-width:720px){ .col-opt { display:none; } .rank-table { font-size:11px; } }

    /* ── SUPRDUPR PLAYER OF THE WEEK ───────────────────────────────────────────── */
    .kchn-logo { display:inline-flex; align-items:center; background:#000; border:1px solid rgba(255,255,255,0.12); border-radius:7px; padding:5px 11px; }
    .kchn-logo span { font-size:16px; font-weight:900; color:#f0d020; letter-spacing:0.06em; font-style:italic; }
    .kchn-header { display:flex; align-items:center; gap:12px; margin-bottom:var(--space-5); }
    .kchn-title { font-size:14px; font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:0.04em; margin:0; }
    .kchn-sub   { font-size:12px; color:var(--color-text-faint); margin:2px 0 0; }

    /* Weekly podium */
    .week-block { margin-bottom:var(--space-5); }
    .week-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; color:var(--color-text-faint); text-align:center; margin-bottom:var(--space-3); }
    .podium { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:10px; }
    .podium-card {
      background:var(--color-surface-2); border:1px solid var(--color-border);
      border-radius:var(--radius-md); padding:var(--space-4) var(--space-3);
      text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;
    }
    .podium-card--first { background:var(--color-lime-ghost); border-color:var(--color-lime-dim); }
    .podium-avatar {
      width:44px; height:44px; border-radius:50%; background:var(--color-surface-3);
      display:flex; align-items:center; justify-content:center;
      font-size:13px; font-weight:900; border:2px solid var(--color-border-strong);
    }
    .podium-avatar--first { border-color:var(--color-lime); }
    .podium-name  { font-size:13px; font-weight:800; font-style:italic; text-transform:uppercase; }
    .podium-team  { font-size:10px; color:var(--color-text-faint); }
    .podium-score { font-size:18px; font-weight:900; color:var(--color-lime); }
    .podium-meta  { font-size:10px; color:var(--color-text-faint); }
    .podium-place { font-size:9px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-text-faint); }
    .podium-place--1 { color:var(--color-lime); }

    /* Player of the Week — collapsible weekly winners */
    .chef-week-head { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; margin-bottom:var(--space-3); }
    .chef-week-caret { color:var(--color-text-faint); font-size:11px; display:inline-block; transition:transform .15s; }
    .chef-week-label { color:var(--color-text-faint); font-size:11px; letter-spacing:0.1em; font-weight:700; text-transform:uppercase; }
    .pow-cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .pow-col-label { font-size:10px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px; }
    .pow-winner { border:1px solid var(--color-border); border-radius:var(--radius-md); padding:14px; display:flex; flex-direction:column; gap:8px; }
    .pow-winner__top { display:flex; align-items:center; gap:10px; }
    .pow-winner__name { font-size:14px; font-weight:800; font-style:italic; text-transform:uppercase; }
    .pow-winner__stats { display:flex; align-items:baseline; justify-content:space-between; }
    .pow-winner__dsr { font-size:24px; font-weight:900; line-height:1; }

  <script>
  // ── Config ───────────────────────────────────────────────────────
  const DIV_LABELS = {
    '3.0M':'3.0 Mixed','3.5M':'3.0–3.5 Mixed',
    '3-0-mixed':'3.0 Mixed','3-5-mixed':'3.0–3.5 Mixed'
  };
  const SLOT_LABELS = { womens:"Women's", mens:"Men's", mixed:'Mixed' };

  const state = {
    circuit:'I', division:'', section:'rankings',
    lastSub:{ rankings:'rankings', awards:'topchefs' },
    filter:'all', genderFilter:'all', search:'', sort:'dsr', sortDir:'desc',
    showAll:false, showUnq:false, finding:false, open:new Set(),
    playerStats:null, standings:null, potw:null
  };
  // Which top tab owns each content section.
  const SECTION_TOP = { rankings:'rankings', leaders:'rankings', pvp:'pvp', tvt:'tvt', topchefs:'awards', streaks:'awards', nvz:'nvz', ladder:'ladder' };
  const TOP_DEFAULT = { rankings:'rankings', pvp:'pvp', tvt:'tvt', awards:'topchefs', nvz:'nvz', ladder:'ladder' };
  const KNOWN_SECTIONS = ['rankings','leaders','pvp','tvt','topchefs','streaks','nvz','ladder'];
  const LB_GENDER_COLOR = { M:'#6aa8ff', F:'#ff8fb3' };
  const lbGenderOf = p => /^f/i.test(p.gender||'') ? 'F' : /^m/i.test(p.gender||'') ? 'M' : null;

  const $ = id => document.getElementById(id);

  // ── Profile links (carry the current season/circuit forward) ─────
  // Which code is "now" — settled by dsSeason() below; 'I' only until then.
  let CURRENT_CODE = 'I';
  // Was a season pinned in the URL? Either spelling counts.
  const PINNED_IN_URL = (function(){ const p = new URLSearchParams(location.search); return p.has('circuit') || p.has('season'); })();
  function _seasonSuffix(){ return state.circuit === CURRENT_CODE ? '' : '&season=' + encodeURIComponent(seasonIdOf(state.circuit)); }
  function _slug(s){ return String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30)||'x'; }
  function teamLinkHtml(name, id){ if(!name) return ''; const ref=id||_slug(name); return '<a class="ds-link" href="/team?id='+encodeURIComponent(ref)+_seasonSuffix()+'">'+esc(name)+'</a>'; }
  // Display shows "First L."; the href keeps the FULL name so profile links
  // and search keep working on real names.
  function playerLinkHtml(name, teamName){ if(!name) return esc(name||''); return '<a class="ds-link" href="/player?team='+encodeURIComponent(_slug(teamName))+'&name='+encodeURIComponent(name)+_seasonSuffix()+'">'+esc(shortName(name))+'</a>'; }

  // ── URL ──────────────────────────────────────────────────────────
  function readUrl() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('circuit'))  state.circuit  = p.get('circuit');
    // Every other page links with ?season=<id>; accept it here too, otherwise
    // the leaderboard sits on Season 1 while the rest of the site is on 2.
    else if (p.get('season')) state.circuit = codeFromSeasonId(p.get('season'));
    if (p.get('division')) state.division = p.get('division');
    if (['womens','mens','mixed'].includes(p.get('games'))) state.filter = p.get('games');
    if (['won','pct','diff','avgdiff','ps'].includes(p.get('sort'))) state.sort = p.get('sort');
    if (/^(\d{4}-\d{2}|all)$/.test(p.get('month') || '')) state.ladderPeriod = p.get('month');
    const v = p.get('view');
    // Legacy redirects: society/standings → rankings, analytics → the NVZ.
    if (v) {
      const legacy = { society:'rankings', standings:'rankings', analytics:'nvz', compare:'pvp' };
      state.section = legacy[v] || (KNOWN_SECTIONS.includes(v) ? v : 'rankings');
    }
    $('circuit-select').value  = state.circuit;
    $('division-select').value = state.division || '';
    activate(state.section, true);
  }
  function writeUrl() {
    const p = new URLSearchParams();
    if (state.circuit !== CURRENT_CODE) p.set('circuit', state.circuit);
    if (state.division)               p.set('division', state.division);
    if (state.section !== 'rankings') p.set('view', state.section);
    if (state.filter !== 'all')       p.set('games', state.filter);
    if (state.sort !== 'dsr')         p.set('sort', state.sort);
    if (state.section === 'ladder' && state.ladderPeriod) p.set('month', state.ladderPeriod);
    const q = p.toString();
    history.replaceState({}, '', q ? `?${q}` : window.location.pathname);
  }

  // ── Data ─────────────────────────────────────────────────────────
  // Every load is tagged with the season it was fetched for; a response that
  // lands after the user (or dsSeason) switched seasons is discarded instead of
  // overwriting the newer season's data. That race is what showed Season 1
  // stats under the Season 2 filter until you toggled back and forth.
  async function loadPlayerStats() {
    const c = state.circuit;
    let out;
    try {
      const r = await fetch(`/.netlify/functions/public-leaderboard?circuit=${encodeURIComponent(c)}&view=players`);
      out = r.ok ? await r.json() : { empty:true };
    } catch { out = { empty:true }; }
    if (state.circuit === c) state.playerStats = out;
  }
  async function loadStandings() {
    const c = state.circuit;
    let out;
    try {
      let r = await fetch(`/.netlify/functions/public-leaderboard?circuit=${encodeURIComponent(c)}`);
      if (!r.ok) throw 0;
      out = await r.json();
      if (out?.empty) {
        r = await fetch(`/.netlify/functions/public-standings?season=${encodeURIComponent(seasonIdOf(c))}`);
        if (r.ok) { const d = await r.json(); if (!d.empty) out = d; }
      }
    } catch {
      try {
        const r = await fetch(`/.netlify/functions/public-standings?season=${encodeURIComponent(seasonIdOf(c))}`);
        out = r.ok ? await r.json() : { empty:true };
      } catch { out = { empty:true }; }
    }
    if (state.circuit === c) state.standings = out;
  }
  async function loadPotw() {
    try {
      const r = await fetch('/.netlify/functions/player-of-week');
      if (r.ok) { const d = await r.json(); if (!d.empty) state.potw = d; }
    } catch {}
  }

  // ── Hero ─────────────────────────────────────────────────────────
  // Hand-written, and specific to the season named here. The same figures live
  // on the Standings page; when a second season's MVPs exist these should move
  // into a blob rather than being duplicated a third time.
  const MVP_CIRCUIT = 'I';
  const SEASON_MVPS = {
    // playerId = the Season 1 roster id, so the ring shows the real photo
    // (player-photo-serve resolves across a person's ids; 404 → initials).
    male:   { initials:'RH', name:'Ryan Hom', team:'Smash Society', tag:'Season MVP · Male', playerId:'p_fd8a1d5cc957f4ee_0',
              stats:[['72.0','DSR','g'],['24-6','Record',''],['+117','Diff','li'],['7/9','Clutch','t']] },
    female: { initials:'SC', name:'Shay C',   team:'ZERO ZERO TWO', tag:'Season MVP · Female', playerId:'p_e46927c1b38c',
              stats:[['82.0','DSR','g'],['29-3','Record',''],['+200','Diff','li'],['91%','Win rate','t']] },
  };
  // Photo when the MVP has one: the standings row's stamped URL first, else the
  // serve endpoint by id; the initials sit underneath for the 404 case.
  function mvpRing(m) {
    const row = (state.playerStats?.players ? Object.values(state.playerStats.players) : []).find(p => p.name === m.name || p.playerId === m.playerId);
    const src = (row && row.photoUrl) || (m.playerId ? '/.netlify/functions/player-photo-serve?id=' + encodeURIComponent(m.playerId) : null);
    return '<div class="lb-mvpc__ring">' + (src
      ? '<img data-ini="' + esc(m.initials) + '" src="' + esc(src) + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="avFallback(this)">'
      : esc(m.initials)) + '</div>';
  }

  // Small formatters shared by the header and the list.
  const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const signed = (n, d) => (n > 0 ? '+' : n < 0 ? '−' : '') + (d != null ? Math.abs(n).toFixed(d) : Math.abs(n));
  const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
  const playerHref = p => '/player?team=' + encodeURIComponent(_slug(p.teamName)) + '&name=' + encodeURIComponent(p.name) + _seasonSuffix();
  const plural = (n, w, many) => n + ' ' + (n === 1 ? w : (many || w + 's'));
  function seasonName() {
    const c = String(state.circuit || 'I').toUpperCase();
    const hit = (SEASONS_LOADED || []).find(s => String(s.circuit || '').toUpperCase() === c);
    if (hit && (hit.name || hit.label)) return hit.name || hit.label;
    if (c === 'TEST') return 'Test season';
    const i = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'].indexOf(c);
    return 'Season ' + (i < 0 ? c : i + 1);
  }
  // Qualified players in canonical DSR order (same order dsrRankMap() numbers).
  function rankedOverall() {
    return playerList()
      .filter(p => p.composite != null && p.dsrQualified !== false)
      .sort((a, b) => (b.composite - a.composite) || ((b.gamesWon || 0) - (a.gamesWon || 0)) || (a.name || '').localeCompare(b.name || ''));
  }

  // The header tells the story of the rankings: who is number one and how they
  // got there, then four tiles. On the other tabs it is just the page title.
  function renderHero() {
    const title = $('lb-title'), lede = $('lb-lede'), tiles = $('lb-tiles');
    if (!title) return;
    const onRank = (SECTION_TOP[state.section] || 'rankings') === 'rankings';
    const ps = state.playerStats, all = playerList();
    const has = !!(ps && !ps.empty && all.length);
    const past = state.circuit !== CURRENT_CODE;
    const wk = has ? (ps.weeksPlayed || 0) : 0;
    $('lb-season-name').textContent = seasonName();
    $('lb-thru').textContent = wk ? (past ? plural(wk, 'week') + ' played' : 'Through week ' + wk) : '';

    const R = has ? rankedOverall() : [], one = R[0], two = R[1];
    if (!onRank || !one) {
      title.textContent = 'Leaderboard';
      tiles.hidden = true; tiles.innerHTML = '';
      const msg = !onRank || !ps ? ''
        : !has ? (ps.message || 'Rankings start once the first week is played.')
        : 'Nobody has played enough games to hold a rank yet' + (ps.needGames ? '. It takes ' + ps.needGames + '.' : '.');
      lede.textContent = msg; lede.hidden = !msg;
      if (state.section === 'ladder') renderLadderHero();
    } else {
      const rankOf = dsrRankMap(), need = ps.needGames;
      const rec = p => (p.gamesWon || 0) + '–' + ((p.gamesPlayed || 0) - (p.gamesWon || 0));
      const verb = past ? 'finished' : one.rankDelta > 0 ? 'takes' : wk <= 1 ? 'opens at' : 'holds';
      title.innerHTML = esc(firstName(one.name)) + ' ' + verb + ' <span class="lime">number one.</span>';
      const gap = two ? (one.composite - two.composite) : 0;
      lede.innerHTML = '<b>' + one.composite.toFixed(1) + ' DSR</b>, ' + rec(one) + ' in games' +
        (one.rankDelta > 0 ? ', up ' + plural(one.rankDelta, 'place') + (past ? ' in the last week' : ' this week') : '') + '. ' +
        (two ? esc(shortName(two.name)) + (past ? ' was ' : ' is ') + (gap < 0.05 ? 'level on the rating' : gap.toFixed(1) + ' behind') + '. ' : '') +
        R.length + ' of ' + plural(all.length, 'player') + (past ? ' were' : ' are') + ' ranked' +
        (need && !past ? '; it takes ' + plural(need, 'game') + ' to qualify.' : '.');
      lede.hidden = false;

      const withG = all.filter(p => (p.gamesPlayed || 0) > 0);
      const climb = R.filter(p => p.rankDelta > 0).sort((a, b) => b.rankDelta - a.rankDelta)[0];
      const bestDiff = withG.slice().sort((a, b) => (b.diff || 0) - (a.diff || 0))[0];
      const mostW = withG.slice().sort((a, b) => ((b.gamesWon || 0) - (a.gamesWon || 0)) || ((b.composite || 0) - (a.composite || 0)))[0];
      const tile = (cls, k, v, p, sub) => '<div class="dk-tile ' + cls + '"><small>' + k + '</small><b>' + v + '</b>' +
        (p ? '<a class="nm" href="' + esc(playerHref(p)) + '">' + esc(shortName(p.name)) + '</a>' : '') + '<span>' + sub + '</span></div>';
      tiles.innerHTML =
        tile('hot', 'Number one', one.composite.toFixed(1), one, esc(one.teamName || '') + ' · ' + rec(one)) +
        (climb
          ? tile('', 'Biggest climb', '▲' + climb.rankDelta, climb, ord(rankOf.get(climb.playerId) + climb.rankDelta) + ' to ' + ord(rankOf.get(climb.playerId)) + (past ? ' in the last week' : ' this week'))
          : tile('', 'Ranked players', R.length, null, 'of ' + all.length + (need && !past ? ' · ' + plural(need, 'game') + ' to qualify' : ''))) +
        (bestDiff ? tile('', 'Best point diff', signed(bestDiff.diff || 0), bestDiff, (bestDiff.ps || 0) + '–' + (bestDiff.pa || 0) + ' over ' + plural(bestDiff.gamesPlayed || 0, 'game')) : '') +
        (mostW ? tile('', 'Most wins', mostW.gamesWon || 0, mostW, rec(mostW) + ' · ' + esc(mostW.teamName || '')) : '');
      tiles.hidden = false;
    }

    /* Season MVPs: only on the season they were won in, above the rankings. */
    const box = $('lb-mvp');
    if (!box) return;
    if (state.circuit !== MVP_CIRCUIT) { box.hidden = true; box.innerHTML = ''; return; }
    const label = seasonName();
    const card = (m, cls) => '<div class="lb-mvpc ' + cls + '">' +
      '<span class="lb-mvpc__tag">' + esc(m.tag) + '</span>' +
      '<div class="lb-mvpc__who">' + mvpRing(m) +
        '<div><div class="lb-mvpc__nm">' + esc(m.name) + '</div>' +
        '<div class="lb-mvpc__tm">' + esc(m.team) + ' · ' + esc(label) + '</div></div></div>' +
      '<div class="lb-mvpc__st">' + m.stats.map(st =>
        '<div><b>' + esc(st[0]) + '</b><span>' + esc(st[1]) + '</span></div>').join('') +
      '</div></div>';
    box.innerHTML =
      '<div class="lb-mvp__hd"><b>' + esc(label) + ' MVPs</b>' +
      '<span>Voted by the league. The stats made the shortlist.</span></div>' +
      '<div class="lb-mvp__grid">' + card(SEASON_MVPS.male, '') + card(SEASON_MVPS.female, 'lb-mvpc--f') + '</div>';
    box.hidden = false;
  }

  // ── Helpers ──────────────────────────────────────────────────────
  function playerList() {
    if (!state.playerStats?.players) return [];
    return Object.values(state.playerStats.players);
  }
  // Each player's canonical DSR rank (1 = highest DSR). Computed from the FULL
  // board so it stays with the player no matter how the table is filtered,
  // searched, or sorted. Only players with a DSR (≥1 game) are ranked; everyone
  // else is unranked (→ "—"), so there's no fake ranking at season start.
  function dsrRankMap() {
    const ranked = playerList()
      .filter(p => p.composite != null && p.dsrQualified !== false)
      .sort((a, b) => (b.composite - a.composite)
        || ((b.gamesWon || 0) - (a.gamesWon || 0))
        || (a.name || '').localeCompare(b.name || ''));
    const m = new Map();
    ranked.forEach((p, i) => m.set(p.playerId, i + 1));
    return m;
  }
  // Each player's DSR rank WITHIN their own gender (stable across filters).
  function genderRankMap() {
    const m = new Map();
    ['M','F'].forEach(g => {
      playerList()
        .filter(p => p.composite != null && p.dsrQualified !== false && lbGenderOf(p) === g)
        .sort((a, b) => (b.composite - a.composite) || ((b.gamesWon||0)-(a.gamesWon||0)) || (a.name||'').localeCompare(b.name||''))
        .forEach((p, i) => m.set(p.playerId, i + 1));
    });
    return m;
  }
  // Which rating a game-type filter ranks by. "All games" → overall DSR. Women's /
  // Men's → the gender-line DSR, Mixed → the Mixed DSR, each with its own rank and
  // its own week-over-week movement. Returns null for "All games", and for seasons
  // whose stats were built before the split ratings existed (those keep the overall
  // ranking under every filter, as before).
  function splitMode(filter) {
    filter = filter || state.filter;
    if (filter === 'all') return null;
    if (!playerList().some(p => p.dsrGender != null || p.dsrMixed != null)) return null;
    return filter === 'mixed'
      ? { dsr:'dsrMixed', rank:'dsrMixedRank', hist:'xRank' }
      : { dsr:'dsrGender', rank:'dsrGenderRank', hist:'gRank' };
  }
  // Movement within one split: last week's rank in that split minus today's.
  function splitDelta(p, sm) {
    const h = Array.isArray(p.dsrHistory) ? p.dsrHistory : [];
    if (h.length < 2 || p[sm.rank] == null) return null;
    const prev = h[h.length - 2][sm.hist];
    return prev == null ? null : prev - p[sm.rank];
  }
  function filteredPlayers(filter, searchQ) {
    filter = filter || state.filter;
    const sm = splitMode(filter);
    searchQ = (searchQ !== undefined ? searchQ : state.search).toLowerCase();
    const gf = state.genderFilter || 'all';
    // Gendered game-type tabs (Women's / Men's) also restrict the player list:
    // only women play women's doubles, only men play men's. Mixed/All keep both.
    const typeGender = filter === 'womens' ? 'F' : filter === 'mens' ? 'M' : null;
    const rows = playerList()
      .filter(p => !searchQ || p.name.toLowerCase().includes(searchQ) || (p.teamName||'').toLowerCase().includes(searchQ))
      .filter(p => gf === 'all' || lbGenderOf(p) === gf)
      .filter(p => !typeGender || lbGenderOf(p) === typeGender)
      .map(p => {
        // GP / WON / LOSS respect the active game-type filter
        const s = filter === 'all'
          ? { played: p.gamesPlayed||0, won: p.gamesWon||0 }
          : (p.byType?.[filter] || { played:0, won:0 });
        // PS / PA / DIFF and per-game averages: season totals on "All games"; on a
        // game-type filter they cover that game type only (when the blob carries
        // per-type points — older ones only have played/won, so fall back to totals).
        const bt = sm ? (p.byType?.[filter] || { played:0, won:0, ps:0, pa:0, diff:0 }) : null;
        const own = !!(bt && bt.ps != null && bt.pa != null);
        const gp = own ? (bt.played || 0) : (p.gamesPlayed || 0);
        const ps = own ? bt.ps : (p.ps || 0), pa = own ? bt.pa : (p.pa || 0);
        const diff = own ? (bt.diff != null ? bt.diff : ps - pa) : (p.diff != null ? p.diff : ps - pa);
        return { ...p,
          _played: s.played, _won: s.won, _lost: s.played - s.won,
          _rate: s.played ? s.won/s.played : 0,
          _dsr: sm ? (p[sm.dsr] != null ? p[sm.dsr] : null) : p.composite,
          _rank: sm ? (p[sm.rank] != null ? p[sm.rank] : null) : null,
          _delta: sm ? splitDelta(p, sm) : p.rankDelta,
          _ps: ps, _pa: pa, _diff: diff,
          _aps: gp ? ps/gp : 0, _apa: gp ? pa/gp : 0, _avgDiff: gp ? diff/gp : 0,
        };
      });

    // Sort by the active column (default: DSR desc). Nulls sink to the bottom.
    const KEY = { dsr:'_dsr', gp:'_played', won:'_won', loss:'_lost', pct:'_rate',
                  ps:'_ps', pa:'_pa', diff:'_diff', aps:'_aps', apa:'_apa', avgdiff:'_avgDiff' };
    const k = KEY[state.sort] || '_dsr';
    const dir = state.sortDir === 'asc' ? 1 : -1;
    const num = v => (v == null || Number.isNaN(v)) ? -Infinity : v;
    rows.sort((a,b) => {
      const d = (num(a[k]) - num(b[k])) * dir;
      if (d) return d;
      // Tiebreak: DSR, then wins, then alphabetical by name. Keeps zeroed
      // (yet-to-play) players in clean A→Z order at the bottom of the board.
      return (num(b._dsr) - num(a._dsr)) || (b._won - a._won)
        || (a.name||'').localeCompare(b.name||'');
    });
    return rows;
  }

  function noData(msg) {
    return `<div class="empty-state">${esc(msg||'No data yet — check back after Week 1.')}</div>`;
  }
  function initials(name) {
    if (!name) return '?';
    const p = name.trim().split(' ');
    return (p[0][0] + (p[p.length-1]?.[0]||'')).toUpperCase();
  }
  // Avatar inner content: the player's photo when they have one, else initials.
  // Goes INSIDE an existing .player-avatar / .team-player__av circle. The serve
  // endpoint 404s for players with no photo → onerror swaps back to initials.
  function avInner(p) {
    const ini = esc(initials(p && p.name));
    if (!p) return ini;
    // Prefer server-stamped photoUrl; fall back to blind id request only for
    // legacy data without the field. null = known no-photo → initials.
    const src = p.photoUrl ? p.photoUrl
      : ((!('photoUrl' in p) && p.playerId) ? '/.netlify/functions/player-photo-serve?id=' + encodeURIComponent(p.playerId) : null);
    if (!src) return ini;
    return '<img data-ini="' + ini + '" src="' + src + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;" onerror="avFallback(this)">';
  }
  window.avFallback = function (img) { const d = img.getAttribute('data-ini') || ''; if (img.parentNode) img.parentNode.textContent = d; };
  function pctClass(rate) {
    return rate >= 0.65 ? '' : rate >= 0.5 ? 'team-player__pct--mid' : 'team-player__pct--low';
  }

  // ── RANKINGS ─────────────────────────────────────────────────────
  // One list, as rows, no sideways scroll. The pinned bar holds the controls
  // (games, find, rank by, players or by team) and is never re-rendered, so the
  // find field keeps focus while you type. Every stat the old 14-column table
  // had is still here: open a row for the full set.
  const RK_CAP = 12;   // players shown before "Show all"
  const SORT_LABEL = { dsr: 'DSR', won: 'Wins', pct: 'Win %', diff: 'Diff', avgdiff: 'Avg diff', ps: 'Points' };
  const RK_METRIC = {
    dsr:     p => p._dsr != null ? p._dsr.toFixed(1) : '—',
    won:     p => p._won,
    pct:     p => p._played ? Math.round(100 * p._rate) + '%' : '—',
    diff:    p => signed(p._diff),
    avgdiff: p => p._played ? signed(p._avgDiff, 1) : '—',
    ps:      p => p._ps,
  };
  const RK_CELL = {
    dsr:     p => ['DSR', RK_METRIC.dsr(p), 'main'],
    rec:     p => ['W–L', p._won + '–' + p._lost, 'main'],
    pct:     p => ['Win %', RK_METRIC.pct(p), ''],
    diff:    p => ['Diff', signed(p._diff), p._diff > 0 ? 'pos' : p._diff < 0 ? 'neg' : ''],
    avgdiff: p => ['Avg', RK_METRIC.avgdiff(p), ''],
    ps:      p => ['Points', p._ps + '–' + p._pa, ''],
  };
  // Five cells beside the big number; the big number is whatever you rank by.
  const rkCells = sort => sort === 'dsr' ? ['rec', 'pct', 'diff', 'avgdiff', 'ps']
    : sort === 'won' ? ['dsr', 'rec', 'pct', 'diff', 'avgdiff']
    : ['dsr', 'rec', 'pct', 'diff', 'avgdiff', 'ps'].filter(k => k !== sort);
  const rkChev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  const rkMv = d => d > 0 ? '<span class="rk-mv up" title="Up ' + plural(d, 'place') + ' this week">▲' + d + '</span>'
    : d < 0 ? '<span class="rk-mv down" title="Down ' + plural(-d, 'place') + ' this week">▼' + (-d) + '</span>' : '';
  const rkAv = p => '<span class="dk-av" aria-hidden="true">' + avInner(p) + '</span>';
  const rkKey = p => p.playerId || p.name;

  // The full list for the active games filter and sort (no find applied), split
  // into ranked and not-yet-ranked, each player stamped with their position.
  function rankingData() {
    const sm = splitMode();
    const full = filteredPlayers(state.filter, '');
    const isRanked = p => sm ? p._rank != null : (p._dsr != null && p.dsrQualified !== false);
    const ranked = full.filter(isRanked), unq = full.filter(p => !isRanked(p));
    const rankOf = dsrRankMap(), gRankOf = genderRankMap();
    ranked.forEach((p, i) => {
      p._ov = rankOf.get(p.playerId) || null;                 // overall DSR rank, whatever the view
      p._pos = state.sort !== 'dsr' ? i + 1 : sm ? p._rank : p._ov;
      p._g = gRankOf.get(p.playerId) || null;
    });
    unq.forEach(p => { p._ov = null; p._pos = null; p._g = null; });
    return { sm, ranked, unq };
  }

  // The line under a player's name: team, then where else they stand.
  function rkSub(p, sm) {
    const bits = [teamLinkHtml(p.teamName, p.teamId)];
    if (p._pos == null) bits.push(p._played ? plural(p._played, 'game') + ' played' : 'no games yet');
    else if (state.sort !== 'dsr') { const r = sm ? p._rank : p._ov; if (r) bits.push(ord(r) + ' in DSR'); }
    else if (sm) { if (p._ov) bits.push(ord(p._ov) + ' overall'); }
    else if (p._g) bits.push(ord(p._g) + (lbGenderOf(p) === 'F' ? ' woman' : ' man'));
    return bits.filter(Boolean).join(' · ');
  }

  // Everything else about a player, for the open row.
  function rkMore(p, sm) {
    const flabel = state.filter === 'all' ? '' : SLOT_LABELS[state.filter];
    const bt = sm ? ((p.byType && p.byType[state.filter]) || {}) : p;
    const cg = bt.clutchG || 0, cw = bt.clutchW || 0;
    const cell = (k, v, sub) => '<div class="dk-cell"><small>' + k + '</small><b>' + v + '</b>' + (sub ? '<em>' + sub + '</em>' : '') + '</div>';
    const grid = [
      cell('Games played', p._played),
      cell('Won', p._won),
      cell('Lost', p._lost),
      cell('Points for', p._ps, p._played ? p._aps.toFixed(1) + ' a game' : ''),
      cell('Points against', p._pa, p._played ? p._apa.toFixed(1) + ' a game' : ''),
      cell('Point diff', signed(p._diff), p._played ? signed(p._avgDiff, 1) + ' a game' : ''),
      cg ? cell('Close games', cw + '–' + (cg - cw), 'decided by 3 or fewer') : '',
    ].join('');
    // Each game type on its own line, only on "All games" (a filter already is one).
    let types = '';
    if (!sm && p.byType) {
      const g = lbGenderOf(p);
      const rows = ['womens', 'mens', 'mixed'].map(t => {
        const b = p.byType[t]; if (!b || !b.played) return '';
        const gen = t !== 'mixed';
        if (gen && ((t === 'womens') !== (g === 'F'))) return '';
        const d = gen ? p.dsrGender : p.dsrMixed, r = gen ? p.dsrGenderRank : p.dsrMixedRank;
        return cell(SLOT_LABELS[t] + ' doubles', (b.won || 0) + '–' + ((b.played || 0) - (b.won || 0)), d != null ? d.toFixed(1) + ' DSR' + (r ? ' · ' + ord(r) : '') : '');
      }).join('');
      if (rows) types = '<div><h3>By game</h3><div class="rk-more__grid">' + rows + '</div></div>';
    }
    const wk = (!sm && Array.isArray(p.weeklyGameRecords) ? p.weeklyGameRecords : []).filter(w => w && w.week != null);
    const weeks = wk.length ? '<div><h3>Week by week</h3><div class="rk-weeks">' +
      wk.map(w => '<span><small>Week ' + esc(w.week) + '</small>' + (w.w || 0) + '–' + (w.l || 0) + '</span>').join('') + '</div></div>' : '';
    return '<div class="rk-more">' +
      (flabel && sm ? '<div class="rk-more__cap">' + esc(flabel) + ' doubles games only.</div>' : '') +
      '<div class="rk-more__grid">' + grid + '</div>' + types + weeks +
      '<div class="rk-more__acts"><a class="dk-more" href="' + esc(playerHref(p)) + '">' + esc(shortName(p.name)) + '’s player page</a>' +
      (p.teamName ? '<a class="dk-more" href="/team?id=' + encodeURIComponent(p.teamId || _slug(p.teamName)) + _seasonSuffix() + '">' + esc(p.teamName) + '</a>' : '') + '</div></div>';
  }

  function rkRow(p, sm) {
    const open = state.open.has(rkKey(p)), id = esc(rkKey(p));
    const cells = rkCells(state.sort).map(k => { const c = RK_CELL[k](p); return '<div><small>' + c[0] + '</small><b class="' + c[2] + '">' + c[1] + '</b></div>'; }).join('');
    const delta = state.sort === 'dsr' && p._pos != null ? rkMv(p._delta) : '';
    return '<div class="dk-row rk-row' + (open ? ' open' : '') + '" data-pid="' + id + '">' +
      '<div class="who"><span class="rk-pos"><b>' + (p._pos != null ? p._pos : '–') + '</b>' + delta + '</span>' + rkAv(p) +
        '<div><a class="nm" href="' + esc(playerHref(p)) + '">' + esc(shortName(p.name)) + '</a><span class="sm">' + rkSub(p, sm) + '</span></div>' +
        '<span class="rk-big' + (p._pos == null ? ' nr' : '') + '"><b>' + RK_METRIC[state.sort](p) + '</b><small>' + SORT_LABEL[state.sort] + '</small></span></div>' +
      '<div class="rk-stats"><div class="dk-cells" style="--n:5">' + cells + '</div>' +
        '<button type="button" class="rk-tog" data-more="' + id + '" aria-expanded="' + open + '" aria-label="' + (open ? 'Hide' : 'Show') + ' all stats for ' + esc(shortName(p.name)) + '">' + rkChev + '</button></div>' +
      (open ? rkMore(p, sm) : '') + '</div>';
  }

  // The top three as photo cards.
  function rkCard(p, i, sm) {
    const extra = state.sort === 'dsr' ? (sm ? (p._ov ? ord(p._ov) + ' overall' : '') : (p._g ? ord(p._g) + (lbGenderOf(p) === 'F' ? ' woman' : ' man') : ''))
      : (p._dsr != null ? p._dsr.toFixed(1) + ' DSR' : '');
    return '<a class="dk-pc' + (i === 0 ? ' first' : '') + '" href="' + esc(playerHref(p)) + '">' +
      '<span class="dk-pc__pic" aria-hidden="true">' + avInner(p) + '</span>' +
      '<span class="dk-pc__b"><span class="dk-pc__k">' + ord(p._pos) + (state.sort === 'dsr' ? rkMv(p._delta) : '') + '</span>' +
        '<span class="dk-pc__n">' + esc(shortName(p.name)) + '</span>' +
        '<span class="dk-sub" style="font-size:12px;">' + esc(p.teamName || '') + '</span>' +
        '<span class="dk-pc__v"><b>' + RK_METRIC[state.sort](p) + '</b><span>' + SORT_LABEL[state.sort] + '</span></span>' +
        '<span class="dk-pc__s"><span>' + p._won + '–' + p._lost + '</span><span>' + signed(p._diff) + '</span>' + (extra ? '<span>' + extra + '</span>' : '') + '</span>' +
      '</span></a>';
  }

  const rkViewSeg = cls => '<div class="dk-seg ' + cls + '" role="group" aria-label="Show">' +
    '<button type="button" class="lb-sub' + (state.section !== 'leaders' ? ' is-active on' : '') + '" data-section="rankings">Players</button>' +
    '<button type="button" class="lb-sub' + (state.section === 'leaders' ? ' is-active on' : '') + '" data-section="leaders">By team</button></div>';

  // Players view.
  function rkPlayersHtml(D, q) {
    const sm = D.sm, flabel = state.filter === 'all' ? '' : SLOT_LABELS[state.filter];
    const hit = p => !q || (p.name || '').toLowerCase().includes(q) || (p.teamName || '').toLowerCase().includes(q);
    const ranked = D.ranked.filter(hit), unq = D.unq.filter(hit);
    const ps = state.playerStats, need = ps && ps.needGames;
    const title = q ? plural(ranked.length + unq.length, 'match', 'matches') + ' for “' + esc(state.search.trim()) + '”'
      : state.sort !== 'dsr' ? 'Ranked by ' + SORT_LABEL[state.sort].toLowerCase()
      : sm ? esc(flabel) + ' doubles rankings' : 'Player rankings';
    const note = sm ? 'Rank, movement and stats here are for ' + esc(flabel.toLowerCase()) + ' doubles games only.'
      : state.sort !== 'dsr' ? 'Ranked players only. The rating that sets the official order is DSR.'
      : plural(D.ranked.length, 'ranked player') + (ps.weeksPlayed ? ' after ' + plural(ps.weeksPlayed, 'week') : '');
    let html = '<div class="rk-listhead"><div><h2 class="dk-h2">' + title + '</h2><span class="dk-sub">' + note + '</span></div>' + rkViewSeg('rk-viewrow') + '</div>';

    if (!ranked.length && !unq.length) {
      return html + '<div class="dk-card"><div class="dk-empty">' + (q ? 'No player or team matches that.' : 'No ' + esc(flabel ? flabel.toLowerCase() + ' doubles' : 'ranked') + ' games yet.') + '</div></div>';
    }
    let rows = ranked, cards = 0;
    if (!q && ranked.length >= 3) { cards = 3; html += '<div class="rk-top">' + ranked.slice(0, 3).map((p, i) => rkCard(p, i, sm)).join('') + '</div>'; rows = ranked.slice(3); }
    const long = !q && ranked.length > RK_CAP, capped = long && !state.showAll;
    const shown = capped ? rows.slice(0, RK_CAP - cards) : rows;
    if (shown.length) {
      html += '<div class="dk-card dk-rows rk-list">' + shown.map(p => rkRow(p, sm)).join('') +
        (long ? '<div class="rk-foot"><span>' + (capped ? 'Showing ' + RK_CAP + ' of ' + ranked.length + ' ranked players.' : 'All ' + ranked.length + ' ranked players.') + '</span>' +
          '<button type="button" class="dk-btn dk-btn--out dk-btn--sm" data-act="showall">' + (capped ? 'Show all ' + ranked.length : 'Show fewer') + '</button></div>' : '') + '</div>';
    }
    if (unq.length) {
      const openU = !!q || state.showUnq;
      const why = sm ? 'No ' + esc(flabel.toLowerCase()) + ' doubles games yet' + (need ? ', or fewer than ' + need + ' games overall.' : '.')
        : need ? 'Fewer than ' + plural(need, 'game') + ' played. They have a rating, and join the ranking at ' + need + '.'
        : 'They have a rating but have not played enough to hold a rank.';
      html += '<div class="dk-card dk-card--pad rk-unq"><div class="rk-unq__hd"><div><b>Not yet ranked · ' + plural(unq.length, 'player') + '</b><span class="dk-sub">' + why + '</span></div>' +
        (q ? '' : '<button type="button" class="dk-btn dk-btn--out dk-btn--sm" data-act="unq" aria-expanded="' + openU + '">' + (openU ? 'Hide them' : 'Show them') + '</button>') + '</div>' +
        (openU ? '<div class="dk-rows">' + unq.map(p => rkRow(p, sm)).join('') + '</div>' : '') + '</div>';
    }
    return html;
  }

  // By team: the same list, grouped. Each team's top three by the active "Rank by".
  function rkTeamsHtml(D, q) {
    const sm = D.sm, flabel = state.filter === 'all' ? '' : SLOT_LABELS[state.filter];
    const pool = D.ranked.concat(D.unq.filter(p => p._played > 0));
    const teams = new Map();
    pool.forEach(p => { const k = p.teamId || p.teamName || 'Unknown'; if (!teams.has(k)) teams.set(k, { id: p.teamId, name: p.teamName || 'Unknown', players: [] }); teams.get(k).players.push(p); });
    const list = [...teams.values()]
      .filter(t => !q || t.name.toLowerCase().includes(q) || t.players.some(p => (p.name || '').toLowerCase().includes(q)))
      .sort((a, b) => a.name.localeCompare(b.name));
    let html = '<div class="rk-listhead"><div><h2 class="dk-h2">Team leaders</h2><span class="dk-sub">Each team’s top three by ' + (state.sort === 'dsr' ? 'DSR' : SORT_LABEL[state.sort].toLowerCase()) +
      (sm ? ', ' + esc(flabel.toLowerCase()) + ' doubles games only' : '') + '.</span></div>' + rkViewSeg('rk-viewrow') + '</div>';
    if (!list.length) return html + '<div class="dk-card"><div class="dk-empty">' + (q ? 'No player or team matches that.' : 'No games played yet.') + '</div></div>';
    const where = state.sort === 'dsr' ? (sm ? ' in ' + esc(flabel.toLowerCase()) + ' doubles' : ' overall') : ' in the league';
    html += '<div class="dk-grid" style="--min:290px;">' + list.map(t => {
      const rows = t.players.slice(0, 3).map((p, i) =>
        '<div class="dk-row"><div class="who"><span class="rk-pos"><b>' + (i + 1) + '</b></span>' + rkAv(p) +
          '<div><a class="nm" href="' + esc(playerHref(p)) + '">' + esc(shortName(p.name)) + '</a><span class="sm">' + p._won + '–' + p._lost +
            ' · ' + (p._pos != null ? ord(p._pos) + where : 'not ranked yet') + '</span></div>' +
          '<span class="rk-big' + (p._pos == null ? ' nr' : '') + '"><b>' + RK_METRIC[state.sort](p) + '</b><small>' + SORT_LABEL[state.sort] + '</small></span></div></div>').join('');
      return '<article class="dk-card rk-team"><div class="rk-team__hd"><a href="/team?id=' + encodeURIComponent(t.id || _slug(t.name)) + _seasonSuffix() + '">' + esc(t.name) + '</a>' +
        '<span class="dk-sub">' + plural(t.players.length, 'player') + ' with games</span></div><div class="dk-rows">' + rows + '</div></article>';
    }).join('') + '</div>';
    return html;
  }

  // Side column: who moved, who leads each game type, and how the rating works.
  function rkSideHtml() {
    const R = rankedOverall(), rankOf = dsrRankMap();
    const past = state.circuit !== CURRENT_CODE;
    let html = '';
    const ups = R.filter(p => p.rankDelta > 0).sort((a, b) => b.rankDelta - a.rankDelta).slice(0, 3);
    const downs = R.filter(p => p.rankDelta < 0).sort((a, b) => a.rankDelta - b.rankDelta).slice(0, 3);
    if (ups.length || downs.length) {
      html += '<div class="dk-card dk-card--pad"><div class="dk-head"><h2 class="dk-h2" style="font-size:18px;">' + (past ? 'Last week’s movers' : 'Movers this week') + '</h2><span>places gained or lost</span></div>' +
        ups.concat(downs).map(p => '<div class="rk-srow"><span class="d ' + (p.rankDelta > 0 ? 'pos' : 'neg') + '">' + (p.rankDelta > 0 ? '▲' : '▼') + Math.abs(p.rankDelta) + '</span>' +
          '<a class="n" href="' + esc(playerHref(p)) + '">' + esc(shortName(p.name)) + '</a><span class="t">' + (past ? '' : 'now ') + ord(rankOf.get(p.playerId)) + '</span></div>').join('') + '</div>';
    }
    if (playerList().some(p => p.dsrGender != null || p.dsrMixed != null)) {
      const best = (rankKey, valKey, g) => playerList().filter(p => p[rankKey] != null && p[valKey] != null && (!g || lbGenderOf(p) === g)).sort((a, b) => a[rankKey] - b[rankKey])[0];
      const ones = [['womens', "Women's", best('dsrGenderRank', 'dsrGender', 'F'), 'dsrGender'], ['mens', "Men's", best('dsrGenderRank', 'dsrGender', 'M'), 'dsrGender'], ['mixed', 'Mixed', best('dsrMixedRank', 'dsrMixed'), 'dsrMixed']].filter(o => o[2]);
      if (ones.length) html += '<div class="dk-card dk-card--pad"><div class="dk-head"><h2 class="dk-h2" style="font-size:18px;">Number one by game</h2><span>open that ranking</span></div>' +
        ones.map(o => '<button type="button" class="rk-srow" data-filter="' + o[0] + '"><span class="k">' + o[1] + '</span><span class="n">' + esc(shortName(o[2].name)) + '</span><span class="v">' + o[2][o[3]].toFixed(1) + '</span></button>').join('') + '</div>';
    }
    const parts = [
      ['Win %', 60, 'Games won out of games played. Winning counts most, and an 11–10 win is still a win.'],
      ['Avg diff', 15, 'Average point margin per game. Margin matters, but it does not dominate.'],
      ['Clutch', 10, 'Win rate in close games only, those decided by 3 points or fewer.'],
      ['Volume', 10, 'Games played, measured against the most active player. Showing up counts.'],
      ['Consistency', 5, 'How steady the results are from game to game. Reliable beats streaky.'],
    ];
    html += '<div class="dk-card dk-card--pad rk-how"><div class="dk-head"><h2 class="dk-h2" style="font-size:18px;">How DSR works</h2></div>' +
      '<p class="dk-sub" style="margin:0 0 10px;line-height:1.5;">One score out of 100, made of five parts. Winning counts most.</p>' +
      parts.map(w => '<div class="rk-part"><span>' + w[0] + '</span><span class="dk-track"><i style="width:' + Math.round(100 * w[1] / 60) + '%"></i></span><b>' + w[1] + '</b></div>').join('') +
      '<details><summary>What each part measures</summary><dl>' + parts.map(w => '<dt>' + w[0] + ' · ' + w[1] + ' points</dt><dd>' + w[2] + '</dd>').join('') + '</dl>' +
      '<p>To hold a rank, a player must average 2 games a week, up to a 10-game minimum for the season. Everyone else has a rating and is listed under “Not yet ranked.”</p></details></div>';
    return html;
  }

  // Keep the pinned controls in step with the state.
  function syncBar() {
    const bar = $('rk-bar'); if (!bar) return;
    bar.querySelectorAll('[data-filter]').forEach(b => { const on = b.dataset.filter === state.filter; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    bar.querySelectorAll('[data-sort]').forEach(b => { const on = b.dataset.sort === state.sort; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    const sel = $('rk-sortsel'); if (sel) sel.value = state.sort;
    const inp = $('rank-search'); if (inp && document.activeElement !== inp && inp.value !== state.search) inp.value = state.search;
    bar.classList.toggle('finding', !!state.finding || !!state.search);
    const has = !!(state.playerStats && !state.playerStats.empty && playerList().length);
    const st = $('rk-stick'); if (st) st.hidden = !has;
  }

  function renderRankings() {
    const el = $('rankings-content'); if (!el) return;
    syncBar();
    const ps = state.playerStats;
    if (!ps) { el.innerHTML = '<div class="dk-empty">Loading…</div>'; return; }
    if (ps.empty || !playerList().length) {
      el.innerHTML = '<div class="dk-card"><div class="dk-empty">' + esc(ps.message || 'No data yet. Check back after Week 1.') + '</div></div>';
      return;
    }
    const D = rankingData(), q = state.search.trim().toLowerCase();
    el.innerHTML = '<div class="dk-cols rk-cols"><div class="wide">' + (state.section === 'leaders' ? rkTeamsHtml(D, q) : rkPlayersHtml(D, q)) +
      '</div><aside class="side rk-side" aria-label="More on the rankings">' + rkSideHtml() + '</aside></div>';
  }

  // After a filter or sort change from further down the page, bring the top of
  // the list back under the pinned bar (the order just changed under you).
  function rkToTop() {
    const el = $('rankings-content'), bar = $('lb-bar'); if (!el || !bar) return;
    const st = $('rk-stick');
    const off = bar.getBoundingClientRect().bottom + (st ? st.offsetHeight : 0) + 12, y = el.getBoundingClientRect().top;
    if (y < off - 1) window.scrollTo({ top: Math.max(0, window.pageYOffset + y - off), behavior: 'instant' });
  }
  function rkSet(patch) {
    Object.assign(state, patch); state.showAll = false;
    writeUrl(); renderRankings(); rkToTop();
  }
  function wireRankings() {
    document.addEventListener('click', e => {
      const t = e.target; let b;
      if ((b = t.closest('.lb-sub[data-section]'))) { activate(b.dataset.section); return; }
      if (!t.closest('#lb')) return;
      if ((b = t.closest('[data-filter]'))) {
        // "Number one by game" in the side column opens that ranking as the player list.
        if (b.closest('.rk-side') && state.section !== 'rankings') { state.filter = b.dataset.filter; state.showAll = false; activate('rankings'); rkToTop(); return; }
        rkSet({ filter: b.dataset.filter }); return;
      }
      if ((b = t.closest('#rk-sortseg [data-sort]'))) { rkSet({ sort: b.dataset.sort, sortDir: 'desc' }); return; }
      if (t.closest('[data-act="showall"]')) { state.showAll = !state.showAll; renderRankings(); if (!state.showAll) rkToTop(); return; }
      if (t.closest('[data-act="unq"]')) { state.showUnq = !state.showUnq; renderRankings(); return; }
      if (t.closest('#rk-find-open')) { state.finding = true; syncBar(); const i = $('rank-search'); if (i) i.focus(); return; }
      if (t.closest('#rk-find-close')) { state.finding = false; state.search = ''; const i = $('rank-search'); if (i) i.value = ''; renderRankings(); return; }
      const row = t.closest('.rk-row');
      if (row && (t.closest('[data-more]') || !t.closest('a, button, .rk-more'))) {
        const id = row.dataset.pid; if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
        renderRankings();
      }
    });
    const inp = $('rank-search');
    if (inp) inp.addEventListener('input', () => { state.search = inp.value; renderRankings(); });
    const sel = $('rk-sortsel');
    if (sel) sel.addEventListener('change', () => rkSet({ sort: sel.value, sortDir: 'desc' }));
  }

  // ── SUPRDUPR PLAYER OF THE WEEK ───────────────────────────────────────────────
  function renderTopChefs() {
    const el = $('topchefs-content');
    let html = '';

    // SuprDupr header
    html += `<div class="lb-card">
      <div class="kchn-header">
        <img class="sd-logo" src="/img/suprdupr.png" alt="SuprDupr" style="height:34px;width:auto;border-radius:5px;display:block">
        <div>
          <h2 class="kchn-title">Player of the Week</h2>
          <p class="kchn-sub">Top performers each week · Presented by SuprDupr</p>
        </div>
      </div>`;

    // Weekly Players of the Week — gender-split winners, newest week first, collapsible
    const wtp = state.standings?.weeklyTopPerformers || [];
    if (wtp.length) {
      const openMap = getChefOpen(wtp);
      wtp.forEach(week => { html += renderWeekPodium(week, !!openMap[week.week]); });
    } else {
      html += `<div style="background:var(--color-surface-2);border-radius:var(--radius-md);padding:var(--space-4);margin-bottom:var(--space-4);">
        <p style="font-size:12px;color:var(--color-text-faint);margin:0;">
          ⏳ Weekly top performers appear here after each match night. Check back after Week 1 (June 8).
        </p>
      </div>`;
    }
    html += `</div>`;

    // Season leaders split by gender
    if (!state.playerStats || state.playerStats.empty) {
      html += `<div class="lb-card">${noData()}</div>`;
      el.innerHTML = html; return;
    }

    const byWinRate = (a, b) => (b._rate - a._rate) || (b._won - a._won);
    const allChefs = filteredPlayers('all');
    const malePlayers   = allChefs.filter(p => /^m/i.test(p.gender || '')).sort(byWinRate);
    const femalePlayers = allChefs.filter(p => /^f/i.test(p.gender || '')).sort(byWinRate);

    const chefRows = (list, limit) => list.slice(0, limit).map((p, i) => {
      const pct = Math.round(p._rate * 100);
      return `<tr class="${i===0?'rank-row--leader':''}">
        <td><span class="rank-num ${i===0?'rank-num--1':i===1?'rank-num--2':i===2?'rank-num--3':''}">${i+1}</span></td>
        <td>
          <div class="player-cell">
            <div class="player-avatar ${/^f/i.test(p.gender||'')?'player-avatar--f':''}">${avInner(p)}</div>
            <div>
              <div class="player-name">${playerLinkHtml(p.name, p.teamName)}</div>
              <div class="player-team">${teamLinkHtml(p.teamName, p.teamId)}</div>
            </div>
          </div>
        </td>
        <td class="r"><strong>${p._won}–${p._played-p._won}</strong></td>
        <td class="r"><span class="${pct>=65?'win-pct':'win-pct--low'}">${pct}%</span></td>
      </tr>`;
    }).join('');

    html += `<div class="chefs-grid">
      <div class="lb-card">
        <h2 class="lb-card__title">🔥 Top Male Players</h2>
        <p class="lb-card__sub">Season leaders · win rate</p>
        <table class="rank-table">
          <thead><tr><th>#</th><th>Player</th><th class="r">W–L</th><th class="r">Win%</th></tr></thead>
          <tbody>${chefRows(malePlayers,8)||'<tr><td colspan="4">'+noData()+'</td></tr>'}</tbody>
        </table>
      </div>
      <div class="lb-card">
        <h2 class="lb-card__title">🔥 Top Female Players</h2>
        <p class="lb-card__sub">Season leaders · win rate</p>
        <table class="rank-table">
          <thead><tr><th>#</th><th>Player</th><th class="r">W–L</th><th class="r">Win%</th></tr></thead>
          <tbody>${chefRows(femalePlayers,8)||'<tr><td colspan="4">'+noData()+'</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;

    el.innerHTML = html;
    wireChefs(el);
  }

  function renderWeekPodium(week, open) {
    // week: { week, label, date, men:[top3], women:[top3] } — each: {name, teamName, teamId, gender, dsr, w, l, diff}
    const LIME = 'var(--color-lime)', TEAL = 'var(--color-teal)';
    const fmtDate = iso => { if (!iso) return ''; try { return new Date(iso).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }); } catch { return esc(iso); } };

    const winnerCard = (p, accent, ghost) => {
      if (!p) return `<div class="pow-winner"><span style="color:var(--color-text-faint);font-size:12px">—</span></div>`;
      return `<div class="pow-winner" style="border-color:${accent};background:${ghost}">
        <div class="pow-winner__top">
          <div class="player-avatar" style="color:${accent};border-color:${accent}">${avInner(p)}</div>
          <div style="min-width:0">
            <div class="pow-winner__name">👑 ${playerLinkHtml(p.name, p.teamName)}</div>
            <div class="player-team">${teamLinkHtml(p.teamName, p.teamId)}</div>
          </div>
        </div>
        <div class="pow-winner__stats">
          <span class="pow-winner__dsr" style="color:${accent}">${Number(p.dsr).toFixed(1)}<span style="font-size:9px;color:var(--color-text-faint);font-weight:600"> DSR</span></span>
          <span class="pow-winner__rec">${p.w}W–${p.l}L · ${p.diff>=0?'+':''}${p.diff}</span>
        </div>
      </div>`;
    };
    const mention = (p, place) => p ? `<div class="pow-mention">
      <span style="font-weight:900;color:${place===2?'#c0c8d0':'#cd7f32'}">${place}</span>
      <span class="pow-mention__name">${playerLinkHtml(p.name, p.teamName)}</span>
      <span class="pow-mention__team">· ${esc(p.teamName||'')}</span>
      <span class="pow-mention__dsr">${Number(p.dsr).toFixed(1)} DSR</span>
    </div>` : '';
    const column = (list, label, accent, ghost) => {
      if (!list || !list.length) return '';
      return `<div>
        <div class="pow-col-label" style="color:${accent}">${label}</div>
        ${winnerCard(list[0], accent, ghost)}
        <div class="pow-mentions">${mention(list[1],2)}${mention(list[2],3)}</div>
      </div>`;
    };
    const chip = (p, accent) => p ? `<div class="pow-chip">
      <div class="player-avatar" style="width:26px;height:26px;font-size:9px;color:${accent};border-color:${accent}">${avInner(p)}</div>
      <div style="min-width:0">
        <div class="pow-chip__name">👑 ${playerLinkHtml(p.name, p.teamName)}</div>
        <div class="player-team">${esc(p.teamName||'')}</div>
      </div>
      <span class="pow-chip__dsr" style="color:${accent}">${Number(p.dsr).toFixed(1)}</span>
    </div>` : '<div class="pow-chip"><span style="color:var(--color-text-faint);font-size:12px">—</span></div>';

    const body = open
      ? `<div class="pow-cols">
           ${column(week.men, "Men's winner", LIME, 'var(--color-lime-ghost)')}
           ${column(week.women, "Women's winner", TEAL, 'var(--color-teal-dim)')}
         </div>`
      : `<div class="pow-collapsed">${chip(week.men && week.men[0], LIME)}${chip(week.women && week.women[0], TEAL)}</div>`;

    return `<div class="week-block">
      <div class="chef-week-head" data-chef-week="${week.week}">
        <span class="chef-week-caret" style="transform:rotate(${open ? '90' : '0'}deg)">▶</span>
        <span class="chef-week-label">📅 ${esc(week.label)}${week.date ? ' · ' + esc(fmtDate(week.date)) : ''}</span>
      </div>
      ${body}
    </div>`;
  }

  // Collapse state for weekly Players of the Week — persisted; newest week open by default.
  function getChefOpen(weeks) {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('ds-chef-open') || '{}'); } catch {}
    const newest = Math.max(...weeks.map(w => w.week));
    const out = {};
    for (const w of weeks) out[w.week] = (String(w.week) in saved) ? !!saved[w.week] : (w.week === newest);
    return out;
  }
  function setChefOpen(week, open) {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('ds-chef-open') || '{}'); } catch {}
    saved[week] = open;
    try { localStorage.setItem('ds-chef-open', JSON.stringify(saved)); } catch {}
  }
  function wireChefs(el) {
    const weeks = state.standings?.weeklyTopPerformers || [];
    const openMap = getChefOpen(weeks);
    el.querySelectorAll('[data-chef-week]').forEach(h => h.addEventListener('click', () => {
      const wk = Number(h.dataset.chefWeek);
      setChefOpen(wk, !openMap[wk]);
      renderTopChefs();
    }));
  }

  // ── HOT STREAKS ──────────────────────────────────────────────────
  function renderStreaks() {
    const el = $('streaks-content');
    const players = playerList().filter(p => p.gamesPlayed > 0);

    const stub = `<div class="coming-soon">
      <div class="coming-soon__icon">🔥</div>
      <div>
        <p class="coming-soon__title">Match-by-match form tracking coming after Week 1</p>
        <p class="coming-soon__body">
          Last-10-games W/L dots and active win streaks will appear here once match data is recorded.
          Until then, season-to-date totals are shown below.
        </p>
      </div>
    </div>`;

    if (!players.length) {
      el.innerHTML = stub + `<div class="lb-card">${noData()}</div>`;
      return;
    }

    // Derive current form proxy: sort by win rate among players with 5+ games
    const ranked = [...players]
      .filter(p => p.gamesPlayed >= 3)
      .sort((a,b) => {
        const ra = a.gamesWon/a.gamesPlayed, rb = b.gamesWon/b.gamesPlayed;
        return rb !== ra ? rb - ra : b.gamesWon - a.gamesWon;
      });

    const streakRows = ranked.slice(0, 15).map((p, i) => {
      const rate = Math.round(100*p.gamesWon/p.gamesPlayed);
      const isHot = rate >= 70 && p.gamesWon >= 5;
      const badge = isHot ? '<span class="streak-badge streak-badge--hot">Hot</span>' : '';
      const avCls = p.gender==='female' ? 'player-avatar--f' : '';

      // Simulate form dots from win rate (proxy until real game-order data)
      const approxWins = Math.round(Math.min(p.gamesWon, 10) * (rate/100));
      const dots = Array.from({length:Math.min(p.gamesPlayed,10)}, (_,j) =>
        `<div class="form-dot form-dot--${j < Math.round(Math.min(p.gamesPlayed,10)*p.gamesWon/p.gamesPlayed) ? 'w':'l'}">${j < Math.round(Math.min(p.gamesPlayed,10)*p.gamesWon/p.gamesPlayed)?'W':'L'}</div>`
      ).join('');
      const score = `${Math.round(Math.min(p.gamesPlayed,10)*p.gamesWon/p.gamesPlayed)}/${Math.min(p.gamesPlayed,10)}`;

      return `<tr>
        <td>
          <div class="player-cell">
            <div class="player-avatar ${avCls}">${avInner(p)}</div>
            <div>
              <div class="player-name">${playerLinkHtml(p.name, p.teamName)} ${badge}</div>
              <div class="player-team">${teamLinkHtml(p.teamName, p.teamId)}</div>
            </div>
          </div>
        </td>
        <td><div class="form-dots">${dots}</div></td>
        <td class="r"><span class="form-score">${score}</span></td>
      </tr>`;
    }).join('');

    el.innerHTML = stub + `<div class="lb-card">
      <h2 class="lb-card__title">Season Form</h2>
      <p class="lb-card__sub">Approximated from season totals · Exact last-10 form unlocks after Week 1</p>
      <div style="overflow-x:auto">
        <table class="streak-table">
          <thead><tr>
            <th>Player</th>
            <th>Last 10 Games (approx)</th>
            <th style="text-align:right">Form</th>
          </tr></thead>
          <tbody>${streakRows || '<tr><td colspan="3">'+noData()+'</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
  }

  // ── LADDER (open-play rankings, one board per calendar month) ─────
  // Richard, 2026-10-05: the ladder season is split into automatic calendar
  // months. public-ladder-stats returns `periods` (months with scored
  // ladders) and `champions` (#1 of each month) on every call, and
  // `?period=YYYY-MM` scopes the board to one month. One ladder is enough to
  // be ranked on a month board. Ranked by the ladder rule: wins → point diff
  // → Dink Rating (DR and XP are career-wide and never reset with the month).
  // The team chip comes from public-ladder-teams, which resolves each ladder
  // id to a league roster by IDENTITY (roster id / email across every
  // season) — never by display name.
  state.ladderBy = {};            // 'all' | 'YYYY-MM' → response
  state.ladderPeriod = state.ladderPeriod || null;
  state.ladderSort = 'w'; state.ladderDiv = 'all'; state.ladderQ = ''; state.ladderAll = false;
  const LD_AV = {}, LD_AV_ASKED = new Set();
  const LD_MIN_LADDERS = 1;

  async function fetchLadder(period) {
    const key = period || 'all';
    if (state.ladderBy[key]) return state.ladderBy[key];
    try {
      const r = await fetch('/.netlify/functions/public-ladder-stats' + (period && period !== 'all' ? '?period=' + encodeURIComponent(period) : ''));
      state.ladderBy[key] = r.ok ? await r.json() : { hasData:false, periods:[], champions:[] };
    } catch { state.ladderBy[key] = { hasData:false, periods:[], champions:[] }; }
    return state.ladderBy[key];
  }
  async function loadLadderTab() {
    const el = $('ladder-content'); if (!el) return;
    const base = await fetchLadder('all');
    const periods = base.periods || [];
    if (!state.ladderPeriod || (state.ladderPeriod !== 'all' && !periods.some(p => p.key === state.ladderPeriod))) {
      state.ladderPeriod = periods[0] ? periods[0].key : 'all';
    }
    renderLadderMonths();
    if (state.ladderPeriod !== 'all') { renderLadder(); await fetchLadder(state.ladderPeriod); }
    renderLadder();                 // paint immediately (chips + photos fill in below)
    await ensureLadderTeams();
    renderLadder();
  }
  function ladderCur() { return state.ladderBy[state.ladderPeriod || 'all'] || null; }
  function ladderPeriodMeta() {
    const base = state.ladderBy.all || {};
    return (base.periods || []).find(p => p.key === state.ladderPeriod) || null;
  }
  // Team lookup for every ladder id on the all-time board, keyed by the season
  // being viewed (the chip prefers a roster in THAT season). Re-fetched on switch.
  async function ensureLadderTeams() {
    const rows = (state.ladderBy.all && state.ladderBy.all.leaderboard) || [];
    const ids = [...new Set(rows.map(r => r.id).filter(Boolean))];
    if (!ids.length) { state.ladderTeams = { circuit: state.circuit, map: {} }; return; }
    if (state.ladderTeams && state.ladderTeams.circuit === state.circuit) return;
    try {
      const r = await fetch('/.netlify/functions/public-ladder-teams?circuit=' + encodeURIComponent(state.circuit) + '&ids=' + encodeURIComponent(ids.join(',')));
      const j = r.ok ? await r.json() : { teams:{} };
      state.ladderTeams = { circuit: state.circuit, map: j.teams || {} };
    } catch { state.ladderTeams = { circuit: state.circuit, map: {} }; }
  }
  function ladderChip(r) {
    const lt = state.ladderTeams;
    if (!lt || lt.circuit !== state.circuit) return '';   // still resolving — no guess
    const t = lt.map[r.id];
    if (!t) return '<span class="ladder-chip ladder-chip--fa">Free agent</span>';
    if (t.current) return '<span class="ladder-chip ladder-chip--team">' + esc(t.name) + '</span>';
    const tag = String(t.season || '').replace(/^Season\s+/i, 'S');
    return '<span class="ladder-chip ladder-chip--past" title="' + esc(t.season || '') + '">' + esc(t.name) + '<small>' + esc(tag) + '</small></span>';
  }
  // Approved profile photos for the ids on screen, one call, painted when they land.
  async function ensureLadderAvatars(ids) {
    const want = [...new Set(ids)].filter(id => id && !LD_AV_ASKED.has(id));
    if (!want.length) return;
    want.forEach(id => LD_AV_ASKED.add(id));
    try {
      const r = await fetch('/.netlify/functions/public-ladder-avatars?ids=' + encodeURIComponent(want.join(',')));
      const j = r.ok ? await r.json() : {};
      const got = j.photos || {};
      if (Object.keys(got).length) { Object.assign(LD_AV, got); renderLadder(); }
    } catch {}
  }
  const ldHref = r => '/profile?ladderId=' + encodeURIComponent(r.id || '');
  const ldIni = n => String(n || '').trim().split(/\s+/).map(x => x[0] || '').join('').slice(0, 2).toUpperCase();
  const ldAv = (r, cls) => LD_AV[r.id]
    ? '<span class="' + cls + '"><img src="' + esc(LD_AV[r.id]) + '" alt="" loading="lazy"></span>'
    : '<span class="' + cls + '">' + esc(ldIni(r.name)) + '</span>';
  const ldSg = n => (n > 0 ? '+' : '') + (n ?? 0);
  const ldMv = r => {
    if (state.ladderPeriod === 'all') return '';
    if (r.rankDelta == null) return '<span class="rk-mv" title="First ladder this month">new</span>';
    if (!r.rankDelta) return '<span class="rk-mv">—</span>';
