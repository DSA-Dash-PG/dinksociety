  <!-- Resolves which season this page shows (?season= / ?circuit=, else the

  <style>
    .nvz-shell { max-width: 1080px; margin: 0 auto; padding: 0 var(--gutter) 80px; }
    .nvz-hero { text-align:center; padding: 92px var(--gutter) 8px; }
    @media (max-width: 900px) { .nvz-hero { padding-top: 84px; } }
    .nvz-hero h1 { font-size:clamp(2rem,1.3rem+2.4vw,3rem); font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:-.02em; margin:0; }
    .nvz-hero h1 .lime { color:var(--color-lime); }
    .nvz-hero p { color:var(--color-text-muted); font-size:14px; margin-top:8px; }
    .nvz-hero .disc { margin-top:12px; font-size:12px; font-weight:800; font-style:italic; color:var(--color-gold); }
    .nvz-hero .rule { width:60px; height:3px; background:var(--color-lime); border-radius:2px; margin:14px auto 0; }

    .tabs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:22px auto 8px; }
    .tab { font:inherit; font-size:12.5px; font-weight:700; padding:8px 15px; border-radius:var(--radius-full); border:1px solid var(--color-border-strong); background:transparent; color:var(--color-text-muted); cursor:pointer; transition:all var(--transition); white-space:nowrap; }
    .tab:hover { color:var(--color-text); border-color:var(--color-text-muted); }
    .tab.on { background:var(--color-lime); color:var(--color-text-inverse); border-color:var(--color-lime); }

    .panel { display:none; padding:18px 0 0; }
    .panel.on { display:block; animation:fade .2s ease; }
    @keyframes fade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    .ptitle { text-align:center; font-size:20px; font-weight:900; font-style:italic; margin-bottom:4px; }
    .psub { text-align:center; font-size:13px; color:var(--color-text-muted); margin-bottom:18px; }

    .card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:20px 22px; margin-bottom:16px; }
    .empty { text-align:center; padding:48px 20px; color:var(--color-text-faint); font-size:14px; }
    .empty b { color:var(--color-text-muted); }

    select { font:inherit; font-size:13px; font-weight:600; padding:11px 14px; border-radius:var(--radius-md); border:1px solid var(--color-border-strong); background:var(--color-surface); color:var(--color-text); cursor:pointer; min-width:230px; max-width:90vw; }
    .h2h-note { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--color-text-faint); margin:16px 0 8px; text-align:center; }



    .pos { color:var(--color-teal); } .neg { color:var(--color-red); } .pos-bg{background:var(--color-teal-dim);color:var(--color-teal);} .neg-bg{background:var(--color-red-dim);color:var(--color-red);}

    .os-sec-h { font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--color-text-faint); margin:4px 0 6px; }
    .os-rk { font-weight:900; color:var(--color-text-faint); font-size:12px; }
    .os-nm { font-weight:800; font-style:italic; text-transform:uppercase; font-size:13px; }


.pc-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
    .pc-tile { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:14px; text-align:center; }
    .pc-tile .v { font-size:24px; font-weight:900; font-variant-numeric:tabular-nums; }
    .pc-tile .v small { font-size:12px; font-weight:700; color:var(--color-text-faint); margin-left:2px; }
    .pc-tile .l { font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--color-text-faint); margin-top:4px; }
    .pc-row { display:grid; grid-template-columns:22px minmax(120px,1.3fr) 2fr repeat(3,64px); gap:10px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--color-divider); font-variant-numeric:tabular-nums; font-size:13px; }
    .pc-row:last-child { border-bottom:none; }
    .pc-row.hd { font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--color-text-faint); padding-top:0; }
    .pc-row .c { text-align:right; }
    .pc-bar { height:10px; border-radius:6px; background:var(--color-surface-2); overflow:hidden; }
    .pc-bar i { display:block; height:100%; background:var(--color-lime); border-radius:6px; }
    .pc-bar.teal i { background:var(--color-teal); }
    .pc-g { display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:10px 4px; border-bottom:1px solid var(--color-divider); font-size:13px; }
    .pc-g:last-child { border-bottom:none; }
    .pc-g .m { font-weight:900; font-variant-numeric:tabular-nums; text-align:right; }
    .pc-g .s { grid-column:1 / -1; font-size:11px; color:var(--color-text-faint); }
    .pc-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
    .pc-note { text-align:center; font-size:11px; color:var(--color-text-faint); margin-top:4px; }
    @media (max-width:640px){ .pc-row { grid-template-columns:18px 1fr 56px 56px; } .pc-row .hide-sm { display:none; } }
    .av-c { display:inline-flex; align-items:center; justify-content:center; overflow:hidden; }
    .av-c img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
    .spark { display:block; }

    /* ══ Versus views: Player vs Player + Team vs Team ══════════════════
       Side A is lime, side B is blue (teal read too close to lime, and it was
       also the "winner" colour). The bright value/bar marks who has the edge. */
    .vx { --vx-a:var(--color-lime); --vx-b:#5aa9ff; display:flex; flex-direction:column; gap:16px; }
    [data-theme="light"] .vx { --vx-b:#1f6fd1; }
    .vx-out { display:flex; flex-direction:column; gap:16px; }
    .vx-card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:20px; min-width:0; }
    .vx-card h3 { margin:0; font-size:15px; font-weight:900; font-style:italic; text-transform:uppercase; }
    .vx-hd { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 12px; margin-bottom:12px; }
    .vx-hd span, .vx-note { font-size:12px; color:var(--color-text-muted); }
    .vx-take { margin:0 0 10px; font-size:13px; line-height:1.5; color:var(--color-text-muted); }
    .vx-cols { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
    .vx-cols > .wide { flex:999 1 560px; min-width:0; }
    .vx-cols > .stack { display:flex; flex-direction:column; gap:16px; }
    .vx-cols > .side { flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:16px; }
    .vx-cols > .third { flex:1 1 300px; min-width:0; }
    .vx-cols > .two { flex:2 1 460px; min-width:0; }
    .vx-cols > .half { flex:1 1 400px; min-width:0; }
    .vx-load { text-align:center; padding:22px 12px; color:var(--color-text-faint); font-size:13px; }

    /* matchup bar — stays in view while you scroll */
    .vx-barwrap { position:sticky; top:var(--vx-top,64px); z-index:30; }
    /* embedded: not sticky (the frame never scrolls), so cancel the sticky offset too;
       position:relative + top pushed the bar down over the first card */
    body.nvz-embed .vx-barwrap { position:relative; top:auto; }
    .vx-bar { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; padding:10px 0 14px; background:var(--color-bg); border-bottom:1px solid var(--color-border); }
    .vx-bar.stuck { box-shadow:0 12px 18px -14px rgba(0,0,0,.7); }
    .vx-field { flex:1 1 140px; min-width:0; position:relative; display:flex; flex-direction:column; gap:6px; }
    .vx-field label { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .vx-field.a label { color:var(--vx-a); } .vx-field.b label { color:var(--vx-b); }
    .vx-inp { display:flex; align-items:center; gap:8px; height:46px; padding:0 14px; background:var(--color-surface); border:1px solid var(--color-border-strong); border-radius:var(--radius-full); color:var(--color-text-muted); }
    .vx-field.a .vx-inp { border-color:var(--vx-a); } .vx-field.b .vx-inp { border-color:var(--vx-b); }
    .vx-inp svg { flex:0 0 16px; }
    .vx-inp input { flex:1; min-width:0; width:100%; background:transparent; border:0; outline:0; color:var(--color-text); font:inherit; font-size:15px; font-weight:700; padding:0; text-overflow:ellipsis; }
    .vx-inp:focus-within { box-shadow:0 0 0 2px var(--color-border-strong); }
    .vx-swap { flex:0 0 46px; width:46px; height:46px; border-radius:50%; background:var(--color-surface-2); border:1px solid var(--color-border-strong); color:var(--color-text); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
    .vx-swap:hover { border-color:var(--color-text-muted); }
    .vx-list { position:absolute; top:100%; left:0; margin-top:6px; z-index:40; width:max(100%,270px); max-width:calc(100vw - 24px); background:var(--color-surface); border:1px solid var(--color-border-strong); border-radius:var(--radius-md); padding:6px; max-height:300px; overflow-y:auto; box-shadow:0 18px 40px rgba(0,0,0,.45); }
    .vx-field.b .vx-list { left:auto; right:0; }
    .vx-list[hidden] { display:none; }
    .vx-opt { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:48px; padding:7px 10px; border:0; border-radius:var(--radius-sm); background:transparent; color:var(--color-text); font:inherit; text-align:left; cursor:pointer; }
    .vx-opt.on, .vx-opt:hover { background:var(--color-surface-3); }
    .vx-opt .n { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .vx-opt b { font-size:14px; font-weight:800; } .vx-opt mark { background:none; color:var(--color-lime); }
    .vx-opt small { font-size:12px; color:var(--color-text-muted); }
    .vx-opt .r { font-size:12px; font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .vx-none { padding:14px; font-size:13px; color:var(--color-text-muted); text-align:center; }

    /* hero */
    .vx-hero { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:12px; align-items:start; }
    .vx-side { display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-width:0; }
    .vx-side.b { align-items:flex-end; text-align:right; }
    .vx-av { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:22px; font-weight:900; border:2px solid var(--vx-a); background:var(--color-surface-2); }
    .vx-av .av-c { width:100% !important; height:100% !important; }
    .vx-side.b .vx-av { border-color:var(--vx-b); }
    .vx-nm { display:block; font-size:20px; font-weight:900; font-style:italic; text-transform:uppercase; line-height:1.1; color:var(--vx-a); text-decoration:none; overflow-wrap:anywhere; }
    .vx-side.b .vx-nm { color:var(--vx-b); }
    .vx-sub { font-size:13px; color:var(--color-text-muted); margin-top:4px; }
    .vx-big { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; }
    .vx-side.b .vx-big { flex-direction:row-reverse; }
    .vx-big b { font-size:40px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
    .vx-big span { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--color-text-muted); }
    .vx-chips { display:flex; flex-wrap:wrap; gap:6px; } .vx-side.b .vx-chips { justify-content:flex-end; }
    .vx-chip { font-size:12px; font-weight:700; padding:5px 10px; border-radius:var(--radius-full); background:var(--color-surface-3); white-space:nowrap; }
    .vx-chip.warn { background:var(--color-gold-dim); color:var(--color-gold); }
    .vx-vs { align-self:center; font-size:14px; font-weight:900; font-style:italic; color:var(--color-text-muted); }
    .vx-edge { border-top:1px solid var(--color-border); margin-top:20px; padding-top:16px; display:flex; flex-direction:column; gap:10px; }
    .vx-edge-l { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 10px; font-size:13px; font-weight:800; color:var(--color-text-muted); }
    .vx-edge-l .a { color:var(--vx-a); } .vx-edge-l .b { color:var(--vx-b); }
    .vx-edge-m { display:flex; gap:4px; height:12px; }
    .vx-edge-m i { flex:1; background:var(--color-text-faint); } .vx-edge-m i.a { background:var(--vx-a); } .vx-edge-m i.b { background:var(--vx-b); }
    .vx-edge-m i:first-child { border-radius:9999px 0 0 9999px; } .vx-edge-m i:last-child { border-radius:0 9999px 9999px 0; }
    .vx-verdict { margin:0; max-width:780px; font-size:15px; line-height:1.55; }

    /* stat rows: bars grow out from the centre */
    .vx-row { padding:13px 0; border-top:1px solid var(--color-divider); display:flex; flex-direction:column; gap:7px; }
    .vx-row-h { display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:3px 8px; text-align:center; }
    .vx-row-h b { font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .vx-row-h span { font-size:12px; color:var(--color-text-muted); }
    .vx-row-b { display:flex; align-items:center; gap:10px; }
    .vx-val { width:66px; font-size:20px; font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .vx-val.r { text-align:right; } .vx-val.la { color:var(--vx-a); } .vx-val.lb { color:var(--vx-b); } .vx-val.dim { color:var(--color-text-muted); }
    .vx-tracks { flex:1; min-width:0; display:flex; gap:2px; }
    .vx-track { flex:1; min-width:0; height:10px; background:var(--color-surface-3); display:flex; }
    .vx-track.l { border-radius:9999px 0 0 9999px; justify-content:flex-end; } .vx-track.r { border-radius:0 9999px 9999px 0; }
    .vx-track i { display:block; height:100%; } .vx-track.l i { background:var(--vx-a); border-radius:9999px 0 0 9999px; } .vx-track.r i { background:var(--vx-b); border-radius:0 9999px 9999px 0; }
    .vx-track i.dim { opacity:.35; }
    .vx-row-s { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--color-text-muted); }
    .vx-row-s span:last-child { text-align:right; }
    .vx-row.sm { padding:10px 0; gap:6px; } .vx-row.sm .vx-row-h b { font-size:12px; } .vx-row.sm .vx-val { width:54px; font-size:16px; } .vx-row.sm .vx-track { height:8px; }

    /* head-to-head */
    .vx-h2h { display:flex; align-items:center; justify-content:center; gap:18px; margin:4px 0 8px; }
    .vx-h2h div { text-align:center; min-width:0; } .vx-h2h b { display:block; font-size:56px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
    .vx-h2h small { display:block; font-size:12px; font-weight:700; margin-top:6px; }
    .vx-h2h .dash { font-size:28px; font-weight:900; color:var(--color-text-muted); }
    .vx-h2h .la { color:var(--vx-a); } .vx-h2h .lb { color:var(--vx-b); } .vx-h2h .dim { color:var(--color-text-muted); }
    .vx-cap { text-align:center; font-size:13px; color:var(--color-text-muted); }
    .vx-kv { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:0 12px; align-items:baseline; font-variant-numeric:tabular-nums; margin-top:10px; }
    .vx-kv > * { padding:7px 0; border-top:1px solid var(--color-divider); }
    .vx-kv b { font-size:15px; font-weight:800; } .vx-kv b.r { text-align:right; } .vx-kv b.la { color:var(--vx-a); } .vx-kv b.lb { color:var(--vx-b); } .vx-kv b.dim { color:var(--color-text-muted); }
    .vx-kv span { font-size:12px; color:var(--color-text-muted); text-align:center; }
    .vx-sec { border-top:1px solid var(--color-border); margin-top:14px; padding-top:14px; }
    .vx-sec-h { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; }
    .vx-meet { display:flex; flex-direction:column; gap:2px; padding:8px 0; border-top:1px solid var(--color-divider); font-size:12px; }
    .vx-meet .t { display:flex; justify-content:space-between; gap:8px; font-weight:800; font-size:13px; font-variant-numeric:tabular-nums; }
    .vx-meet .t .la { color:var(--vx-a); } .vx-meet .t .lb { color:var(--vx-b); }
    .vx-meet .d { color:var(--color-text-muted); line-height:1.4; }

    /* DSR breakdown table */
    .vx-tbl { display:grid; grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr)); gap:0 8px; align-items:baseline; font-variant-numeric:tabular-nums; }
    .vx-tbl > * { padding:9px 0; border-top:1px solid var(--color-divider); font-size:14px; font-weight:800; text-align:right; }
    .vx-tbl > .k { text-align:left; font-size:13px; font-weight:700; }
    .vx-tbl > .h { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--color-text-muted); border-top:0; padding-top:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .vx-tbl > .h.a { color:var(--vx-a); } .vx-tbl > .h.b { color:var(--vx-b); }
    .vx-tbl > .tot { border-top-color:var(--color-border-strong); font-size:16px; font-weight:900; } .vx-tbl > .k.tot { font-size:13px; text-transform:uppercase; }
    .vx-tbl .la { color:var(--vx-a); } .vx-tbl .lb { color:var(--vx-b); } .vx-tbl .dim { color:var(--color-text-muted); }

    /* game-by-game strip + DSR trend */
    .vx-form { display:flex; flex-wrap:wrap; gap:24px 32px; align-items:flex-start; }
    .vx-form > .strips { flex:999 1 500px; min-width:0; display:flex; flex-direction:column; gap:22px; }
    .vx-form > .trend { flex:1 1 280px; min-width:0; }
    .vx-strip-h { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 12px; margin-bottom:10px; }
    .vx-strip-h b { font-size:14px; font-weight:900; font-style:italic; text-transform:uppercase; }
    .vx-strip.a .vx-strip-h b { color:var(--vx-a); } .vx-strip.b .vx-strip-h b { color:var(--vx-b); }
    .vx-strip-h span { font-size:12px; color:var(--color-text-muted); } .vx-strip-h em { font-style:normal; font-weight:800; color:var(--color-text); letter-spacing:.12em; }
    .vx-weeks { display:flex; flex-wrap:wrap; gap:14px 12px; }
    .vx-wk-h { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--color-text-muted); margin-bottom:6px; white-space:nowrap; }
    .vx-wk-g { display:flex; }
    .vx-g { width:26px; display:flex; flex-direction:column; align-items:center; }
    .vx-g .up { width:100%; height:40px; border-bottom:1px solid var(--color-border-strong); display:flex; align-items:flex-end; justify-content:center; }
    .vx-g .dn { width:100%; height:40px; display:flex; align-items:flex-start; justify-content:center; }
    .vx-g i { width:13px; display:block; } .vx-g .up i { border-radius:3px 3px 0 0; } .vx-g .dn i { border-radius:0 0 3px 3px; background:var(--color-text-faint); }
    .vx-strip.a .vx-g .up i { background:var(--vx-a); } .vx-strip.b .vx-g .up i { background:var(--vx-b); }
    .vx-g span { font-size:10px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; min-height:13px; } .vx-g.l span { color:var(--color-text-muted); }
    .vx-trend { width:100%; max-width:420px; height:auto; display:block; }
    .vx-trend polyline { fill:none; stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }

<body data-page="nvz">
  <div data-partial="nav"></div>

  <div class="nvz-hero">
    <h1>The <span class="lime">NVZ</span> 🔍</h1>
    <p>Deep dives, matchups &amp; nerdy breakdowns</p>
    <div class="disc">⚠️ For Extra Entertainment Purposes Only ⚠️</div>
    <div class="rule"></div>
  </div>

  <div class="nvz-shell">
    <div class="tabs" id="tabs"></div>
    <div id="panels"><div class="empty">Loading the lab&hellip;</div></div>
  </div>

  <div data-partial="footer"></div>
  <script src="/js/partials.js"></script>
  <script>
  (function () {
    var SEASON_ID = new URLSearchParams(location.search).get('season') || 'circuit-i';
    // Season ids come in several shapes ('circuit-i', 'season-2', a bare '2').
    // Chopping off a literal 'circuit-' turned 'season-1' into 'SEASON-1', which
    // matches no stats blob. dsSeason() overwrites this once it resolves; this is
    // only the pre-resolution guess.
    function codeFromId(id) {
      var ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
      var roman = function (n) { return (n >= 1 && n <= 10) ? ROMAN[n] : String(n); };
      var s = String(id || '').trim();
      if (!s) return 'I';
      if (/^(TEST|[IVX]+)$/i.test(s)) return s.toUpperCase();
      if (/^(circuit|season)-/i.test(s)) {
        var t = s.replace(/^(circuit|season)-/i, '').trim();
        return /^\d+$/.test(t) ? roman(parseInt(t, 10)) : t.toUpperCase();
      }
      if (/^\d+$/.test(s)) return roman(parseInt(s, 10));
      var m = s.match(/season\s*(\d+)/i);   // display name: "Season 2" → II
      if (m) return roman(parseInt(m[1], 10));
      return s.toUpperCase();
    }
    var CIRCUIT = codeFromId(SEASON_ID);
    var LINK_SUFFIX = SEASON_ID === 'circuit-i' ? '' : '&season=' + encodeURIComponent(SEASON_ID);

    // When embedded in the Leaderboard tab (?embed=1): strip chrome and report our
    // height to the parent so the iframe auto-sizes (no nested scrollbar).
    var QS = new URLSearchParams(location.search);
    var EMBED = QS.get('embed') === '1';
    // Two sets of views share this page: 'versus' (Player Matchup + Team Matchup, the
    // leaderboard's two matchup tabs) and the NVZ proper (everything else).
    var SET = QS.get('set') === 'versus' ? 'versus' : 'nvz', START = QS.get('tab') || '', CURTAB = '';
    if (SET === 'versus') document.body.classList.add('nvz-versus');
    if (EMBED) {
      document.body.classList.add('nvz-embed');
      var postH = function () { try { parent.postMessage({ nvzHeight: Math.ceil(document.body.getBoundingClientRect().height), nvzTab: CURTAB }, '*'); } catch (e) {} };
      window.addEventListener('load', postH);
      window.addEventListener('resize', postH);
      if (window.ResizeObserver) { try { new ResizeObserver(postH).observe(document.body); } catch (e) {} }
      setInterval(postH, 1200); // safety net for late chart/select renders
    }

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    function sgn(n){ return (n>0?'+':n<0?'−':'')+Math.abs(n); }
    function r1(n){ return Math.round(n*10)/10; }
    function ini(n){ var p=String(n||'').trim().split(/\s+/); return ((p[0][0]||'')+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
    function pct(w,n){ return n? Math.round(w/n*100):0; }
    var COL=['#e0533f','#8b5cf6','#5cc8e0','#2bb1a0','#e08a2b','#7acc00','#d06ba0','#f0c040'];
    function colorFor(n){ var s=0; n=String(n||''); for(var i=0;i<n.length;i++)s+=n.charCodeAt(i); return COL[s%COL.length]; }
    function pHref(p){ return '/player?team='+encodeURIComponent(slug(p.t||''))+'&name='+encodeURIComponent(p.n)+LINK_SUFFIX; }
    function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
    function avatar(p, sz){
      var s = sz||34;
      var box = 'width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+colorFor(p.n)+';font-size:'+Math.round(s*0.38)+'px;font-weight:900;color:#fff;';
      var ic = esc(ini(p.n));
      // Prefer server photoUrl; undefined = legacy data → blind id request; null = no photo → initials.
      var src = p.photoUrl ? p.photoUrl : ((p.photoUrl===undefined && p.id) ? '/.netlify/functions/player-photo-serve?id='+encodeURIComponent(p.id) : null);
      var inner = src ? ('<img src="'+src+'" alt="" loading="lazy" onerror="this.outerHTML=&quot;'+ic+'&quot;">') : ic;
      return '<span class="av-c" style="'+box+'">'+inner+'</span>';
    }

    var PLAYERS=[], PBYID={}, TEAMS=[], TBYID={}, TBYNAME={}, MAXGP=1, LEAGUE_WIN=50, NEED=0, WEEKS=0;

    function derive(raw){
      var gp=raw.gamesPlayed||0;
      var gd=Array.isArray(raw.gameDiffs)?raw.gameDiffs:[];
      var cons=null;
      if(gd.length>=2){ var m=gd.reduce(function(s,d){return s+d;},0)/gd.length; var v=gd.reduce(function(s,d){return s+(d-m)*(d-m);},0)/gd.length; cons=Math.max(0,Math.round((1-Math.sqrt(v)/8)*100)); }
      var gsc=raw.gamesScored||0;
      return {
        id:raw.playerId, photoUrl:raw.photoUrl, n:raw.name, t:raw.teamName||'', g:(raw.gender||''),
        gp:gp, w:raw.gamesWon||0, l:raw.gamesLost||0,
        win: pct(raw.gamesWon||0, gp),
        clutch: raw.clutchG? Math.round((raw.clutchW/raw.clutchG)*100) : pct(raw.gamesWon||0,gp),
        diff: gp? r1(raw.diff/gp):0,
        aps: gsc? r1(raw.ps/gsc) : (gp? r1(raw.ps/gp):0),
        apa: gsc? r1(raw.pa/gsc) : (gp? r1(raw.pa/gp):0),
        cons: cons,
        dsr: raw.composite!=null? r1(raw.composite):null,
        byType: raw.byType||{womens:{played:0,won:0},mens:{played:0,won:0},mixed:{played:0,won:0}},
        partners: raw.partners||{}, opponents: raw.opponents||{}, gameDiffs: gd,
        // versus views
        q: !!raw.dsrQualified, cl: raw.clutchG? Math.round((raw.clutchW/raw.clutchG)*100) : null, clutchW: raw.clutchW||0, clutchG: raw.clutchG||0,
        ps: raw.ps||0, pa: raw.pa||0, td: raw.diff||0, share: raw.avgPointsPct!=null? raw.avgPointsPct : null,
        bd: raw.dsrBreakdown||null, hist: Array.isArray(raw.dsrHistory)?raw.dsrHistory:[], wk: Array.isArray(raw.weeklyGameRecords)?raw.weeklyGameRecords:[],
        gDsr: raw.dsrGender!=null?raw.dsrGender:null, xDsr: raw.dsrMixed!=null?raw.dsrMixed:null, gRank: raw.dsrGenderRank!=null?raw.dsrGenderRank:null, xRank: raw.dsrMixedRank!=null?raw.dsrMixedRank:null,
        rd: raw.rankDelta||0, rank: null,
      };
    }

    function isF(g){ return String(g||'').trim().toLowerCase()[0]==='f'; }

    // ════════ load ════════
    Promise.all([
      fetch('/.netlify/functions/public-leaderboard?circuit='+encodeURIComponent(CIRCUIT)+'&view=players').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/.netlify/functions/public-standings?season='+encodeURIComponent(SEASON_ID)).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/.netlify/functions/public-teams?season='+encodeURIComponent(SEASON_ID)).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    ]).then(function(res){
      var pd=res[0], sd=res[1], td=res[2];
      var raw = (pd&&pd.players)||{};
      PLAYERS = Object.keys(raw).map(function(k){return derive(raw[k]);}).filter(function(p){return p.gp>0;});
      PLAYERS.forEach(function(p){ PBYID[p.id]=p; });
      var seenName={}; PLAYERS.forEach(function(p){ PBYKEY[p.t+'|'+p.n]=p; seenName[p.n]=(seenName[p.n]||0)+1; });
      PLAYERS.forEach(function(p){ if(seenName[p.n]===1) PBYNAME[p.n]=p; });
      MAXGP = PLAYERS.reduce(function(m,p){return Math.max(m,p.gp);},1);
      LEAGUE_WIN = PLAYERS.length? Math.round(PLAYERS.reduce(function(s,p){return s+p.win;},0)/PLAYERS.length) : 50;
      // Overall rank: qualified players by DSR (unqualified keep a rating but no rank).
      NEED = (pd&&pd.needGames)||0; WEEKS = (pd&&pd.weeksPlayed)||0;
      PLAYERS.filter(function(p){return p.q&&p.dsr!=null;}).sort(function(a,b){return b.dsr-a.dsr;}).forEach(function(p,i){ p.rank=i+1; });
      // Prefer the server's own end-of-week rank so this matches the Rankings tab and the trend labels.
      PLAYERS.forEach(function(p){ var h=p.hist[p.hist.length-1]; if(p.q && h && h.rank!=null && (!WEEKS || h.week>=WEEKS)) p.rank=h.rank; });

      if(sd&&sd.divisions){
        Object.keys(sd.divisions).forEach(function(d){ (sd.divisions[d].teams||[]).forEach(function(t){ TEAMS.push(t); TBYID[t.teamId]=t; TBYNAME[t.teamName]=t; }); });
      }
      initTabs();
    });

    // ════════ tabs ════════
    var VIEWS=[
      ['pvp','⚔️ Player Matchup', renderPVP],
      ['tvt','🌸 Team Matchup', renderTVT],
      ['splits','🎯 Game Types', renderSplits],
      ['margins','📊 Margins', renderMargins],
      ['partners','🤝 Partners', renderPartners],
      ['sos','💪 Opponents', renderSOS],
      ['rounds','🔁 Round 1 vs 2', renderRounds],
      ['trends','📈 Trends', renderTrends],
      ['pace','⏱️ Game Pace', renderPace],

        if(c0) list.sort(function(a,b){
          if(c0.str) return String(c0.v(a)).localeCompare(String(c0.v(b)))*(-st.dir);

          if(nx||ny) return nx&&ny? String(a.n).localeCompare(String(b.n)) : nx?1:-1;

          + Object.keys(weeks).sort(function(a,b){return b-a;}).map(function(w){
              return '<div class="h2h-note" style="text-align:left;margin-top:12px">Week '+w+'</div>'+weeks[w].slice().sort(function(a,b){return (a.totalMin||999)-(b.totalMin||999);}).map(function(m){
                return '<div class="pc-row" style="grid-template-columns:minmax(150px,1.6fr) 2fr 70px"><span>'+esc(m.home)+' v '+esc(m.away)+'<br><small style="color:var(--color-text-faint)">games '+esc(m.games)+' · '+m.pointsPlayed+' pts played</small></span>'
                  + '<span class="pc-bar"><i style="width:'+Math.round((m.totalMin||0)/maxM*100)+'%"></i></span><span class="c"><b>'+(m.totalMin==null?'—':m.totalMin)+'</b> min</span></div>'; }).join('');
            }).join('')
          + '</div><div class="pc-note">Times come from when each score was entered — close, not exact. ~ = entered two at a time.</div>';
        body.innerHTML=html;
      });
    }
  })();
  </script>
</body>
</html>
