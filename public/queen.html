<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queen of the Court · The Dink Society</title>
<meta name="description" content="The Dink Society women's ladder. The Queen board, every result, the season awards and the photos.">
<meta property="og:title" content="Queen of the Court · The Dink Society">
<meta property="og:description" content="The Dink Society women's ladder. The Queen board, every result, the season awards and the photos.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Dink Society">
<meta property="og:url" content="https://dinksociety.app/queen">
<meta name="theme-color" content="#0e0e0e">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<script>(function(){var t=localStorage.getItem("ds-theme");if(t==="light"){document.documentElement.setAttribute("data-theme","light")}else{document.documentElement.setAttribute("data-theme","dark")}})()</script>
<link rel="stylesheet" href="/css/shared-nav.css">
<link rel="stylesheet" href="/css/pages.css">
<link rel="stylesheet" href="/css/ladder-hub.css">
</head>
<body>
<!-- ═══════════════════════════════════════════════════════════════
     QUEEN OF THE COURT — the women's division on its own page.
     Same hub as /ladders.html (js/ladder-hub.js + css/ladder-hub.css),
     locked to the women's division and wearing the Pearl accent.
     The board here is the Women's board on the ladder page: one set of
     numbers, two front doors.
     ═══════════════════════════════════════════════════════════════ -->
<div data-partial="nav"></div>

<main class="dk brand-queen" id="hub">
  <header class="dk-hero" id="lh-hero"><div class="dk-loading">Loading the ladders…</div></header>
  <div class="dk-bar" id="lh-bar"><div class="dk-wrap dk-bar__in" id="lh-barin"></div></div>
  <div class="dk-wrap dk-stack">
    <div class="dk-panel on" data-panel="overview" id="p-overview"></div>
    <div class="dk-panel" data-panel="results" id="p-results"></div>
    <div class="dk-panel" data-panel="board" id="p-board"></div>
    <div class="dk-panel" data-panel="kitchen" id="p-kitchen"></div>
    <div class="dk-panel" data-panel="photos" id="p-photos"></div>
    <div class="dk-panel" data-panel="rules" id="p-rules"></div>
  </div>
  <!-- Phones: the next ladder stays one tap away once its card scrolls off. -->
  <div class="lh-mbar" id="lh-mbar"></div>
</main>

<!-- Sign-up / payment sheet (filled by openSignup in ladder-hub.js) -->
<div class="ov" id="payOv" role="dialog" aria-modal="true" aria-labelledby="payTitle">
  <div class="sheet">
    <button class="x" type="button" onclick="closeOv('payOv')" aria-label="Close">&times;</button>
    <h3 id="payTitle">Sign up</h3>
    <div class="sub" id="paySub"></div>
    <div id="payBody"></div>
    <div id="payMsg"></div>
  </div>
</div>

<div data-partial="footer"></div>

<script src="/js/partials.js"></script>
<script src="/js/recap-urls.js"></script>
<script src="/js/ds-ui.js"></script>
<script>window.LADDER_HUB = { brand: 'queen', division: 'womens', home: '/queen.html' };</script>
<script src="/js/ladder-hub.js"></script>
</body>
</html>
