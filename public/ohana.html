<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>South Bay Ohana · The Dink Society</title>
  <!-- Private team page: never indexed, not linked from nav or sitemap. -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <script>(function(){var t=localStorage.getItem("ds-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark")})()</script>
  <link rel="stylesheet" href="/css/shared-nav.css" />
  <style>
    .oh { max-width: 760px; margin: 0 auto; padding: 0 var(--gutter) 80px; }
    .oh-hero { padding: 28px 0 18px; }
    .oh-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--color-teal); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .oh-lock { font-size: 9px; padding: 2px 8px; border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); color: var(--color-text-muted); }
    .oh-title { font-size: clamp(30px, 7vw, 46px); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; margin: 8px 0 4px; line-height: 1.02; }
    .oh-sub { font-size: 13px; color: var(--color-text-muted); }
    .oh-rec { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    .oh-chip { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-full); padding:6px 12px; font-size:12px; font-weight:700; font-variant-numeric: tabular-nums; }
    .oh-chip b { color: var(--color-lime); }

    /* Sticky week strip — never scroll back up to jump weeks */
    .oh-strip { position: sticky; top: 0; z-index: 20; background: var(--color-bg); padding: 10px 0; border-bottom: 1px solid var(--color-divider); margin-bottom: 16px; }
    .oh-pills { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling: touch; }
    .oh-pills::-webkit-scrollbar { display:none; }
    .oh-pill { flex-shrink:0; background: var(--color-surface-2); border:1px solid var(--color-border); color: var(--color-text-muted); border-radius: var(--radius-full); padding:6px 12px; font:600 11px Inter, sans-serif; cursor:pointer; white-space:nowrap; }
    .oh-pill .k { font-size:9px; font-weight:800; letter-spacing:.08em; color: var(--color-text-faint); margin-right:4px; }
    .oh-pill.is-next { border-color: var(--color-lime); color: var(--color-lime); background: var(--color-lime-ghost); }
    .oh-pill.is-w { color: var(--color-teal); } .oh-pill.is-l { color: var(--color-red); }
    .oh-pill.is-bye { opacity: .6; }

    .oh-week { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; scroll-margin-top: 64px; }
    .oh-week.is-next { border-color: rgba(184,255,44,.35); background: linear-gradient(135deg, rgba(184,255,44,.08), rgba(23,215,176,.04)), var(--color-surface); }
    .oh-week.is-bye { opacity: .75; padding: 12px 16px; }
    .oh-wk-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .oh-wk-label { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color: var(--color-text-faint); }
    .oh-wk-label .nx { color: var(--color-lime); margin-left:6px; }
    .oh-vs { font-size: 20px; font-weight: 800; margin-top: 4px; }
    .oh-vs small { font-size: 11px; font-weight: 700; color: var(--color-text-faint); text-transform: uppercase; letter-spacing: .08em; margin-left: 6px; }
    .oh-meta { font-size:12px; color: var(--color-text-muted); margin-top:4px; }
    .oh-note { font-size:12px; color: var(--color-gold); margin-top:6px; }
    .oh-res { font-size:22px; font-weight:800; font-variant-numeric: tabular-nums; white-space:nowrap; text-align:right; }
    .oh-res .v { display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    .oh-res.w, .oh-res.w .v { color: var(--color-teal); } .oh-res.l, .oh-res.l .v { color: var(--color-red); }
    .oh-others { font-size:11px; color: var(--color-text-faint); margin-top:10px; }

    .oh-lineup { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:6px; margin-top:14px; }
    @media (max-width: 520px) { .oh-lineup { grid-template-columns: 1fr; } }
    .oh-g { display:flex; align-items:center; gap:8px; background: var(--color-surface-2); border:1px solid var(--color-border); border-radius: var(--radius-sm); padding:8px 10px; font-size:13px; min-width:0; }
    .oh-g .n { font-size:10px; font-weight:800; color: var(--color-text-faint); width:24px; flex-shrink:0; }
    .oh-g .p { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .oh-g .s { font-weight:800; font-variant-numeric: tabular-nums; font-size:12px; }
    .oh-g .s.w { color: var(--color-teal); } .oh-g .s.l { color: var(--color-red); }
    .oh-g.mine { border-color: rgba(23,215,176,.45); } .oh-g.mine .p { color: var(--color-teal); font-weight:700; }
    .oh-g.empty .p { color: var(--color-text-faint); }
    .oh-pending { margin-top:12px; font-size:12px; color: var(--color-text-faint); }
    .oh-you { margin-top:12px; font-size:12px; color: var(--color-text-muted); }
    .oh-you b { color: var(--color-teal); }

    .oh-h2 { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 32px 0 10px; }
    .oh-table { width:100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .oh-table th { text-align:right; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color: var(--color-text-faint); font-weight:800; padding:6px 6px; }
    .oh-table td { text-align:right; padding:8px 6px; border-top: 1px solid var(--color-divider); }
    .oh-table th:first-child, .oh-table td:first-child { text-align:left; }
    .oh-card { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-lg); padding: 14px 16px; }
    .oh-empty { color: var(--color-text-faint); font-size: 13px; }
    .oh-roster { display:flex; flex-wrap:wrap; gap:6px; }
    .oh-tag { font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color: var(--color-lime); margin-left:4px; }

    /* Manager tools */
    .oh-btn { font: 800 12px Inter, sans-serif; border-radius: var(--radius-full); padding: 9px 16px; cursor: pointer; border: 1px solid var(--color-border-strong); background: transparent; color: var(--color-text); }
    .oh-btn.pri { background: var(--color-lime); color: #0e0e0e; border-color: var(--color-lime); }
    .oh-btn.sm { padding: 6px 12px; font-size: 11px; }
    .oh-btn:disabled { opacity: .5; cursor: default; }
    .oh-tools { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
    .oh-ed { margin-top: 14px; border-top: 1px dashed var(--color-border-strong); padding-top: 14px; }
    .oh-ed-row { display:grid; grid-template-columns: 30px 1fr 1fr; gap:6px; margin-bottom:6px; align-items:center; }
    .oh-ed-row.sc { grid-template-columns: 30px 1.4fr 1fr 52px 52px; }
    .oh-ed input, .oh-ed select, .oh-ed textarea, .oh-in { width:100%; background: var(--color-surface-2); border:1px solid var(--color-border); color: var(--color-text); border-radius: 8px; padding: 8px 9px; font: 500 13px Inter, sans-serif; min-width:0; }
    .oh-ed .n { font-size:10px; font-weight:800; color: var(--color-text-faint); }
    .oh-ed .lbl { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color: var(--color-text-faint); margin: 4px 0 6px; }
    .oh-ed .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px; }
    .oh-ed .pairtxt { font-size:12px; color: var(--color-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .oh-chk { display:flex; gap:8px; align-items:center; font-size:12px; color: var(--color-text-muted); margin: 10px 0; }
    .oh-chk input { width:auto; }
    .oh-msg { font-size:12px; margin-top:8px; color: var(--color-teal); min-height: 1em; }
    .oh-msg.err { color: var(--color-red); }
    .oh-sugg { position: relative; }
    .oh-sugg-list { position:absolute; left:0; right:0; top:100%; z-index:30; background: var(--color-surface-2); border:1px solid var(--color-border-strong); border-radius: 8px; margin-top:4px; overflow:hidden; }
    .oh-sugg-list button { display:block; width:100%; text-align:left; background:none; border:0; color: var(--color-text); padding:9px 10px; font: 500 13px Inter, sans-serif; cursor:pointer; }
    .oh-sugg-list button:hover, .oh-sugg-list button.on { background: var(--color-lime-ghost); }
    .oh-sugg-list small { color: var(--color-text-faint); margin-left:6px; }
    .oh-mgr { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:12px; padding:8px 12px; border:1px dashed rgba(255,176,46,.45); border-radius: var(--radius-sm); font-size:12px; color:#ffb02e; }
    .oh-gate { text-align:center; padding: 60px 20px; }
    .oh-gate p { color: var(--color-text-muted); font-size:14px; line-height:1.6; max-width: 380px; margin: 10px auto 22px; }
    .oh-gate a { display:inline-block; }
  </style>
</head>
<body data-page="ohana">
  <div data-partial="nav"></div>
  <main class="oh" id="app">
    <div class="oh-gate"><div class="oh-sub">Loading…</div></div>
  </main>
  <div data-partial="footer"></div>
  <script src="/js/partials.js"></script>
  <script>
  (function () {
    const API = '/.netlify/functions/';
    const $ = (s, r = document) => r.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    let D = null;
    const open = {};   // weekId → 'lineup' | 'scores' | 'match' | 'finals'
    let asPlayer = false; // manager's "preview as player" (client-side only — the server still decides who can save)

    const fmtDate = (d, opts) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', opts || { weekday: 'short', month: 'short', day: 'numeric' });
    const pct = (x) => (x * 100).toFixed(0) + '%';
    const sign = (n) => (n > 0 ? '+' : '') + n;

    async function load() {
      const res = await fetch(API + 'ohana-data', { credentials: 'include' });
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) return gate('signin');
      if (res.status === 403) return gate('denied', body.email);
      D = body; D.me.isManager = !!D.me.canEdit; D.me.canEdit = D.me.isManager && !asPlayer; render();
    }

    function gate(kind, email) {
      $('#app').innerHTML = kind === 'signin'
        ? `<div class="oh-gate"><div class="oh-eyebrow" style="justify-content:center">South Bay Ohana <span class="oh-lock">Private</span></div>
            <h1 class="oh-title">Team page</h1>
            <p>This page is just for the South Bay Ohana roster. Sign in with the email you use for The Dink Society.</p>
            <a class="oh-btn pri" href="/me.html?next=${encodeURIComponent('/ohana')}">Sign in</a></div>`
        : `<div class="oh-gate"><div class="oh-eyebrow" style="justify-content:center">South Bay Ohana <span class="oh-lock">Private</span></div>
            <h1 class="oh-title">Roster only</h1>
            <p>You're signed in as <b>${esc(email || '')}</b>, which isn't on the South Bay Ohana roster. If that's a mistake, ask your captain to add you.</p></div>`;
    }

    function nextWeekId() {
      const now = Date.now();
      const up = D.weeks.find(w => w.match && w.match.startMs + 3 * 3600e3 > now && !w.match.result);
      return up ? up.id : null;
    }

    function render() {
      const t = D.stats.team;
      const nx = nextWeekId();
      const pills = D.weeks.map(w => {
        const r = w.match?.result;
        const cls = w.id === nx ? 'is-next' : r ? (r.us > r.them ? 'is-w' : r.us < r.them ? 'is-l' : '') : w.bye || w.type === 'rain' ? 'is-bye' : '';
        const short = w.label.replace('Playoffs · ', '').replace(' · Round Robin', ' RR');
        return `<button class="oh-pill ${cls}" data-go="${w.id}"><span class="k">${esc(short)}</span>${fmtDate(w.match?.date || w.date, { month: 'numeric', day: 'numeric' })}${r ? ` · ${r.us}-${r.them}` : w.bye ? ' · bye' : ''}</button>`;
      }).join('');

      $('#app').innerHTML = `
        <section class="oh-hero">
          <div class="oh-eyebrow">${esc(D.league.name)} <span class="oh-lock">Private</span></div>
          <h1 class="oh-title">South Bay Ohana</h1>
          <div class="oh-sub">${esc(D.league.night)} · ${esc(D.league.venue)}${D.me.name ? ` · Signed in as ${esc(D.me.name)}` : ''}</div>
          ${D.me.isManager ? `<div class="oh-mgr">
            <span>${asPlayer ? 'Previewing what players see' : 'Manager view — only you and team managers see these edit tools'}</span>
            <button class="oh-btn sm" id="as-player">${asPlayer ? 'Back to manager view' : 'Preview as player'}</button></div>` : ''}
          <div class="oh-rec">
            <span class="oh-chip">Record <b>${t.mw}-${t.ml}${t.mt ? '-' + t.mt : ''}</b></span>
            <span class="oh-chip">Games <b>${t.gw}-${t.gl}</b></span>
            ${t.pf + t.pa ? `<span class="oh-chip">Points <b>${sign(t.pf - t.pa)}</b></span>` : ''}
          </div>
        </section>
        <div class="oh-strip"><div class="oh-pills">${pills}</div></div>
        <section id="weeks">${D.weeks.map(weekCard).join('')}</section>
        ${standingsSection()}
        ${statsSection()}
        ${rosterSection()}
        ${D.me.canEdit ? messageSection() : ''}
      `;
      bind();
    }

    function othersLine(w) {
      if (!w.others.length) return '';
      const one = (o) => {
        const r = o.result;
        const h = r && r.home > r.away ? `<b style="color:var(--color-text)">${esc(o.home)}</b>` : esc(o.home);
        const a = r && r.away > r.home ? `<b style="color:var(--color-text)">${esc(o.away)}</b>` : esc(o.away);
        return `${o.note ? esc(o.note) + ': ' : ''}${h} ${r ? `<span style="font-variant-numeric:tabular-nums">${r.home}-${r.away}</span>` : 'vs'} ${a}`;
      };
      return `<div class="oh-others">${w.match ? 'Also tonight: ' : ''}${w.others.map(one).join(' · ')}</div>`;
    }
    const finalsBtn = (w) => D.me.canEdit && (w.others.some(o => o.homeId && o.awayId) || (w.match && !w.match.detailed))
      ? `<button class="oh-btn sm ${open[w.id] === 'finals' ? 'pri' : ''}" data-open="finals" data-wk="${w.id}">Final scores</button>` : '';

    function weekCard(w) {
      const nx = nextWeekId() === w.id;
      if (!w.match) {
        const title = w.type === 'rain' ? 'Rain makeup date' : w.bye ? 'Bye week' : 'Playoffs — matchup TBD';
        return `<article class="oh-week ${w.bye || w.type === 'rain' ? 'is-bye' : ''}" id="wk-${w.id}">
          <div class="oh-wk-label">${esc(w.label)} · ${fmtDate(w.date)}</div>
          <div class="oh-vs" style="font-size:16px">${title}</div>
          ${w.note ? `<div class="oh-meta">${esc(w.note)}</div>` : ''}
          ${othersLine(w)}
          ${D.me.canEdit ? `<div class="oh-tools">${['semis','finals'].includes(w.type) ? w.others.map(o => `<button class="oh-btn sm" data-playoff="${o.id}" data-wk="${w.id}">Set teams · ${esc(o.note || 'match')}</button>`).join('') : ''}${finalsBtn(w)}</div>
            <div id="pe-${w.id}"></div>${editor(w)}` : ''}
        </article>`;
      }
      const m = w.match;
      const r = m.result;
      const cls = r ? (r.us > r.them ? 'w' : r.us < r.them ? 'l' : '') : '';
      const hasLineup = m.slots.some(s => s.players.some(Boolean));
      const isMe = (p) => p && (p.me || (D.me.email && p.email === D.me.email));
      const mine = m.slots.filter(s => s.players.some(isMe));
      const games = m.slots.filter(s => s.players.some(Boolean) || s.us != null).map(s => {
        const names = s.players.filter(Boolean).map(p => p.name).join(' & ') || 'TBD';
        const sc = s.us != null && s.them != null ? `<span class="s ${s.us > s.them ? 'w' : 'l'}">${s.us}-${s.them}</span>` : '';
        return `<div class="oh-g ${s.players.some(isMe) ? 'mine' : ''}"><span class="n">G${s.no}</span><span class="p" title="${esc(names)}${s.opp.filter(Boolean).length ? ' vs ' + esc(s.opp.filter(Boolean).join(' & ')) : ''}">${esc(names)}</span>${sc}</div>`;
      }).join('');
      return `<article class="oh-week ${nx ? 'is-next' : ''}" id="wk-${w.id}">
        <div class="oh-wk-top">
          <div>
            <div class="oh-wk-label">${esc(w.label)}${nx ? '<span class="nx">● Next up</span>' : ''}</div>
            <div class="oh-vs">vs ${esc(m.opponent)}<small>${m.side === 'home' ? 'Home' : 'Away'}</small></div>
            <div class="oh-meta">${fmtDate(m.date, { weekday: 'long', month: 'short', day: 'numeric' })} · ${esc(m.time)} · Courts ${esc(m.courts)}</div>
            ${m.note ? `<div class="oh-note">${esc(m.note)}</div>` : ''}
            ${w.note ? `<div class="oh-meta">${esc(w.note)}</div>` : ''}
          </div>
          ${r ? `<div class="oh-res ${cls}">${r.us}-${r.them}<span class="v">${r.us > r.them ? 'Win' : r.us < r.them ? 'Loss' : 'Tie'}</span></div>` : ''}
        </div>
        ${hasLineup ? `<div class="oh-lineup">${games}</div>` : `<div class="oh-pending">Lineup not posted yet — you'll get an email when it is.</div>`}
        ${r && !m.detailed ? `<div class="oh-pending">Final score only — no game-by-game sheet.</div>` : ''}
        ${othersLine(w)}
        ${hasLineup && !D.me.canEdit ? `<div class="oh-you">${mine.length ? `You're in <b>${mine.length} game${mine.length === 1 ? '' : 's'}</b>: ${mine.map(s => 'G' + s.no).join(', ')}` : `You're not in the lineup this week.`}</div>` : ''}
        ${D.me.canEdit ? `<div class="oh-tools">
            <button class="oh-btn sm ${open[w.id] === 'lineup' ? 'pri' : ''}" data-open="lineup" data-wk="${w.id}">Lineup</button>
            <button class="oh-btn sm ${open[w.id] === 'scores' ? 'pri' : ''}" data-open="scores" data-wk="${w.id}">Scores</button>
            <button class="oh-btn sm ${open[w.id] === 'match' ? 'pri' : ''}" data-open="match" data-wk="${w.id}">Date / courts</button>
            ${finalsBtn(w)}
          </div>${editor(w)}` : ''}
      </article>`;
    }

    // ── Manager editors ────────────────────────────────────────────────
    function rosterOptions() { return D.roster.map(p => `<option value="${esc(p.name)}"></option>`).join(''); }
    const emailByName = (n) => D.roster.find(p => p.name.toLowerCase() === String(n).trim().toLowerCase())?.email || '';

    function editor(w) {
      const kind = open[w.id]; if (!kind) return '';
      const m = w.match;
      if (kind === 'finals') {
        const rows = [];
        if (m && !m.detailed) rows.push({ id: m.id, home: m.side === 'home' ? 'South Bay Ohana' : m.opponent, away: m.side === 'home' ? m.opponent : 'South Bay Ohana',
          result: m.result ? (m.side === 'home' ? { home: m.result.us, away: m.result.them } : { home: m.result.them, away: m.result.us }) : null, ours: true });
        for (const o of w.others) if (o.homeId && o.awayId) rows.push(o);
        return `<div class="oh-ed" data-ed="finals" data-wk="${w.id}">
          <div class="lbl">Games won — from the PVTC final sheet (leave blank if not in yet)</div>
          ${rows.map(o => `<div class="oh-ed-row sc" data-final="${o.id}" style="grid-template-columns:1fr 52px 52px 1fr">
            <span class="pairtxt" style="text-align:right">${esc(o.home)}</span>
            <input data-k="home" inputmode="numeric" value="${o.result ? o.result.home : ''}" aria-label="${esc(o.home)} games">
            <input data-k="away" inputmode="numeric" value="${o.result ? o.result.away : ''}" aria-label="${esc(o.away)} games">
            <span class="pairtxt">${esc(o.away)}</span></div>`).join('')}
          ${m && !m.detailed ? `<label class="oh-chk"><input type="checkbox" data-notify> Email the team our final score</label>` : ''}
          <button class="oh-btn pri" data-save="finals" data-wk="${w.id}">Save finals</button>
          <div class="oh-msg" data-out></div></div>`;
      }
      if (kind === 'lineup') {
        if (!D.roster.length) return `<div class="oh-ed"><div class="oh-empty">Add players to the roster first (bottom of the page).</div></div>`;
        return `<div class="oh-ed" data-ed="lineup" data-wk="${w.id}">
          <datalist id="dl-roster">${rosterOptions()}</datalist>
          <div class="lbl">Type a name — 12 games</div>
          ${m.slots.map(s => `<div class="oh-ed-row"><span class="n">G${s.no}</span>
            <input list="dl-roster" data-slot="${s.no}" data-i="0" value="${esc(s.players[0]?.name || '')}" placeholder="Player" autocomplete="off">
            <input list="dl-roster" data-slot="${s.no}" data-i="1" value="${esc(s.players[1]?.name || '')}" placeholder="Partner" autocomplete="off"></div>`).join('')}
          <label class="oh-chk"><input type="checkbox" data-notify checked> ${m.lineupSentAt ? 'Email players whose games changed' : 'Email everyone their games'}</label>
          <button class="oh-btn pri" data-save="lineup" data-wk="${w.id}">Save lineup</button>
          <div class="oh-msg" data-out></div></div>`;
      }
      if (kind === 'scores') {
        return `<div class="oh-ed" data-ed="scores" data-wk="${w.id}">
          <div class="lbl">Our score · their score · who we played (optional — builds opponent stats)</div>
          ${m.slots.map(s => `<div class="oh-ed-row sc"><span class="n">G${s.no}</span>
            <span class="pairtxt">${esc(s.players.filter(Boolean).map(p => p.name.split(' ')[0]).join(' & ') || '—')}</span>
            <input data-slot="${s.no}" data-k="opp" value="${esc(s.opp.filter(Boolean).join(' & '))}" placeholder="Opponents">
            <input data-slot="${s.no}" data-k="us" inputmode="numeric" value="${s.us ?? ''}" placeholder="Us">
            <input data-slot="${s.no}" data-k="them" inputmode="numeric" value="${s.them ?? ''}" placeholder="Them"></div>`).join('')}
          <label class="oh-chk"><input type="checkbox" data-notify> Email the team the final score</label>
          <button class="oh-btn pri" data-save="scores" data-wk="${w.id}">Save scores</button>
          <div class="oh-msg" data-out></div></div>`;
      }
      return matchEditor(w.id, m.id, { date: m.date, time: m.time, courts: m.courts, note: m.note });
    }

    function matchEditor(wkId, matchId, v, teams) {
      const opts = (sel) => `<option value="">TBD</option>` + D.league.teams.map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
      return `<div class="oh-ed" data-ed="match" data-wk="${wkId}" data-match="${matchId}">
        ${teams ? `<div class="grid2"><div><div class="lbl">Home</div><select data-f="homeTeamId">${opts(teams.home)}</select></div><div><div class="lbl">Away</div><select data-f="awayTeamId">${opts(teams.away)}</select></div></div>` : ''}
        <div class="grid2"><div><div class="lbl">Date</div><input type="date" data-f="date" value="${esc(v.date || '')}"></div>
          <div><div class="lbl">Time</div><input data-f="time" value="${esc(v.time || '7:00 PM')}"></div></div>
        <div class="grid2"><div><div class="lbl">Courts</div><input data-f="courts" value="${esc(v.courts || '')}"></div>
          <div><div class="lbl">Note</div><input data-f="note" value="${esc(v.note || '')}" placeholder="e.g. Moved for rain"></div></div>
        <label class="oh-chk"><input type="checkbox" data-notify checked> Email the team what changed</label>
        <button class="oh-btn pri" data-save="match" data-wk="${wkId}">Save</button>
        <div class="oh-msg" data-out></div></div>`;
    }

    // ── League table ───────────────────────────────────────────────────
    function standingsSection() {
      const rows = D.standings || [];
      const any = rows.some(r => r.mp);
      const body = any ? `<table class="oh-table"><thead><tr><th>#</th><th style="text-align:left">Team</th><th>MP</th><th>W-L</th><th>Games</th><th>+/-</th></tr></thead><tbody>
        ${rows.map(r => { const us = r.teamId === D.league.ourTeamId; return `<tr style="${us ? 'color:var(--color-lime);font-weight:700' : ''}"><td>${r.rank}</td><td style="text-align:left">${esc(r.name)}</td><td>${r.mp}</td><td>${r.mw}-${r.ml}${r.mt ? '-' + r.mt : ''}</td><td>${r.gw}-${r.gl}</td><td>${sign(r.gd)}</td></tr>`; }).join('')}
        </tbody></table>
        <div style="font-size:11px;color:var(--color-text-faint);margin-top:8px">Ranked by games won, then match wins. All 5 teams make the playoffs — 1st gets a semis bye.</div>`
        : `<div class="oh-empty">Standings fill in as final scores are entered.</div>`;
      return `<h2 class="oh-h2">League table</h2><div class="oh-card">${body}</div>`;
    }

    // ── Stats + roster ─────────────────────────────────────────────────
    function statsSection() {
      const ps = D.stats.players;
      const body = ps.length ? `<table class="oh-table"><thead><tr><th>Player</th><th>Nts</th><th>GP</th><th>W-L</th><th>Win%</th><th>+/-</th></tr></thead><tbody>
        ${ps.map(p => `<tr><td>${esc(p.name)}${p.partners[0] ? `<div style="font-size:10px;color:var(--color-text-faint)">Top partner: ${esc(p.partners[0].name)} (${p.partners[0].w}-${p.partners[0].gp - p.partners[0].w})</div>` : ''}</td><td>${p.nights}</td><td>${p.gp}</td><td>${p.w}-${p.l}</td><td>${pct(p.pct)}</td><td>${sign(p.diff)}</td></tr>`).join('')}
        </tbody></table>` : `<div class="oh-empty">Stats start once the first game scores are in.</div>`;
      const pairs = D.stats.pairs.length ? `<div class="oh-h2" style="margin-top:18px;font-size:11px">Best pairs</div><table class="oh-table"><tbody>
        ${D.stats.pairs.map(p => `<tr><td>${esc(p.pair)}</td><td>${p.w}-${p.gp - p.w}</td><td>${sign(p.diff)}</td></tr>`).join('')}</tbody></table>` : '';
      return `<h2 class="oh-h2">Our stats</h2><div class="oh-card">${body}${pairs}</div>`;
    }

    function rosterSection() {
      const list = D.roster.length ? D.roster.map(p => D.me.canEdit
        ? `<span class="oh-chip" style="font-weight:600">${esc(p.name)}${p.manager ? '<span class="oh-tag">Mgr</span>' : ''}
            <button class="oh-btn sm" style="padding:2px 8px;margin-left:6px" data-mgr="${esc(p.email)}" data-on="${p.manager ? 0 : 1}">${p.manager ? 'Unset mgr' : 'Make mgr'}</button>
            <button class="oh-btn sm" style="padding:2px 8px" data-rm="${esc(p.email)}" aria-label="Remove">✕</button></span>`
        : `<span class="oh-chip" style="font-weight:600">${esc(p.name)}${p.manager ? '<span class="oh-tag">Captain</span>' : ''}</span>`).join('')
        : `<div class="oh-empty">No players yet.</div>`;
      const add = D.me.canEdit ? `<div class="oh-sugg" style="margin-top:12px">
          <input class="oh-in" id="add-q" placeholder="Add a player — type a name" autocomplete="off">
          <div class="oh-sugg-list" id="add-list" hidden></div></div><div class="oh-msg" id="roster-out"></div>` : '';
      return `<h2 class="oh-h2">Roster</h2><div class="oh-card"><div class="oh-roster">${list}</div>${add}</div>`;
    }

    function messageSection() {
      return `<h2 class="oh-h2">Email the team</h2><div class="oh-card oh-ed" style="margin:0;border-top:1px solid var(--color-border)" data-ed="message">
        <input data-f="subject" placeholder="Subject" style="margin-bottom:8px">
        <textarea data-f="text" rows="4" placeholder="Message to everyone on the roster"></textarea>
        <div style="margin-top:10px"><button class="oh-btn pri" data-save="message">Send to team</button></div>
        <div class="oh-msg" data-out></div></div>`;
    }

    // ── Events ─────────────────────────────────────────────────────────
    async function post(payload) {
      const res = await fetch(API + 'ohana-save', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Save failed');
      return body;
    }
    const emailedLine = (e) => e ? (e.note || `Emailed ${e.sent} player${e.sent === 1 ? '' : 's'}${e.failed ? ` (${e.failed} failed)` : ''}.`) : '';

    function bind() {
      const ap = $('#as-player'); if (ap) ap.onclick = () => { asPlayer = !asPlayer; D.me.canEdit = D.me.isManager && !asPlayer; render(); };
      document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => $('#wk-' + b.dataset.go)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
        open[b.dataset.wk] = open[b.dataset.wk] === b.dataset.open ? null : b.dataset.open;
        rerenderWeek(b.dataset.wk);
      });
      document.querySelectorAll('[data-playoff]').forEach(b => b.onclick = () => {
        const w = D.weeks.find(x => x.id === b.dataset.wk);
        const o = w.others.find(x => x.id === b.dataset.playoff);
        $('#pe-' + w.id).innerHTML = matchEditor(w.id, o.id, { date: w.date, time: '7:00 PM', courts: o.courts, note: o.note }, { home: o.homeId, away: o.awayId });
        bindSaves($('#pe-' + w.id));
      });
      bindSaves(document);
      bindRoster();
    }

    function rerenderWeek(id) {
      const w = D.weeks.find(x => x.id === id);
      const el = $('#wk-' + id);
      const tmp = document.createElement('div'); tmp.innerHTML = weekCard(w);
      el.replaceWith(tmp.firstElementChild);
      bind();
    }

    function bindSaves(root) {
      root.querySelectorAll('[data-save]').forEach(btn => btn.onclick = async () => {
        const ed = btn.closest('[data-ed]');
        const out = ed.querySelector('[data-out]');
        const notify = !!ed.querySelector('[data-notify]')?.checked;
        const w = D.weeks.find(x => x.id === btn.dataset.wk);
        let payload;
        try {
          if (btn.dataset.save === 'lineup') {
            const slots = w.match.slots.map(s => ({ no: s.no, players: ['', ''] }));
            for (const inp of ed.querySelectorAll('input[data-slot]')) {
              const v = inp.value.trim(); if (!v) continue;
              const e = emailByName(v);
              if (!e) throw new Error(`"${v}" isn't on the roster — pick a name from the list.`);
              slots[+inp.dataset.slot - 1].players[+inp.dataset.i] = e;
            }
            payload = { action: 'saveLineup', matchId: w.match.id, slots, notify };
          } else if (btn.dataset.save === 'scores') {
            const slots = w.match.slots.map(s => ({ no: s.no, us: null, them: null, opp: ['', ''] }));
            for (const inp of ed.querySelectorAll('input[data-slot]')) {
              const s = slots[+inp.dataset.slot - 1]; const v = inp.value.trim();
              if (inp.dataset.k === 'opp') s.opp = v.split(/\s*(?:&|\/|,| and )\s*/i).slice(0, 2);
              else s[inp.dataset.k] = v === '' ? null : Number(v);
            }
            payload = { action: 'saveScores', matchId: w.match.id, slots, notify };
          } else if (btn.dataset.save === 'finals') {
            btn.disabled = true; out.className = 'oh-msg'; out.textContent = 'Saving…';
            const notes = [];
            const rows = [...ed.querySelectorAll('[data-final]')].map(row => ({ id: row.dataset.final,
              home: row.querySelector('[data-k=home]').value.trim(), away: row.querySelector('[data-k=away]').value.trim() }));
            if (rows.some(x => (x.home === '') !== (x.away === ''))) throw new Error('Enter both scores for each match (or leave both blank).');
            for (const x of rows) {
              const r = await post({ action: 'saveResult', matchId: x.id, home: x.home, away: x.away, notify });
              if (r.note) notes.push(r.note); if (r.emailed) notes.push(emailedLine(r.emailed));
            }
            open[w.id] = null; await load(); flash(w.id, ['Finals saved.', ...notes].join(' ')); return;
          } else if (btn.dataset.save === 'match') {
            payload = { action: 'editMatch', matchId: ed.dataset.match, notify };
            ed.querySelectorAll('[data-f]').forEach(i => payload[i.dataset.f] = i.value);
          } else {
            payload = { action: 'message', notify: true };
            ed.querySelectorAll('[data-f]').forEach(i => payload[i.dataset.f] = i.value);
          }
          btn.disabled = true; out.className = 'oh-msg'; out.textContent = 'Saving…';
          const r = await post(payload);
          if (payload.action === 'message') { out.textContent = emailedLine(r.emailed) || 'Sent.'; ed.querySelectorAll('[data-f]').forEach(i => i.value = ''); btn.disabled = false; return; }
          const msg = ['Saved.', (r.changes && !r.changes.length) ? 'Nothing changed.' : '', emailedLine(r.emailed)].filter(Boolean).join(' ');
          if (w) open[w.id] = null;
          await load();
          flash(w?.id, msg);
        } catch (e) {
          btn.disabled = false; out.className = 'oh-msg err'; out.textContent = e.message;
        }
      });
    }

    function flash(wkId, msg) {
      const el = wkId && $('#wk-' + wkId); if (!el) return;
      const d = document.createElement('div'); d.className = 'oh-msg'; d.textContent = msg; el.appendChild(d);
      setTimeout(() => d.remove(), 6000);
    }

    function bindRoster() {
      const out = $('#roster-out');
      const act = async (payload) => { try { await post(payload); await load(); } catch (e) { if (out) { out.className = 'oh-msg err'; out.textContent = e.message; } } };
      document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (confirm('Remove from the Ohana roster?')) act({ action: 'removePlayer', email: b.dataset.rm }); });
      document.querySelectorAll('[data-mgr]').forEach(b => b.onclick = () => act({ action: 'setManager', email: b.dataset.mgr, manager: b.dataset.on === '1' }));
      const q = $('#add-q'), list = $('#add-list'); if (!q) return;
      let timer = null, hits = [], idx = 0;
      const show = () => {
        if (!hits.length) { list.hidden = true; return; }
        list.innerHTML = hits.map((h, i) => `<button type="button" class="${i === idx ? 'on' : ''}" data-i="${i}">${esc(h.name)}<small>${esc(h.lastTeamName || '')}</small></button>`).join('');
        list.hidden = false;
        list.querySelectorAll('button').forEach(b => b.onmousedown = (ev) => { ev.preventDefault(); pick(hits[+b.dataset.i]); });
      };
      const pick = (h) => { list.hidden = true; q.value = ''; act({ action: 'addPlayer', email: h.email, name: h.name }); };
      q.oninput = () => {
        clearTimeout(timer);
        const v = q.value.trim(); if (v.length < 2) { hits = []; show(); return; }
        timer = setTimeout(async () => {
          const r = await fetch(API + 'ohana-player-search?q=' + encodeURIComponent(v), { credentials: 'include' }).then(r => r.json()).catch(() => ({}));
          hits = r.results || []; idx = 0; show();
        }, 180);
      };
      q.onkeydown = (e) => {
        if (list.hidden) return;
        if (e.key === 'ArrowDown') { idx = Math.min(idx + 1, hits.length - 1); show(); e.preventDefault(); }
        if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); show(); e.preventDefault(); }
        if (e.key === 'Enter' && hits[idx]) { pick(hits[idx]); e.preventDefault(); }
        if (e.key === 'Escape') list.hidden = true;
      };
      q.onblur = () => setTimeout(() => list.hidden = true, 150);
    }

    load().then(() => {
      const nx = D && nextWeekId();
      if (nx && location.hash !== '#top') setTimeout(() => $('#wk-' + nx)?.scrollIntoView({ block: 'start' }), 50);
    }).catch((e) => { console.error(e); $('#app').innerHTML = '<div class="oh-gate"><p>Couldn\'t load the team page — refresh to try again.</p></div>'; });
  })();
  </script>
</body>
</html>
