<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>South Bay Ohana · The Dink Society</title>
  <!-- Private team page: never indexed, not linked from nav or sitemap. -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <script>(function(){var t=localStorage.getItem("ds-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark")})()</script>
  <link rel="stylesheet" href="/css/shared-nav.css" />
  <style>
    .oh { max-width: 760px; margin: 0 auto; padding: 0 var(--gutter) 80px; }
    .oh-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--color-teal); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .oh-lock { font-size: 9px; padding: 2px 8px; border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); color: var(--color-text-muted); }
    .oh-title { font-size: clamp(30px, 7vw, 46px); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; margin: 8px 0 4px; line-height: 1.02; }
    .oh-sub { font-size: 13px; color: var(--color-text-muted); }
    .oh-rec { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    .oh-chip { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-full); padding:6px 12px; font-size:12px; font-weight:700; font-variant-numeric: tabular-nums; }
    .oh-chip b { color: var(--color-lime); }

    /* Sticky week strip — never scroll back up to jump weeks */
    /* top = fixed site nav height (shared-nav.css .ds-nav min-height) */
    .oh-strip { position: sticky; top: 64px; z-index: 20; background: var(--color-bg); padding: 10px 0; border-bottom: 1px solid var(--color-divider); margin-bottom: 16px; }
    .oh-pills { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling: touch; }
    .oh-pills::-webkit-scrollbar { display:none; }
    .oh-pill { flex-shrink:0; background: var(--color-surface-2); border:1px solid var(--color-border); color: var(--color-text-muted); border-radius: var(--radius-full); padding:6px 12px; font:600 11px Inter, sans-serif; cursor:pointer; white-space:nowrap; }
    .oh-pill .k { font-size:9px; font-weight:800; letter-spacing:.08em; color: var(--color-text-faint); margin-right:4px; }
    .oh-pill.is-next { border-color: var(--color-lime); color: var(--color-lime); background: var(--color-lime-ghost); }
    .oh-pill.is-w { color: var(--color-teal); } .oh-pill.is-l { color: var(--color-red); }
    .oh-pill.is-bye { opacity: .6; }

    .oh-week { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; scroll-margin-top: 130px; }
    .oh-week.is-next { border-color: rgba(184,255,44,.35); background: linear-gradient(135deg, rgba(184,255,44,.08), rgba(23,215,176,.04)), var(--color-surface); }
    .oh-week.is-bye { opacity: .75; padding: 12px 16px; }
    .oh-wk-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .oh-wk-label { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color: var(--color-text-faint); }
    .oh-wk-label .nx { color: var(--color-lime); margin-left:6px; }
    .oh-vs { font-size: 20px; font-weight: 800; margin-top: 4px; }
    .oh-vs small { font-size: 11px; font-weight: 700; color: var(--color-text-faint); text-transform: uppercase; letter-spacing: .08em; margin-left: 6px; }
    .oh-meta { font-size:12px; color: var(--color-text-muted); margin-top:4px; }
    .oh-note { font-size:12px; color: var(--color-gold); margin-top:6px; }
    .oh-res { font-size:22px; font-weight:800; font-variant-numeric: tabular-nums; white-space:nowrap; text-align:right; }
    .oh-res .v { display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    .oh-res.w, .oh-res.w .v { color: var(--color-teal); } .oh-res.l, .oh-res.l .v { color: var(--color-red); }
    .oh-others { font-size:11px; color: var(--color-text-faint); margin-top:10px; }

    .oh-lineup { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:6px; margin-top:14px; }
    @media (max-width: 520px) { .oh-lineup { grid-template-columns: 1fr; } }
    .oh-g { display:flex; align-items:center; gap:8px; background: var(--color-surface-2); border:1px solid var(--color-border); border-radius: var(--radius-sm); padding:8px 10px; font-size:13px; min-width:0; }
    .oh-g .n { font-size:10px; font-weight:800; color: var(--color-text-faint); width:24px; flex-shrink:0; }
    .oh-g .p { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .oh-g .s { font-weight:800; font-variant-numeric: tabular-nums; font-size:12px; }
    .oh-g .s.w { color: var(--color-teal); } .oh-g .s.l { color: var(--color-red); }
    .oh-g.mine { border-color: rgba(23,215,176,.45); } .oh-g.mine .p { color: var(--color-teal); font-weight:700; }
    .oh-g.empty .p { color: var(--color-text-faint); }
    .oh-pending { margin-top:12px; font-size:12px; color: var(--color-text-faint); }
    .oh-you { margin-top:12px; font-size:12px; color: var(--color-text-muted); }
    .oh-you b { color: var(--color-teal); }

    .oh-h2 { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 32px 0 10px; }
    .oh-table { width:100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .oh-table th { text-align:right; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color: var(--color-text-faint); font-weight:800; padding:6px 6px; }
    .oh-table td { text-align:right; padding:8px 6px; border-top: 1px solid var(--color-divider); }
    .oh-table th:first-child, .oh-table td:first-child { text-align:left; }
    .oh-card { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-lg); padding: 14px 16px; }
    .oh-empty { color: var(--color-text-faint); font-size: 13px; }
    .oh-roster { display:flex; flex-wrap:wrap; gap:6px; }
    .oh-tag { font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color: var(--color-lime); margin-left:4px; }

    /* Manager tools */
    .oh-btn { font: 800 12px Inter, sans-serif; border-radius: var(--radius-full); padding: 9px 16px; cursor: pointer; border: 1px solid var(--color-border-strong); background: transparent; color: var(--color-text); }
    .oh-btn.pri { background: var(--color-lime); color: #0e0e0e; border-color: var(--color-lime); }
    .oh-btn.sm { padding: 6px 12px; font-size: 11px; }
    .oh-btn:disabled { opacity: .5; cursor: default; }
    .oh-tools { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
    .oh-ed { margin-top: 14px; border-top: 1px dashed var(--color-border-strong); padding-top: 14px; }
    .oh-ed-row { display:grid; grid-template-columns: 30px 1fr 1fr; gap:6px; margin-bottom:6px; align-items:center; }
    .oh-ed-row.sc { grid-template-columns: 30px 1.4fr 1fr 52px 52px; }
    .oh-ed input, .oh-ed select, .oh-ed textarea, .oh-in { width:100%; background: var(--color-surface-2); border:1px solid var(--color-border); color: var(--color-text); border-radius: 8px; padding: 8px 9px; font: 500 13px Inter, sans-serif; min-width:0; }
    .oh-ed .n { font-size:10px; font-weight:800; color: var(--color-text-faint); }
    .oh-ed .lbl { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color: var(--color-text-faint); margin: 4px 0 6px; }
    .oh-ed .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px; }
    .oh-ed .pairtxt { font-size:12px; color: var(--color-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .oh-chk { display:flex; gap:8px; align-items:center; font-size:12px; color: var(--color-text-muted); margin: 10px 0; }
    .oh-chk input { width:auto; }
    .oh-msg { font-size:12px; margin-top:8px; color: var(--color-teal); min-height: 1em; }
    .oh-msg.err { color: var(--color-red); }
    .oh-sugg { position: relative; }
    .oh-sugg-list { position:absolute; left:0; right:0; top:100%; z-index:30; background: var(--color-surface-2); border:1px solid var(--color-border-strong); border-radius: 8px; margin-top:4px; overflow:hidden; }
    .oh-sugg-list button { display:block; width:100%; text-align:left; background:none; border:0; color: var(--color-text); padding:9px 10px; font: 500 13px Inter, sans-serif; cursor:pointer; }
    .oh-sugg-list button:hover, .oh-sugg-list button.on { background: var(--color-lime-ghost); }
    .oh-sugg-list small { color: var(--color-text-faint); margin-left:6px; }
    .oh-hero-lock { font-size: 9px; letter-spacing: .1em; padding: 2px 8px; border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); color: var(--color-text-muted); }
    .oh-photo { position: relative; margin: 0 0 16px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--color-border); background: var(--color-surface); }
    .oh-photo img { display:block; width:100%; max-height: 460px; object-fit: cover; }
    .oh-photo-tools { position:absolute; right:10px; bottom:10px; display:flex; gap:6px; }
    .oh-photo-tools .oh-btn { background: rgba(14,14,14,.75); backdrop-filter: blur(6px); }
    .oh-photo-add { display:flex; align-items:center; justify-content:center; gap:10px; min-height: 140px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-lg); margin-bottom:16px; color: var(--color-text-muted); font-size: 13px; }
    .oh-note-card { background: linear-gradient(135deg, rgba(184,255,44,.10), rgba(23,215,176,.05)), var(--color-surface); border: 1px solid rgba(184,255,44,.28); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 16px; }
    .oh-note-card h3 { font-size: 18px; font-weight: 800; margin: 0 0 6px; }
    .oh-note-card p { font-size: 14px; color: var(--color-text-muted); line-height: 1.6; margin: 0; white-space: pre-line; }
    .oh-note-card .oh-tools { margin-top: 12px; }
    .oh-round { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-faint); margin: 14px 0 6px; display:flex; justify-content:space-between; }
    .oh-round b { color: var(--color-text-muted); }
    .oh-g .t { font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-faint); width: 44px; flex-shrink: 0; }
    .oh-warn { margin-top: 10px; border: 1px solid rgba(255,176,46,.35); background: rgba(255,176,46,.06); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12px; color: #ffb02e; line-height: 1.6; }
    .oh-day { font-size: 12px; color: var(--color-text-muted); margin-top: 10px; line-height: 1.55; }
    .oh-day b { color: var(--color-text); }
    .oh-rules ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; color: var(--color-text); }
    .oh-rules ol li { margin-bottom: 8px; } .oh-rules ol li::marker { color: var(--color-lime); font-weight: 800; }
    .oh-rules details { border-top: 1px solid var(--color-divider); padding: 10px 0; }
    .oh-rules summary { cursor: pointer; font-size: 13px; font-weight: 700; list-style: none; display:flex; justify-content:space-between; }
    .oh-rules summary::after { content: '+'; color: var(--color-text-faint); } .oh-rules details[open] summary::after { content: '–'; }
    .oh-rules details ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--color-text-muted); line-height: 1.6; }
    .oh-rules details li { margin-bottom: 5px; }
    .oh-elig { font-size: 10px; font-weight: 700; margin-left: 6px; } .oh-elig.ok { color: var(--color-teal); } .oh-elig.no { color: var(--color-text-faint); }
    .oh-top { display:flex; flex-direction:column; gap:10px; margin-bottom: 22px; }
    .oh-top .oh-rec { margin-top: 0; }
    /* Clear the fixed site nav (2-line brand on desktop) and keep the hero short. */
    .page-hero--ohana { min-height: 0; margin-bottom: var(--space-4); }
    .page-hero--ohana .page-hero__content { padding: 112px var(--gutter) 8px; width: 100%; max-width: 760px; box-sizing: border-box; }
    @media (max-width: 720px) { .page-hero--ohana .page-hero__content { padding-top: 96px; } }
    .oh-table tr.us td { color: var(--color-lime); font-weight: 700; }
    .oh-table td.tm { text-align: left; }
    .oh-mgr { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:12px; padding:8px 12px; border:1px dashed rgba(255,176,46,.45); border-radius: var(--radius-sm); font-size:12px; color:#ffb02e; }
    .oh-gate { text-align:center; padding: 60px 20px; }
    .oh-gate p { color: var(--color-text-muted); font-size:14px; line-height:1.6; max-width: 380px; margin: 10px auto 22px; }
    .oh-gate a { display:inline-block; }
  </style>
</head>
<body data-page="ohana">
  <div data-partial="nav"></div>
  <div class="page-hero page-hero--ohana">
    <div class="page-hero__bg page-hero__bg--fallback"></div>
    <div class="page-hero__gradient"></div>
    <div class="page-hero__content">
      <div class="page-hero__eyebrow">PVTC Fall 2026 · 3.5 Mixed <span class="oh-hero-lock">Private</span></div>
      <h1 class="page-hero__title">South Bay Ohana</h1>
      <p class="page-hero__sub" id="oh-sub">Tuesdays 7–9pm · PVTC</p>
    </div>
  </div>
  <main class="oh" id="app">
    <div class="oh-gate"><div class="oh-sub">Loading…</div></div>
  </main>
  <div data-partial="footer"></div>
  <script src="/js/partials.js"></script>
  <script>
  (function () {
    const API = '/.netlify/functions/';
    const $ = (s, r = document) => r.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    let D = null;
    const open = {};   // weekId → 'lineup' | 'scores' | 'match' | 'finals'
    let asPlayer = false; // manager's "preview as player" (client-side only — the server still decides who can save)

    const fmtDate = (d, opts) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', opts || { weekday: 'short', month: 'short', day: 'numeric' });
    const pct = (x) => (x * 100).toFixed(0) + '%';
    const sign = (n) => (n > 0 ? '+' : '') + n;

    async function load() {
      const res = await fetch(API + 'ohana-data', { credentials: 'include' });
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) return gate('signin');
      if (res.status === 403) return gate('denied', body.email);
      D = body; D.me.isManager = !!D.me.canEdit; D.me.canEdit = D.me.isManager && !asPlayer; render();
    }

    function gate(kind, email) {
      $('#app').innerHTML = kind === 'signin'
        ? `<div class="oh-gate"><p>This page is just for the South Bay Ohana roster. Sign in with the email you use for The Dink Society.</p>
            <a class="oh-btn pri" href="/me.html?next=${encodeURIComponent('/ohana')}">Sign in</a></div>`
        : `<div class="oh-gate"><p><b>Roster only.</b> You're signed in as <b>${esc(email || '')}</b>, which isn't on the South Bay Ohana roster. If that's a mistake, ask your captain to add you.</p></div>`;
    }

    function nextWeekId() {
      const now = Date.now();
      const up = D.weeks.find(w => w.match && w.match.startMs + 3 * 3600e3 > now && !w.match.result);
      return up ? up.id : null;
    }

    function render() {
      const t = D.stats.team;
      const nx = nextWeekId();
      const pills = D.weeks.map(w => {
        const r = w.match?.result;
        const cls = w.id === nx ? 'is-next' : r ? (r.ptsUs > r.ptsThem ? 'is-w' : r.ptsUs < r.ptsThem ? 'is-l' : '') : w.bye || w.type === 'rain' ? 'is-bye' : '';
        const short = w.label.replace('Playoffs · ', '').replace(' · Round Robin', ' RR');
        return `<button class="oh-pill ${cls}" data-go="${w.id}"><span class="k">${esc(short)}</span>${fmtDate(w.match?.date || w.date, { month: 'numeric', day: 'numeric' })}${r ? ` · ${r.ptsUs} pts` : w.bye ? ' · bye' : ''}</button>`;
      }).join('');

      $('#oh-sub').textContent = `${D.league.night} · ${D.league.venue}${D.me.name ? ` · Signed in as ${D.me.name}` : ''}`;
      const ph = D.league.photo;
      const photo = ph
        ? `<figure class="oh-photo"><img src="${API}ohana-photo?v=${encodeURIComponent(ph.updatedAt)}" alt="South Bay Ohana team photo">
            ${D.me.canEdit ? `<div class="oh-photo-tools"><button class="oh-btn sm" data-photo="pick">Change photo</button><button class="oh-btn sm" data-photo="rm">Remove</button></div>` : ''}</figure>`
        : D.me.canEdit ? `<div class="oh-photo-add"><span>No team photo yet</span><button class="oh-btn sm pri" data-photo="pick">Add team photo</button></div>` : '';
      const top = `${photo}${announcementCard()}<input type="file" id="photo-in" accept="image/*" hidden><div class="oh-msg" id="photo-out" style="min-height:0"></div><div class="oh-top">
          ${D.me.isManager ? `<div class="oh-mgr">
            <span>${asPlayer ? 'Previewing what players see' : 'Manager view — only you and team managers see these edit tools'}</span>
            <button class="oh-btn sm" id="as-player">${asPlayer ? 'Back to manager view' : 'Preview as player'}</button></div>` : ''}
          <div class="oh-rec">
            <span class="oh-chip">League pts <b>${t.pts}</b></span>
            <span class="oh-chip">Record <b>${t.mw}-${t.ml}${t.mt ? '-' + t.mt : ''}</b></span>
            <span class="oh-chip">Games <b>${t.gw}-${t.gl}</b></span>
            <a class="oh-chip" href="#rules" style="text-decoration:none;color:var(--color-text)">Rules ↓</a>
          </div></div>`;
      $('#app').innerHTML = `
        ${top}
        ${standingsSection()}
        <div class="oh-strip"><div class="oh-pills">${pills}</div></div>
        <section id="weeks">${D.weeks.map(weekCard).join('')}</section>
        ${statsSection()}
        ${rosterSection()}
        ${rulesSection()}
        ${D.me.canEdit ? messageSection() : ''}
      `;
      bind();
    }

    function othersLine(w) {
      const bye = (w.byes || []).length ? `<span style="white-space:nowrap">Bye: <b style="color:var(--color-text-muted)">${w.byes.map(esc).join(', ')}</b></span>` : '';
      if (!w.others.length) return bye ? `<div class="oh-others">${bye}</div>` : '';
      const one = (o) => {
        const r = o.result;
        const h = r && r.ptsHome > r.ptsAway ? `<b style="color:var(--color-text)">${esc(o.home)}</b>` : esc(o.home);
        const a = r && r.ptsAway > r.ptsHome ? `<b style="color:var(--color-text)">${esc(o.away)}</b>` : esc(o.away);
        return `${o.note ? esc(o.note) + ': ' : ''}${h} ${r ? `<span style="font-variant-numeric:tabular-nums" title="Games ${r.home}-${r.away}">${r.ptsHome}-${r.ptsAway} pts</span>` : 'vs'} ${a}`;
      };
      return `<div class="oh-others">${w.match ? 'Also tonight: ' : ''}${w.others.map(one).join(' · ')}${bye ? ' · ' + bye : ''}</div>`;
    }
    const finalsBtn = (w) => D.me.canEdit && (w.others.some(o => o.homeId && o.awayId) || (w.match && !w.match.detailed))
      ? `<button class="oh-btn sm ${open[w.id] === 'finals' ? 'pri' : ''}" data-open="finals" data-wk="${w.id}">Final scores</button>` : '';

    function weekCard(w) {
      const nx = nextWeekId() === w.id;
      if (!w.match) {
        const title = w.type === 'rain' ? 'Rain makeup date' : w.bye ? 'Bye week' : 'Playoffs — matchup TBD';
        return `<article class="oh-week ${w.bye || w.type === 'rain' ? 'is-bye' : ''}" id="wk-${w.id}">
          <div class="oh-wk-label">${esc(w.label)} · ${fmtDate(w.date)}</div>
          <div class="oh-vs" style="font-size:16px">${title}</div>
          ${w.note ? `<div class="oh-meta">${esc(w.note)}</div>` : ''}
          ${othersLine(w)}
          ${D.me.canEdit ? `<div class="oh-tools">${['semis','finals'].includes(w.type) ? w.others.map(o => `<button class="oh-btn sm" data-playoff="${o.id}" data-wk="${w.id}">Set teams · ${esc(o.note || 'match')}</button>`).join('') : ''}${finalsBtn(w)}</div>
            <div id="pe-${w.id}"></div>${editor(w)}` : ''}
        </article>`;
      }
      const m = w.match;
      const r = m.result;
      const cls = r ? (r.ptsUs > r.ptsThem ? 'w' : r.ptsUs < r.ptsThem ? 'l' : '') : '';
      const hasLineup = m.slots.some(s => s.players.some(Boolean));
      const isMe = (p) => p && (p.me || (D.me.email && p.email === D.me.email));
      const mine = m.slots.filter(s => s.players.some(isMe));
      const game = (s) => {
        const names = s.players.filter(Boolean).map(p => p.name).join(' & ') || 'TBD';
        const sc = s.us != null && s.them != null ? `<span class="s ${s.us > s.them ? 'w' : 'l'}">${s.us}-${s.them}</span>` : '';
        return `<div class="oh-g ${s.players.some(isMe) ? 'mine' : ''} ${s.players.some(Boolean) ? '' : 'empty'}"><span class="n">G${s.no}</span><span class="t">${esc(s.typeLabel)}</span><span class="p" title="${esc(names)}${s.opp.filter(Boolean).length ? ' vs ' + esc(s.opp.filter(Boolean).join(' & ')) : ''}">${esc(names)}</span>${sc}</div>`;
      };
      const games = [1, 2].map(rn => {
        const rr = r?.rounds?.[rn - 1];
        const tag = rr ? `<b>${rr.us}-${rr.them} · ${rr.us > rr.them ? '2 pts' : rr.us < rr.them ? '0 pts' : '1 pt'}</b>` : '';
        return `<div class="oh-round"><span>Round ${rn}</span>${tag}</div><div class="oh-lineup" style="margin-top:0">${m.slots.filter(s => s.round === rn).map(game).join('')}</div>`;
      }).join('');
      const day = m.side === 'home'
        ? `<b>We're home:</b> captain picks up game balls &amp; clipboards at the front desk. We serve first in Round 1, they choose sides; switch in Round 2.`
        : `<b>We're away:</b> they serve first in Round 1 and we choose sides; switch in Round 2.`;
      return `<article class="oh-week ${nx ? 'is-next' : ''}" id="wk-${w.id}">
        <div class="oh-wk-top">
          <div>
            <div class="oh-wk-label">${esc(w.label)}${nx ? '<span class="nx">● Next up</span>' : ''}</div>
            <div class="oh-vs">vs ${esc(m.opponent)}<small>${m.side === 'home' ? 'Home' : 'Away'}</small></div>
            <div class="oh-meta">${fmtDate(m.date, { weekday: 'long', month: 'short', day: 'numeric' })} · ${esc(m.time)} · Courts ${esc(m.courts)}</div>
            ${m.note ? `<div class="oh-note">${esc(m.note)}</div>` : ''}
            ${w.note ? `<div class="oh-meta">${esc(w.note)}</div>` : ''}
          </div>
          ${r ? `<div class="oh-res ${cls}">${r.ptsUs} pts<span class="v">${r.ptsUs > r.ptsThem ? 'Win' : r.ptsUs < r.ptsThem ? 'Loss' : 'Split'} · games ${r.us}-${r.them}</span></div>` : ''}
        </div>
        ${hasLineup || r ? games : `<div class="oh-pending">Lineup not posted yet — you'll get an email when it is.</div>`}
        ${D.me.canEdit && m.warnings?.length ? `<div class="oh-warn">${m.warnings.map(esc).join('<br>')}</div>` : ''}
        ${!r ? `<div class="oh-day">${day} Lineups are exchanged at ${esc(lineupTime(m.time))}.</div>` : ''}
        ${r && !m.detailed ? `<div class="oh-pending">Final score only — no game-by-game sheet.</div>` : ''}
        ${othersLine(w)}
        ${hasLineup && !D.me.canEdit ? `<div class="oh-tools"><a class="oh-btn sm" href="/ohana/print?m=${encodeURIComponent(m.id)}" target="_blank" rel="noopener">Print lineup</a></div>` : ''}
        ${hasLineup && !D.me.canEdit ? `<div class="oh-you">${mine.length ? `You're in <b>${mine.length} game${mine.length === 1 ? '' : 's'}</b>: ${mine.map(s => `G${s.no} (${s.typeLabel})`).join(', ')}` : `You're not in the lineup this week.`}</div>` : ''}
        ${D.me.canEdit ? `<div class="oh-tools">
            <button class="oh-btn sm ${open[w.id] === 'lineup' ? 'pri' : ''}" data-open="lineup" data-wk="${w.id}">Lineup</button>
            <button class="oh-btn sm ${open[w.id] === 'scores' ? 'pri' : ''}" data-open="scores" data-wk="${w.id}">Scores</button>
            <button class="oh-btn sm ${open[w.id] === 'match' ? 'pri' : ''}" data-open="match" data-wk="${w.id}">Date / courts</button>
            ${finalsBtn(w)}
            ${hasLineup ? `<a class="oh-btn sm" href="/ohana/print?m=${encodeURIComponent(m.id)}" target="_blank" rel="noopener">Print lineup</a>` : ''}
          </div>${editor(w)}` : ''}
      </article>`;
    }

    // ── Manager editors ────────────────────────────────────────────────
    function rosterOptions() { return D.roster.map(p => `<option value="${esc(p.name)}"></option>`).join(''); }
    const emailByName = (n) => D.roster.find(p => p.name.toLowerCase() === String(n).trim().toLowerCase())?.email || '';

    function editor(w) {
      const kind = open[w.id]; if (!kind) return '';
      const m = w.match;
      if (kind === 'finals') {
        const rows = [];
        if (m && !m.detailed) {
          const flip = (x) => x ? (m.side === 'home' ? { home: x.us, away: x.them } : { home: x.them, away: x.us }) : null;
          rows.push({ id: m.id, home: m.side === 'home' ? 'South Bay Ohana' : m.opponent, away: m.side === 'home' ? m.opponent : 'South Bay Ohana',
            rounds: (m.result?.rounds || []).map(flip), pts: null });
        }
        for (const o of w.others) if (o.homeId && o.awayId) rows.push({ ...o, rounds: o.result?.rounds || [], pts: o.result && o.result.scoredHome != null ? { home: o.result.scoredHome, away: o.result.scoredAway } : null });
        const cell = (k, v, lbl) => `<input data-k="${k}" inputmode="numeric" value="${v ?? ''}" aria-label="${esc(lbl)}" placeholder="–">`;
        return `<div class="oh-ed" data-ed="finals" data-wk="${w.id}">
          <div class="lbl">From the PVTC scoresheet — games won each round (max 6). Rally points are optional (3rd tiebreaker).</div>
          <div class="oh-ed-row" style="grid-template-columns:1fr 46px 46px 46px 64px;font-size:10px;color:var(--color-text-faint);font-weight:800;letter-spacing:.06em;text-transform:uppercase">
            <span></span><span>R1</span><span>R2</span><span></span><span>Points</span></div>
          ${rows.map(o => `<div data-final="${o.id}" style="margin-bottom:10px">
            ${[['home', o.home], ['away', o.away]].map(([side, name]) => `<div class="oh-ed-row" style="grid-template-columns:1fr 46px 46px 46px 64px">
              <span class="pairtxt">${esc(name)}</span>${cell('r1' + side, o.rounds[0]?.[side], name + ' round 1')}${cell('r2' + side, o.rounds[1]?.[side], name + ' round 2')}<span></span>${cell('pts' + side, o.pts?.[side], name + ' points')}</div>`).join('')}
          </div>`).join('')}
          ${m && !m.detailed ? `<label class="oh-chk"><input type="checkbox" data-notify> Email the team our final score</label>` : ''}
          <button class="oh-btn pri" data-save="finals" data-wk="${w.id}">Save finals</button>
          <div class="oh-msg" data-out></div></div>`;
      }
      if (kind === 'lineup') {
        if (!D.roster.length) return `<div class="oh-ed"><div class="oh-empty">Add players to the roster first (bottom of the page).</div></div>`;
        return `<div class="oh-ed" data-ed="lineup" data-wk="${w.id}">
          <datalist id="dl-roster">${rosterOptions()}</datalist>
          <div class="lbl">Type a name · partner only once per round · max 3 games per round · 4–8 players</div>
          ${m.slots.map(s => `${s.no === 1 || s.no === 7 ? `<div class="oh-round">Round ${s.round}</div>` : ''}<div class="oh-ed-row"><span class="n" title="${esc(s.typeLabel)}">G${s.no}<br><span style="font-size:8px">${s.type}</span></span>
            <input list="dl-roster" data-slot="${s.no}" data-i="0" value="${esc(s.players[0]?.name || '')}" placeholder="Player" autocomplete="off">
            <input list="dl-roster" data-slot="${s.no}" data-i="1" value="${esc(s.players[1]?.name || '')}" placeholder="Partner" autocomplete="off"></div>`).join('')}
          <label class="oh-chk"><input type="checkbox" data-notify checked> ${m.lineupSentAt ? 'Email players whose games changed' : 'Email everyone their games'}</label>
          <button class="oh-btn pri" data-save="lineup" data-wk="${w.id}">Save lineup</button>
          <div class="oh-msg" data-out></div></div>`;
      }
      if (kind === 'scores') {
        return `<div class="oh-ed" data-ed="scores" data-wk="${w.id}">
          <div class="lbl">Our score · their score · who we played (optional — builds opponent stats)</div>
          ${m.slots.map(s => `<div class="oh-ed-row sc"><span class="n">G${s.no}</span>
            <span class="pairtxt">${esc(s.players.filter(Boolean).map(p => p.name.split(' ')[0]).join(' & ') || '—')}</span>
            <input data-slot="${s.no}" data-k="opp" value="${esc(s.opp.filter(Boolean).join(' & '))}" placeholder="Opponents">
            <input data-slot="${s.no}" data-k="us" inputmode="numeric" value="${s.us ?? ''}" placeholder="Us">
            <input data-slot="${s.no}" data-k="them" inputmode="numeric" value="${s.them ?? ''}" placeholder="Them"></div>`).join('')}
          <label class="oh-chk"><input type="checkbox" data-notify> Email the team the final score</label>
          <button class="oh-btn pri" data-save="scores" data-wk="${w.id}">Save scores</button>
          <div class="oh-msg" data-out></div></div>`;
      }
      return matchEditor(w.id, m.id, { date: m.date, time: m.time, courts: m.courts, note: m.note });
    }

    function matchEditor(wkId, matchId, v, teams) {
      const opts = (sel) => `<option value="">TBD</option>` + D.league.teams.map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
      return `<div class="oh-ed" data-ed="match" data-wk="${wkId}" data-match="${matchId}">
        ${teams ? `<div class="grid2"><div><div class="lbl">Home</div><select data-f="homeTeamId">${opts(teams.home)}</select></div><div><div class="lbl">Away</div><select data-f="awayTeamId">${opts(teams.away)}</select></div></div>` : ''}
        <div class="grid2"><div><div class="lbl">Date</div><input type="date" data-f="date" value="${esc(v.date || '')}"></div>
          <div><div class="lbl">Time</div><input data-f="time" value="${esc(v.time || '7:00 PM')}"></div></div>
        <div class="grid2"><div><div class="lbl">Courts</div><input data-f="courts" value="${esc(v.courts || '')}"></div>
          <div><div class="lbl">Note</div><input data-f="note" value="${esc(v.note || '')}" placeholder="e.g. Moved for rain"></div></div>
        <label class="oh-chk"><input type="checkbox" data-notify checked> Email the team what changed</label>
        <button class="oh-btn pri" data-save="match" data-wk="${wkId}">Save</button>
        <div class="oh-msg" data-out></div></div>`;
    }

    // ── League table ───────────────────────────────────────────────────
    function standingsSection() {
      const rows = D.standings || [];
      const any = rows.some(r => r.mp);
      const body = `<table class="oh-table"><thead><tr><th>#</th><th style="text-align:left">Team</th><th>MP</th><th>Pts</th><th>W-L-T</th><th>Games</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="${r.teamId === D.league.ourTeamId ? 'us' : ''}"><td>${any ? r.rank : '–'}</td><td class="tm">${esc(r.name)}</td><td>${r.mp}</td><td><b>${r.pts}</b></td><td>${r.mw}-${r.ml}-${r.mt}</td><td>${r.gw}-${r.gl}</td></tr>`).join('')}
        </tbody></table>
        <div style="font-size:11px;color:var(--color-text-faint);margin-top:8px;line-height:1.6">${any ? '' : 'Fills in as final scores are entered. '}Points per round: win 2, tie 1, loss 0 (max 4 a match). Ties: head-to-head, then games won, then points scored. All 5 teams make the playoffs — 1st gets a semis bye.</div>`;
      return `<h2 class="oh-h2" style="margin-top:0">League standings</h2><div class="oh-card" style="margin-bottom:8px">${body}</div>`;
    }

    // ── Stats + roster ─────────────────────────────────────────────────
    function statsSection() {
      const ps = D.stats.players;
      const body = ps.length ? `<table class="oh-table"><thead><tr><th>Player</th><th>Nts</th><th>GP</th><th>W-L</th><th>Win%</th><th>+/-</th></tr></thead><tbody>
        ${ps.map(p => `<tr><td>${esc(p.name)}${p.partners[0] ? `<div style="font-size:10px;color:var(--color-text-faint)">Top partner: ${esc(p.partners[0].name)} (${p.partners[0].w}-${p.partners[0].gp - p.partners[0].w})</div>` : ''}</td><td>${p.nights}</td><td>${p.gp}</td><td>${p.w}-${p.l}</td><td>${pct(p.pct)}</td><td>${sign(p.diff)}</td></tr>`).join('')}
        </tbody></table>` : `<div class="oh-empty">Stats start once the first game scores are in.</div>`;
      const pairs = D.stats.pairs.length ? `<div class="oh-h2" style="margin-top:18px;font-size:11px">Best pairs</div><table class="oh-table"><tbody>
        ${D.stats.pairs.map(p => `<tr><td>${esc(p.pair)}</td><td>${p.w}-${p.gp - p.w}</td><td>${sign(p.diff)}</td></tr>`).join('')}</tbody></table>` : '';
      return `<h2 class="oh-h2">Our stats</h2><div class="oh-card">${body}${pairs}</div>`;
    }

    function rosterSection() {
      const list = D.roster.length ? D.roster.map(p => D.me.canEdit
        ? `<span class="oh-chip" style="font-weight:600">${esc(p.name)}${p.manager ? '<span class="oh-tag">Mgr</span>' : ''}${eligTag(p)}
            <button class="oh-btn sm" style="padding:2px 8px;margin-left:6px" data-gender="${esc(p.email)}" title="Used to check women's / men's / mixed games">${p.gender || '?'}</button>
            <button class="oh-btn sm" style="padding:2px 8px;margin-left:6px" data-mgr="${esc(p.email)}" data-on="${p.manager ? 0 : 1}">${p.manager ? 'Unset mgr' : 'Make mgr'}</button>
            <button class="oh-btn sm" style="padding:2px 8px" data-rm="${esc(p.email)}" aria-label="Remove">✕</button></span>`
        : `<span class="oh-chip" style="font-weight:600">${esc(p.name)}${p.manager ? '<span class="oh-tag">Captain</span>' : ''}${eligTag(p)}</span>`).join('')
        : `<div class="oh-empty">No players yet.</div>`;
      const add = D.me.canEdit ? `<div class="oh-sugg" style="margin-top:12px">
          <input class="oh-in" id="add-q" placeholder="Add a player — type a name" autocomplete="off">
          <div class="oh-sugg-list" id="add-list" hidden></div></div><div class="oh-msg" id="roster-out"></div>` : '';
      const e = D.eligibility;
      return `<h2 class="oh-h2">Roster <span style="font-weight:600;color:var(--color-text-faint);letter-spacing:0;text-transform:none;font-size:12px">${D.roster.length} of 15</span></h2>
        <div class="oh-card"><div class="oh-roster">${list}</div>
        <div style="font-size:11px;color:var(--color-text-faint);margin-top:10px">Playoffs: play at least ${e.needed} of our ${e.total} regular-season matches (⅓).</div>${add}</div>`;
    }
    function eligTag(p) {
      const e = D.eligibility; if (!e || !e.total) return '';
      return p.played >= e.needed ? `<span class="oh-elig ok" title="Playoff eligible">✓ ${p.played}/${e.needed}</span>` : `<span class="oh-elig no" title="Matches played toward playoff eligibility">${p.played}/${e.needed}</span>`;
    }
    const lineupTime = (t) => { const m = String(t).match(/(\d+):(\d+)\s*(AM|PM)?/i); if (!m) return '10 min before start'; let h = +m[1], mi = +m[2] - 10; if (mi < 0) { mi += 60; h -= 1; } return `${h}:${String(mi).padStart(2, '0')} ${m[3] || ''}`.trim(); };

    // ── Team note (announcement) ───────────────────────────────────────
    let editingNote = false;
    function announcementCard() {
      const a = D.announcement;
      if (editingNote && D.me.canEdit) return `<div class="oh-note-card oh-ed" data-ed="note" style="margin-top:0">
          <div class="lbl">Team note — shows at the top for everyone</div>
          <input data-f="title" value="${esc(a?.title || '')}" placeholder="Headline" style="margin-bottom:8px">
          <textarea data-f="body" rows="4" placeholder="Message">${esc(a?.body || '')}</textarea>
          <label class="oh-chk"><input type="checkbox" data-notify> Also email it to the team</label>
          <div class="oh-tools"><button class="oh-btn pri sm" data-save="note">Save note</button><button class="oh-btn sm" data-note="cancel">Cancel</button><button class="oh-btn sm" data-note="clear">Remove note</button></div>
          <div class="oh-msg" data-out></div></div>`;
      if (!a) return D.me.canEdit ? `<div class="oh-tools" style="margin:0 0 12px"><button class="oh-btn sm" data-note="edit">+ Add a team note</button></div>` : '';
      return `<div class="oh-note-card">${a.title ? `<h3>${esc(a.title)}</h3>` : ''}${a.body ? `<p>${esc(a.body)}</p>` : ''}
        <div class="oh-tools"><a class="oh-btn sm" href="#rules">Key rules</a><a class="oh-btn sm" href="${API}ohana-rules-pdf" target="_blank" rel="noopener">Full rules (PDF)</a>${D.me.canEdit ? `<button class="oh-btn sm" data-note="edit">Edit note</button>` : ''}</div></div>`;
    }

    // ── Rules ──────────────────────────────────────────────────────────
    const KEY_RULES = [
      'Games are to 11, win by 1.',
      'Home team goes to the front desk to pick up game balls and clipboards.',
      'Home team serves first in Round 1 and Away chooses side. Switch in Round 2.',
      'Switch sides of the court when the first team gets to 6 points.',
      'A minimum of 4 people (max of 8) may play each week. You may have up to 15 players on your roster for the season.',
      'There are 2 rounds of 6 games (12 games total). You may not play with the same partner more than once per round. Mixed teams play 1 game of women’s doubles and men’s doubles, followed by 4 games of mixed doubles each round.',
      'Use the PVTC scoresheet. Points are given separately for Round 1 and Round 2 — 2 points for a win, 1 for a tie, 0 for a loss. Max points for both rounds = 4.',
      'Exchange lineups 10 minutes before league start time. You can’t change your lineup once exchanged (except for injury/medical reasons — see full rules).',
      'PVTC does not guarantee warm-up courts. You may arrive 30 minutes before start to warm up if a court is available. Your captain (or a team rep) must check with the front desk. Please don’t disturb members who have the court reserved.',
      'Any player on the roster must play at least 1/3 of the regular-season matches to be eligible for the playoffs.',
    ];
    const FULL_RULES = [
      ['Team rosters', ['Players must be 18+. A valid photo ID and signed waiver (if not on file) are required for everyone on the roster.', 'Maximum 15 rostered players per team for the season.', 'Adding or removing players after the first game of Week 1 needs approval from the league coordinator.', 'League fee is due at registration (PVTC front desk, (310) 373-6326).', 'A player may only captain one team, in one skill level per league type in a season.', 'Final, full rosters are due one week before the first game unless the coordinator says otherwise.']],
      ['Division placement', ['Placement and movement are set by the team’s average DUPR.', 'Players/teams playing in the wrong skill level will be moved up if they continue in PVTC leagues.', 'Season results don’t automatically move a team.', 'Players may only play in one skill level per league type.', 'Ranges: 3.0 = DUPR 2.75–3.25 · 3.5 = 3.25–3.75 · 4.0 = 3.75–4.25.']],
      ['Captains', ['Share the league rules and make sure players follow them; captains are the main point of contact.', 'Collect waivers and IDs for players new to PVTC (electronic submission encouraged).', 'Arrive with a hardcopy lineup in the emailed format.', 'Check in at the front desk about warm-up courts. They aren’t guaranteed; members with reservations finish their time first. Teams may enter courts 30 minutes early and may share open courts.', 'Home captain checks in at the front desk and picks up balls and clipboards.', 'Captains exchange lineups 10 minutes before start.']],
      ['Match format', ['2 rounds of 6 games (12 total). Points are given separately for each round: win 2, tie 1, loss 0.', 'Mixed format each round: 1 women’s doubles, 1 men’s doubles, 4 mixed.', 'Games to 11, win by 1. Switch sides when one team reaches 6.', 'Both captains record scores after each game; the home team’s copy is the official record.', 'When done, captains validate results, tally games and points for each round, and sign the home team copy.']],
      ['Lineups', ['Only rostered players may play — a game with a non-rostered player is a forfeit.', '15-minute grace period for the first game only. Players may arrive late or leave early but must be present when their game starts.', 'Rotate partners every game — same partner only once per round. Max 3 games per person per round.', 'If a player is injured, teams must still rotate partners and not repeat partnerships in a round.', 'Minimum 4 players per match; maximum 8 on any day (space and parking).']],
      ['Timeouts & injury subs', ['Water breaks when switching sides at 6 (1 minute max).', 'No official timeouts except medical (15 minutes, including urgent restroom).', 'An injured player unable to continue can be replaced by a player not currently in the game; the team chooses who.', 'A subbed-out player who recovers must wait until Round 2 to play again.', 'If the injured player can’t continue, the team may not shuffle its lineup; subs must come from players not in the current game.', 'No subs available → the injured player’s remaining games are forfeited.']],
      ['Line calls', ['Self-regulated — call your own side fairly.', 'Players on the sideline may not talk, make calls, coach, or gesture during play.', 'On the serve, a ball on any line is in — except the kitchen line, which is out.', 'If in doubt, it’s in. If partners disagree, the call is in.', 'You may appeal to your opponent’s partner and must respectfully accept the decision.']],
      ['Kitchen & foot faults', ['Toe touching the baseline or kitchen line: don’t call it. Obvious/flagrant foot or kitchen faults: do call.', 'Anyone on the court can call a kitchen fault; if the other team disagrees, replay the point.', 'Keep foot-fault calls to a minimum — repeated issues go to the league coordinator after play.', 'Wrong server/receiver: stop before the return. If the rally is played out, the point stands and players reset.', '2-hour limit per division — avoid unnecessary replays.']],
      ['Scoring', ['Server calls the score clearly before serving.', 'A wrong score can be corrected before the return is hit (serve is replayed); after the return it’s a fault.']],
      ['Equipment & clothing', ['Bring your own paddle. Game balls are provided; warm-up balls are not.', 'Avoid clothing that matches the ball color. Eye protection is strongly encouraged.']],
      ['Cancellations & rescheduling', ['A whole match can be cancelled by mutual consent of captains (rain, wind, heat, air quality, court conditions). Call the PVTC front desk at least 2 hours before start.', 'Weather cancellations aren’t final until the morning of the match; if captains can’t reach each other or it’s clearing, assume you’re playing.', 'Start may be delayed up to 30 minutes (longer if both teams agree and courts are free). Leaving risks a default — no grace period once courts are playable.', 'If a match is stopped mid-way, captains reschedule the remaining games within 1 week, with the original lineup; each game resumes where it left off.', 'A cancelled night extends the season by a week against the same opponent.']],
      ['Etiquette', ['Fun, friendly, recreational competition. Discipline is at PVTC’s discretion.', 'No swearing, taunting or poor sportsmanship — offenders may forfeit games or be removed.', 'Finish early? You can keep playing until the end of the league slot; leave courts promptly when it ends.', 'Anyone not on the day’s roster sits in the patio area; players not in the current round should too when possible.', 'No cell phones on the court for rostered players. Water only on the courts.']],
      ['Playoffs', ['A player must play in at least ⅓ of regular-season matches to play in the playoffs (injury appeals go to the coordinator).', 'Playoff seeding is by regular-season points.', 'Standings ties: head-to-head, then games won, then total points scored, then a randomly selected game.', 'Tied playoff match: total points scored in the match, then regular-season head-to-head, then best overall record.']],
    ];
    function rulesSection() {
      return `<h2 class="oh-h2" id="rules" style="scroll-margin-top:130px">Rules</h2>
        <div class="oh-card oh-rules">
          <div class="lbl" style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-faint);margin-bottom:10px">Key rules — PVTC league</div>
          <ol>${KEY_RULES.map(r => `<li>${esc(r)}</li>`).join('')}</ol>
          <div class="oh-tools" style="margin:6px 0 14px"><a class="oh-btn sm pri" href="${API}ohana-rules-pdf" target="_blank" rel="noopener">Open full rules (PDF)</a><a class="oh-btn sm" href="${API}ohana-rules-pdf?dl=1">Download</a></div>
          <div class="lbl" style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-faint);margin:6px 0 4px">Full rules</div>
          ${FULL_RULES.map(([t, items]) => `<details><summary>${esc(t)}</summary><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></details>`).join('')}
          <div style="font-size:11px;color:var(--color-text-faint);margin-top:10px">Summary of the PVTC 2026 league rules — the PDF is the official version.</div>
        </div>`;
    }

    function messageSection() {
      return `<h2 class="oh-h2">Email the team</h2><div class="oh-card oh-ed" style="margin:0;border-top:1px solid var(--color-border)" data-ed="message">
        <input data-f="subject" placeholder="Subject" style="margin-bottom:8px">
        <textarea data-f="text" rows="4" placeholder="Message to everyone on the roster"></textarea>
        <div style="margin-top:10px"><button class="oh-btn pri" data-save="message">Send to team</button></div>
        <div class="oh-msg" data-out></div></div>`;
    }

    // ── Events ─────────────────────────────────────────────────────────
    async function post(payload) {
      const res = await fetch(API + 'ohana-save', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Save failed');
      return body;
    }
    const emailedLine = (e) => e ? (e.note || `Emailed ${e.sent} player${e.sent === 1 ? '' : 's'}${e.failed ? ` (${e.failed} failed)` : ''}.`) : '';

    // Downscale on the phone before upload (camera photos are 5–12 MB).
    function compress(file, max = 2000) {
      return new Promise((ok, bad) => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(b => b ? ok(b) : bad(new Error('Could not read that photo')), 'image/jpeg', 0.86);
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => bad(new Error('Could not read that photo — try a JPG or PNG'));
        img.src = URL.createObjectURL(file);
      });
    }
    function bindPhoto() {
      const inp = $('#photo-in'), out = $('#photo-out'); if (!inp) return;
      document.querySelectorAll('[data-photo=pick]').forEach(b => b.onclick = () => inp.click());
      document.querySelectorAll('[data-photo=rm]').forEach(b => b.onclick = async () => {
        if (!confirm('Remove the team photo?')) return;
        await fetch(API + 'ohana-photo', { method: 'DELETE', credentials: 'include' }); await load();
      });
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        out.className = 'oh-msg'; out.textContent = 'Uploading…';
        try {
          const fd = new FormData(); fd.append('file', await compress(f), 'team.jpg');
          const r = await fetch(API + 'ohana-photo', { method: 'POST', credentials: 'include', body: fd });
          const b = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(b.error || 'Upload failed');
          await load();
        } catch (e) { out.className = 'oh-msg err'; out.textContent = e.message; }
      };
    }

    function alertLine(msg) { const o = $('#photo-out'); if (o) { o.className = 'oh-msg'; o.textContent = msg; } }
    function bind() {
      bindPhoto();
      document.querySelectorAll('[data-note]').forEach(b => b.onclick = async () => {
        if (b.dataset.note === 'edit') { editingNote = true; return render(); }
        if (b.dataset.note === 'cancel') { editingNote = false; return render(); }
        if (b.dataset.note === 'clear' && confirm('Remove the team note?')) { await post({ action: 'setAnnouncement', title: '', body: '' }); editingNote = false; await load(); }
      });
      document.querySelectorAll('[data-gender]').forEach(b => b.onclick = async () => {
        const p = D.roster.find(x => x.email === b.dataset.gender);
        const next = p.gender === 'F' ? 'M' : p.gender === 'M' ? '' : 'F';
        await post({ action: 'setGender', email: p.email, gender: next }); await load();
      });
      const ap = $('#as-player'); if (ap) ap.onclick = () => { asPlayer = !asPlayer; D.me.canEdit = D.me.isManager && !asPlayer; render(); };
      document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => $('#wk-' + b.dataset.go)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
        open[b.dataset.wk] = open[b.dataset.wk] === b.dataset.open ? null : b.dataset.open;
        rerenderWeek(b.dataset.wk);
      });
      document.querySelectorAll('[data-playoff]').forEach(b => b.onclick = () => {
        const w = D.weeks.find(x => x.id === b.dataset.wk);
        const o = w.others.find(x => x.id === b.dataset.playoff);
        $('#pe-' + w.id).innerHTML = matchEditor(w.id, o.id, { date: w.date, time: '7:00 PM', courts: o.courts, note: o.note }, { home: o.homeId, away: o.awayId });
        bindSaves($('#pe-' + w.id));
      });
      bindSaves(document);
      bindRoster();
    }

    function rerenderWeek(id) {
      const w = D.weeks.find(x => x.id === id);
      const el = $('#wk-' + id);
      const tmp = document.createElement('div'); tmp.innerHTML = weekCard(w);
      el.replaceWith(tmp.firstElementChild);
      bind();
    }

    function bindSaves(root) {
      root.querySelectorAll('[data-save]').forEach(btn => btn.onclick = async () => {
        const ed = btn.closest('[data-ed]');
        const out = ed.querySelector('[data-out]');
        const notify = !!ed.querySelector('[data-notify]')?.checked;
        const w = D.weeks.find(x => x.id === btn.dataset.wk);
        let payload;
        try {
          if (btn.dataset.save === 'lineup') {
            const slots = w.match.slots.map(s => ({ no: s.no, players: ['', ''] }));
            for (const inp of ed.querySelectorAll('input[data-slot]')) {
              const v = inp.value.trim(); if (!v) continue;
              const e = emailByName(v);
              if (!e) throw new Error(`"${v}" isn't on the roster — pick a name from the list.`);
              slots[+inp.dataset.slot - 1].players[+inp.dataset.i] = e;
            }
            payload = { action: 'saveLineup', matchId: w.match.id, slots, notify };
          } else if (btn.dataset.save === 'scores') {
            const slots = w.match.slots.map(s => ({ no: s.no, us: null, them: null, opp: ['', ''] }));
            for (const inp of ed.querySelectorAll('input[data-slot]')) {
              const s = slots[+inp.dataset.slot - 1]; const v = inp.value.trim();
              if (inp.dataset.k === 'opp') s.opp = v.split(/\s*(?:&|\/|,| and )\s*/i).slice(0, 2);
              else s[inp.dataset.k] = v === '' ? null : Number(v);
            }
            payload = { action: 'saveScores', matchId: w.match.id, slots, notify };
          } else if (btn.dataset.save === 'finals') {
            btn.disabled = true; out.className = 'oh-msg'; out.textContent = 'Saving…';
            const notes = [];
            const val = (row, k) => row.querySelector(`[data-k=${k}]`).value.trim();
            const rows = [...ed.querySelectorAll('[data-final]')].map(row => ({ id: row.dataset.final,
              r1: { home: val(row, 'r1home'), away: val(row, 'r1away') }, r2: { home: val(row, 'r2home'), away: val(row, 'r2away') },
              pts: { home: val(row, 'ptshome'), away: val(row, 'ptsaway') } }));
            const half = (x) => (x.home === '') !== (x.away === '');
            if (rows.some(x => half(x.r1) || half(x.r2) || half(x.pts))) throw new Error('Fill in both teams for each round (or leave both blank).');
            for (const x of rows) {
              const r = await post({ action: 'saveResult', matchId: x.id, r1: x.r1, r2: x.r2, pts: x.pts, notify });
              if (r.note) notes.push(r.note); if (r.emailed) notes.push(emailedLine(r.emailed));
            }
            open[w.id] = null; await load(); flash(w.id, ['Finals saved.', ...notes].join(' ')); return;
          } else if (btn.dataset.save === 'note') {
            payload = { action: 'setAnnouncement', email: notify };
            ed.querySelectorAll('[data-f]').forEach(i => payload[i.dataset.f] = i.value);
            btn.disabled = true; out.className = 'oh-msg'; out.textContent = 'Saving…';
            const r = await post(payload); editingNote = false; await load();
            if (r.emailed) alertLine(emailedLine(r.emailed)); return;
          } else if (btn.dataset.save === 'match') {
            payload = { action: 'editMatch', matchId: ed.dataset.match, notify };
            ed.querySelectorAll('[data-f]').forEach(i => payload[i.dataset.f] = i.value);
          } else {
            payload = { action: 'message', notify: true };
            ed.querySelectorAll('[data-f]').forEach(i => payload[i.dataset.f] = i.value);
          }
          btn.disabled = true; out.className = 'oh-msg'; out.textContent = 'Saving…';
          const r = await post(payload);
          if (payload.action === 'message') { out.textContent = emailedLine(r.emailed) || 'Sent.'; ed.querySelectorAll('[data-f]').forEach(i => i.value = ''); btn.disabled = false; return; }
          const msg = ['Saved.', (r.changes && !r.changes.length) ? 'Nothing changed.' : '', emailedLine(r.emailed), r.warnings?.length ? `Check the rule warnings on the card.` : ''].filter(Boolean).join(' ');
          if (w) open[w.id] = null;
          await load();
          flash(w?.id, msg);
        } catch (e) {
          btn.disabled = false; out.className = 'oh-msg err'; out.textContent = e.message;
        }
      });
    }

    function flash(wkId, msg) {
      const el = wkId && $('#wk-' + wkId); if (!el) return;
      const d = document.createElement('div'); d.className = 'oh-msg'; d.textContent = msg; el.appendChild(d);
      setTimeout(() => d.remove(), 6000);
    }

    function bindRoster() {
      const out = $('#roster-out');
      const act = async (payload) => { try { await post(payload); await load(); } catch (e) { if (out) { out.className = 'oh-msg err'; out.textContent = e.message; } } };
      document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (confirm('Remove from the Ohana roster?')) act({ action: 'removePlayer', email: b.dataset.rm }); });
      document.querySelectorAll('[data-mgr]').forEach(b => b.onclick = () => act({ action: 'setManager', email: b.dataset.mgr, manager: b.dataset.on === '1' }));
      const q = $('#add-q'), list = $('#add-list'); if (!q) return;
      let timer = null, hits = [], idx = 0;
      const show = () => {
        if (!hits.length) { list.hidden = true; return; }
        list.innerHTML = hits.map((h, i) => `<button type="button" class="${i === idx ? 'on' : ''}" data-i="${i}">${esc(h.name)}<small>${esc(h.lastTeamName || '')}</small></button>`).join('');
        list.hidden = false;
        list.querySelectorAll('button').forEach(b => b.onmousedown = (ev) => { ev.preventDefault(); pick(hits[+b.dataset.i]); });
      };
      const pick = (h) => { list.hidden = true; q.value = ''; act({ action: 'addPlayer', email: h.email, name: h.name, gender: h.gender }); };
      q.oninput = () => {
        clearTimeout(timer);
        const v = q.value.trim(); if (v.length < 2) { hits = []; show(); return; }
        timer = setTimeout(async () => {
          const r = await fetch(API + 'ohana-player-search?q=' + encodeURIComponent(v), { credentials: 'include' }).then(r => r.json()).catch(() => ({}));
          hits = r.results || []; idx = 0; show();
        }, 180);
      };
      q.onkeydown = (e) => {
        if (list.hidden) return;
        if (e.key === 'ArrowDown') { idx = Math.min(idx + 1, hits.length - 1); show(); e.preventDefault(); }
        if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); show(); e.preventDefault(); }
        if (e.key === 'Enter' && hits[idx]) { pick(hits[idx]); e.preventDefault(); }
        if (e.key === 'Escape') list.hidden = true;
      };
      q.onblur = () => setTimeout(() => list.hidden = true, 150);
    }

    // Opens at the top (photo + standings); the sticky week strip jumps to any week.
    load().catch((e) => { console.error(e); $('#app').innerHTML = '<div class="oh-gate"><p>Couldn\'t load the team page — refresh to try again.</p></div>'; });
  })();
  </script>
</body>
