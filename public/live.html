<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live · The Dink Society</title>
  <meta name="description" content="Every game of every match night — live as scores come in, and the full archive of every week." />
  <meta property="og:title" content="Live · The Dink Society" />
  <meta property="og:description" content="Every game of every match night — live as scores come in, and the full archive of every week." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Dink Society" />
  <meta property="og:url" content="https://dinksociety.app/live" />
  <meta property="og:image" content="https://dinksociety.app/.netlify/functions/og-image?p=live" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="stylesheet" href="/css/shared.css" />
  <script>(function(){var t=localStorage.getItem("ds-theme");if(t==="light"){document.documentElement.setAttribute("data-theme","light")}else{document.documentElement.setAttribute("data-theme","dark")}})();</script>
  <link rel="stylesheet" href="/css/shared-nav.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="/js/season.js"></script>
  <script src="/js/live-poll.js"></script>
  <style>
    /* ── Live board · "dots" layout ─────────────────────────────────────
       One dot per game. Lime = home won, teal = away won, hollow = not
       played, pulsing ring = on court now. Swap --lv-disp to Inter to go
       strictly on-brand; the dots don't care. */
    :root{
      --lv-disp:'Barlow Condensed',Inter,sans-serif;
      --lv-mono:'IBM Plex Mono',ui-monospace,monospace;
      --lv-dim:#2c322c; --lv-dim2:#3a423a; --lv-gold:#f0b429;
    }
    [data-theme="light"]{ --lv-dim:#d9ded9; --lv-dim2:#b9c1b9; }
    #lv{ max-width:1040px; margin:0 auto; padding:0 var(--gutter) 90px; }
    #lv .disp{ font-family:var(--lv-disp); font-weight:900; text-transform:uppercase; letter-spacing:.005em; line-height:.92; }
    #lv .mono{ font-family:var(--lv-mono); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--color-text-muted); }
    #lv .mono b{ color:var(--color-text); font-weight:600; }
    #lv .mono .lime{ color:var(--color-lime); } #lv .mono .teal{ color:var(--color-teal); } #lv .mono .gold{ color:var(--lv-gold); }
    #lv .rule{ height:1px; background:var(--color-border); }
    #lv a{ color:inherit; text-decoration:none; }

    /* header */
    #lv .top{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; padding:88px 0 14px; flex-wrap:wrap; }
    #lv .top h1{ margin:0; font-size:clamp(40px,6vw,60px); white-space:nowrap; }
    #lv .top h1 small{ display:block; font-weight:500; font-size:.4em; color:var(--color-text-muted); letter-spacing:.04em; margin-bottom:4px; white-space:normal; }
    #lv .top .right{ text-align:right; padding-bottom:6px; }
    #lv .livepill{ display:inline-flex; align-items:center; gap:8px; font-family:var(--lv-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--color-lime); border:1px solid var(--color-lime-dim); border-radius:999px; padding:6px 12px; margin-bottom:10px; }
    #lv .livepill.off{ color:var(--color-text-muted); border-color:var(--color-border); }
    #lv .dotp{ width:7px; height:7px; border-radius:50%; background:var(--color-lime); animation:lvpulse 1.6s infinite; }
    @keyframes lvpulse{ 0%{box-shadow:0 0 0 0 rgba(184,255,44,.55)} 70%{box-shadow:0 0 0 8px rgba(184,255,44,0)} 100%{box-shadow:0 0 0 0 rgba(184,255,44,0)} }

    /* week strip */
    #lv .weeks{ display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none; }
    #lv .weeks::-webkit-scrollbar{ display:none; }
    #lv .weeks button{ flex:none; border:1px solid var(--color-border); background:transparent; color:var(--color-text-muted); border-radius:10px; padding:8px 14px; font-family:var(--lv-disp); font-weight:800; font-size:18px; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; text-align:left; line-height:1; }
    #lv .weeks button small{ display:block; font-family:var(--lv-mono); font-size:9px; letter-spacing:.14em; color:var(--color-text-faint); margin-top:4px; font-weight:600; }
    #lv .weeks button.final small{ color:var(--color-teal); }
    #lv .weeks button.live small{ color:var(--color-lime); }
    #lv .weeks button.next small{ color:var(--lv-gold); }
    #lv .weeks button.on{ border-color:var(--color-text); color:var(--color-text); background:var(--color-surface); }

    /* night grid */
    #lv .night{ padding:16px 0 18px; }
    #lv .night .lbl{ display:flex; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    #lv .ngrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
    #lv .ng .strip{ margin-top:7px; }
    #lv .ng .rlab{ width:20px; color:var(--color-text-faint); font-size:10px; }
    #lv .strip{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
    #lv .strip .gap{ width:14px; }
    #lv .d{ width:16px; height:16px; border-radius:50%; background:var(--lv-dim); flex:none; position:relative; }
    #lv .d.h{ background:var(--color-lime); } #lv .d.a{ background:var(--color-teal); }
    #lv .d.o{ background:transparent; border:2px solid var(--lv-dim2); }
    #lv .d.e{ background:transparent; border:2px solid var(--lv-dim2); box-shadow:inset 0 0 0 3px var(--lv-dim); } /* entered, awaiting confirm */
    #lv .d.l{ background:transparent; border:2px solid var(--color-lime); animation:lvpulse 1.6s infinite; }
    #lv .d[data-t]:hover::after{ content:attr(data-t); position:absolute; bottom:22px; left:50%; transform:translateX(-50%); white-space:nowrap; background:#000; border:1px solid var(--lv-dim2); color:#f5f5f5; font:600 11px/1.3 var(--lv-mono); letter-spacing:.06em; padding:6px 9px; border-radius:6px; z-index:5; }

    /* match rows */
    #lv .match{ padding:18px 0 16px; border-top:1px solid var(--color-border); cursor:pointer; }
    #lv .match:first-of-type{ border-top:0; }
    #lv .mrow{ display:grid; grid-template-columns:1fr auto; gap:18px; align-items:start; }
    #lv .names{ font-size:clamp(26px,3.8vw,36px); }
    #lv .names .vs{ color:var(--color-text-faint); font-weight:500; margin:0 .22em; }
    #lv .names .h{ color:var(--color-lime); } #lv .names .a{ color:var(--color-teal); }
    #lv .names .em{ font-size:.55em; vertical-align:middle; margin-right:.2em; }
    #lv .mp{ text-align:right; }
    #lv .mp .n{ font-family:var(--lv-disp); font-weight:900; font-size:clamp(36px,5vw,52px); line-height:.9; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
    #lv .mp .n i{ font-style:normal; color:var(--color-text-faint); margin:0 .06em; }
    #lv .mp .n .h{ color:var(--color-lime); } #lv .mp .n .a{ color:var(--color-teal); }
    #lv .mp .n.tbd{ color:var(--lv-dim2); }
    #lv .mp .mono{ margin-top:6px; display:block; }
    #lv .mdots{ margin:10px 0 8px; }
    #lv .mdots .strip{ gap:9px; }
    #lv .mdots .d{ width:20px; height:20px; }
    #lv .mdots .rlab{ font-family:var(--lv-mono); font-size:10px; letter-spacing:.14em; color:var(--color-text-faint); width:22px; }
    #lv .mcap{ display:flex; gap:18px; flex-wrap:wrap; }

    /* box score */
    #lv .detail{ display:none; margin-top:18px; border-top:1px dashed var(--lv-dim2); padding-top:6px; }
    #lv .match.open .detail{ display:block; }
    #lv .gl{ display:grid; grid-template-columns:34px 34px 1fr auto 1fr 96px; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--color-border); font-size:14px; font-weight:600; }
    #lv .gl:last-child{ border-bottom:0; }
    #lv .gl .g{ font-family:var(--lv-mono); font-size:11px; color:var(--color-text-faint); letter-spacing:.1em; }
    #lv .gl .ty{ font-family:var(--lv-mono); font-size:10px; letter-spacing:.14em; color:var(--color-text-muted); }
    #lv .gl .p{ color:var(--color-text-muted); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #lv .gl .p.w{ color:var(--color-text); }
    #lv .gl .p.ar{ text-align:right; }
    #lv .gl .sc{ font-family:var(--lv-disp); font-weight:800; font-size:22px; letter-spacing:.02em; font-variant-numeric:tabular-nums; color:var(--color-text-muted); text-align:center; min-width:64px; }
    #lv .gl .sc b{ font-weight:800; color:var(--color-text); }
    #lv .gl .sc.hw b:first-child{ color:var(--color-lime); } #lv .gl .sc.aw b:last-child{ color:var(--color-teal); }
    #lv .gl .st{ font-family:var(--lv-mono); font-size:10px; letter-spacing:.12em; text-align:right; color:var(--color-text-faint); }
    #lv .gl .st.live{ color:var(--color-lime); }
    #lv .gl.up{ opacity:.55; }
    #lv .rhead{ font-family:var(--lv-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--color-text-faint); padding:14px 0 6px; }
    #lv .rhead b{ color:var(--color-text); }

    /* on court now */
    #lv .sec{ padding:22px 0 8px; }
    #lv .sec h2{ margin:0 0 4px; font-size:clamp(30px,4.5vw,44px); }
    #lv .sec h2 small{ display:block; font-weight:500; font-size:.5em; color:var(--color-text-muted); }
    #lv .now{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; margin-top:18px; }
    #lv .ct{ border:1px solid var(--color-border); border-radius:12px; padding:14px 16px; background:var(--color-surface); }
    #lv .ct .k{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
    #lv .ct .side{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:4px 0; font-size:15px; font-weight:600; color:var(--color-text); }
    #lv .ct .side .tm{ font-family:var(--lv-mono); font-size:10px; letter-spacing:.12em; color:var(--color-text-faint); text-transform:uppercase; }

    #lv .empty{ padding:60px 0; text-align:center; color:var(--color-text-muted); }
    #lv .empty .disp{ font-size:clamp(40px,8vw,80px); color:var(--color-text); margin-bottom:10px; }
    #lv .cta{ display:inline-block; margin-top:14px; padding:12px 22px; border-radius:9999px; background:var(--color-lime); color:#0e0e0e; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.06em; }

    /* this page IS the board — hide the site-wide ticker strip */
    body.is-live #ds-ticker{ display:none !important; }

    @media(max-width:700px){ #lv .ngrid{ grid-template-columns:1fr; } }
    @media(max-width:640px){
      #lv .top{ padding-top:80px; }
      #lv .top h1{ white-space:normal; }
      #lv .mrow{ grid-template-columns:1fr; }
      #lv .mp{ text-align:left; }
      #lv .gl{ grid-template-columns:28px 1fr auto 1fr; gap:8px; }
      #lv .gl .ty, #lv .gl .st{ display:none; }
      #lv .mdots .d, #lv .d{ width:14px; height:14px; }
      #lv .mdots .strip{ gap:7px; }
    }
  </style>
</head>
<body class="is-live">
  <div data-partial="nav"></div>

  <main id="lv">
    <div class="top">
      <h1 class="disp"><small id="lv-sub">&nbsp;</small><span id="lv-title">Game Night</span></h1>
      <div class="right">
        <div class="livepill off" id="lv-pill">Loading…</div>
        <div class="mono" id="lv-prog">&nbsp;</div>
      </div>
    </div>
    <div class="rule"></div>
    <div class="weeks" id="lv-weeks"></div>
    <div id="lv-body"><div class="empty"><div class="mono">Loading the board…</div></div></div>
  </main>

  <div data-partial="footer"></div>
  <script src="/js/partials.js"></script>

  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var qs = new URLSearchParams(location.search);
    var SEASON_ID = qs.get('season') || null;
    var WEEK = Number(qs.get('week')) || null;      // null → the API picks (tonight / next unfinished / last)
    var DATA = null, POLL = null, OPEN = {};        // OPEN: matchId → box score expanded

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function shortName(n) { var p = String(n || '').trim().split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length - 1][0] : (p[0] || ''); }
    function pair(list) { return (list && list.length) ? list.map(shortName).join(' · ') : ''; }
    function fmtDate(iso, opts) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleDateString('en-US', opts || { weekday: 'short', month: 'short', day: 'numeric' }); }
    function fmtTime(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
    function typeLabel(t) { return t === 'WD' ? 'W' : t === 'MD' ? 'M' : 'MX'; }
    function courts(m) { if (m.courtA && m.courtB) return 'Courts ' + m.courtA + ' & ' + m.courtB; return m.court || ''; }

    function endpoint() {
      var u = '/.netlify/functions/public-gameday?season=' + encodeURIComponent(SEASON_ID || 'circuit-i');
      if (WEEK) u += '&week=' + WEEK;
      return u;
    }

    // ── match points: persisted when final, otherwise derived from round points ──
    function mp(m) {
      if (m.mpHome != null && m.mpAway != null) return [m.mpHome, m.mpAway];
      var h = (m.round1 && m.round1.homePoints || 0) + (m.round2 && m.round2.homePoints || 0);
      var a = (m.round1 && m.round1.awayPoints || 0) + (m.round2 && m.round2.awayPoints || 0);
      return [h, a];
    }

    // ── one dot per slot, in slot order ──
    function slotMap(m) {
      var by = {};
      (m.games || []).forEach(function (g) { by[g.slot] = { kind: g.homeWin ? 'h' : (g.home === g.away ? 'x' : 'a'), g: g }; });
      (m.upcoming || []).forEach(function (u) { by[u.slot] = { kind: u.entered ? 'e' : 'o', g: u }; });
      if (m.status === 'live' && m.current && by[m.current.slot] && by[m.current.slot].kind !== 'h' && by[m.current.slot].kind !== 'a') by[m.current.slot].kind = 'l';
      return by;
    }
    var SLOTS = ['r1g1','r1g2','r1g3','r1g4','r1g5','r1g6','r2g1','r2g2','r2g3','r2g4','r2g5','r2g6'];
    function dots(m, big) {
      var by = slotMap(m), out = '';
      SLOTS.forEach(function (s, i) {
        if (i === 6) out += '<span class="gap"></span><span class="rlab mono">R2</span>';
        var d = by[s] || { kind: 'o', g: null };
        var tip = '';
        if (d.g && d.g.home != null && d.g.away != null) tip = 'G' + d.g.gameNum + ' ' + typeLabel(d.g.type) + ' · ' + d.g.home + '–' + d.g.away;
        else if (d.g) tip = 'G' + d.g.gameNum + ' ' + typeLabel(d.g.type) + (d.kind === 'l' ? ' · on court' : d.kind === 'e' ? ' · entered, awaiting confirm' : ' · not played');
        out += '<span class="d ' + d.kind + '"' + (tip ? ' data-t="' + esc(tip) + '"' : '') + '></span>';
      });
      return '<span class="rlab mono">R1</span>' + out;
    }

    function roundCap(m, rn) {
      var r = rn === 1 ? m.round1 : m.round2; if (!r) return '';
      var done = r.scoredGames === 6;
      return 'R' + rn + ' <b>' + (r.homeGames || 0) + '–' + (r.awayGames || 0) + '</b>' +
        (done ? ' · <span class="lime">' + (r.homePoints || 0) + '–' + (r.awayPoints || 0) + ' pts</span>' : (r.scoredGames ? ' · ' + r.scoredGames + '/6' : ''));
    }

    function boxRow(g, live) {
      var scored = g.home != null && g.away != null;
      var cls = scored ? (g.home > g.away ? 'hw' : g.away > g.home ? 'aw' : '') : '';
      var hp = pair(g.homePlayers), ap = pair(g.awayPlayers);
      var st = live ? '<span class="st live">● On court</span>' : scored ? '<span class="st">Final</span>' : g.entered ? '<span class="st">Entered · unconfirmed</span>' : '<span class="st">—</span>';
      return '<div class="gl' + (scored ? '' : ' up') + '">' +
        '<span class="g">G' + g.gameNum + '</span><span class="ty">' + typeLabel(g.type) + '</span>' +
        '<span class="p' + (scored && g.home > g.away ? ' w' : '') + '">' + esc(hp || '—') + '</span>' +
        '<span class="sc ' + cls + '">' + (scored ? '<b>' + g.home + '</b>–<b>' + g.away + '</b>' : '–') + '</span>' +
        '<span class="p ar' + (scored && g.away > g.home ? ' w' : '') + '">' + esc(ap || '—') + '</span>' + st + '</div>';
    }
    function boxScore(m) {
      var all = (m.games || []).concat(m.upcoming || []);
      var by = {}; all.forEach(function (g) { by[g.slot] = g; });
      var html = '';
      [1, 2].forEach(function (rn) {
        var r = rn === 1 ? m.round1 : m.round2;
        html += '<div class="rhead">Round ' + rn + (r ? ' · <b>' + (r.homeGames || 0) + '–' + (r.awayGames || 0) + '</b>' + (r.scoredGames === 6 ? ' · <b>' + (r.homePoints || 0) + '–' + (r.awayPoints || 0) + ' pts</b>' : ' · ' + (r.scoredGames || 0) + ' of 6 confirmed') : '') + '</div>';
        SLOTS.slice(rn === 1 ? 0 : 6, rn === 1 ? 6 : 12).forEach(function (s) {
          var g = by[s]; if (!g) return;
          html += boxRow(g, m.status === 'live' && m.current && m.current.slot === s);
        });
      });
      return html;
    }

    function matchRow(m) {
      var p = mp(m), final = m.status === 'final';
      var tbd = m.status === 'awaiting' && !(m.games || []).length;
      var cap = [];
      if (!tbd) { cap.push(roundCap(m, 1)); cap.push(roundCap(m, 2)); }
      if ((m.games || []).length) { cap.push('Games <b>' + m.gamesHome + '–' + m.gamesAway + '</b>'); cap.push('Rally <b>' + m.pointsHome + '–' + m.pointsAway + '</b>'); }
      if (courts(m)) cap.push('<b>' + esc(courts(m)) + '</b>');
      if (tbd && m.scheduledAt) cap.push(esc(fmtDate(m.scheduledAt) + ' · ' + fmtTime(m.scheduledAt)));
      if (tbd && !m.lineupsVisible) cap.push('Lineups reveal at first serve');
      var sub = final ? 'Final' : m.status === 'live' ? (m.current ? 'Live · R' + m.current.round : 'Live') : 'Match pts';
      var em = function (s) { return s.emoji ? '<span class="em">' + esc(s.emoji) + '</span>' : ''; };
      return '<div class="match' + (OPEN[m.id] ? ' open' : '') + '" data-id="' + esc(m.id) + '">' +
        '<div class="mrow"><div>' +
          '<div class="disp names"><span class="h">' + em(m.home) + esc(m.home.name) + '</span><span class="vs">vs</span><span class="a">' + em(m.away) + esc(m.away.name) + '</span></div>' +
          '<div class="mdots"><div class="strip">' + dots(m) + '</div></div>' +
          '<div class="mcap mono">' + cap.filter(Boolean).map(function (c) { return '<span>' + c + '</span>'; }).join('') + '</div>' +
        '</div>' +
        '<div class="mp"><div class="n' + (tbd ? ' tbd' : '') + '">' + (tbd ? '–' : '<span class="h">' + p[0] + '</span><i>–</i><span class="a">' + p[1] + '</span>') + '</div><span class="mono">' + sub + '</span></div>' +
        '</div>' +
        '<div class="detail">' + boxScore(m) + '</div>' +
      '</div>';
    }

    function abbr(name) { var w = String(name || '').split(/\s+/); return w.length > 1 ? w.map(function (x) { return x[0]; }).join('').slice(0, 4).toUpperCase() : String(name || '').slice(0, 8); }
    function nightGrid(d) {
      var ms = d.matches || [];
      return '<div class="ngrid">' + ms.map(function (m) {
        var by = slotMap(m);
        var row = function (from) { return SLOTS.slice(from, from + 6).map(function (s) { return '<span class="d ' + ((by[s] && by[s].kind) || 'o') + '"></span>'; }).join(''); };
        var p = mp(m);
        return '<div class="ng"><div class="mono"><span class="lime">' + esc(abbr(m.home.name)) + '</span> v <span class="teal">' + esc(abbr(m.away.name)) + '</span>' +
          (m.status === 'final' ? ' · ' + p[0] + '–' + p[1] : courts(m) ? ' · ' + esc(courts(m).replace('Courts ', 'Cts ')) : '') + '</div>' +
          '<div class="strip"><span class="rlab mono">R1</span>' + row(0) + '</div>' +
          '<div class="strip"><span class="rlab mono">R2</span>' + row(6) + '</div></div>';
      }).join('') + '</div>';
    }

    function onCourt(d) {
      var live = (d.matches || []).filter(function (m) { return m.status === 'live' && m.current; });
      if (!live.length) return '';
      return '<div class="sec"><h2 class="disp">On court<small>right now · scores post once both captains confirm</small></h2><div class="now">' +
        live.map(function (m) {
          var c = m.current;
          return '<div class="ct"><div class="k"><span class="mono"><b>' + esc(courts(m).replace('Courts ', 'Cts ')) + '</b> · R' + c.round + ' G' + c.gameNum + ' ' + typeLabel(c.type) + '</span><span class="mono lime">● In play</span></div>' +
            '<div class="side"><span>' + esc(pair(c.homePlayers) || m.home.name) + '</span><span class="tm">' + esc(abbr(m.home.name)) + '</span></div>' +
            '<div class="side"><span>' + esc(pair(c.awayPlayers) || m.away.name) + '</span><span class="tm">' + esc(abbr(m.away.name)) + '</span></div></div>';
        }).join('') + '</div></div>';
    }

    function weekStrip(d) {
      var ws = d.weeks || [];
      var cur = d.week;
      $('lv-weeks').innerHTML = ws.map(function (w) {
        var tag = w.status === 'live' ? '● Live' : w.status === 'final' ? (fmtDate(w.date, { month: 'short', day: 'numeric' }) || 'Final') : (w.phaseLabel || fmtDate(w.date, { month: 'short', day: 'numeric' }) || 'TBD');
        var next = w.status === 'upcoming' && !ws.some(function (x) { return x.status === 'upcoming' && x.week < w.week; });
        return '<button data-w="' + w.week + '" class="' + w.status + (next ? ' next' : '') + (w.week === cur ? ' on' : '') + '">Wk ' + w.week + '<small>' + esc(tag) + '</small></button>';
      }).join('');
    }

    function render(d) {
      DATA = d;
      var ms = d.matches || [];
      var wk = (d.weeks || []).find(function (w) { return w.week === d.week; }) || {};
      var status = wk.status || (d.gameNight ? 'live' : 'final');
      var isLive = ms.some(function (m) { return m.status === 'live'; });
      var allFinal = ms.length && ms.every(function (m) { return m.status === 'final'; });
      var first = ms.map(function (m) { return m.scheduledAt; }).filter(Boolean).sort()[0] || wk.date;

      // header
      $('lv-sub').textContent = (d.week ? 'Week ' + d.week + ' · ' : '') + (first ? fmtDate(first) : '') + (d.venue || wk.venue ? ' · ' + (d.venue || wk.venue) : '');
      $('lv-title').innerHTML = isLive ? 'Game Night' : allFinal ? 'Final Score' : (d.phaseLabel ? esc(d.phaseLabel) : 'Up Next');
      var pill = $('lv-pill');
      if (isLive) { pill.className = 'livepill'; pill.innerHTML = '<span class="dotp"></span>Live'; }
      else if (allFinal) { pill.className = 'livepill off'; pill.textContent = 'Final'; }
      else { pill.className = 'livepill off'; pill.textContent = first ? fmtTime(first) + ' first serve' : 'Scheduled'; }
      var confirmed = ms.reduce(function (n, m) { return n + (m.gamesConfirmed || 0); }, 0), total = ms.length * 12;
      $('lv-prog').innerHTML = ms.length ? (allFinal ? '<b>' + total + '</b> games · all confirmed' : '<b>' + confirmed + ' of ' + total + '</b> games confirmed') : '&nbsp;';

      weekStrip(d);

      if (!ms.length) {
        $('lv-body').innerHTML = '<div class="empty"><div class="disp">See you next week.</div><div class="mono">' + esc(d.message || 'No matches scheduled.') + '</div></div>';
        return;
      }
      var legend = '<span class="mono"><span class="lime">●</span> home &nbsp;<span class="teal">●</span> away &nbsp;<span style="color:var(--lv-dim2)">○</span> not played' + (isLive ? ' &nbsp;<span class="lime">◌</span> on court' : '') + '</span>';
      var html = '<div class="night"><div class="lbl"><span class="mono"><b>' + (isLive ? 'Tonight' : allFinal ? 'The night' : 'The slate') + '</b> · one dot per game</span>' + legend + '</div>' + nightGrid(d) +
        '<div class="mono" style="margin-top:14px;color:var(--color-text-faint)">Tap a match for the box score' + (isLive ? ' · scores appear when both captains confirm' : '') + '</div></div><div class="rule"></div>';
      html += ms.map(matchRow).join('');
      html += '<div class="rule"></div>';
      html += onCourt(d);
      if (allFinal && d.week) html += '<div class="sec"><h2 class="disp">The recap<small>how the night went</small></h2><a class="cta" href="/drop.html?edition=week-' + d.week + '">Read The Drop · Week ' + d.week + ' →</a></div>';
      $('lv-body').innerHTML = html;
    }

    // ── interactions ──
    $('lv-body').addEventListener('click', function (e) {
      var m = e.target.closest('.match'); if (!m) return;
      OPEN[m.dataset.id] = !OPEN[m.dataset.id];
      m.classList.toggle('open', OPEN[m.dataset.id]);
    });
    $('lv-weeks').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      WEEK = Number(b.dataset.w); OPEN = {};
      var u = new URL(location.href); u.searchParams.set('week', WEEK); history.replaceState(null, '', u);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (POLL) POLL.pollNow(); else load();
    });

    function load() {
      return fetch(endpoint(), { headers: { Accept: 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(render)
        .catch(function (e) { $('lv-body').innerHTML = '<div class="empty"><div class="mono">Live scoring unavailable (' + esc(e.message) + ')</div></div>'; });
    }

    // Poll every 30s while the viewed week is live; every 5 min otherwise
    // (so a night that starts while the page is open wakes up on its own).
    function start() {
      if (!window.DSLivePoll) { load(); setInterval(load, 30000); return; }
      POLL = DSLivePoll.create({
        url: endpoint,
        interval: function () { return (DATA && (DATA.matches || []).some(function (m) { return m.status === 'live'; })) ? 30000 : 5 * 60 * 1000; },
        onUpdate: render,
        onError: function (e) { if (!DATA) $('lv-body').innerHTML = '<div class="empty"><div class="mono">Live scoring unavailable (' + esc(e && e.message || e) + ')</div></div>'; },
      });
      POLL.start();
    }

    // Season first: the board follows the CURRENT season unless ?season= pins one.
    var ready = (SEASON_ID || !window.dsSeason) ? Promise.resolve()
      : window.dsSeason().then(function (S) { if (S && S.id) SEASON_ID = S.id; }).catch(function () {});
    ready.then(start);
  })();
  </script>
</body>
</html>
