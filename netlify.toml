[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Land the Ladder Challengers product at the subdomain root. This host-scoped
# rewrite only affects ladders.dinksociety.app/ (force = true so it wins over the
# home index.html); every other path on the subdomain still serves normally
# (ladder-score.html, /profile, /css, /api …). The apex (dinksociety.app) is
# unaffected because the `from` is host-specific. Requires the domain alias
# `ladders.dinksociety.app` to be added in Netlify with DNS pointing at the site.
[[redirects]]
  from = "https://ladders.dinksociety.app/"
  to = "/ladders.html"
  status = 200
  force = true

# Pretty URLs for the two portals. The old /admin/* and /captain/* catch-alls
# were broader than needed — nothing routes to sub-paths (the admin panel uses
# in-page tabs, magic links land on the .html files directly), so only the
# bare paths are mapped.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Unified admin console — one shell embedding the league + ladder admin pages.
[[redirects]]
  from = "/console"
  to = "/console.html"
  status = 200

[[redirects]]
  from = "/captain"
  to = "/captain.html"
  status = 200

# South Bay Ohana — private team page for our PVTC Fall 2026 mini league.
# Roster-only (checked server-side in ohana-data); never indexed.
[[redirects]]
  from = "/ohana"
  to = "/ohana.html"
  status = 200

# Printable lineup in the PVTC scoresheet format — /ohana/print?m=<matchId>
[[redirects]]
  from = "/ohana/print"
  to = "/ohana-print.html"
  status = 200

[[headers]]
  for = "/ohana*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# /ladders is the Ladders landing (both leagues). The Challengers hub keeps
# /ladders.html — every deep link (#ladders/<id>, #leaderboard, ?event=…) still
# works because the landing forwards those to the hub before paint.
[[redirects]]
  from = "/ladders"
  to = "/ladders-home.html"
  status = 200

[[redirects]]
  from = "/challengers"
  to = "/ladders.html"
  status = 200

# Generated recap articles. NOT forced, so Netlify still serves the hand-built
# static files under public/ladders/recaps/*.html first and only unmatched
# paths reach the function, which looks the night up by event id (or slug) and
# answers 200 with a "recap on the way" placeholder until the cron publishes.
[[redirects]]
  from = "/ladders/recaps/*"
  to = "/.netlify/functions/ladder-recap-page?id=:splat"
  status = 200

# Queen of the Court — the women's division hub (board, results, recaps,
# kitchen, gallery). Same pretty-URL pattern as /ladders.
[[redirects]]
  from = "/queen"
  to = "/queen.html"
  status = 200

# Ladder Organizer portal — hosts run their own ladder nights here (scoped;
# organizers sign in with the normal player magic-link).
[[redirects]]
  from = "/organizer"
  to = "/organizer.html"
  status = 200

[[redirects]]
  from = "/ladder-live"
  to = "/ladder-live.html"
  status = 200

# Public copy of the player waiver(s) — a stable link for players, venues and
# the insurance carrier. Signing still happens in the Player Portal.
[[redirects]]
  from = "/waiver"
  to = "/waiver.html"
  status = 200

[[redirects]]
  from = "/waivers"
  to = "/waiver.html"
  status = 200

# Legal pages — privacy, terms, refunds, photo/media. Linked from the footer
# and the registration form.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/refunds"
  to = "/refunds.html"
  status = 200

[[redirects]]
  from = "/media"
  to = "/media.html"
  status = 200

# Last rule — anything that didn't match a real file or a rule above is a 404.
# Netlify evaluates redirects top-to-bottom, first match wins; non-forced rules
# never shadow existing static files.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
